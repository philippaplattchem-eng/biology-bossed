@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T9: Ecosystems &mdash; Inferno</h1><span class="tier-badge inferno">Inferno</span></header><main><div class="quiz-meta"><span>20 questions &middot; Ecosystems</span><span>Inferno: Higher</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"Island biogeography theory (MacArthur & Wilson, 1967) predicts that species richness on an island is determined by immigration rate and extinction rate reaching an equilibrium. How does this apply to nature reserves, and what does it predict about reserve design?","A":"Island biogeography predicts that all reserves of the same area will have identical species richness","B":"Reserves function as habitat islands in a landscape matrix; the species-area relationship (S = cA^z) predicts larger reserves have more species; isolation (distance from other habitat patches) reduces immigration rate, increasing extinction rate; predictions for design: larger reserves are better; closer together is better; circular shape (minimal edge:area ratio) reduces edge effects; habitat corridors between reserves can increase effective immigration rate, reducing extinction — the \"stepping stone\" model for fragmented landscapes","C":"Island biogeography only applies to oceanic islands — it has no relevance to terrestrial conservation","D":"According to island biogeography, the number of species in a reserve is fixed permanently and cannot change","correct":"B","explain":"MacArthur-Wilson equilibrium theory: species number reaches a dynamic equilibrium where immigration rate (new species arriving) = extinction rate (local extinctions). Key predictions: (1) larger area → lower extinction rate (larger populations, more resource diversity) → higher equilibrium species number; (2) closer to source (mainland/large patch) → higher immigration rate → higher equilibrium number; (3) species turnover occurs even at equilibrium — composition changes even if number stays constant. Applied to reserves: SLOSS debate, corridor design, buffer zones, clustering reserves all derive from island biogeography. The species-area exponent z ≈ 0.25 for true islands; z ≈ 0.15–0.35 for habitat islands — predicts ~10-fold area increase → ~2× species number."},{"stem":"Trophic cascades can operate top-down or bottom-up. Explain the difference and give a named example of each.","A":"Top-down cascades involve plants controlling all higher trophic levels; bottom-up cascades involve predators controlling plant growth","B":"Top-down cascade: predator removal → prey release → overgrazing/herbivory increases → producer level collapses (e.g. wolf removal from Yellowstone → elk population explosion → riparian willow/aspen overgrazing → beaver decline → stream modification). Bottom-up cascade: primary productivity controls higher levels (e.g. nutrient enrichment in a lake → phytoplankton bloom → zooplankton increase → fish increase; conversely, nutrient limitation → low phytoplankton → low zooplankton → fish population limited by food)","C":"Top-down and bottom-up cascades are identical processes — the direction of the cascade is irrelevant","D":"Top-down cascades only occur in marine ecosystems; bottom-up cascades only in terrestrial ecosystems","correct":"B","explain":"Trophic cascade direction determines which level initiates the cascade: Top-down (predator-controlled): Estes & Palmisano (1974) showed sea otter → urchin → kelp relationship: otter removal → urchin explosion → kelp disappearance → \"urchin barrens\" → loss of kelp forest species. Ripley et al. (2001) Yellowstone wolf reintroduction → elk behaviour change (avoided riparian zones) → willow/aspen recovery → beaver return → stream restoration (trophic cascade affecting geomorphology). Bottom-up (nutrient/productivity controlled): Productivity in open ocean correlates with upwelling (nutrient-rich water) → more phytoplankton → more zooplankton → more fish → seabirds. Reality: most ecosystems show both — top-down and bottom-up forces operate simultaneously; relative strength varies by ecosystem type."},{"stem":"Metapopulation theory describes populations existing as networks of subpopulations connected by dispersal. How does this concept change conservation priorities compared to single-population thinking?","A":"Metapopulation theory shows that small isolated populations are always viable as long as they have enough food","B":"In metapopulation theory, local subpopulations regularly go extinct but are recolonised from other patches (the \"rescue effect\"); the entire network is more persistent than any individual subpopulation; implications: (1) maintaining habitat patches even if currently unoccupied (as potential recolonisation sites); (2) maintaining dispersal corridors between patches; (3) managing the landscape matrix (farmland, roads) for species movement; (4) recognising that a \"locally extinct\" patch may naturally recolonise if the metapopulation is intact — single-site thinking would treat local extinction as irreversible","C":"Metapopulation theory shows that one large reserve is always sufficient for conservation","D":"Metapopulation theory only applies to insects — vertebrate populations do not form metapopulations","correct":"B","explain":"Levins (1969) metapopulation model: fraction of patches occupied reaches equilibrium between local extinction rate and colonisation rate. Key implications: (1) Isolated subpopulation has higher extinction risk (no rescue effect); (2) Even zero-occupancy patches have conservation value as future colonisation sites; (3) Corridor loss can be as damaging as habitat loss — reducing colonisation rate tips the balance toward metapopulation extinction; (4) Target species management must consider landscape-level connectivity, not just individual site quality. Classic example: UK marsh fritillary butterfly — survives in networks of violet-rich grassland patches; managing patch connectivity more effective than maximising single-site quality. Amphibians, woodland birds, and many invertebrates show metapopulation dynamics."},{"stem":"Explain how stable isotope analysis (using ¹³C and ¹⁵N ratios) can reveal trophic level and dietary history of organisms in an ecosystem, without direct observation of feeding.","A":"Stable isotopes are radioactive and decay over time — older organisms have lower isotope ratios","B":"¹⁵N is enriched by ~3–4‰ per trophic level because lighter ¹⁴N is preferentially excreted as urea/ammonia — δ¹⁵N in tissues reveals trophic position (high δ¹⁵N = high trophic level). ¹³C fractionation is small (~1‰ per level) but different ecosystems have distinct δ¹³C signatures (C3 vs C4 plants, terrestrial vs marine, inshore vs offshore) — allowing identification of dietary carbon source. Combined ¹³C + ¹⁵N analysis maps organisms in two-dimensional \"isotope space\" revealing food web structure without direct observation — useful for cryptic species, historical specimens (museum collections), and reconstructing ancient food webs","C":"Stable isotope analysis measures the total mass of carbon and nitrogen in an organism's tissues","D":"Only ¹⁴C (radiocarbon) is used in ecological studies — ¹³C and ¹⁵N have no ecological applications","correct":"B","explain":"Stable isotope ecology (Fry 2006): δ¹⁵N = [(¹⁵N/¹⁴N sample / ¹⁵N/¹⁴N standard) − 1] × 1000‰. Each trophic level adds ~3.4‰ due to preferential ¹⁴N excretion. So a predator 2 levels above a baseline has δ¹⁵N ~6.8‰ higher. δ¹³C varies by ecosystem: ocean (−20‰) vs terrestrial C3 plants (−27‰) vs C4 plants (−13‰). Applications: (1) detecting illegal shark fin origin (ocean vs farm); (2) reconstructing diets of museum specimens pre-industrial; (3) showing Pacific salmon are a marine subsidy to riparian forests (bears deposit carcasses → trees have marine δ¹⁵N signature); (4) documenting dietary shifts in seabirds over decades using egg museum collections."},{"stem":"Climate change is causing phenological mismatches — for example, caterpillar emergence timing shifts relative to oak tree leaf flush and blue tit nesting. Explain the ecological consequences and why this is difficult to adapt to.","A":"Phenological mismatches only affect insects — birds and plants are unaffected by temperature changes","B":"Oak leaves flush earlier as spring warms; winter moth caterpillars (feeding on oak leaves) also emerge earlier; blue tits time breeding to peak caterpillar abundance (chick provisioning period must coincide with peak food). If caterpillars advance faster than blue tit laying dates, the peak food window occurs before chick hatching → food shortage → reduced chick survival → declining tit populations. Difficulty: different species respond to different environmental cues (temperature, photoperiod, rainfall) that are changing at different rates → synchrony between interacting species breaks down; evolutionary adaptation requires sufficient genetic variation and time; rapid climate change may outpace evolutionary response","C":"Phenological mismatches cause species to synchronise more tightly as all species respond equally to warming","D":"Blue tits simply wait for caterpillars — if caterpillars peak earlier, tits can lay earlier too with no mismatch consequences","correct":"B","explain":"Classic UK study (Visser et al., Thomas et al.): Great tit (Parus major) breeding dates have advanced ~14 days since 1970s; caterpillar peak advanced ~18–23 days → growing mismatch. Blue tit peak food demand (~ day 15 post-hatch) must coincide with caterpillar peak. Mismatched years show lower chick mass and survival → reduced recruitment. Why difficult to adapt: (1) Photoperiod (day length) — a reliable, unchanging cue — partly constrains laying date; temperature is the shifting cue; (2) genetic variation in laying date exists but selection may be insufficient given rate of change; (3) Predators, prey and competitors all shift independently. \"Ecological trap\" — cues that previously predicted food availability now decouple from actual food timing."},{"stem":"The concept of ecosystem services categorises benefits humans receive from ecosystems. Evaluate the use of economic valuation of ecosystem services as a conservation tool.","A":"Economic valuation of ecosystem services is unnecessary because biodiversity has intrinsic value","B":"Strengths: making ecosystem services visible in economic terms (e.g. UK pollination services worth ~£690M/yr; Thames flood defence by wetlands worth £millions vs concrete barriers) provides decision-makers with comparable cost-benefit data; can justify conservation as economically rational; allows payment for ecosystem services (PES) schemes. Weaknesses: many ecosystem services are genuinely difficult to value (e.g. cultural/spiritual value, existence value, option value for undiscovered medicines); market failure — services are public goods (non-excludable, non-rival), markets undervalue them; risk of allowing ecosystems to be destroyed if economic value is deemed insufficient; ecological processes have non-linear, threshold behaviours that economic models struggle to capture","C":"Economic valuation always overestimates ecosystem services — conservation funding is being misallocated","D":"Economic valuation has no role in conservation — all decisions should be based purely on biodiversity metrics","correct":"B","explain":"The \"natural capital\" framework (Costanza et al. 1997 estimated global ecosystem services at $33 trillion/yr) aims to embed biodiversity into economic decision-making. TEEB (The Economics of Ecosystems and Biodiversity) provides frameworks for national accounting. Payment for Ecosystem Services (PES): farmers paid for flood retention, carbon storage, biodiversity maintenance (UK Environmental Land Management scheme). Critical perspectives: (1) Commodification risk — ecosystems \"worth\" only what they provide to humans; (2) Substitutability assumptions — can engineered alternatives replace natural processes? (3) Distributive justice — who receives payments, who bears costs; (4) Biodiversity not fully captured by service metrics (supporting services undervalued). Most conservation scientists accept economic valuation as a useful political tool while insisting on intrinsic value arguments alongside."},{"stem":"Horizontal gene transfer between bacteria in soil ecosystems allows antibiotic resistance genes to spread rapidly. Explain the ecological conditions in soil that facilitate this, and why it is relevant to human health.","A":"Soil bacteria do not exchange genes — each species maintains completely separate genetic material","B":"High cell density in soil (10⁸–10⁹ bacteria per gram) facilitates: (1) conjugation — direct cell-cell plasmid transfer; (2) transformation — uptake of environmental DNA from lysed cells; (3) transduction — bacteriophage-mediated gene transfer; antibiotic-producing actinomycetes in soil have co-evolved with bacteria carrying resistance genes (soil resistome); agricultural use of antibiotics in livestock → antibiotic-enriched manure applied to fields → selection for resistant bacteria → resistance genes in soil bacteria → potential transfer to human pathogens via mobile genetic elements (plasmids, transposons, integrons)","C":"Antibiotic resistance only develops in hospitals — soil bacteria are unrelated to clinical resistance","D":"Soil conditions are too dry for gene transfer — HGT only occurs in aquatic environments","correct":"B","explain":"The soil resistome (D'Costa et al. 2006, 2011): ancient bacteria in 30,000-year-old Beringian permafrost carry resistance genes to modern antibiotics. Resistance predates clinical antibiotic use — it evolved as a competitive strategy among soil organisms (many soil bacteria produce antibiotics; co-inhabitants evolve resistance). Agricultural antibiotic use enriches resistance gene frequencies in soil microbial communities. Mobile genetic elements (class 1 integrons — particularly associated with human clinical resistance) have been found in agricultural soil. The One Health framework recognises human health, animal health and environmental health as interconnected: resistance in soil → livestock → food chain/water → human pathogens. This is why agricultural antibiotic use is increasingly restricted (EU banned growth-promotion use 2006; UK reducing veterinary use)."},{"stem":"Population viability analysis (PVA) uses demographic data to estimate minimum viable population (MVP) size. What factors does PVA model, and why is genetic diversity a critical component beyond simply counting individuals?","A":"PVA only counts individuals — genetic factors are irrelevant to population survival","B":"PVA models: (1) demographic stochasticity — random variation in birth/death rates in small populations; (2) environmental stochasticity — unpredictable environmental variation; (3) catastrophes — low-probability, high-impact events; (4) genetic factors — inbreeding depression (homozygous deleterious recessives expressed), loss of genetic diversity (reduced ability to adapt to future environmental change, pathogens); Soule's original MVP estimate (~500–5000 individuals) attempts to balance these. Genetic diversity is critical because: low diversity reduces individual fitness (inbreeding depression); reduces evolutionary potential to respond to novel challenges; the Florida panther example — introduced Texas cougars genetically rescued the population by restoring heterozygosity and reversing developmental defects","C":"Genetic diversity is only important for plants — animal populations do not suffer from inbreeding","D":"MVP is a fixed universal number of 50 individuals for all species","correct":"B","explain":"PVA integrates multiple extinction risks. The 50/500 rule: Ne ≥ 50 (short-term, avoid inbreeding depression); Ne ≥ 500 (long-term, maintain evolutionary potential). Effective population size (Ne) is typically 10–30% of census size due to unequal sex ratios, variance in reproductive success, overlapping generations. Inbreeding depression evidence: Isle Royale wolves (highly inbred → immune gene loss → susceptibility to parvovirus → near-extinction); Florida panther (heart defects, poor sperm quality, kinked tails from inbreeding → reversal after Texas cougar introduction — \"genetic rescue\"). Loss of adaptive potential: cheetah (extremely low diversity → all individuals accept skin grafts — dangerously uniform MHC) → vulnerability to novel pathogens. IUCN criteria for Critically Endangered: <50 mature individuals or >80% decline in 10 years."},{"stem":"Describe the mechanism of biological magnification (biomagnification) and explain why lipid-soluble persistent organic pollutants (POPs) accumulate at the highest trophic levels.","A":"Biomagnification occurs because top predators eat more food per day — they simply ingest more pollutant","B":"Lipid-soluble POPs (e.g. DDT, PCBs, organochlorines) are not excreted efficiently — they dissolve in fat and accumulate in tissues; organisms at each trophic level consume many organisms from the level below, concentrating the pollutant; concentration increases ~10-fold per trophic level (mirroring the inverse of energy transfer efficiency); top predators (eagles, orcas, polar bears) accumulate the highest body burdens; effects include: reproductive failure (DDT → thin eggshells in birds → population collapse), immunosuppression (PCBs in marine mammals), endocrine disruption; polar regions act as global distillation traps — volatile POPs evaporate in tropics, condense and deposit at poles","C":"Biomagnification only occurs in aquatic ecosystems — terrestrial food chains are unaffected","D":"POPs accumulate at the base of food chains because producers absorb them during photosynthesis","correct":"B","explain":"Biomagnification mechanism: POPs partition strongly into lipid (high octanol-water coefficient, log Kow > 5) → stored in adipose tissue, not excreted or metabolised. At each trophic transfer: predator ingests 10 kg prey to make 1 kg of body tissue (10% efficiency); all lipid-soluble POP from prey is retained in predator → concentration multiplies. Classic case: Clear Lake, California (DDD application) → plankton 265× environmental level → small fish 2000× → grebes 80,000× (concentration factor ~300,000× water level). DDT in UK peregrine falcons → DDE metabolite → inhibits CA enzyme → disrupts CaCO₃ shell formation → shell thinning → egg breakage during incubation → population collapse (50% decline 1950s–60s). After 1974 DDT ban → recovery. PCBs in beluga whales (St. Lawrence): so contaminated that carcasses are classified as toxic waste."},{"stem":"Explain how the denitrification process can be managed to reduce agricultural nitrous oxide (N₂O) emissions, and why this matters for climate change.","A":"Denitrification does not produce N₂O — it only produces harmless N₂","B":"Denitrification: NO₃⁻ → NO₂⁻ → NO → N₂O → N₂ (anaerobic bacteria, Paracoccus, Pseudomonas etc.). N₂O is a potent greenhouse gas (298× CO₂ warming potential over 100 years) and ozone-depleting substance. Incomplete denitrification (insufficient carbon substrate, high O₂, fluctuating conditions) produces N₂O rather than N₂. Management strategies: (1) nitrification inhibitors (DMPP) slow nitrification, reducing substrate for denitrifiers; (2) improving drainage (less anoxic conditions reduces denitrification); (3) precision application of nitrogen fertiliser (reducing excess); (4) covering slurry stores (reduces N₂O from anaerobic decomposition); (5) biochar addition (alters soil redox, promotes complete denitrification to N₂)","C":"Agricultural N₂O can be eliminated by simply stopping fertiliser use with no other consequences","D":"N₂O from denitrification is only released from rice paddies — it is not produced in temperate agriculture","correct":"B","explain":"Agriculture accounts for ~10% of global greenhouse gas emissions, with N₂O contributing ~6% of global GHG (CO₂ equivalent). The N₂O pathway: partial denitrification at intermediate redox conditions produces N₂O (instead of N₂) — particularly likely in waterlogged, recently fertilised soil with fluctuating aerobic/anaerobic zones. The complete denitrification to N₂ requires: sufficient organic carbon substrate (electron donor), low O₂, stable anaerobic conditions. Management: (1) DMPP (3,4-dimethylpyrazole phosphate) inhibits Nitrosomonas → less NO₃⁻ formed → less denitrification substrate; (2) urease inhibitors slow urea hydrolysis → less NH₄⁺ loss and subsequent nitrification; (3) split fertiliser application reduces peak NO₃⁻ concentrations; (4) cover crops and organic matter improve carbon availability, promoting complete denitrification. UK agriculture responsible for ~70% of national N₂O emissions."},{"stem":"The intermediate disturbance hypothesis (IDH) proposes that species diversity is highest at intermediate levels of disturbance. Explain the mechanism and give an ecological example.","A":"IDH predicts that maximum disturbance always produces the highest biodiversity","B":"At low disturbance: competitive exclusion allows dominant species to eliminate others → low diversity. At high disturbance: only highly stress-tolerant/ruderal species survive → low diversity. At intermediate disturbance: competitive dominants are kept in check before they can exclude others; diversity of species from different successional stages coexist; neither competitive exclusion nor extreme stress tolerance rules; example: coral reefs — waves/storms at intermediate frequency maintain space availability preventing monoculture by fast-growing corals; tropical forests — treefall gaps at intermediate rates diversify light environments; intertidal zones — wave disturbance prevents mussels from dominating","C":"IDH predicts diversity is always highest in undisturbed, climax communities","D":"IDH only applies to marine ecosystems — terrestrial communities are not affected by disturbance","correct":"B","explain":"IDH (Connell 1978, based on coral reef observations): diversity peaks at intermediate disturbance frequency and intensity. Mechanism: disturbance resets succession, creating space for early-successional species; competitive dominants (that would eventually exclude others) are periodically reduced; species from multiple successional stages coexist simultaneously. Evidence: Connell's coral reef work; Paine's rocky intertidal (Pisaster sea star = intermediate disturbance predator → maintains diversity); tropical forest treefall gap dynamics. Limitations: IDH has been criticised — meta-analyses show the mid-hump relationship holds in only ~20–30% of test cases; disturbance type, scale, and the identity of the competitive dominant all matter; the \"habitat mosaic\" model (spatial heterogeneity) may better explain patterns in many systems."},{"stem":"Rewilding proposes reintroducing large predators (e.g. wolves, lynx, beavers, white-tailed eagles in UK) to restore ecosystem function. Evaluate the ecological arguments for and against wolf reintroduction to Scotland.","A":"Wolf reintroduction would immediately solve all conservation problems in Scotland with no downsides","B":"For: wolves as keystone predators would trigger trophic cascades — reducing red deer overgrazing → woodland/shrubland regeneration → increased biodiversity; landscape of fear reduces deer grazing in riparian zones → stream bank vegetation recovery → improved water quality; natural population regulation reducing culling costs. Against: deer farmers and livestock farmers would face predation losses (significant economic and cultural impact); wolves require very large territories (~200 km²) — insufficient contiguous wild land in Scotland; public acceptance variable; legal framework requires government support; potential conflict with existing sheep farming; uncertainty about cascade magnitude in Scottish uplands given different species composition from Yellowstone","C":"Wolf reintroduction would only benefit wolves — no ecosystem changes would follow","D":"Scotland does not have suitable habitat for wolves — the climate is too wet for predator survival","correct":"B","explain":"The case of Yellowstone wolves (reintroduced 1995): documented trophic cascade effects — elk numbers reduced and redistributed; riparian vegetation recovered; beavers returned; stream channels stabilised. However, the Yellowstone analogy to Scotland is imperfect: different prey species (red deer vs elk), different landscape context, much smaller wild areas, higher human population density. The \"landscape of fear\" effect: prey change behaviour (avoid risky areas) even if not killed — vegetation recovery may occur without large predator-prey numerical changes. Economic considerations: compensation schemes for livestock losses exist in other European countries with wolf recovery (France, Germany, Scandinavia). Scotland hosts viable prey (red deer, mountain hare) but contiguous land is fragmented. The Cairngorms Connect project (600 km² habitat restoration) represents the kind of large-scale rewilding that would be prerequisite. Community engagement is essential — failed reintroductions in Europe correlate with poor stakeholder process."},{"stem":"The Allee effect describes reduced fitness at very low population densities. Explain the mechanisms and why it creates a \"extinction vortex\" in conservation biology.","A":"The Allee effect describes increased fitness at high population densities — it is the opposite of inbreeding","B":"At very low densities, per-capita fitness falls due to: mate-finding failure (difficulty locating mates in sparse populations); reduced cooperative behaviours (group foraging, predator detection, cooperative breeding); increased inbreeding depression; increased demographic stochasticity (random sex ratio fluctuations, random failures to reproduce). The extinction vortex: small population → Allee effects reduce per-capita growth rate → population shrinks further → genetic diversity erodes (more inbreeding) → fitness further reduced → population may fall below a critical threshold (Allee threshold) below which population growth rate is negative even without additional external pressures → deterministic slide to extinction","C":"The Allee effect only applies to insects — vertebrate populations do not experience reduced fitness at low density","D":"The Allee effect predicts that all small populations will inevitably go extinct regardless of management","correct":"B","explain":"Allee (1931) observed that some species show reduced fitness below certain densities. Strong Allee effects: populations with negative growth rates below the Allee threshold — the population must exceed this threshold for growth to be positive. Examples: African wild dogs (cooperative pack hunting requires minimum group size — solitary individuals cannot successfully raise pups); passenger pigeon (required huge flocks for anti-predator dilution — once reduced below flock size threshold, extinction was rapid despite millions remaining); some fish requiring spawning aggregations. The extinction vortex (Gilpin & Soulé 1986): reciprocal interactions between small population size, demographic stochasticity, genetic drift, inbreeding, and environmental stochasticity create a self-reinforcing downward spiral. Management implication: population augmentation must raise numbers above Allee threshold, not just prevent further decline."},{"stem":"Explain how deep-sea hydrothermal vent ecosystems support life without sunlight, and what this reveals about the universality of photosynthesis as the primary energy input for ecosystems.","A":"Deep-sea vents use photosynthesis — bioluminescence from bacteria provides light for photosynthesis","B":"Vent ecosystems are based on chemolithotrophy: bacteria and archaea oxidise reduced inorganic chemicals (H₂S → SO₄²⁻; Fe²⁺ → Fe³⁺; CH₄ → CO₂) for energy, fixing CO₂ into organic matter (chemosynthesis); these chemoautotrophs form the base of the food web — supporting tube worms (Riftia, with endosymbiotic sulfur-oxidising bacteria), clams, shrimp, crabs, octopus, fish; entirely independent of solar energy. Significance: demonstrates that photosynthesis is not universal as a primary production mechanism — chemosynthesis is an alternative; implies life could exist on other planets/moons (Europa, Enceladus) without sunlight; vent communities represent living evidence of potentially early life on Earth before oxygenic photosynthesis evolved","C":"Hydrothermal vents only support bacteria — no animals can survive at these depths","D":"Vent animals eat organic matter that falls from the sunlit surface — they are not independent of photosynthesis","correct":"B","explain":"Deep-sea hydrothermal vents (discovered 1977, Galápagos Rift): primary production via chemosynthesis — sulfur-oxidising bacteria (Thiomicrospira, Beggiatoa) and methanotrophic archaea are the autotrophs. Energy source: geochemical (oxidising H₂S, H₂, CH₄ from superheated vent fluid). Some animals (Riftia pachyptila, giant tube worms up to 2 m) have no gut — entirely dependent on endosymbiotic chemosynthetic bacteria in a specialised organ (trophosome). This is one of the few ecosystems where solar energy is genuinely absent (cold seeps, methane vents are similar). Astrobiological significance: liquid water + chemical energy gradient = prerequisite for life — no sunlight required. Europa's ocean (under ice, potentially chemically active from tidal heating) and Enceladus (Saturn moon, confirmed hydrothermal activity, water plumes) are considered top candidates for extraterrestrial life based on this template."},{"stem":"Explain the concept of ecological stoichiometry — how the elemental ratios (C:N:P) of organisms and food resources constrain food web dynamics.","A":"Ecological stoichiometry only applies to marine plankton — terrestrial food webs are unaffected by elemental ratios","B":"Organisms have relatively fixed elemental compositions that differ from their food: animal tissues are N and P-rich relative to most plant material (high C:N, C:P in plants vs low C:N, C:P in animals); when consumers eat food with mismatched stoichiometry (high C:N), they must respire excess carbon or excrete it while retaining N and P — reducing energy conversion efficiency; phosphorus is often the most growth-limiting element for consumers; Daphnia (zooplankton) require low dietary C:P to achieve maximum growth rate; if algae grown under P-limitation have very high C:P, Daphnia growth collapses even with abundant food (quantity is adequate but quality — elemental composition — is limiting)","C":"Organisms adjust their elemental composition freely to match available resources — stoichiometry poses no constraint","D":"Ecological stoichiometry predicts that all organisms have identical C:N:P ratios (Redfield ratio 106:16:1)","correct":"B","explain":"Ecological stoichiometry (Sterner & Elser 2002) applies conservation of matter to food web interactions. The \"Redfield ratio\" (106C:16N:1P) describes marine phytoplankton average composition — but consumers have different requirements (animals: ~50C:7N:1P). Stoichiometric mismatch: forest leaves have C:N ratios of 100–200:1; insects need ~5–10:1 → must process enormous carbon excess (respired or egested) to obtain sufficient nitrogen. Practical consequences: (1) Global change — elevated CO₂ → increased plant C:N (more photosynthate, same nitrogen) → reduced nutritional quality for herbivores → plant-herbivore dynamics shift; (2) P-limitation in freshwaters — increased algal C:P under P-limitation reduces zooplankton growth (threshold elemental ratio concept); (3) Explains why adding P-fertiliser to forests often increases plant growth but simultaneously reduces it for herbivores through stoichiometric mismatch — counterintuitive result from bottom-up perspective."},{"stem":"Biodiversity-ecosystem function (BEF) research shows that diverse plant communities are more productive than monocultures. Explain the two main mechanisms proposed: complementarity and sampling effect.","A":"Diverse communities are more productive simply because they have more plants — species richness itself adds biomass directly","B":"Complementarity: different species use resources (light, water, nutrients) at different times, depths, wavelengths — niche partitioning allows more complete resource use; facilitation (e.g. legumes fix nitrogen used by neighbouring plants); net effect: diverse plots extract more total resources → greater productivity. Sampling effect (also called selection effect): in diverse communities, there is a higher probability of including a dominant, highly productive species; this species may drive the productivity advantage rather than complementarity; the sampling effect is a statistical artifact. Research: long-term experiments (Tilman's Minnesota grasslands, BIODEPTH Europe) show complementarity effects strengthen over time — genuine functional complementarity, not just sampling","C":"Diverse communities are less productive than monocultures because species compete for the same resources","D":"Biodiversity only matters for ecosystem stability — it has no effect on productivity","correct":"B","explain":"BEF research (Tilman, Loreau, Hector): 147 grassland experiment across Europe (BIODEPTH, 1994–1995) showed plant biomass increased with diversity; effect due to both complementarity and sampling. Distinguishing them: (1) Sampling effect — random chance of including highly productive species increases with richness; diminishes or disappears in monocultures of the most productive species; (2) Complementarity — genuine niche partitioning or facilitation produces \"overyielding\" (diverse polyculture produces more than the best monoculture). Over-yielding evidence: in Tilman's 12-year experiment, transgressive overyielding increased with time → rules out sampling effect (which would stabilise early); nitrogen-fixing legumes facilitated neighbours; deep/shallow-rooted species partitioned soil water. Applications: ecological intensification of agriculture using diverse cover crop mixtures; forest management promoting mixed-species stands for productivity and resilience."},{"stem":"Describe how paleoecological methods (pollen records, ancient DNA, stable isotopes from lake sediments) can inform modern conservation decisions.","A":"Paleoecological methods are purely academic — they have no relevance to conservation","B":"Pollen cores from peat bogs and lake sediments record vegetation changes over millennia — establishing: pre-human baseline diversity and composition (reference conditions for restoration targets); rate and magnitude of past change (human vs climate-driven); resilience/recovery times. Ancient DNA from sediments or fossils reconstructs past community composition including extinct species and past genetic diversity. Stable isotopes from lake sediments track past productivity (¹⁵N, ¹³C), nutrient loading and food web structure. Conservation applications: identifying what landscapes should look like without human impact (naturalness baseline); detecting when degradation began (identifying \"shifting baseline syndrome\"); determining appropriate targets for rewilding (what large animals once lived here); assessing whether restoration is achieving historical community states","C":"Paleoecology shows that all current ecosystems are in their natural undisturbed state","D":"Pollen records can only identify plant species — they cannot inform restoration of animal communities","correct":"B","explain":"Pollen analysis (palynology): pollen is resistant to decay and accumulates in annual layers in lake sediments and peat; species-specific morphology allows identification; radiocarbon dating establishes chronology → vegetation history for 10,000+ years. Examples: (1) UK heather moorland palaeoecology shows many areas were once woodland — current moorland is a cultural landscape, not natural; (2) Greenland ice cores show pre-industrial atmospheric composition; (3) Ancient DNA from permafrost: Pleistocene megafauna (woolly mammoth, cave lion, woolly rhino) diversity and population genetic structure. \"Shifting baseline syndrome\" (Pauly 1995) — each generation perceives current conditions as normal, not recognising past degradation. Paleoecology provides pre-anthropogenic baselines. The Oostvaardersplassen rewilding project in Netherlands used ancient pollen and bone evidence to justify introducing Konik horses and Heck cattle as proxies for extinct aurochs and tarpan."},{"stem":"The phosphorus cycle, unlike the nitrogen and carbon cycles, has no significant gaseous phase. Explain why this makes phosphorus particularly prone to becoming limiting, and the long-term implications for food security.","A":"The lack of a gaseous phase means phosphorus is always in excess — it is never limiting","B":"Carbon and nitrogen cycle through the atmosphere (CO₂ fixation; N₂ fixation) which provides a large atmospheric reservoir that renews terrestrial supplies. Phosphorus has no atmospheric source — it enters ecosystems only through rock weathering (very slow) or human mining of phosphate rock. Once phosphorus is removed from agricultural land (in harvested crops, lost to water bodies as run-off, trapped in lake sediments), it cannot be returned via atmospheric processes. Global minable phosphate rock reserves are estimated at 50–300 years at current extraction rates; most reserves concentrated in Morocco/Western Sahara (75%+); peak phosphorus predicted this century; implications for food security: nitrogen can be synthesised via Haber-Bosch (energy-intensive); phosphorus has no synthesis alternative — its scarcity would directly limit global food production","C":"Phosphorus cycles through the atmosphere as phosphine gas — reserves are unlimited","D":"Phosphorus limitation only occurs in aquatic ecosystems — terrestrial soils always have sufficient phosphorus","correct":"B","explain":"Phosphorus geochemical cycle operates on geological timescales: apatite minerals in igneous rock → weathering → dissolved phosphate → marine sediments → subducted → geological uplift (millions of years). There is no gaseous phase shortcutting this. Human phosphorus use: ~50 million tonnes/yr mined as phosphate rock (primarily for fertilisers); ~80% of mined P is lost to water bodies or non-recoverable dispersal. Phosphorus in food production cannot be substituted. Global concerns: (1) geopolitical concentration of reserves (Morocco controls ~75% of global phosphate — analogous to OPEC for oil); (2) declining ore quality requiring more energy/water to process; (3) wastewater contains high P (urine is ~80% of P in sewage) — struvite recovery could recycle significant P. Peak phosphorus would catastrophically limit global agricultural yields — no Haber-Bosch equivalent exists for P. This is one of the least discussed but most serious long-term global sustainability challenges."},{"stem":"Explain the difference between resilience and resistance in ecosystem ecology, and why these properties sometimes trade off against each other.","A":"Resilience and resistance are synonymous — they describe the same property of ecosystems","B":"Resistance: the ability of an ecosystem to withstand disturbance without changing (how much perturbation is required to displace the system from its current state). Resilience: the ability to recover and return to the original state after being displaced. Trade-off example: highly resistant ecosystems (e.g. old-growth forests with buffered microclimate) may change little during drought but recover slowly if they do change (low resilience). Grasslands with frequent disturbance may change readily (low resistance) but recover quickly due to rapid growth rates (high resilience). Conservation implication: managing for only one property may compromise the other; systems facing novel stressors (climate change) need resilience (ability to recover from unprecedented events) not just resistance.","C":"Resistance is always better than resilience — preventing any change to an ecosystem is always the best management strategy","D":"Resilience only applies to forest ecosystems — grasslands and marine systems do not show recovery","correct":"B","explain":"Engineering resilience vs ecological resilience (Holling 1973): Engineering resilience = speed of return to equilibrium after small perturbation (classical resilience). Ecological (Hollingian) resilience = magnitude of perturbation the system can absorb before shifting to an alternative stable state. Old-growth forests: high resistance (buffered microclimate, mature trees resist moderate drought/fire); low engineering resilience (if old-growth is lost, centuries to recover). Grasslands: low resistance (easily grazed/burned to a different state); high engineering resilience (recover rapidly after disturbance due to persistent roots, seed banks). The trade-off arises from the same structural complexity that creates resistance (diverse, mature communities with many interactions) also creating slow recovery dynamics when the complex structure is lost. In climate change context: ecosystems need resilience to novel extreme events, but human-managed high-resistance systems may catastrophically collapse if resistance is finally exceeded."},{"stem":"Evaluate the strengths and limitations of using species richness alone as a measure of biodiversity in conservation assessment.","A":"Species richness is a perfect measure of biodiversity — no other measures are needed","B":"Strengths: easy to count and compare; intuitively meaningful; correlates with other diversity measures; well-established in legislation and international targets (e.g. CBD 30×30 target). Limitations: ignores functional diversity (a community of 10 species all doing the same ecological role vs 10 species with distinct roles are equally rich but functionally different); ignores phylogenetic diversity (10 closely related species represent less evolutionary history than 10 species from distinct lineages); ignores evenness (100 individuals of one species + 1 each of 9 others = 10 species richness, same as 10 equally abundant species, but ecological function differs); ignores genetic diversity within species; rare endemic species count the same as cosmopolitan species; can be \"improved\" by adding invasive species; tropical forests can lose native species richness and gain invasive-rich assemblages — looking equal in species count but representing catastrophic biodiversity loss","C":"Species richness is the worst possible measure — only genetic diversity should be used","D":"Species richness is only useful in tropical ecosystems — it cannot be applied to temperate or arctic regions","correct":"B","explain":"Species richness (S) is the most widely used biodiversity metric but is one component of a multi-dimensional concept. More comprehensive metrics: (1) Shannon diversity index H' = −Σ(pi × ln pi) — combines richness and evenness; (2) Simpson's diversity (1 − D) — probability that two randomly selected individuals are different species; (3) Functional diversity — range and variety of functional traits; (4) Phylogenetic diversity (Faith's PD) — total branch length of the phylogenetic tree for the community; (5) IUCN Red List Index — accounts for extinction risk, not just presence. Policy: CBD Kunming-Montreal agreement (2022) targets 30% of land/sea conserved by 2030 — but \"conserved\" and \"biodiverse\" need operational definitions beyond species counts. Conservation genomics identifies evolutionarily significant units (ESUs) within species — a single species with multiple divergent populations may warrant protection at each genetic unit."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
