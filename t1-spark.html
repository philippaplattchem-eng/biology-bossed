<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T1 Cell Biology Spark | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T1: Cell Biology &mdash; Spark</h1><span class="tier-badge spark">Spark</span></header><main><div class="quiz-meta"><span>20 questions &middot; Cell Biology</span><span>Spark: Recall</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"What is the function of the cell membrane?","A":"To produce energy for the cell","B":"To control what enters and leaves the cell","C":"To carry out photosynthesis","D":"To store the cell's genetic information","correct":"B","explain":"The cell membrane is selectively permeable — it controls which substances can enter and leave the cell. This keeps the internal conditions of the cell different from the surrounding environment. It is present in all cell types (animal, plant and bacterial)."},{"stem":"Which organelle is the site of photosynthesis?","A":"Mitochondria","B":"Ribosome","C":"Nucleus","D":"Chloroplast","correct":"D","explain":"Chloroplasts contain chlorophyll, the green pigment that absorbs light energy to drive photosynthesis. They are found in plant cells and algae but not in animal cells or prokaryotes."},{"stem":"What is the function of mitochondria?","A":"Protein synthesis","B":"Storing the cell's DNA","C":"Aerobic respiration — releasing energy (ATP) from glucose","D":"Absorbing light energy for photosynthesis","correct":"C","explain":"Mitochondria are the site of aerobic respiration, which releases energy stored in glucose as ATP. Cells with high energy demands — such as muscle cells and sperm cells — contain large numbers of mitochondria."},{"stem":"What is the function of ribosomes?","A":"Energy production","B":"Protein synthesis","C":"Photosynthesis","D":"Cell division","correct":"B","explain":"Ribosomes are tiny organelles found in all living cells, including prokaryotes. They read mRNA and assemble amino acids into polypeptide chains during translation. Every cell that makes proteins (i.e. every living cell) requires ribosomes."},{"stem":"Which of the following is a feature of a plant cell but NOT an animal cell?","A":"Cell membrane","B":"Nucleus","C":"Mitochondria","D":"Cell wall","correct":"D","explain":"Plant cells have a rigid cell wall made of cellulose, which provides structural support and prevents the cell from bursting when turgid. Animal cells lack a cell wall — both cell types share a cell membrane, nucleus and mitochondria."},{"stem":"Which of the following is a feature of a prokaryotic cell?","A":"A membrane-bound nucleus","B":"Mitochondria","C":"Plasmid DNA","D":"Chloroplasts","correct":"C","explain":"Prokaryotes (e.g. bacteria) lack a membrane-bound nucleus — their DNA floats freely in the cytoplasm as a circular loop. Many also carry small circular DNA molecules called plasmids. Mitochondria and chloroplasts are only found in eukaryotic cells."},{"stem":"What is cell differentiation?","A":"The process by which cells increase in number by dividing","B":"The process by which cells become specialised for a specific function","C":"The process by which cells absorb water by osmosis","D":"The process by which cells release energy","correct":"B","explain":"During development, cells differentiate — they switch on specific genes to become specialised (e.g. red blood cells, nerve cells, muscle cells). Differentiation allows a multicellular organism to build tissues and organs with different functions from a single fertilised egg."},{"stem":"What are stem cells?","A":"Cells that have already fully differentiated","B":"Cells found only in bone marrow","C":"Undifferentiated cells that can divide and become specialised","D":"Cells that only exist in embryos","correct":"C","explain":"Stem cells are undifferentiated cells capable of both self-renewal (dividing to produce more stem cells) and differentiation (producing specialised cell types). Embryonic stem cells are pluripotent; adult stem cells are more restricted in what they can become."},{"stem":"What is mitosis?","A":"Cell division that produces gametes with half the chromosome number","B":"Cell division that produces two genetically identical daughter cells","C":"The process of DNA replication only","D":"Cell division producing four daughter cells","correct":"B","explain":"Mitosis produces two daughter cells that are genetically identical to each other and to the parent cell — each receives the same number of chromosomes. It is used for growth, repair and asexual reproduction. Meiosis (not mitosis) produces gametes with half the chromosome number."},{"stem":"What is the magnification formula?","A":"Magnification = actual size ÷ image size","B":"Magnification = image size + actual size","C":"Magnification = image size × actual size","D":"Magnification = image size ÷ actual size","correct":"D","explain":"Magnification = image size ÷ actual size. For example, if a cell is 0.05 mm long but appears 5 mm long under the microscope, magnification = 5 ÷ 0.05 = ×100. Always ensure both measurements are in the same units before dividing."},{"stem":"What is the role of the large permanent vacuole in plant cells?","A":"To carry out photosynthesis","B":"To produce proteins","C":"To maintain cell turgidity by storing cell sap","D":"To carry out aerobic respiration","correct":"C","explain":"The large permanent vacuole contains cell sap — a solution of sugars, salts and pigments. It creates turgor pressure against the cell wall, keeping the cell rigid. Animal cells may have small, temporary vacuoles but lack this large permanent structure."},{"stem":"Which process moves substances from a region of low concentration to a region of high concentration?","A":"Diffusion","B":"Osmosis","C":"Active transport","D":"Facilitated diffusion","correct":"C","explain":"Active transport moves molecules against their concentration gradient — from low to high concentration. It requires energy (ATP) and specific carrier proteins. Examples include absorption of glucose into intestinal cells and uptake of mineral ions by plant roots."},{"stem":"How does an electron microscope differ from a light microscope?","A":"It has lower resolution and shows less detail","B":"It has higher resolution and can show subcellular structures in detail","C":"It uses visible light to form images","D":"It can only view whole organisms, not cells","correct":"B","explain":"Electron microscopes use beams of electrons (which have a much shorter wavelength than visible light), giving far higher resolution. Structures too small to see with a light microscope — such as ribosomes, mitochondrial cristae and the endoplasmic reticulum — become visible."},{"stem":"What is the structure of DNA?","A":"A single-stranded helix of amino acids","B":"A double helix of nucleotides","C":"A single-stranded chain of glucose units","D":"A double helix of amino acids","correct":"B","explain":"DNA is a double helix — two complementary strands of nucleotides, twisted around each other and held together by hydrogen bonds between complementary base pairs (A–T and C–G). Each nucleotide contains a deoxyribose sugar, a phosphate group and one of four bases."},{"stem":"What type of molecule is an enzyme?","A":"Carbohydrate","B":"Lipid","C":"Protein","D":"Nucleic acid","correct":"C","explain":"Enzymes are proteins. Their specific tertiary structure creates an active site with a complementary shape to their substrate. Any change to the enzyme's shape (denaturation, e.g. by extreme temperature or pH) destroys its function permanently."},{"stem":"Which cells in the human body lack a nucleus?","A":"Muscle cells","B":"Nerve cells","C":"Mature red blood cells","D":"Epithelial cells","correct":"C","explain":"Mature red blood cells lose their nucleus during development. This creates more space for haemoglobin and allows the biconcave disc shape, increasing surface area for oxygen loading. The absence of a nucleus means red blood cells cannot divide or repair themselves and have a lifespan of about 120 days."},{"stem":"What is the function of the nucleus?","A":"To produce energy for the cell","B":"To synthesise proteins directly","C":"To contain the cell's DNA and control cell activities","D":"To carry out photosynthesis","correct":"C","explain":"The nucleus contains the chromosomal DNA, which carries the instructions (genes) for making all the cell's proteins. It controls cell activities by directing mRNA production (transcription), which then carries the code to ribosomes for protein synthesis."},{"stem":"What is diffusion?","A":"Movement of water only, from high to low water potential","B":"Movement of particles against a concentration gradient, requiring ATP","C":"Net movement of particles from a region of higher to lower concentration","D":"Movement of large molecules through the membrane","correct":"C","explain":"Diffusion is the net movement of particles (ions, molecules) from a region of higher concentration to lower concentration. It is passive — no energy is required. Diffusion continues until the concentration gradient is eliminated (equilibrium)."},{"stem":"What is a gene?","A":"The entire DNA found in a cell","B":"A section of DNA that codes for a specific protein","C":"A type of chromosome","D":"A molecule of mRNA","correct":"B","explain":"A gene is a specific sequence of DNA bases that encodes the instructions for making a particular protein. Humans have approximately 20,000–25,000 genes. The sequence of bases in a gene determines the sequence of amino acids in the protein it codes for."},{"stem":"What is osmosis?","A":"Movement of solutes from high to low concentration through a membrane","B":"Movement of water from a region of higher water potential to lower water potential through a partially permeable membrane","C":"Movement of any molecule against a concentration gradient","D":"Movement of oxygen across a membrane, requiring energy","correct":"B","explain":"Osmosis is the movement of water molecules only, across a partially permeable membrane, from a region of higher water potential (more dilute solution) to a region of lower water potential (more concentrated solution). It is a passive process — no energy is required."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
