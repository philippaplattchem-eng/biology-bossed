@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T9: Ecosystems &mdash; Flame</h1><span class="tier-badge flame">Flame</span></header><main><div class="quiz-meta"><span>20 questions &middot; Ecosystems</span><span>Flame: Application</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"A food web shows: grass → rabbits → foxes; grass → rabbits → stoats → foxes; grass → mice → owls; mice → stoats. If the rabbit population suddenly crashed due to disease, predict the effect on foxes and on grass.","A":"Fox numbers would increase because less competition; grass would decrease due to increased rabbit grazing","B":"Fox numbers would initially decrease (reduced food source); stoat numbers might also decrease (less rabbit prey) → stoats eat more mice → owl numbers might decrease; grass biomass would likely increase (fewer rabbits eating it) — demonstrating that removing one species has cascading effects through the food web","C":"Grass would decrease because foxes eat grass when rabbit numbers fall","D":"There would be no effect — foxes would immediately switch to eating grass","correct":"B","explain":"The rabbit crash removes a major food source for foxes and stoats → their populations fall. Stoats may compensate by eating more mice → mouse population declines → owls (which also eat mice) may decline. Reduced rabbit grazing → grass grows more abundantly. This illustrates trophic cascades — changes at one level cascade through the food web in complex ways. Food webs are more resilient than single chains because predators can switch prey, but species with few connections are most vulnerable."},{"stem":"A student measures the dry biomass at each trophic level in a grassland ecosystem. The results are: grass 5000 g/m², insects 500 g/m², small birds 50 g/m², hawks 5 g/m². Calculate the energy transfer efficiency between the first and second trophic levels and explain what happened to the \"lost\" energy.","A":"Efficiency = 1%; all lost as CO₂ in photosynthesis","B":"Efficiency = (500/5000) × 100 = 10%; the remaining 90% (4500 g/m²) was lost by the grass through respiration (heat), remained in plant material not eaten, or was excreted as faeces — not transferred to insect biomass","C":"Efficiency = 90% — only 10% is lost at each level","D":"Efficiency = 50% — half the grass energy is always transferred to the next level","correct":"B","explain":"Transfer efficiency = (biomass at trophic level n+1 / biomass at trophic level n) × 100 = (500/5000) × 100 = 10%. This is typical. The other 90% is accounted for by: (1) respiration in grass cells — energy released as heat, not available for building biomass; (2) plant material not consumed by insects (roots, bark, etc.); (3) plant material consumed but not absorbed (indigestible cellulose → faeces); (4) material converted to urine/excretion. Only biomass actually incorporated into insect tissue is available to the next trophic level."},{"stem":"Explain why farmers sometimes use biological pest control (introducing a natural predator) rather than pesticides, and give one potential risk of this approach.","A":"Biological control is cheaper because natural predators are free; no risks exist because natural predators only eat pests","B":"Biological control avoids chemical pollution of soil and water; predators are self-sustaining and targeted; however, introduced species may: become invasive (prey on non-target organisms, disrupting food webs); compete with native predators; be difficult to control once released — the classic risk is the introduced species causing more ecological damage than the original pest","C":"Pesticides are always more effective — biological control never works","D":"Biological control only works in laboratory conditions — it cannot be used in real agricultural fields","correct":"B","explain":"Advantages of biological control: (1) no chemical residues; (2) self-sustaining (predator reproduces); (3) target-specific; (4) pests cannot develop pesticide resistance. Risks: (1) introduced predator may not remain in the field; (2) may attack non-target species — classic example: mongoose introduced to Hawaii to control rats, instead devastated native bird populations; (3) may outcompete native predators; (4) lag time before pest population is controlled — crop damage continues initially. Successful examples: Bacillus thuringiensis toxin, parasitoid wasps for glasshouse pests. Risk assessment before release is now legally required."},{"stem":"A farm field has been heavily fertilised with nitrates. After heavy rainfall, local waterways show signs of eutrophication. Trace the pathway from fertiliser application to fish death.","A":"Nitrates enter the water → water becomes acidic → fish die from low pH","B":"Rain washes nitrates off fields → enter streams/lakes; algae proliferate (algal bloom); surface algae block light → aquatic plants below die; algae die when nutrients depleted; aerobic decomposers respire dead algae, consuming dissolved O₂; O₂ levels fall; fish and other aerobic organisms cannot get sufficient O₂ → die","C":"Nitrates directly poison fish by combining with haemoglobin","D":"Nitrates cause plants to grow faster → fill the waterway and block fish movement → fish are trapped and die","correct":"B","explain":"Eutrophication sequence: (1) Nitrate run-off → watercourse enrichment; (2) Algal bloom — rapid growth of surface algae (phosphate may also be limiting, from sewage/detergents); (3) Light blocked → aquatic plants die (loss of O₂ from plant photosynthesis); (4) Algae die as nutrients deplete; (5) Decomposer bacteria multiply, aerobically decomposing algae → BOD (biological oxygen demand) increases dramatically → dissolved O₂ falls toward zero; (6) Aerobic organisms (fish, invertebrates) die. Anaerobic bacteria remain, producing odorous gases. The problem compounds because dead fish add to decomposers' substrate."},{"stem":"Deforestation releases CO₂ and reduces CO₂ uptake. Use the carbon cycle to explain both effects.","A":"Deforestation increases CO₂ uptake because cleared land absorbs more sunlight","B":"(1) Burning or decay of felled trees releases carbon stored in tree biomass as CO₂ → immediate atmospheric CO₂ increase; (2) Fewer trees = less photosynthesis = less CO₂ removed from atmosphere; (3) Soil disturbance → decomposers more active → soil carbon released as CO₂; (4) Loss of tree roots → less carbon stored in soil organic matter; net effect: increased atmospheric CO₂ concentration → enhanced greenhouse effect","C":"Deforestation has no effect on CO₂ because the carbon remains in the wood","D":"Deforestation reduces atmospheric CO₂ because fewer plants means less respiration","correct":"B","explain":"Carbon in trees: ~50% of dry wood mass is carbon, fixed over decades/centuries by photosynthesis. When felled and burned: rapid oxidation → CO₂ release. When left to rot: slower but same CO₂ release via decomposer respiration. The standing forest annually removed ~2.6 billion tonnes of CO₂ globally (net). Deforestation = losing this carbon sink AND releasing stored carbon. Tropical forests (Amazon, Congo Basin) are particularly carbon-dense. Estimates suggest deforestation accounts for ~10% of current anthropogenic CO₂ emissions. Reforestation and avoided deforestation are key carbon offset strategies."},{"stem":"A conservation biologist introduces captive-bred white rhinos back into a national park where they were previously extinct. What challenges must be addressed to ensure the reintroduction succeeds?","A":"The main challenge is that the rhinos have forgotten how to eat grass in captivity","B":"Suitable habitat must exist with adequate food, water and territory; sufficient genetic diversity in the captive population (to avoid inbreeding depression); disease threats assessed; the cause of original extinction addressed (poaching, habitat loss) — if unchanged, reintroduction will fail; post-release monitoring of survival, reproduction and health; management of human-wildlife conflict in surrounding communities","C":"Reintroduction only fails if there are too many predators — removing all predators ensures success","D":"Success is guaranteed once captive-bred animals are released — no further management is needed","correct":"B","explain":"Successful reintroduction (ex-situ to in-situ conservation) requires: (1) Habitat — sufficient high-quality territory with food, water, shelter, appropriate abiotic conditions; (2) Genetic diversity — minimum viable population size and genetic variation to prevent inbreeding; (3) Threat removal — address the cause of original extinction (anti-poaching patrols, habitat protection); (4) Health assessment — pre-release veterinary checks, disease screening; (5) Behaviour — captive-bred animals may lack survival skills (foraging, predator avoidance); (6) Post-release monitoring — track survival, movement, reproduction; (7) Community engagement — local people must benefit or at minimum not suffer from the presence of wildlife. The northern white rhino has only 2 individuals remaining (both female) — reintroduction is now impossible without reproductive technology."},{"stem":"Explain how intensive farming practices increase food production but reduce biodiversity.","A":"Intensive farming always increases biodiversity because it grows more plants","B":"Intensive farming raises yields via: monocultures (single-crop fields with no habitat variation → fewer niches); pesticide use (kills insects including pollinators and food-web species); herbicide use (kills wild plants that provide food and shelter); hedgerow removal (destroys habitat corridors and nesting sites); drainage of wetlands (removes aquatic habitats); artificial fertilisers (run-off causes eutrophication); all reduce structural and species diversity in the agricultural landscape","C":"Intensive farming only affects soil microorganisms — larger species are unaffected","D":"Biodiversity increases in intensively farmed areas because of the large amounts of food available for wildlife","correct":"B","explain":"Biodiversity losses from intensification: (1) Monocultures — single species, single age structure → minimal habitat complexity → few niches for insects, birds, mammals; (2) Pesticides — insecticide kills invertebrates (pollinators, predators of pests); herbicides remove arable weeds (food source for seed-eating birds); (3) Hedgerow removal — in UK, ~50% of hedgerows lost since 1945, reducing woodland-edge habitat for birds, mammals, insects; (4) Wetland drainage — for agriculture, ~90% of UK lowland wetlands lost; (5) Eutrophication from fertiliser run-off. The UK has lost >50% of its biodiversity over the past 50 years, largely due to agricultural intensification."},{"stem":"A scientist uses a quadrat survey to estimate the population of a rare orchid in a meadow (area 5000 m²). In 10 random quadrats (each 1 m²), the counts are: 3, 0, 2, 1, 4, 0, 2, 1, 3, 0. Estimate the total population.","A":"Total population = 16 (just add all counts from the quadrats)","B":"Mean per quadrat = 16/10 = 1.6; estimated total = 1.6 × 5000 = 8000 orchids","C":"Total population = 10 (one per quadrat on average)","D":"Total population = 5000 (equal to the meadow area)","correct":"B","explain":"Population estimate using quadrats: (1) Calculate mean number per quadrat: sum of counts = 3+0+2+1+4+0+2+1+3+0 = 16; mean = 16/10 = 1.6 per m²; (2) Extrapolate to whole area: 1.6 × 5000 = 8000. For this method to be valid, quadrats must be placed randomly (random number coordinates) to avoid sampling bias. Larger sample size reduces sampling error. This is the standard quadrat extrapolation method for sessile/slow-moving organisms. For mobile organisms, mark-recapture (Lincoln index) is more appropriate."},{"stem":"A mark-recapture experiment to estimate a fish population: 50 fish are caught, marked, and released. Two weeks later, 60 fish are caught; 10 are marked. Estimate the population size using the Lincoln index.","A":"Population = 50 + 60 = 110 fish","B":"Population = (50 × 60) / 10 = 300 fish","C":"Population = 60 / 10 = 6 fish","D":"Population = 50 × 10 = 500 fish","correct":"B","explain":"Lincoln (Peterson) index: N = (M × C) / R, where M = number marked initially, C = number in second capture, R = recaptures. N = (50 × 60) / 10 = 3000/10 = 300 fish. Assumptions required for validity: (1) marked individuals mix randomly back into population; (2) marks are not lost and don't affect survival/behaviour; (3) no significant immigration, emigration, births or deaths between captures; (4) sufficient time for mixing (~2 weeks here). If any assumption is violated, the estimate is biased."},{"stem":"Explain why growing leguminous plants (e.g. clover) in crop rotation reduces the need for artificial nitrogen fertilisers.","A":"Leguminous plants absorb nitrogen directly from the atmosphere through their leaves","B":"Legumes have Rhizobium bacteria in root nodules that fix atmospheric N₂ → NH₄⁺; when legumes are ploughed in (green manure), their nitrogen-rich tissue decomposes → ammonium and nitrates released into soil; the following crop can absorb this nitrogen — reducing (but not eliminating) the need for synthetic nitrate fertilisers","C":"Leguminous plants produce nitrogen gas as a photosynthesis by-product, enriching the soil","D":"Leguminous crop rotation has no effect on soil nitrogen — its value is purely in breaking disease cycles","correct":"B","explain":"Rhizobium in legume root nodules fix atmospheric N₂ using nitrogenase enzymes, providing plant-available ammonium. When the legume crop is ploughed under as green manure: (1) decomposers mineralise organic nitrogen → ammonium → nitrification → nitrate; (2) soil nitrate available for next crop. Traditional Norfolk 4-course rotation included clover (legume) in the rotation specifically to improve soil fertility. This reduces dependence on synthetic Haber-Bosch nitrogen fertilisers (whose production is energy-intensive and contributes to greenhouse gas emissions). Organic farming systems rely heavily on legume rotation."},{"stem":"Global warming is predicted to cause poleward shifts in species distributions. Explain why, and identify one species that might benefit and one that might be harmed by warming in the UK.","A":"Species move poleward to escape increased predators in warmer regions","B":"Rising temperatures shift thermal tolerance zones poleward — species tracking their preferred temperature range move to higher latitudes or altitudes; benefit example: Comma butterfly (Polygonia c-album) — already expanded northward in UK as warm summers extend its range; harm example: Mountain hare (Lepus timidus) or Arctic/sub-Arctic moorland species — their cold-adapted habitats are contracting as warmer conditions allow competitors/lowland species to advance","C":"Warming causes all species to migrate toward the equator to find cooler conditions","D":"Warming has no effect on species distributions — only rainfall matters","correct":"B","explain":"Climate change is shifting bioclimatic envelopes — the range of temperature, rainfall and other conditions a species can tolerate. Evidence: UK Butterfly Monitoring Scheme shows northward range expansion in many southern species; treeline moving upslope globally; polar bears losing sea ice habitat. Winners in UK: warmth-loving invertebrates (Comma, Painted Lady butterflies), some reptiles, Mediterranean bird species; losers: montane/boreal species dependent on cold conditions (Ptarmigan, Mountain hare, alpine plants), species with fragmented habitats unable to disperse northward. Rate of change may exceed species' ability to track."},{"stem":"A conservation manager is deciding whether to maintain a single large nature reserve or several small ones (SLOSS debate — Single Large Or Several Small). Outline the main ecological arguments for each approach.","A":"Several small reserves are always better — more sites means more total habitat","B":"Single large: supports larger populations (less vulnerable to demographic stochasticity and inbreeding); contains more interior habitat (avoids edge effects); can accommodate species with large territory requirements; more stable microclimate. Several small: total area may be larger; protects against catastrophic loss (disease/fire/pollution of one site); may cover more geographic range (different abiotic conditions, different species); increases connectivity if close together (acts as stepping stones for dispersal)","C":"Single large reserves are always better — small reserves provide no conservation value","D":"Reserve size has no effect on species diversity — what matters is management only","correct":"B","explain":"The SLOSS debate stems from island biogeography theory (MacArthur & Wilson): larger islands/reserves → more species (species-area relationship: S = cAz). Large single reserve: higher species richness, viable populations for large-territory species (wolves, eagles), reduced edge:interior ratio (interior species need refugia from edge effects like predation, invasive species, human disturbance). Several small: geographic spread protects against local catastrophe; may collectively contain more species if sited in different habitat types; can function as a network if habitat corridors connect them. Modern consensus: both network connectivity AND individual reserve size matter — the \"island network\" approach."},{"stem":"Explain how the loss of a keystone species can cause disproportionate damage to ecosystem biodiversity.","A":"Keystone species are the most numerous organisms in an ecosystem — losing them reduces total biomass","B":"A keystone species has an effect on ecosystem structure and function disproportionate to its abundance — classic example: sea otters control sea urchin populations, which would otherwise overgraze kelp; removing otters → urchin explosion → kelp forest collapse → loss of entire ecosystem; keystone species often create or maintain habitat used by many other species, so their removal triggers cascading extinctions","C":"Keystone species are always top predators — removing prey species has no similar effect","D":"All species are equally important — the concept of \"keystone species\" is scientifically invalid","correct":"B","explain":"Paine (1966) coined \"keystone species\" after his starfish removal experiment (Pisaster ochraceus) — removal caused mussels to dominate and biodiversity to collapse. Examples: (1) Sea otters → kelp forest maintenance → dozens of dependent species; (2) African elephant — ecosystem engineer, creates waterholes, opens woodland for grassland species; (3) Wolves in Yellowstone → trophic cascade → reduced elk overgrazing → willow/aspen recovery → beaver return → stream modification → wetland creation. The disproportionate effect relative to biomass is the key characteristic. Loss of keystone species can cause \"trophic cascade collapse\" affecting the entire community."},{"stem":"Explain the greenhouse effect and how human activities are intensifying it.","A":"The greenhouse effect is entirely natural and human activities have no influence on it","B":"Greenhouse gases (CO₂, CH₄, N₂O, H₂O vapour) absorb outgoing infrared radiation from Earth's surface and re-emit it in all directions, including back toward Earth — warming the surface beyond what would occur with only solar radiation. Human activities increasing greenhouse gas concentrations: burning fossil fuels (CO₂), deforestation (CO₂), livestock farming and rice paddies (CH₄), fertiliser use (N₂O); increased greenhouse gas concentration → more IR trapped → enhanced greenhouse effect → global warming","C":"The greenhouse effect warms the Earth by blocking sunlight from reaching the surface","D":"Human CO₂ emissions are too small to affect the greenhouse effect — only water vapour matters","correct":"B","explain":"The natural greenhouse effect maintains Earth at ~15°C mean surface temperature (without it: ~-18°C). Greenhouse gases absorb IR at specific wavelengths (CO₂: 15 μm; CH₄: 7.7 μm; H₂O: multiple bands) and re-radiate energy, creating a \"blanket\" effect. Human enhancement: atmospheric CO₂ has risen from 280 ppm (pre-industrial) to 420+ ppm (2024) — a 50% increase primarily from fossil fuel combustion; CH₄ has more than doubled (livestock, landfill, wetland rice, fossil fuel extraction); N₂O +20% (fertilisers). The enhanced greenhouse effect is driving measurable global temperature increase (~1.1°C above pre-industrial) with consequences for species distribution, sea level and weather extremes."},{"stem":"Describe the role of mycorrhizal fungi in nutrient cycling and explain why their loss due to intensive agriculture is ecologically significant.","A":"Mycorrhizal fungi produce nitrogen from decomposing leaf litter — they replace nitrifying bacteria","B":"Mycorrhizal fungi form networks (hyphal networks) through soil — hyphae have vastly more surface area than roots, accessing phosphorus and nitrogen in soil pores inaccessible to roots; plants supply fungi with photosynthate; fungi supply mineral ions; fungal networks connect multiple plants (even different species) allowing nutrient transfer between trees; intensive agriculture (deep ploughing, fungicide use, bare soil periods) destroys hyphal networks — reducing plant mineral access, increasing fertiliser requirement, reducing soil carbon storage","C":"Mycorrhizal fungi only affect the water uptake of plants — they have no role in nutrient cycling","D":"Intensive agriculture increases mycorrhizal fungi populations because fertilisers provide them with more nutrients","correct":"B","explain":"Mycorrhizal hyphae extend the effective root surface area by 10–100×, accessing phosphorus (which moves only by slow diffusion in soil) and organic nitrogen that roots cannot reach. The \"wood wide web\" — interconnected mycorrhizal networks — allows carbon and nutrient transfer between plants (demonstrated by stable isotope tracer experiments: ¹³C from photosynthesis in shaded seedlings via connected trees). Loss from agricultural intensification: (1) reduces plant phosphorus acquisition efficiency → more P fertiliser needed; (2) reduces soil aggregate stability (fungi produce glomalin, a soil-binding glycoprotein) → erosion; (3) reduces soil carbon storage. Regenerative agriculture practices (minimal tillage, cover crops, no fungicides) aim to restore mycorrhizal networks."},{"stem":"A scientist studying succession records the plant species colonising a bare volcanic island over 20 years. Describe what she would observe and explain the process of ecological succession.","A":"The island would remain bare — plants cannot colonise without human assistance","B":"Pioneer species (lichens, mosses, then annual weeds) would colonise first — they tolerate harsh abiotic conditions (bare rock, no soil, extremes of temperature); they begin soil formation (weathering + organic matter from dead tissue); as soil develops, taller plants (grasses, shrubs) can establish; each stage modifies the environment (more soil, shade, moisture retention) making it suitable for new species; later-successional species outcompete pioneers; over time, a climax community (woodland) is reached — stable in the prevailing climate","C":"Succession only occurs in aquatic habitats — terrestrial habitats cannot undergo succession","D":"Pioneer species are always the largest organisms — they arrive first because they disperse further","correct":"B","explain":"Primary succession (from bare, uninhabited substrate): (1) Pioneer species — most stress-tolerant (lichens can fix nitrogen and weather rock; mosses hold water); (2) Soil formation — pioneer death adds organic matter; weathering creates mineral particles; earthworms mix soil; (3) As soil deepens, grasses/herbs establish; (4) Shrubs → shade-tolerant trees; each stage (sere) changes abiotic conditions (more stable temperature, increased nutrient cycling, moisture retention) making conditions suitable for the next. Climax community is determined by climate. Secondary succession (after disturbance) is faster because soil already exists. Classic example: Krakatoa (1883) — lifeless volcanic island recolonised within decades."},{"stem":"Evaluate the use of indicator species to assess water quality.","A":"Indicator species are unreliable because species distribution is entirely random","B":"Pollution-sensitive species (stonefly larvae, mayfly larvae in clean water; rat-tailed maggots, bloodworms in polluted water) provide an integrated measure of long-term water quality — unlike chemical testing which gives a snapshot; presence/absence is easily assessed; however, limitations include: single sampling events may be misleading; species may be absent for reasons other than pollution (natural variation, seasonal); identification requires expertise; cannot quantify pollutant type or concentration","C":"Indicator species can identify the exact chemical composition of pollutants in water","D":"Only aquatic invertebrates are valid indicators — fish cannot be used to assess water quality","correct":"B","explain":"Biotic index methods (e.g. BMWP — Biological Monitoring Working Party score): each macroinvertebrate taxon assigned a sensitivity score; high score = diverse sensitive species = clean water; low score = only pollution-tolerant species = polluted. Advantages over chemical testing: (1) Organisms integrate conditions over time — not a snapshot; (2) show biological (not just chemical) impact; (3) some pollutants are difficult to detect chemically. Limitations: (1) species vary seasonally (some only present as larvae in specific months); (2) natural variation between sites; (3) taxonomic expertise required (identification to genus/species level); (4) some sensitive species naturally absent from certain clean water types. Best used alongside chemical analysis."},{"stem":"A student claims that \"decomposers are not really needed in an ecosystem because animals can always find food without decomposers.\" Evaluate this claim.","A":"The student is correct — decomposers are only beneficial, not essential","B":"The claim is incorrect: without decomposers, dead organic matter would accumulate and mineral nutrients (nitrogen, phosphorus, sulfur) would remain locked in organic form unavailable for uptake by plants; the nutrient cycle would stop; plant growth would cease as mineral supplies deplete; primary productivity would collapse → all food chains would fail; decomposers are essential for recycling the finite mineral nutrients in an ecosystem — without them the system would become nutrient-depleted and all life would eventually cease","C":"The claim is correct only for marine ecosystems — terrestrial ecosystems need decomposers","D":"Decomposers only matter for plant growth — animals can obtain nutrients directly from organic matter without decomposers","correct":"B","explain":"Mineral nutrients (N, P, K, S) cycle through ecosystems via decomposers. These nutrients are finite in any ecosystem — once locked in organic molecules of dead bodies, they are unavailable to producers until mineralised. Without decomposers: (1) dead organic matter accumulates (as in peat bogs where anaerobic conditions inhibit decomposers); (2) mineral ions (especially nitrate, phosphate) become depleted; (3) plant growth declines → herbivores starve → food chains collapse. Decomposers are therefore the essential \"valve\" in nutrient cycling. They are also a food source for detritivores (earthworms, woodlice) which break dead matter into smaller pieces, increasing surface area for decomposers."},{"stem":"Explain the concept of net primary productivity (NPP) and why it differs from gross primary productivity (GPP).","A":"NPP and GPP are identical — the terms are interchangeable","B":"GPP is the total rate of photosynthesis (all carbon fixed per unit area per unit time); NPP = GPP − plant respiration; NPP represents the organic matter available for consumers — the energy actually incorporated into new plant biomass that herbivores can eat; GPP is higher than NPP because plants use a significant portion of their photosynthate for their own respiration (typically 40–60% of GPP); tropical forests have high GPP but also high respiration — NPP is lower than GPP implies","C":"NPP is the total amount of photosynthesis; GPP is the amount available for consumers","D":"GPP only applies to aquatic ecosystems; NPP applies to terrestrial ecosystems","correct":"B","explain":"GPP (Gross Primary Productivity): total energy fixed by photosynthesis per unit area per unit time (e.g. g C m⁻² yr⁻¹). Plant respiration consumes a fraction of GPP for the plant's own metabolism (growth, reproduction, maintenance). NPP (Net Primary Productivity) = GPP − plant respiration = net carbon accumulation in plant biomass = what's available to consumers. Typical values: tropical forest GPP ~3000 g C m⁻² yr⁻¹, plant respiration ~1500 → NPP ~1500; desert: GPP ~150, plant respiration ~100 → NPP ~50. NPP is the actual energy base for all heterotrophs in the ecosystem. Human appropriation of NPP (grazing, harvest, deforestation) has profound effects on ecosystem energy budgets."},{"stem":"The oceans absorb approximately 25% of human CO₂ emissions. Explain the consequences for marine ecosystems and relate this to shell-forming organisms.","A":"Ocean CO₂ absorption warms the water, causing coral bleaching — this is the only ecological consequence","B":"CO₂ dissolves in seawater → forms carbonic acid (H₂CO₃) → dissociates to H⁺ and HCO₃⁻ → ocean pH falls (ocean acidification, current drop ~0.1 pH units since pre-industrial, projected ~0.3–0.4 by 2100); carbonate ion concentration falls → saturation state for calcium carbonate falls → shell-forming organisms (corals, molluscs, echinoderms, pteropods) struggle to build or maintain CaCO₃ shells/skeletons → reduced growth rates, dissolution of shells, weakened reef structures → cascading effects on marine food webs and biodiversity","C":"Ocean CO₂ absorption is beneficial — it fertilises marine algae and increases fish populations","D":"Ocean acidification only affects deep-sea organisms — surface waters are unaffected","correct":"B","explain":"Ocean chemistry: CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻ ⇌ 2H⁺ + CO₃²⁻. Rising CO₂ → more H⁺ → lower pH → carbonate (CO₃²⁻) ions react with H⁺ → less CO₃²⁻ available for CaCO₃ (aragonite/calcite) formation. Threshold: aragonite saturation state Ω < 1 → dissolution exceeds formation. Current impacts: pteropod shells dissolving at polar ocean depths; Great Barrier Reef calcification rates down ~40%; oyster larvae failing in Pacific aquaculture (pH <7.9 → acidosis). Additional stressor: ocean warming → coral bleaching (symbiotic zooxanthellae expelled when temperature exceeds bleaching threshold). Combined warming and acidification represent compound stressors on marine ecosystems — reducing structural habitat (reefs) used by ~25% of marine species despite covering <1% of ocean floor."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
