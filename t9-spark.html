<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T9 Ecosystems Spark | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T9: Ecosystems &mdash; Spark</h1><span class="tier-badge spark">Spark</span></header><main><div class="quiz-meta"><span>20 questions &middot; Ecosystems</span><span>Spark: Recall</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"What is an ecosystem?","A":"A single species living in one particular habitat","B":"All the living organisms in an area (community) together with the non-living (abiotic) environment they interact with","C":"The total number of organisms in a given area at one time","D":"The collection of food chains found in a particular region","correct":"B","explain":"An ecosystem includes both the biotic (living) component — all species in the community — and the abiotic (non-living) component — water, soil, temperature, light, pH. The living and non-living components interact through energy flow and nutrient cycling. Ecosystems can range in scale from a pond to a rainforest. Understanding ecosystems is essential for conservation and predicting how human activities affect nature."},{"stem":"What is the difference between a habitat, a population and a community?","A":"A habitat is all the organisms in an area; a population is a group of different species; a community is the physical environment","B":"A habitat is the place where organisms live; a population is all the individuals of one species in an area; a community is all the populations of different species living in the same area","C":"A habitat is a food chain; a population is a food web; a community is an ecosystem","D":"All three terms describe the same thing — the total number of organisms in an area","correct":"B","explain":"Habitat: the physical environment/place where an organism lives (e.g. a rocky shore, a hedgerow). Population: all individuals of the same species living in the same area at the same time (e.g. all oak trees in a wood). Community: all populations of all different species living and interacting in the same area (e.g. all plants, animals, fungi and bacteria in the wood). Adding the abiotic environment to the community gives the ecosystem."},{"stem":"What are producers and why are they important in ecosystems?","A":"Producers are organisms that eat other organisms — they produce organic matter by digesting prey","B":"Producers (mainly green plants and algae) make organic molecules from inorganic substances using light energy (photosynthesis) — they convert solar energy into chemical energy that passes through all food chains","C":"Producers are decomposers that break down dead organic matter and produce mineral ions","D":"Producers are the largest organisms in an ecosystem that support all other organisms by providing shelter","correct":"B","explain":"Producers are autotrophs — they produce organic compounds from inorganic materials. Green plants, algae and phytoplankton use photosynthesis (light energy + CO₂ + H₂O → glucose + O₂) to fix energy into organic molecules. This is the energy input for virtually all food chains on Earth. Without producers, there would be no energy available for consumers and the entire ecosystem would collapse. Chemoautotrophs (near hydrothermal vents) are producers that use chemical energy rather than light."},{"stem":"What is the difference between a food chain and a food web?","A":"A food chain shows all the organisms in an ecosystem; a food web shows just one pathway","B":"A food chain shows a single linear pathway of energy transfer from one organism to the next; a food web shows the complex interconnected feeding relationships among multiple species in an ecosystem","C":"A food chain always starts with a decomposer; a food web always starts with a producer","D":"Food chains show energy gain; food webs show energy loss","correct":"B","explain":"A food chain is a simple linear sequence: producer → primary consumer → secondary consumer → tertiary consumer (e.g. grass → rabbit → fox). A food web shows the more realistic, complex network of feeding relationships — most organisms eat multiple species and are eaten by multiple predators. Food webs better represent the true structure of ecological communities. Understanding food webs allows prediction of how removing one species affects others."},{"stem":"What is meant by a trophic level?","A":"The total energy contained in all organisms at a particular position in the food chain","B":"A step or feeding level in a food chain — producers are at trophic level 1; primary consumers at level 2; secondary consumers at level 3; and so on","C":"The number of different species at each position in a food web","D":"The physical location where feeding takes place in an ecosystem","correct":"B","explain":"Trophic levels organise organisms by the number of energy transfer steps from producers. Level 1: producers (plants/algae). Level 2: primary consumers (herbivores). Level 3: secondary consumers (carnivores eating herbivores). Level 4: tertiary consumers (top predators). Energy is lost at each trophic level — only about 10% passes from one level to the next — which limits the number of levels in a food chain (typically 4–5 maximum)."},{"stem":"What are abiotic factors in an ecosystem?","A":"Living factors that affect organisms — predators, competitors and disease organisms","B":"Non-living physical and chemical factors such as light intensity, temperature, water availability, humidity, soil pH, mineral ion concentration, and wind speed","C":"The organisms that break down dead material at the base of food chains","D":"The total number of different species present in an ecosystem","correct":"B","explain":"Abiotic factors are non-biological environmental factors: (1) light intensity — affects photosynthesis rate; (2) temperature — affects metabolic rate and enzyme activity; (3) water/moisture — affects turgor, transpiration, habitat; (4) soil pH and mineral content — affects plant growth; (5) wind speed — affects transpiration and heat loss; (6) O₂ and CO₂ concentration in aquatic environments. Changes in abiotic factors directly affect organism distribution, abundance and physiology."},{"stem":"What are biotic factors?","A":"Non-living factors such as temperature and pH that affect organisms","B":"Living factors that affect organisms — including predation, competition (for food, space, mates), disease, parasitism, and mutualistic relationships","C":"The chemical properties of the soil that affect plant growth","D":"The physical structure of the habitat (rocks, trees, burrows) that organisms use","correct":"B","explain":"Biotic factors arise from interactions between living organisms: (1) predation — affects prey population size; (2) interspecific competition — competition between different species for limited resources; (3) intraspecific competition — between individuals of the same species; (4) disease organisms — pathogens reduce population size; (5) parasitism; (6) mutualism (e.g. mycorrhizal associations); (7) food availability. Biotic factors are density-dependent — their effect strengthens as population density increases."},{"stem":"What are decomposers and what is their role in ecosystems?","A":"Decomposers are producers at the base of food chains that capture light energy","B":"Decomposers (mainly bacteria and fungi) break down dead organisms and waste materials into simpler inorganic substances — recycling mineral ions (nitrates, phosphates) back into the soil for uptake by plants","C":"Decomposers are the top predators in food chains that control population sizes of other organisms","D":"Decomposers absorb carbon dioxide and convert it into organic matter like producers","correct":"B","explain":"Decomposers (saprotrophic bacteria and fungi) secrete enzymes outside their cells and absorb the digested products — extracellular digestion. They break down complex organic molecules (proteins, carbohydrates, lipids) in dead organisms and excretory products into simple inorganic molecules (NH₄⁺/NO₃⁻, CO₂, H₂O, mineral ions). This returns nutrients to the abiotic environment, making them available for producers to absorb and incorporate into new organic matter — completing nutrient cycles."},{"stem":"What percentage of energy is typically transferred from one trophic level to the next?","A":"90% of energy is transferred from one trophic level to the next","B":"Only about 10% of energy is transferred — the rest is lost as heat (respiration), faeces, urine, and undigested material","C":"All energy is transferred — nothing is lost between trophic levels","D":"Exactly 50% of energy is transferred at each step in a food chain","correct":"B","explain":"Energy transfer efficiency is approximately 10% between trophic levels (range: 5–20%). Most energy is lost as: (1) heat from respiration — organisms use energy for movement, growth, maintaining body temperature; (2) faeces — indigestible material not absorbed; (3) urine — nitrogenous waste. Only about 10% of energy consumed becomes biomass available to the next trophic level. This inefficiency explains why food chains are short (typically 3–5 links) and why there is less biomass at higher trophic levels."},{"stem":"Why do food chains rarely exceed 5 trophic levels?","A":"There are never enough species to fill more than 5 trophic levels","B":"Energy is lost at each trophic level — only ~10% passes to the next; by trophic level 5, so little energy remains that it cannot support another population of consumers","C":"Predators at trophic level 5 are always too large to have any natural predators","D":"Food chains are limited to 5 levels by the amount of sunlight hitting the Earth","correct":"B","explain":"Starting with 10,000 kJ at the producer level: trophic level 2 has ~1,000 kJ; level 3: ~100 kJ; level 4: ~10 kJ; level 5: ~1 kJ. With only 1 kJ remaining at level 5, there is insufficient energy to support a viable population of level 6 consumers — the energy available would not sustain their metabolic needs. This is why the top predators in food chains are typically at trophic levels 4–5, and why increasing trophic level is associated with decreasing biomass and population size."},{"stem":"What is biomass and how is it measured in ecology?","A":"Biomass is the number of organisms at each trophic level","B":"Biomass is the mass of living material in an organism or at a trophic level — usually measured as dry mass per unit area (g/m² or kg/m²) to exclude water, which varies","C":"Biomass is the energy stored in fossil fuels in an ecosystem","D":"Biomass is the total number of different species in an ecosystem","correct":"B","explain":"Biomass is the total mass of organic material in organisms at a given trophic level or in a given area. Dry mass (mass after removing water by drying) is preferred because water content varies greatly. A pyramid of biomass shows the total dry mass at each trophic level — it is almost always a pyramid shape (less biomass at higher levels) because of the ~10% energy transfer efficiency. Biomass measurement is important for calculating energy flow and productivity in ecosystems."},{"stem":"Describe the key steps in the carbon cycle.","A":"Carbon cycles only between the atmosphere and the ocean — land organisms are not involved","B":"Carbon enters ecosystems by photosynthesis (CO₂ → organic molecules); passes through food chains by feeding; returns to atmosphere by respiration (CO₂); returns slowly by combustion of fossil fuels; decomposers release CO₂ from dead organisms; ocean dissolves CO₂; carbonate shells may form limestone over geological time","C":"Carbon only moves between living organisms — it never enters or leaves the atmosphere","D":"Carbon is produced by the sun and absorbed by the ocean — it never cycles through terrestrial organisms","correct":"B","explain":"The carbon cycle: (1) Photosynthesis — plants remove CO₂ from atmosphere, fix it into organic compounds; (2) Feeding — carbon passes through food chains as organic molecules; (3) Respiration — all organisms return CO₂ to the atmosphere; (4) Decomposition — decomposers break down dead organic matter, releasing CO₂; (5) Combustion — burning fossil fuels/wood releases stored carbon as CO₂; (6) Ocean uptake — CO₂ dissolves in seawater, forms carbonate ions, incorporated into shells → calcium carbonate sediments → limestone (very slow cycle). Human activities (burning fossil fuels, deforestation) are disrupting the balance."},{"stem":"Describe the nitrogen cycle — how does nitrogen move between the atmosphere and living organisms?","A":"Plants absorb nitrogen gas directly from the atmosphere and convert it to protein","B":"Nitrogen-fixing bacteria convert atmospheric N₂ to ammonia/nitrates in soil; plants absorb nitrates → make proteins; animals eat plants → proteins pass up food chain; decomposers break down proteins → ammonium ions; nitrifying bacteria convert ammonium → nitrates; denitrifying bacteria convert nitrates back to N₂; lightning also fixes atmospheric N₂","C":"Nitrogen cycles only through animals — plants use carbon instead of nitrogen","D":"Nitrogen enters the soil only from rainfall and is absorbed by animals directly from the soil","correct":"B","explain":"The nitrogen cycle: (1) Nitrogen fixation — N₂ → NH₃/NH₄⁺ by Rhizobium (in legume root nodules) and free-living bacteria (Azotobacter); also by lightning; (2) Plants absorb nitrates (NO₃⁻) via root hair cells (active transport) and make amino acids/proteins; (3) Feeding — nitrogen passes through food chains as protein; (4) Decomposition — decomposers convert proteins → ammonium (ammonification); (5) Nitrification — Nitrosomonas: NH₄⁺ → NO₂⁻; Nitrobacter: NO₂⁻ → NO₃⁻; (6) Denitrification — anaerobic bacteria convert NO₃⁻ → N₂ (returned to atmosphere). This cycle maintains soil nitrogen availability."},{"stem":"What is biodiversity and why is it important?","A":"Biodiversity is the number of individuals in a population — greater numbers = higher biodiversity","B":"Biodiversity includes the variety of different species (species richness), the genetic variation within species, and the variety of different ecosystems; high biodiversity makes ecosystems more stable, resilient and productive","C":"Biodiversity only refers to the number of animal species — plants and microorganisms are excluded","D":"Biodiversity is the total biomass of all organisms in an ecosystem — more biomass = higher biodiversity","correct":"B","explain":"Biodiversity has three levels: (1) Species diversity — number and relative abundance of species; (2) Genetic diversity — variation in alleles within a species; (3) Ecosystem diversity — variety of different habitats/ecosystems in a region. High biodiversity is important because: it increases ecosystem resilience (if one species is lost, others can fill its role); provides resources for medicine, food, materials; provides ecosystem services (clean water, air purification, soil fertility, climate regulation); has intrinsic value."},{"stem":"What are the main threats to biodiversity?","A":"Natural disasters are the only significant threat to biodiversity","B":"Habitat destruction (deforestation, urbanisation, drainage of wetlands), overexploitation (overfishing, hunting), pollution (pesticides, eutrophication), invasive species, and climate change","C":"Biodiversity is currently increasing due to human activity","D":"Only large predators are at risk — small species are too abundant to be threatened","correct":"B","explain":"Current biodiversity loss is primarily driven by human activities: (1) Habitat destruction — deforestation, agricultural expansion, wetland drainage (the leading cause); (2) Overexploitation — overfishing, bushmeat hunting, over-collecting; (3) Pollution — pesticides, plastic, eutrophication; (4) Invasive species — introduced species outcompete or predate native species; (5) Climate change — shifting temperatures and rainfall patterns alter habitats; (6) Disease. The current rate of extinction is estimated to be 100–1000× the natural background rate — a potential \"sixth mass extinction.\""},{"stem":"What is eutrophication and what causes it?","A":"Eutrophication is a natural process of ocean acidification caused by CO₂ absorption","B":"Eutrophication is excessive enrichment of water with nutrients (nitrates/phosphates), usually from agricultural fertiliser run-off; this causes algal blooms which block light, killing aquatic plants; when algae die, decomposers respire aerobically using oxygen, causing deoxygenation of the water and death of fish and other aerobic organisms","C":"Eutrophication is the process by which oil spills kill aquatic organisms","D":"Eutrophication means increased biodiversity in water bodies due to nutrient enrichment","correct":"B","explain":"Eutrophication sequence: (1) Excess nitrates/phosphates enter water body (from fertiliser run-off, sewage); (2) Algal bloom — rapid algal growth at the surface; (3) Algae blocks light — submerged plants die; (4) Algae dies when nutrients depleted; (5) Decomposers (aerobic bacteria) decompose the dead algae — O₂ consumed; (6) Oxygen concentration falls (deoxygenation); (7) Aerobic organisms (fish, invertebrates) suffocate and die. The dead zone has only anaerobic bacteria producing foul gases (H₂S, methane). Eutrophication is a major cause of water pollution globally."},{"stem":"What is the water cycle?","A":"The movement of water only within living organisms through metabolic processes","B":"The continuous movement of water between the atmosphere, land surface and oceans through evaporation, condensation (cloud formation), precipitation (rain/snow) and transpiration from plants","C":"The conversion of water to oxygen and hydrogen by photosynthesis","D":"The process by which water is produced as a by-product of aerobic respiration only","correct":"B","explain":"The water cycle (hydrological cycle): (1) Evaporation — heat energy causes water to evaporate from oceans, lakes, rivers and soil; (2) Transpiration — plants release water vapour through stomata (contributing to evapotranspiration); (3) Condensation — water vapour rises, cools, forms clouds (water droplets); (4) Precipitation — rain, snow, hail returns water to land and sea; (5) Run-off and percolation — water flows to rivers/groundwater → returns to ocean. The water cycle drives weather patterns and distributes fresh water, essential for all life."},{"stem":"What is a pyramid of numbers and when might it be an unusual shape?","A":"A pyramid of numbers always shows an even triangular shape — there are no exceptions","B":"A pyramid of numbers shows the number of organisms at each trophic level; it is usually widest at the base (most producers); it can be inverted if one large producer (e.g. one tree) supports many consumers, or narrowed at the base if parasites are counted — there are more parasites than their hosts","C":"A pyramid of numbers always shows equal numbers at each trophic level","D":"Pyramids of numbers show the mass rather than number of organisms at each trophic level","correct":"B","explain":"Pyramids of numbers represent the count of organisms at each trophic level. Normally: many plants → fewer herbivores → fewer carnivores. Exceptions: (1) One large tree (trophic level 1) supports thousands of caterpillars, hundreds of birds, tens of foxes — the base is narrow with 1 organism; (2) Parasites — a large organism (host) may support many parasites, creating an inverted or unusual shape. Pyramids of biomass are almost always a true pyramid shape and are a more reliable representation of energy relationships."},{"stem":"What is conservation and why is it necessary?","A":"Conservation means preventing all human use of natural environments — no activities are allowed in conservation areas","B":"Conservation involves managing ecosystems and wild species to maintain biodiversity — it is necessary because human activities are driving rapid species extinctions; conserved ecosystems provide services (clean water, air, food, pollination, climate regulation) that support human survival","C":"Conservation only applies to commercially valuable species like fish and timber trees","D":"Conservation is only important for large charismatic animals like elephants and tigers","correct":"B","explain":"Conservation is the management and protection of biodiversity, including species, genetic diversity and ecosystems. It is necessary because: (1) extinction is irreversible; (2) biodiversity provides ecosystem services (pollination, soil formation, water purification, climate regulation) that humans depend on; (3) economic value of biodiversity (medicines, food security, ecotourism); (4) ethical obligation to other species. Modern conservation recognises trade-offs with human development — sustainable use approaches aim to meet human needs while maintaining biodiversity."},{"stem":"What is the role of nitrogen-fixing bacteria such as Rhizobium?","A":"They convert nitrates in the soil into nitrogen gas, returning nitrogen to the atmosphere","B":"They live in root nodules of leguminous plants (peas, beans, clover) and convert atmospheric nitrogen gas (N₂) into ammonia/ammonium ions that plants can use to make amino acids and proteins","C":"They are decomposers that break down dead organisms and release nitrates into the soil","D":"They absorb nitrates from the soil and convert them to proteins for use by plants","correct":"B","explain":"Rhizobium bacteria form a mutualistic relationship with leguminous plants (peas, beans, clover, soya). They live in root nodules and have nitrogenase enzymes that fix N₂ → NH₃/NH₄⁺. The plant provides the bacteria with glucose (from photosynthesis); the bacteria provide the plant with fixed nitrogen (ammonium) that the plant converts to amino acids. This is extremely valuable in agriculture — legumes naturally enrich soil nitrogen, reducing the need for synthetic fertilisers (used in crop rotation)."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
