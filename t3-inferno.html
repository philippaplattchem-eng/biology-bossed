<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T3 Reproduction Inferno | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T3: Reproduction &mdash; Inferno</h1><span class="tier-badge inferno">Inferno</span></header><main><div class="quiz-meta"><span>20 questions &middot; Reproduction</span><span>Inferno: Higher</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"A woman is heterozygous (Ff) for cystic fibrosis and her partner is also Ff. They already have one affected child (ff). What is the probability that their next child will be affected, and why does the previous affected child not change this?","A":"Less than 25%, because one affected child has already been \"used up\"","B":"25% for each pregnancy — each conception is an independent event and the probability is always 1 in 4","C":"50%, because there are now only two parents to donate the f allele","D":"100%, because they have already demonstrated they can produce affected offspring","correct":"B","explain":"Each pregnancy is genetically independent. The Punnett square (Ff × Ff) always gives FF:Ff:Ff:ff = 1:2:1, regardless of previous outcomes. The 25% probability applies to every single conception. Believing that past outcomes affect future probability is the \"gambler's fallacy.\" The only way to change this probability would be to use preimplantation genetic diagnosis (PGD) to select unaffected embryos."},{"stem":"A dihybrid cross is performed between two organisms heterozygous for two independently assorting genes (AaBb × AaBb). What is the expected phenotypic ratio in the offspring assuming complete dominance?","A":"1:1:1:1 (four phenotypes in equal proportions)","B":"3:1 (dominant : recessive for each gene)","C":"9:3:3:1 (both dominant : first dominant only : second dominant only : both recessive)","D":"1:2:1 (as in a monohybrid cross)","correct":"C","explain":"By Mendel's law of independent assortment, the two genes segregate independently. A 9:3:3:1 ratio of phenotypes results: 9/16 both dominant phenotypes; 3/16 first dominant, second recessive; 3/16 first recessive, second dominant; 1/16 both recessive. This ratio only holds when genes are on different chromosomes (or far apart on the same chromosome) and dominance is complete."},{"stem":"A man has sickle cell anaemia (HbsHbs) and his partner is a carrier (HbAHbs). Sickle cell alleles show codominance — HbAHbs individuals have sickle cell trait (mild symptoms). What phenotypes would be expected in their children and in what ratio?","A":"All children will have sickle cell anaemia","B":"All children will be carriers with sickle cell trait","C":"50% will have sickle cell anaemia (HbsHbs) and 50% will have sickle cell trait (HbAHbs)","D":"25% will be normal (HbAHbA); 50% will have sickle cell trait; 25% will have sickle cell anaemia","correct":"C","explain":"Punnett square (HbsHbs × HbAHbs): HbAHbs (sickle cell trait, mild symptoms) : HbAHbs : HbsHbs (sickle cell anaemia) : HbsHbs = 2:2 = 1:1. Half the children inherit HbAHbs (sickle cell trait); half inherit HbsHbs (sickle cell anaemia). Because codominance applies, there are no \"unaffected\" or \"normal\" children — every child inherits at least one HbS allele."},{"stem":"Non-disjunction during meiosis I produces two types of abnormal gametes. One type has two copies of a chromosome; the other has none. Why does this happen?","A":"The chromosome replicates an extra time during meiosis I","B":"Both chromosomes of a homologous pair fail to separate and migrate to the same pole — one cell receives both, the other receives neither","C":"The spindle fibres overstretch one chromosome and break it","D":"Crossing over causes the chromosomes to become permanently joined","correct":"B","explain":"During meiosis I, homologous chromosomes should separate to opposite poles. Non-disjunction means both members of a pair travel to the same pole. The resulting cell has two copies of that chromosome; the other cell has none. After meiosis II, this produces two types of gamete: n+1 (one extra) and n-1 (one missing). Fertilisation of these with normal gametes produces trisomy or monosomy."},{"stem":"A couple undergo preimplantation genetic diagnosis (PGD). Embryos are tested for a serious autosomal recessive condition before implantation. Which embryos would be selected for implantation and why?","A":"Only homozygous dominant (AA) embryos — carriers are excluded to prevent future generations being affected","B":"Embryos that are either AA or Aa (unaffected) — carriers are healthy and will not develop the condition","C":"All embryos, because PGD cannot distinguish genotypes","D":"Only Aa embryos — to maintain the allele in the gene pool","correct":"B","explain":"PGD screens embryos for genetic conditions. For an autosomal recessive condition, AA and Aa individuals are both phenotypically unaffected. Only aa embryos are at risk. The usual practice is to implant AA or Aa embryos — both are healthy. Excluding carriers (Aa) would greatly reduce the number of viable embryos and is ethically contested. Current UK guidance permits implantation of carriers."},{"stem":"In Drosophila (fruit flies), eye colour gene is X-linked. White eyes (Xʷ) is recessive to red eyes (X⁺). A white-eyed female (XʷXʷ) is crossed with a red-eyed male (X⁺Y). What are the expected phenotypes of the offspring?","A":"All females red-eyed; all males white-eyed","B":"All females white-eyed; all males red-eyed","C":"All offspring red-eyed","D":"Half the females white-eyed; half red-eyed; all males white-eyed","correct":"B","explain":"Females (XX): receive X⁺ from father and Xʷ from mother → X⁺Xʷ (red-eyed carriers). Males (XY): receive Xʷ from mother and Y from father → XʷY (white-eyed). So all females are red-eyed (carriers) and all males are white-eyed. This is a classic criss-cross inheritance pattern — daughters resemble the father phenotypically, sons the mother."},{"stem":"Epistasis occurs when one gene masks the expression of another. Labrador retriever coat colour involves two genes: gene E (at least one E allele = pigment deposited) and gene B (BB or Bb = black; bb = brown). A dog with genotype eeB_ has a yellow coat regardless of the B gene. Why?","A":"The ee genotype prevents all pigment from being made — the B gene has nothing to act on","B":"The E gene dilutes the B gene's product to produce yellow","C":"Yellow is the result of codominance between E and B alleles","D":"The B allele is only expressed when the E allele is absent","correct":"A","explain":"Gene E controls whether pigment is deposited at all. With ee, no pigment moves into the hair, producing yellow regardless of what gene B says. Gene B only determines whether deposited pigment is black (B_) or brown (bb). If no pigment is deposited (ee), gene B is irrelevant — its expression is masked. This is recessive epistasis."},{"stem":"A researcher sequences the genomes of two populations of the same species isolated on different islands for 10,000 years. Thousands of single nucleotide polymorphisms (SNPs) have accumulated between the populations. What does this suggest about mutation and variation?","A":"The organisms must have interbred — SNPs can only arise through sexual recombination","B":"Random mutations have accumulated independently in each population over time, creating genetic divergence — demonstrating that mutation is a continuous source of new variation","C":"SNPs only arise during meiosis, so the populations must still be reproducing sexually","D":"The populations have identical SNPs because they shared the same ancestral genome","correct":"B","explain":"Single nucleotide polymorphisms (SNPs) are positions in the genome where individuals differ by one base. Over 10,000 years of isolation, random mutations have occurred independently in each population. Since the populations cannot exchange genes (no interbreeding), different mutations accumulate in each, leading to genetic divergence. This is the molecular basis of speciation and demonstrates that mutation continually generates new variation."},{"stem":"A woman is a carrier of haemophilia A (X-linked recessive). She marries a man with haemophilia A. What are the expected genotypes and phenotypes of their daughters?","A":"All daughters will be carriers (X^H Xʰ) — unaffected","B":"Half the daughters will be affected (Xʰ Xʰ) and half will be carriers (X^H Xʰ)","C":"All daughters will have haemophilia (Xʰ Xʰ)","D":"No daughters can be affected because haemophilia only affects males","correct":"B","explain":"Mother: X^H Xʰ (carrier); Father: Xʰ Y (affected). Daughters (XX) receive Xʰ from their father. From their mother they receive either X^H or Xʰ. So daughters are: X^H Xʰ (carrier, unaffected) or Xʰ Xʰ (affected with haemophilia) in a 1:1 ratio. Unlike the typical pattern where females are only carriers, daughters of an affected father and carrier mother have a 50% chance of being affected."},{"stem":"Two parents with normal pigmentation have an albino child (aa). Albinism is autosomal recessive — it prevents production of melanin. The parents are shocked, as no one in either family has had albinism for several generations. What is the most likely explanation?","A":"A new dominant mutation occurred in the child","B":"Both parents are Aa carriers — the recessive a allele has been silently passed through several heterozygous generations, only becoming visible when two carriers happened to have a child together","C":"The child acquired the condition from an environmental exposure","D":"One parent must be AA and one must be aa — there is no other explanation","correct":"B","explain":"Recessive alleles can be \"hidden\" in carriers (Aa) for many generations — carriers show no symptoms and may not know they carry the allele. The probability of two carriers meeting is relatively low if the allele is rare. This is why autosomal recessive conditions can appear to \"skip\" generations and then suddenly reappear when two carriers happen to have children together."},{"stem":"The BRCA1 gene is a tumour suppressor. Inheriting one faulty copy (BRCA1⁺/⁻) greatly increases a woman's lifetime risk of breast and ovarian cancer. Why does inheriting only one faulty copy increase risk, even though it is an autosomal recessive gene in terms of cancer development?","A":"BRCA1⁺/⁻ heterozygotes immediately develop cancer","B":"Having one faulty copy means only one further somatic mutation (the \"second hit\") is needed to lose all BRCA1 function in a cell — a much more likely event than two independent somatic mutations in an individual with two normal copies","C":"The BRCA1 allele is dominant — one copy is sufficient to lose tumour suppression","D":"BRCA1 heterozygotes produce half the normal amount of the BRCA1 protein, which is below the threshold for tumour suppression","correct":"B","explain":"This is Knudson's \"two-hit hypothesis.\" For a tumour suppressor gene, both alleles must be non-functional for cancer to develop (recessive at the cellular level). In BRCA1⁺/⁻ carriers, one defective copy is already inherited in every cell. A single somatic mutation in the remaining normal copy in any breast or ovarian cell is sufficient to lose all BRCA1 function. In non-carriers, two independent somatic mutations would both be required — a far less likely event. This explains why carriers have dramatically elevated lifetime cancer risk."},{"stem":"In mice, the agouti coat colour gene shows a maternal effect — the mother's genotype, not the offspring's, determines the offspring's phenotype. What does this tell us about the nature of inheritance in this case?","A":"The agouti gene is sex-linked and only expressed in females","B":"The gene product (mRNA or protein) is deposited into the egg by the mother before fertilisation, so it is the mother's alleles — not the offspring's — that determine early development","C":"The offspring's agouti gene is deleted during fertilisation","D":"This shows that environment completely overrides genetics in coat colour","correct":"B","explain":"Maternal effect genes encode products (mRNAs or proteins) that are deposited into the egg cytoplasm by the mother before fertilisation. These products direct early development, so it is the mother's genotype — not the offspring's — that determines early phenotypic outcomes. This is a deviation from standard Mendelian inheritance and is important in developmental biology. It illustrates that inheritance is not always straightforward."},{"stem":"A scientist discovers that two populations of a bird species have evolved different mating calls. Birds only mate with those producing the same call. Even though the populations can occasionally interbreed physically, they rarely do so. What type of reproductive isolation is this?","A":"Geographical isolation — they are in different physical locations","B":"Behavioural (prezygotic) isolation — differences in mating calls prevent mating even when the populations share the same habitat","C":"Postzygotic isolation — hybrids from the two populations are infertile","D":"Temporal isolation — the populations breed at different times of year","correct":"B","explain":"Prezygotic behavioural isolation occurs when differences in mating signals (calls, displays, pheromones) prevent individuals from choosing each other as mates, even when physically capable of interbreeding. This is a form of reproductive isolation that can drive speciation without requiring geographical separation. Over time, continued divergence in call characteristics and other traits can lead to complete reproductive isolation and new species."},{"stem":"A patient has Turner syndrome (45,X — only one sex chromosome, one X). Which meiotic event most likely caused this?","A":"A point mutation in the sex chromosome gene","B":"Non-disjunction — the sex chromosomes failed to separate during meiosis, producing a gamete with no sex chromosome; after fertilisation with a normal X-bearing gamete, the zygote has only one X (45,X)","C":"Crossing over between X and Y chromosomes during meiosis","D":"Deletion of the Y chromosome during early embryonic development","correct":"B","explain":"Turner syndrome (45,X) most commonly arises from non-disjunction in the father during meiosis II — producing a sperm with no sex chromosome (nullisomic for sex chromosomes). When this fuses with a normal X egg, the result is monosomy X (45,X). Alternatively, non-disjunction can occur in the mother. The result is a female phenotype, but with characteristic features including short stature, infertility and heart defects."},{"stem":"Fragile X syndrome is caused by an expansion of a CGG triplet repeat in the FMR1 gene. Normal alleles have 5–44 repeats; full mutations have >200 repeats. The gene is X-linked. Why is Fragile X more common and generally more severe in males than females?","A":"Males have two X chromosomes, so they have two copies of the faulty allele","B":"Males are hemizygous (XY) — a single copy of the expanded FMR1 allele is expressed without a second normal allele to partially compensate; females (XX) may have a normal allele on the second X that partially masks the effect","C":"The Y chromosome actively silences the FMR1 gene in males","D":"Males produce less of the FMR1 protein because their cells have lower transcription rates","correct":"B","explain":"As an X-linked gene, males have only one copy of FMR1. If that copy has a full mutation (>200 CGG repeats), the gene is silenced by methylation — no FMRP protein is produced, causing intellectual disability. Females with one full mutation copy may have a second X carrying a normal FMR1 allele, which can partially compensate, producing a milder or no phenotype. This explains the pattern: hemizygous males are fully affected; heterozygous females show variable expression."},{"stem":"In meiosis, 46 chromosomes enter the cell; 23 chromosomes are in each daughter cell after meiosis I; 23 chromosomes are in each of four cells after meiosis II. How many unique combinations of chromosomes (ignoring crossing over) are theoretically possible in a human gamete?","A":"46","B":"23","C":"2²³ = approximately 8.4 million","D":"46!","correct":"C","explain":"During meiosis I, each of the 23 homologous chromosome pairs segregates independently. For each pair, the chromosome that goes to each pole is random. With 23 pairs, there are 2²³ possible combinations — approximately 8.4 million unique gamete chromosome combinations, from independent assortment alone. Adding crossing over creates virtually unlimited variation. This explains why no two siblings (except identical twins) are genetically identical."},{"stem":"Mitochondrial DNA is inherited exclusively from the mother. Why does this mean mitochondrial diseases show a distinct inheritance pattern?","A":"Mitochondrial diseases are X-linked because the X chromosome contains the mitochondrial gene","B":"Mitochondrial diseases are passed from mothers to all their children regardless of sex, but fathers cannot pass them on — the pattern always traces through the maternal line","C":"Mitochondrial diseases only affect females because only females have mitochondria","D":"Mitochondrial diseases are only inherited if the mutation is dominant","correct":"B","explain":"Sperm cells contain few mitochondria, and these are typically destroyed in the egg after fertilisation — virtually all mitochondria (and their DNA) in an organism are inherited from the mother's egg. A mutation in mitochondrial DNA is therefore passed from a mother to all her children, but an affected father cannot transmit it. The inheritance pattern always traces exclusively through the maternal line, affecting both sexes equally."},{"stem":"A scientist uses CRISPR-Cas9 to edit the FMR1 gene in a patient's neurons to remove the CGG repeat expansion. The patient is an adult. Will this edit be heritable?","A":"Yes — CRISPR editing always affects the germline","B":"No — the edit is in somatic (body) cells; only germline mutations (in eggs or sperm) are heritable","C":"Yes — if enough neurons are edited, the change spreads to gametes","D":"Only if the patient reproduces within 6 months of the treatment","correct":"B","explain":"CRISPR-Cas9 applied to somatic cells (neurons) modifies the DNA in those cells and their daughter cells only. Somatic mutations cannot be transmitted to offspring because gametes (eggs and sperm) are not edited. To create a heritable change, the edit would need to be performed on embryos or germline cells — which is deeply controversial and subject to strict regulation (germline editing in human embryos is illegal in most countries)."},{"stem":"A forensic scientist compares DNA profiles from a crime scene with three suspects. The profiles show the number of repeats at 16 microsatellite loci. Suspect A matches the crime scene profile at all 16 loci. What does this suggest, and what is one limitation of this conclusion?","A":"Suspect A is definitely guilty — DNA evidence is 100% reliable","B":"Suspect A's DNA profile matches — making it highly statistically unlikely that another person shares this profile. However, DNA evidence shows presence (or shared profile), not direct proof of guilt — contamination, familial similarity or laboratory error must be ruled out","C":"The match proves Suspect A was at the crime scene at the time of the crime","D":"The other two suspects are definitely innocent","correct":"B","explain":"DNA profiling compares the number of short tandem repeats (STRs/microsatellites) at multiple loci. A match at 16 loci has a very low probability of occurring by chance (typically 1 in billions). However, DNA evidence only shows that a biological sample matching the suspect's profile was present — it does not prove guilt. Limitations include: the sample could have been left at a different time; contamination during analysis; identical twins would give identical profiles; familial DNA can partially match."},{"stem":"Genomic imprinting means that for some genes, only the allele inherited from a specific parent (mother or father) is expressed, regardless of whether it is dominant or recessive. This violates Mendel's laws. What is the molecular mechanism underlying this phenomenon?","A":"Only one sex chromosome is present in imprinted genes — the other is deleted","B":"Epigenetic methylation patterns are added to DNA in eggs or sperm that selectively silence the allele from one parent — these marks are inherited and maintained through mitosis","C":"Imprinted genes mutate spontaneously after fertilisation to prevent the other allele from being expressed","D":"Imprinting is caused by environmental factors that block transcription in specific tissues","correct":"B","explain":"Genomic imprinting is an epigenetic phenomenon. During gamete formation (gametogenesis), specific genes are methylated differently in eggs versus sperm. These methylation marks are maintained through mitosis in all somatic cells of the offspring — one parental allele is permanently silenced by methylation regardless of its sequence. This is why the same genotype can produce different phenotypes depending on which parent the allele was inherited from. Classic examples: Angelman syndrome (maternal UBE3A silenced → paternal deletion affects only UBE3A) vs. Prader-Willi syndrome (same chromosomal region, paternal origin silenced vs. maternal deletion)."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
