<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T2 Growth and Development Spark | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T2: Growth and Development &mdash; Spark</h1><span class="tier-badge spark">Spark</span></header><main><div class="quiz-meta"><span>20 questions &middot; Growth and Development</span><span>Spark: Recall</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"What are the main roles of mitosis in the human body?","A":"Producing gametes for sexual reproduction","B":"Growth, repair of tissues and replacement of worn-out cells","C":"Converting glucose into energy","D":"Producing hormones in endocrine glands","correct":"B","explain":"Mitosis produces two genetically identical daughter cells with the same chromosome number as the parent. It is used for growth (increasing cell number), repair (replacing damaged tissue) and replacement (e.g. renewing red blood cells and skin cells). Gametes are produced by meiosis, not mitosis."},{"stem":"What is a tumour?","A":"A type of white blood cell that fights infection","B":"A mass of cells formed by uncontrolled cell division","C":"A specialised nerve cell that transmits signals","D":"A type of mutation found only in plant cells","correct":"B","explain":"A tumour forms when cells divide uncontrollably because the normal checkpoints controlling the cell cycle are overridden. The result is an abnormal mass of cells. Tumours can be benign (contained, non-invasive) or malignant (invasive and potentially spreading to other tissues)."},{"stem":"What is the difference between a benign and a malignant tumour?","A":"Benign tumours spread to other parts of the body; malignant ones do not","B":"Malignant tumours invade surrounding tissue and may spread to other organs; benign tumours remain contained in one place","C":"Benign tumours are always larger than malignant tumours","D":"There is no difference — both terms mean cancer","correct":"B","explain":"A benign tumour grows in one place, has a defined boundary and does not invade nearby tissue — it is not cancerous. A malignant tumour (cancer) invades surrounding tissue and can metastasise: cancer cells break away, travel through blood or lymph, and form secondary tumours elsewhere in the body."},{"stem":"What is a neurone?","A":"A specialised cell that carries electrical impulses","B":"A type of endocrine gland that secretes hormones into the blood","C":"A type of muscle fibre that contracts when stimulated","D":"A cell that carries oxygen around the circulatory system","correct":"A","explain":"Neurones are the specialised cells of the nervous system. They transmit electrical impulses rapidly along their length. Their elongated shape, with a long axon, is an adaptation for carrying signals over long distances within the body."},{"stem":"Which is the correct order of components in a spinal reflex arc?","A":"Motor neurone → relay neurone → sensory neurone","B":"Sensory neurone → relay neurone → motor neurone","C":"Sensory neurone → endocrine cell → motor neurone","D":"Receptor → relay neurone → effector (no sensory neurone)","correct":"B","explain":"The reflex arc pathway is: receptor (detects stimulus) → sensory neurone → relay neurone (in spinal cord) → motor neurone → effector (muscle or gland). The relay neurone in the spinal cord connects sensory to motor neurones and allows the reflex to occur without waiting for the brain to process the signal."},{"stem":"What is a synapse?","A":"A type of skeletal muscle connected directly to a nerve","B":"The junction between two neurones where a signal is transmitted by neurotransmitters","C":"The region of the brain that coordinates voluntary movement","D":"A specialised receptor cell in the skin","correct":"B","explain":"A synapse is the microscopic gap (~20 nm) between the terminal of one neurone and the start of the next. When an impulse arrives, neurotransmitters are released from the pre-synaptic membrane, diffuse across the gap and bind to receptor proteins on the post-synaptic membrane, generating a new impulse."},{"stem":"What is the myelin sheath?","A":"A protein that carries oxygen along nerve fibres","B":"An insulating fatty layer that surrounds the axon and speeds up impulse transmission","C":"A type of neurotransmitter found in the spinal cord","D":"The outer membrane of the cell body of a neurone","correct":"B","explain":"The myelin sheath is a layer of fatty (lipid-rich) material produced by Schwann cells, wrapped around the axon. It insulates the axon, forcing the electrical impulse to jump between gaps called nodes of Ranvier (saltatory conduction). This greatly increases transmission speed compared to unmyelinated neurones."},{"stem":"What does the cerebral cortex (cerebrum) control?","A":"Heart rate and breathing rate","B":"Balance and coordination of fine movement","C":"Conscious thought, learning, memory and personality","D":"Only unconscious reflex responses","correct":"C","explain":"The cerebral cortex is the largest brain region and controls higher functions: conscious thought, intelligence, memory, language, personality and voluntary movement. Different regions of the cortex are specialised — motor cortex for movement, sensory cortex for interpreting sensations, and association areas for complex processing."},{"stem":"What does the cerebellum control?","A":"Conscious thought and decision-making","B":"Balance, coordination and fine movement","C":"Heart rate and breathing rate","D":"Hormone production","correct":"B","explain":"The cerebellum coordinates balance, posture and fine motor control. It receives information from the muscles, joints and balance organs and fine-tunes motor commands. Damage to the cerebellum causes ataxia — loss of coordination and unsteady movement."},{"stem":"What does the medulla oblongata control?","A":"Conscious thought and emotions","B":"Balance and fine motor coordination","C":"Unconscious processes including heart rate and breathing rate","D":"Vision and hearing","correct":"C","explain":"The medulla oblongata controls vital automatic (unconscious) functions: heart rate, breathing rate and blood pressure. Located at the base of the brain where it connects to the spinal cord, it operates continuously without conscious effort. Damage to the medulla is rapidly life-threatening."},{"stem":"What is the main function of the cornea?","A":"To detect light and convert it to electrical signals","B":"To refract (bend) light entering the eye","C":"To control how much light enters the eye","D":"To change the shape of the lens during accommodation","correct":"B","explain":"The cornea is the transparent outer layer at the front of the eye. It provides most of the eye's refractive power — bending incoming light rays so they converge towards the retina. Unlike the lens, the cornea has a fixed curvature and cannot change shape."},{"stem":"What is the function of the iris?","A":"To focus light rays onto the retina","B":"To control the diameter of the pupil, regulating the amount of light entering the eye","C":"To convert light energy into electrical impulses","D":"To produce the fluid that fills the front of the eye","correct":"B","explain":"The iris is the coloured ring of muscle surrounding the pupil. It contains circular muscles (which constrict the pupil in bright light) and radial muscles (which dilate the pupil in dim light). This controls the amount of light reaching the retina."},{"stem":"What is accommodation in the context of vision?","A":"The process by which the eye adjusts to different light intensities by changing pupil size","B":"The process by which the lens changes shape to focus on objects at different distances","C":"The movement of the eyeball in its socket to track moving objects","D":"The conversion of light energy into nerve impulses by rod and cone cells","correct":"B","explain":"Accommodation is the process by which the ciliary muscles and suspensory ligaments alter the curvature of the lens to focus on near or distant objects. A rounder (more curved) lens is needed for close objects; a flatter lens for distant ones."},{"stem":"What is myopia?","A":"Long-sightedness — difficulty seeing objects close up","B":"Short-sightedness — difficulty seeing distant objects clearly","C":"Colour blindness — inability to distinguish red from green","D":"Night blindness — difficulty seeing in dim light","correct":"B","explain":"Myopia (short-sightedness) occurs when the eyeball is too long or the lens too curved. Light from distant objects is focused in front of the retina, producing a blurred image. Close objects are still seen clearly. It affects approximately one-third of adults in the UK."},{"stem":"Which type of lens corrects myopia?","A":"A convex (converging) lens","B":"A concave (diverging) lens","C":"A flat (plane) lens","D":"Myopia cannot be corrected with lenses","correct":"B","explain":"Myopia is corrected with a concave (diverging) lens. This spreads light rays apart before they enter the eye, reducing the overall refractive power so the focal point moves back onto the retina. Contact lenses and spectacles for myopia have a negative power value."},{"stem":"What is a reflex action?","A":"A conscious response that requires thought and decision-making","B":"A fast, automatic response to a stimulus that does not require conscious thought","C":"A slow hormonal response to a change in the internal environment","D":"A voluntary movement planned by the cerebral cortex","correct":"B","explain":"Reflex actions are fast, automatic and protective. They do not involve conscious decision-making — the signal is processed in the spinal cord and a response sent to the effector before the brain consciously registers the stimulus. This speed is their key survival advantage (e.g. withdrawing from pain)."},{"stem":"What is a receptor in the nervous system?","A":"A neurone that carries signals from the brain to a muscle","B":"A cell or specialised organ that detects a stimulus and generates a nerve impulse","C":"A muscle or gland that responds to a nerve signal","D":"A region of the spinal cord that processes reflex signals","correct":"B","explain":"Receptors are specialised cells that respond to specific stimuli (e.g. light, heat, pressure, chemicals) and convert these into electrical impulses. Examples: photoreceptors (rods and cones) in the retina detect light; thermoreceptors in the skin detect temperature changes."},{"stem":"What is an effector?","A":"A cell that detects a stimulus and converts it to a nerve signal","B":"A neurone that carries signals from receptor to the spinal cord","C":"A muscle or gland that produces a response to a motor nerve signal","D":"A receptor protein on the post-synaptic membrane of a neurone","correct":"C","explain":"Effectors are the organs that carry out the response dictated by the nervous system. Muscles respond by contracting; glands respond by secreting substances. Examples: skeletal muscle (contraction), the heart (increased rate) and sweat glands (secretion)."},{"stem":"What is hyperopia?","A":"Short-sightedness — difficulty seeing distant objects","B":"Long-sightedness — difficulty seeing near objects clearly","C":"Colour blindness — difficulty distinguishing colours","D":"Blurred vision at all distances due to irregular cornea shape","correct":"B","explain":"Hyperopia (long-sightedness) occurs when the eyeball is too short or the lens too flat. Light from nearby objects is focused behind the retina, producing a blurred image of near objects. Distant objects may be seen more clearly."},{"stem":"Which type of lens corrects hyperopia?","A":"A concave (diverging) lens","B":"A convex (converging) lens","C":"No lens can correct hyperopia","D":"A cylindrical lens","correct":"B","explain":"Hyperopia is corrected with a convex (converging) lens. This converges light rays before they enter the eye, increasing the total refractive power so the focal point moves forward onto the retina. Spectacles and contact lenses for hyperopia have a positive power value."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
