.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}

.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}

.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}

@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T4: Evolution and Inheritance &mdash; Inferno</h1><span class="tier-badge inferno">Inferno</span></header><main><div class="quiz-meta"><span>20 questions &middot; Evolution and Inheritance</span><span>Inferno: Higher</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"Bacteria reproduce asexually every 20 minutes. A single bacterium with a resistance mutation is placed in a flask with antibiotics. After 10 hours, the flask contains ~10⁹ resistant bacteria. A student claims this proves Lamarckian inheritance (acquired characteristics are inherited). What is wrong with this claim?","A":"The experiment was too short — Lamarckian evolution requires millions of years","B":"The resistance mutation was pre-existing, not acquired in response to the antibiotic — the antibiotic acted as a selection pressure that eliminated non-resistant bacteria, not as an agent that induced resistance mutations","C":"Bacteria cannot evolve because they reproduce asexually","D":"The claim is correct — antibiotic exposure caused the mutation","correct":"B","explain":"Lamarck proposed that traits acquired during an organism's lifetime are inherited by offspring. Darwin's mechanism is different: random, pre-existing mutations (not induced by the environment) provide variation; selection then acts on this variation. In this experiment, the resistance mutation arose before antibiotic exposure. The antibiotic did not cause mutations — it eliminated those without resistance. This is Darwinian natural selection, not Lamarckian inheritance."},{"stem":"Allopatric speciation requires geographic isolation. In the model, two populations diverge genetically while isolated, then if reunited, cannot successfully interbreed (reproductive isolation). What is the molecular basis for the final reproductive isolation?","A":"Geographic barriers block DNA transfer between populations","B":"Independent accumulation of mutations in each population alters DNA sequences for reproductive proteins, mating signals or developmental genes — differences eventually prevent successful fertilisation or produce inviable/infertile hybrids","C":"Each population loses different chromosomes during the isolation period","D":"Mutations only accumulate during geographic isolation, not when populations are in contact","correct":"B","explain":"During isolation, each population accumulates independent mutations — including in genes controlling gamete compatibility, mating behaviour, developmental pathways and chromosome structure. When populations meet again, these differences may prevent: mating (behavioural isolation), fertilisation (gamete incompatibility), or produce inviable/sterile hybrids (postzygotic isolation). Reproductive isolation is the defining criterion for distinct species in the biological species concept."},{"stem":"Horizontal gene transfer (HGT) — the direct transfer of genetic material between organisms, not via reproduction — is common in bacteria. How does this complicate the construction of phylogenetic trees for bacteria?","A":"HGT makes bacteria genetically identical, so they all appear on the same branch","B":"HGT means bacteria can share genes without being directly descended from a common ancestor — phylogenetic trees (which assume vertical inheritance only) can therefore misrepresent bacterial evolutionary relationships","C":"HGT eliminates mutations, making bacterial evolution impossible to track","D":"HGT only transfers non-essential genes, so it has no effect on evolutionary analysis","correct":"B","explain":"Phylogenetic trees assume that genetic similarities reflect shared ancestry through vertical inheritance (parent to offspring). HGT allows genes to be transferred laterally — between different species of bacteria via conjugation, transformation or transduction. This means two bacteria can share identical gene sequences without being closely related. Trees built on such genes will be misleading. This is why bacterial classification using single genes (especially antibiotic resistance genes, which spread by HGT) can be unreliable."},{"stem":"In the peppered moth experiment, a student criticises the original data, arguing that moths do not naturally rest on tree trunks. If moths actually rest in the tree canopy, how does this affect the natural selection explanation for industrial melanism?","A":"It completely invalidates the natural selection explanation — no other mechanism could explain the frequency change","B":"If moths do not rest on exposed trunks, direct visual predation of resting moths on trunks cannot explain the selection — an alternative mechanism (e.g. background matching in canopy, different predation rates, or correlated selection) must be considered; the general principle of selection remains valid","C":"The moth colour frequency data must be fabricated if the original mechanism is wrong","D":"Moths in the canopy would not experience selection — all moths would survive equally","correct":"B","explain":"The mechanism (direct predation of moths on tree trunks) has been questioned by some researchers. However, the frequency shift in dark/pale moths with industrialisation and subsequent re-reversal with clean air legislation is well-documented. If the resting-site mechanism is incorrect, an alternative explanation for differential selection is needed — but the existence of selection on coat colour is supported by extensive data. This illustrates the difference between a theory and a specific proposed mechanism: the theory of natural selection is robust even if one particular experiment's methodology is questioned."},{"stem":"The neutral theory of molecular evolution (Kimura, 1968) proposes that most DNA mutations are neither beneficial nor harmful — they are neutral and accumulate at a constant rate. How can this be used as a \"molecular clock\" to date evolutionary divergence?","A":"Neutral mutations are repaired at a constant rate, showing when repair mechanisms evolved","B":"If neutral mutations accumulate at a constant rate, comparing the number of neutral differences between two species' DNA sequences allows estimation of how long ago they shared a common ancestor","C":"Neutral mutations cause species to converge genetically over time, erasing evolutionary divergence","D":"The molecular clock only works for prokaryotes, not eukaryotes","correct":"B","explain":"If neutral mutations accumulate at a roughly constant rate per unit time per gene, the number of sequence differences between two species is proportional to the time since they diverged. By calibrating against fossil dates, the mutation rate per million years can be estimated. This molecular clock allows divergence times to be calculated even without fossil evidence. However, rates vary between genes and lineages, requiring statistical methods to account for this variation."},{"stem":"A population of bacteria is treated with two antibiotics simultaneously. Compared to using one antibiotic at a time, this strategy greatly reduces the probability of resistance emerging. Explain why using two antibiotics simultaneously is more effective.","A":"Two antibiotics kill bacteria twice as fast, leaving no time for mutation","B":"For a bacterium to survive both antibiotics, it would need two independent resistance mutations simultaneously — the probability of both occurring in the same cell at the same time is the product of the two individual probabilities, making dual resistance extremely rare","C":"Two antibiotics produce antibodies faster, boosting the immune response","D":"The second antibiotic neutralises any mutations caused by the first","correct":"B","explain":"If the probability of a mutation conferring resistance to antibiotic A is 10⁻⁸, and to antibiotic B is 10⁻⁸, the probability of a single bacterium having both simultaneously is approximately 10⁻⁸ × 10⁻⁸ = 10⁻¹⁶ — vanishingly rare. With ~10⁹ bacteria in an infection, single-drug resistance emerges readily; dual resistance does not. This is the principle behind combination therapy for tuberculosis, HIV and cancer — it prevents resistance evolution."},{"stem":"Convergent evolution produces organisms with similar phenotypes (e.g. the streamlined body shape of sharks, dolphins and ichthyosaurs) despite distant common ancestry. Why does this challenge morphology-based classification?","A":"Convergent evolution produces identical DNA sequences in unrelated species","B":"Similar phenotypes from convergent evolution can be misinterpreted as close evolutionary relationship when the organisms are in fact distantly related — morphological classification can therefore produce incorrect phylogenies","C":"Convergent evolution only occurs in aquatic environments and can be easily identified","D":"Convergent evolution reverses natural selection, making classification impossible","correct":"B","explain":"When unrelated organisms independently evolve similar features (convergent evolution), morphological classification may group them together as close relatives — even though the similarity reflects similar selection pressures (e.g. aquatic locomotion), not shared ancestry. DNA-based classification is more reliable because it reflects true evolutionary history. Dolphins (mammals) and sharks (fish) are far more distantly related than their similar body shapes suggest."},{"stem":"CRISPR-Cas9 can edit specific DNA sequences with high precision. A team proposes using CRISPR to eliminate the mosquito species Anopheles gambiae (the primary malaria vector) by introducing a \"gene drive\" that spreads infertility through wild populations. Evaluate the key risk of this approach.","A":"Gene drives cannot spread through wild populations — they only work in laboratory conditions","B":"Eliminating a species permanently could have unpredictable cascade effects on the ecosystem (e.g. loss of food sources for other animals, disruption of pollination networks) — and once released, the gene drive cannot be recalled","C":"The infertility gene would transfer to human populations through mosquito bites","D":"Gene drives only affect the specific mosquito that carries the edit — they cannot spread","correct":"B","explain":"Gene drives use CRISPR to bias inheritance so the edited allele is passed to almost all offspring, spreading through wild populations rapidly. The irreversibility is the central risk: if unforeseen ecological consequences emerge — loss of a food source for birds or bats, disruption of nutrient cycling, or the drive spreading to non-target species — there is no \"undo.\" Anopheles gambiae is a significant malaria vector, but it also has ecological roles. This is an active ethical and scientific debate in conservation biology."},{"stem":"The potato blight pathogen (Phytophthora infestans) caused the Irish Famine (1845–52), killing ~1 million people and displacing another million. Nearly all potato crops in Ireland were a single cloned variety (the Irish Lumper). How does this explain the scale of the disaster?","A":"Cloned plants grow slower than seed-grown plants, leaving less food per acre","B":"A genetically uniform (cloned) population has no variation — no individuals carry resistance alleles. When a novel pathogen arrived, the entire crop was equally susceptible and was wiped out. Genetic diversity would have meant some plants resisted the blight.","C":"The pathogen mutated more rapidly in cloned potatoes than in genetically diverse ones","D":"Cloned potatoes produce higher starch content, making them more attractive to the pathogen","correct":"B","explain":"The lack of genetic diversity in a cloned crop population is its greatest vulnerability. In a genetically diverse population, natural variation means some individuals may carry resistance alleles — at least some of the crop would survive a new pathogen. In a uniform clone, a pathogen adapted to attack that genotype attacks every individual equally. This is why modern agricultural practice maintains genetic diversity through seed banks and the deliberate use of multiple crop varieties."},{"stem":"Two closely related species of oak tree can occasionally hybridise and produce fertile offspring where their ranges overlap. By the biological species concept (BSC), this suggests they are not separate species. Yet they are maintained as distinct species in classification. What does this reveal about the limitations of the BSC?","A":"The BSC is completely reliable — if hybridisation occurs, they must be the same species","B":"The BSC works well for sexually reproducing species with clear reproductive isolation but struggles with species that hybridise rarely — practical classification must also consider ecological, genetic and morphological data, not reproductive isolation alone","C":"The BSC only applies to animals, not plants","D":"Hybridisation proves natural selection has failed to operate on these species","correct":"B","explain":"The biological species concept defines species by reproductive isolation. However, many plant species (and some animals) hybridise occasionally without fully merging. Rare hybridisation does not necessarily mean the species are equivalent — they may occupy distinct ecological niches, have different morphologies, and maintain separate gene pools despite occasional gene flow. The BSC is a useful concept but not an absolute rule, and alternative species concepts (morphological, ecological, phylogenetic) are also used."},{"stem":"A conservation geneticist analysing cheetah DNA finds extremely low heterozygosity across the genome — nearly all cheetahs worldwide are nearly genetically identical. What does this suggest happened in cheetah evolutionary history, and what is the conservation implication?","A":"Cheetahs have evolved to be identical because natural selection favours homozygosity","B":"Cheetahs suffered a severe population bottleneck — possibly ~10,000 years ago — reducing the population to a very small number; most genetic variation was lost; the current population descended from these few survivors with almost no diversity","C":"Cheetahs reproduce asexually, explaining their genetic uniformity","D":"Cheetahs live in isolated geographic regions that prevent genetic drift","correct":"B","explain":"A population bottleneck — a dramatic reduction in population size — causes genetic drift to eliminate most alleles. The small surviving population has limited genetic variation, and all subsequent descendants share the same restricted gene pool. For cheetahs, this means: (1) high susceptibility to novel diseases (no resistance allele diversity); (2) reproductive problems (high sperm abnormality rates); (3) difficulty adapting to environmental change. It is a serious conservation concern."},{"stem":"In selective breeding of crops for yield, alleles for disease resistance are often lost because they are not selected for when disease is absent. Why is maintaining seed banks of wild relatives an important strategy for future food security?","A":"Wild relatives can be directly introduced into fields to replace bred crops","B":"Wild relatives retain allele diversity (including disease resistance alleles) lost from cultivated varieties; future breeders can use them as a gene pool to reintroduce lost traits when new diseases or climate challenges emerge","C":"Seed banks slow the loss of yield traits from cultivated varieties","D":"Wild relatives are more nutritious than cultivated crops and should replace them","correct":"B","explain":"Intensive selective breeding narrows the gene pool — alleles not being actively selected (like disease resistance when conditions are favourable) are lost over generations. Wild relatives, shaped by natural selection, retain diverse alleles including rare resistance genes that might be critical against future pathogens. Seed banks preserve this diversity. When crop diseases emerge (e.g. new wheat rust strains), breeders look to wild relatives to source resistant alleles for introgression into cultivated varieties."},{"stem":"Synthetic biology involves designing and building novel biological systems not found in nature — including synthetic genes. A team designs a gene that makes bacteria produce a plastics-degrading enzyme. This gene has never existed in nature. Which established biological principle makes this possible?","A":"DNA does not follow standard rules — synthetic sequences behave differently from natural ones","B":"The genetic code is universal — all living organisms use the same codons to encode the same amino acids, so a synthetic gene with the correct codon sequence will be correctly translated by any organism's ribosomes","C":"Synthetic genes are immediately integrated into the organism's chromosome without any engineering","D":"Bacteria do not have restriction enzymes, so foreign DNA is always accepted","correct":"B","explain":"The universality of the genetic code means that a DNA sequence specifying a desired protein can be synthesised chemically and inserted into any organism's genome — the organism's ribosomes will correctly translate the synthetic gene because all organisms use the same codon-to-amino-acid mapping (with very minor exceptions). This is the foundation of all genetic engineering and synthetic biology: the same biochemical language is spoken by bacteria, plants, animals and fungi."},{"stem":"A researcher argues that epigenetic changes (heritable changes in gene expression without DNA sequence changes) challenge Neo-Darwinian evolutionary theory. What is the most scientifically precise assessment of this argument?","A":"Epigenetics completely replaces the Neo-Darwinian synthesis — DNA sequence is irrelevant to evolution","B":"Epigenetic changes (e.g. methylation marks) can be inherited across generations and respond to the environment — this adds complexity to the simple gene-centric Neo-Darwinian model, though most biologists view it as an extension rather than a replacement","C":"Epigenetics has no role in evolution — only DNA sequence mutations matter","D":"Epigenetics proves Lamarck was entirely correct and Darwin was wrong","correct":"B","explain":"The Neo-Darwinian synthesis focuses on DNA sequence mutations as the source of heritable variation. Epigenetic inheritance — where methylation patterns or chromatin modifications are transmitted to offspring — represents an additional channel of heritable variation that can respond to environmental conditions. While some researchers propose this as a significant evolutionary mechanism (extended evolutionary synthesis), mainstream evolutionary biology views it as an addition to, not a replacement of, the core principles of natural selection acting on genetic variation."},{"stem":"After the Chernobyl nuclear disaster (1986), the surrounding exclusion zone became a wildlife sanctuary. Animal populations (wolves, deer, birds) have thrived despite elevated radiation, which increases mutation rates. What does this tell us about the relative roles of radiation-induced mutation and habitat availability in wildlife population dynamics?","A":"Radiation is always lethal to all wildlife — the thriving populations must be a myth","B":"For many species, the benefit of human absence (no hunting, land clearance or disturbance) and abundant habitat outweighs the negative effects of elevated mutation rates — demonstrating that human activity is a greater threat to most species than moderate increases in radiation","C":"Elevated radiation caused rapid beneficial mutations that improved animal fitness","D":"Radiation only affects humans — animals are immune to radiation-induced mutation","correct":"B","explain":"Studies of Chernobyl wildlife show complex, species-specific effects. Some species show elevated mutation rates and health effects; others appear unaffected or even thriving. The dominant factor appears to be human absence — no hunting, no habitat clearance, no traffic. This demonstrates that direct human disturbance (the sixth mass extinction driver) is more immediately devastating to most populations than moderate increases in background radiation. It does not mean radiation is harmless — it highlights the scale of human impact on biodiversity."},{"stem":"In a laboratory experiment, E. coli bacteria are grown for 50,000 generations on a minimal medium with glucose as the only carbon source. After approximately 31,000 generations, one population evolves the ability to grow on citrate (normally unavailable to E. coli in oxygen). This was only possible because of a specific earlier mutation. What evolutionary phenomenon does this demonstrate?","A":"Directed mutation — the bacteria sensed the citrate and mutated to use it","B":"Historical contingency — evolution is not always predictable; a specific earlier \"potentiating\" mutation was required before the key innovation could evolve; replay the experiment without that mutation and the outcome differs","C":"Convergent evolution — all 12 parallel populations evolved citrate use","D":"Lamarckian inheritance — bacteria adapted to their medium within one generation","correct":"B","explain":"The Long-Term Experimental Evolution experiment (Lenski lab, ongoing since 1988) showed that the evolution of citrate use required at least two mutations: an earlier \"potentiating\" mutation and the key \"enabling\" mutation. Without the prior potentiating mutation, the enabling mutation is insufficient. This illustrates historical contingency — evolutionary outcomes depend on the specific sequence of prior events. Some evolutionary innovations require particular prior genetic backgrounds; they could not arise in a different order."},{"stem":"GM crops containing Bacillus thuringiensis (Bt) toxin genes are designed to kill insect pests. After widespread adoption, some pest populations are developing resistance to Bt toxin. How should farmers manage fields to slow resistance evolution?","A":"Use higher doses of Bt crop to overwhelm resistant insects","B":"Maintain refuge areas of non-Bt crop nearby — susceptible insects from refuges mate with any resistant insects emerging from Bt fields, diluting resistance alleles and slowing their increase in frequency","C":"Rotate crops annually so pests cannot evolve resistance to the same Bt crop","D":"Apply additional chemical insecticide alongside the Bt crop to eliminate all pests","correct":"B","explain":"Refuge strategy exploits population genetics: if susceptible insects (ss, from non-Bt refuges) mate with resistant ones (Rr, from Bt fields), the offspring are mostly Rr — heterozygous. If resistance is recessive, Rr individuals are killed by Bt toxin, preventing resistant alleles accumulating. Refuges maintain a large population of susceptible insects, so resistant individuals are far more likely to mate with susceptibles than with other resistant insects. This is a practical application of Hardy-Weinberg principles to resistance management."},{"stem":"The Archaeopteryx fossil (~150 Ma) has both reptilian features (teeth, clawed wings, long bony tail) and bird features (feathers, wishbone). Why is it considered particularly valuable evidence for evolution?","A":"It proves that birds and dinosaurs are the same species","B":"It is a transitional fossil — it shows an intermediate form between theropod dinosaurs and modern birds, with a combination of ancestral and derived features that supports the evolutionary origin of birds from dinosaurs","C":"It is the oldest fossil ever discovered, showing the origin of all life","D":"Archaeopteryx was a living organism until very recently — it is not truly ancient","correct":"B","explain":"Transitional fossils are powerful evidence for evolution because they show the gradual acquisition of new features — not the sudden appearance of fully formed \"new\" body plans. Archaeopteryx combines features of both ancestral (dinosaurian) and derived (avian) groups, exactly as predicted by evolutionary theory. Combined with molecular data and later fossil discoveries (feathered dinosaurs from China), it strongly supports the evolutionary transition from theropod dinosaurs to modern birds."},{"stem":"A scientist proposes that, rather than selectively breeding sheep for wool yield, it would be faster to insert the gene for high wool production directly into embryos using genetic engineering. What practical limitation makes this suggestion more complex than it sounds?","A":"Sheep genomes are too large to be modified by genetic engineering","B":"Complex traits like wool yield are polygenic — controlled by many genes with additive effects and influenced by the environment; there is no single \"wool yield gene\" to insert; genetic engineering works best for single-gene traits","C":"Genetic engineering only works in bacteria, not mammals","D":"Selective breeding always produces better results than genetic engineering for all agricultural traits","correct":"B","explain":"Genetic engineering (at GCSE level) is most easily applied to single-gene traits — like insulin production or herbicide resistance. Wool yield, like most agricultural performance traits (milk yield, growth rate, disease resistance), is polygenic — determined by hundreds of genes, each with a small effect, interacting with each other and the environment. There is no single gene to insert. Selective breeding, which gradually shifts allele frequencies across many loci, remains better suited to improving polygenic traits."},{"stem":"In 1859, Darwin's theory faced fierce resistance. By the early 20th century, it was widely accepted by scientists. What combination of evidence was most critical in the eventual acceptance of evolution by natural selection?","A":"Religious authorities eventually approved of the theory","B":"The fossil record, biogeography (distribution of related species on separated continents), comparative anatomy (homologous structures), direct observation of selection in action (e.g. antibiotic resistance), and ultimately DNA evidence — which provided a molecular mechanism for inheritance and variation — collectively built an overwhelming, converging case","C":"A single decisive experiment proved Darwin correct in 1900","D":"Evolution was accepted because no competing theory was proposed","correct":"B","explain":"Scientific theories are accepted not by a single experiment but by the convergence of multiple independent lines of evidence. For evolution: fossils show change over time; biogeography shows related species on separated landmasses; homologous structures show shared ancestry; directly observed selection (e.g. resistance evolution) shows the mechanism works; and DNA evidence — the strongest modern evidence — reveals shared genetic sequences and provides the molecular mechanism of inheritance that Darwin himself lacked. This consilience of evidence is why evolution is one of the most strongly supported theories in all of science."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
