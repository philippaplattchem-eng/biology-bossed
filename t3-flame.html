<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T3 Reproduction Flame | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T3: Reproduction &mdash; Flame</h1><span class="tier-badge flame">Flame</span></header><main><div class="quiz-meta"><span>20 questions &middot; Reproduction</span><span>Flame: Application</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"A strawberry plant spreads by producing runners that root and form new plants. What is the advantage of this, and what is the key disadvantage compared to seed production?","A":"Advantage: genetic variation; disadvantage: slow colonisation of new ground","B":"Advantage: rapid production of many identical (adapted) offspring without needing a mate; disadvantage: no genetic variation — the entire clone population is equally vulnerable to the same new disease or environmental change","C":"Advantage: new allele combinations better than the parent; disadvantage: only one parent is required","D":"Advantage: seeds disperse further; disadvantage: runners use more energy","correct":"B","explain":"Asexual reproduction is rapid and efficient — no mate needed, every offspring can reproduce. If the parent is well-adapted, all offspring share that adaptation. However, all individuals are genetically identical — a single pathogen or environmental change that kills one can kill all. Sexual reproduction generates variation that allows populations to survive changing conditions."},{"stem":"Two parents are both carriers of cystic fibrosis (Ff). What is the probability that their child will have cystic fibrosis?","A":"0% — neither parent has the disease","B":"25% — one in four offspring are expected to be ff","C":"50% — half the offspring will be affected","D":"75% — three in four offspring will be affected","correct":"B","explain":"Punnett square (Ff × Ff): FF (unaffected) : Ff (carrier) : Ff (carrier) : ff (affected) = 1:2:1. The probability of the ff genotype is 1 in 4 = 25%. Note that this is a probability for each pregnancy — it does not mean exactly one in four children will be affected."},{"stem":"A man (XY) and a woman (XX) have children. Why is there approximately a 50% chance of any child being male?","A":"All eggs carry a Y chromosome; all sperm carry an X chromosome","B":"The woman produces eggs all carrying X; the man produces sperm carrying either X or Y — there is a 50:50 chance of an X-bearing or Y-bearing sperm fertilising the egg","C":"The Y chromosome determines sex only in combination with two X chromosomes from the mother","D":"Whether a child is male or female is determined by the environment, not chromosomes","correct":"B","explain":"Men produce two types of sperm in roughly equal numbers: X-bearing sperm (→ female offspring if the egg is fertilised by it) and Y-bearing sperm (→ male offspring). The egg always carries one X. Fertilisation is random, giving approximately equal probability of XX (female) and XY (male). The sex of the child is determined at fertilisation."},{"stem":"A man with Huntington's disease has the genotype Hh (heterozygous). His unaffected partner is hh. What proportion of their children would be expected to develop Huntington's disease?","A":"0% — only homozygous HH individuals are affected","B":"25%","C":"50%","D":"100% — because Huntington's is dominant","correct":"C","explain":"Punnett square (Hh × hh): Hh (affected) : Hh (affected) : hh (unaffected) : hh (unaffected) = 1:1. Each child has a 50% chance of inheriting the H allele and developing the disease. Note: Huntington's is dominant, so only one copy of H is needed to cause the disease."},{"stem":"In cattle, coat colour shows codominance. RR = red; WW = white. What is the coat colour of an RW animal, and what does this illustrate?","A":"Red — R is dominant over W","B":"White — W is dominant over R","C":"Roan — a mixture of red and white hairs, because both alleles are expressed simultaneously","D":"Pink — a blended intermediate colour","correct":"C","explain":"In codominance, neither allele is dominant or recessive — both are expressed in heterozygotes. RW cattle are roan — they have a mixture of individual red hairs and white hairs. (This differs from incomplete dominance, where blending produces an intermediate colour.) Both alleles are fully and independently expressed."},{"stem":"Both parents are unaffected carriers of polydactyly (an autosomal dominant condition, allele P). Wait — polydactyly is dominant, so carriers would show the condition. Let me replace this with an appropriate question. A couple are both carriers of an autosomal recessive condition (Aa). They have three unaffected children. What is the probability that their fourth child will be unaffected?","A":"100% — the first three unaffected children means the fourth must also be unaffected","B":"75% — each pregnancy independently has a 3 in 4 chance of producing an unaffected child","C":"50% — because there are only two possible outcomes (affected or unaffected)","D":"25% — because only 1 in 4 outcomes (aa) is affected, the fourth child must have the opposite probability","correct":"B","explain":"Each pregnancy is an independent event. The probability of an unaffected child from two Aa carriers is 3 in 4 (AA: Aa: Aa: aa = 1:2:1; three out of four genotypes are unaffected). Previous children do not affect this probability — the \"gambler's fallacy\" does not apply to genetics. Each pregnancy has the same 75% chance of producing an unaffected child."},{"stem":"In pea plants, tall (T) is dominant over short (t). A tall plant (Tt) is crossed with a short plant (tt). What ratio of tall to short offspring would you expect?","A":"All tall","B":"3 tall : 1 short","C":"1 tall : 1 short","D":"All short","correct":"C","explain":"Punnett square (Tt × tt): Tt (tall) : Tt (tall) : tt (short) : tt (short) = 2:2 = 1:1. Half the offspring carry T (tall phenotype); half are tt (short). This type of cross — crossing a heterozygous organism with a homozygous recessive — is called a test cross and is used to determine an unknown genotype."},{"stem":"Both parents are unaffected, but their child has cystic fibrosis (ff). What must be true about both parents' genotypes?","A":"Both parents are ff (affected)","B":"Both parents are Ff (heterozygous carriers)","C":"One parent is FF and the other is ff","D":"The parents' genotypes cannot be determined","correct":"B","explain":"For a child to inherit two copies of the recessive f allele, each parent must have contributed one f allele. Since neither parent shows cystic fibrosis, neither can be ff. Therefore, both must be Ff — carrying one dominant (unaffected) and one recessive (CF) allele. Carriers are healthy but can pass the allele to their children."},{"stem":"During meiosis, crossing over occurs between homologous chromosomes. What is the significance of this event?","A":"It increases the chromosome number in gametes, ensuring variety","B":"It creates new combinations of alleles on the same chromosome that were not present in either parent — increasing genetic variation in gametes","C":"It ensures that all gametes are genetically identical","D":"It reduces the number of chromosomes from diploid to haploid","correct":"B","explain":"During meiosis I, homologous chromosomes pair up and exchange segments of DNA at chiasmata (crossing over). This shuffles alleles between homologous chromosomes. The resulting chromatids carry new combinations of alleles not found in either parental chromosome — a major source of genetic variation in sexually reproduced offspring."},{"stem":"A genetic counsellor tells a couple that their unborn child has tested positive for trisomy 21 (Down syndrome — 3 copies of chromosome 21). How did this arise?","A":"A mutation occurred in one of the chromosome 21 genes during development","B":"Non-disjunction during meiosis — chromosome 21 pairs failed to separate correctly, producing a gamete with 2 copies instead of 1; after fertilisation with a normal gamete, the zygote has 3 copies","C":"The child inherited a dominant allele for Down syndrome from one parent","D":"The child inherited two faulty recessive alleles, one from each parent","correct":"B","explain":"Trisomy 21 (Down syndrome) results from non-disjunction — a failure of chromosome 21 homologues (or sister chromatids in meiosis II) to separate properly during meiosis. The resulting gamete carries 2 copies of chromosome 21. When this fuses with a normal gamete carrying 1 copy, the zygote has 3 copies (trisomy). Non-disjunction can affect any chromosome and its risk increases with maternal age."},{"stem":"In ABO blood grouping, alleles IA and IB are codominant; allele i is recessive to both. A person with genotype IAIB has blood group AB. A person with IAIA or IAi has blood group A. What blood group would a child with genotype IBi have?","A":"AB","B":"A","C":"B","D":"O","correct":"C","explain":"IB is dominant over i (which is recessive to both IA and IB). A person with IBi expresses the B antigen only — blood group B. Only iiii (ii) gives blood group O. This is an example of a gene with multiple alleles: IA, IB and i."},{"stem":"A woman is a carrier of red-green colour blindness (XᴿX). Her partner has normal colour vision (XY). What is the probability that their son will be colour blind?","A":"0%","B":"25%","C":"50%","D":"100%","correct":"C","explain":"Sons receive their X chromosome from their mother and Y from their father. The mother's X chromosomes are: one carrying the colour blindness allele (Xᵣ) and one normal (Xᴿ). Each son has a 50% chance of receiving the Xᵣ chromosome. Since males are hemizygous (XY), a single Xᵣ allele will express as colour blindness. So 50% of sons will be colour blind."},{"stem":"A scientist studies height in a large population and finds it follows a normal (bell-shaped) distribution. What type of variation is this, and what does it suggest about genetic control of height?","A":"Discontinuous variation — height is controlled by one gene with two alleles","B":"Continuous variation — height is controlled by multiple genes (polygenic inheritance) and is also influenced by environmental factors such as nutrition","C":"Discontinuous variation — height is controlled by many genes with dominant/recessive relationships","D":"Continuous variation — height is controlled by a single gene with many alleles","correct":"B","explain":"The normal distribution of height is characteristic of continuous variation. It is produced by polygenic inheritance (multiple genes, each contributing a small additive effect) combined with environmental influences (e.g. nutrition). No single gene determines height — many genes collectively produce a wide, continuous range of values."},{"stem":"A mutation occurs in a sperm cell that is used in fertilisation. In which individuals will this mutation be found?","A":"Only in the cell in which it occurred","B":"In all cells of the resulting offspring, because the mutation is present from the single-cell zygote stage","C":"Only in reproductive cells of the offspring","D":"In none of the offspring — sperm cell mutations are repaired at fertilisation","correct":"B","explain":"A mutation in a gamete is a germline mutation. Once the gamete fuses with an egg at fertilisation, the mutation is present in the zygote's DNA. Every cell produced by subsequent mitosis carries this mutation — it is present in every cell of the resulting organism. Germline mutations can also be passed to future generations."},{"stem":"Identical twins are compared with non-identical twins for the occurrence of a particular disease. Identical twins both develop the disease in 80% of cases; non-identical twins both develop it in only 40% of cases. What can be concluded?","A":"The disease is entirely genetic — identical twins share more DNA than non-identical","B":"The disease has a significant genetic component (concordance is higher in identical twins who share 100% DNA vs. non-identical who share ~50%) but also an environmental component (concordance is not 100% in identical twins)","C":"The disease is entirely environmental — if it were genetic, identical twins would always both have it","D":"No conclusion can be drawn from this data","correct":"B","explain":"The higher concordance in identical (monozygotic) twins compared to non-identical (dizygotic) twins shows a genetic contribution — shared 100% vs ~50% of DNA. However, the fact that identical twin concordance is 80% (not 100%) shows that environmental factors also play a role. This is the classic twin study methodology for separating genetic and environmental contributions."},{"stem":"Polydactyly (extra fingers or toes) is caused by a dominant allele (P). A person with genotype Pp has polydactyly. Their partner has normal hands (pp). What is the chance of their child having polydactyly?","A":"0%","B":"25%","C":"50%","D":"100%","correct":"C","explain":"Punnett square (Pp × pp): Pp (polydactyly) : Pp (polydactyly) : pp (normal) : pp (normal) = 1:1. Each child has a 50% probability of inheriting the P allele and having polydactyly. Since P is dominant, only one copy is needed to express the condition."},{"stem":"In peas, round seeds (R) are dominant over wrinkled (r), and yellow (Y) is dominant over green (y). Two true-breeding strains are crossed: round yellow (RRYY) × wrinkled green (rryy). What are the offspring (F1) like?","A":"All wrinkled and green","B":"A mixture of all four phenotypes in equal proportions","C":"All round and yellow","D":"75% round yellow, 25% wrinkled green","correct":"C","explain":"When two homozygous parents are crossed, all F1 offspring are heterozygous (RrYy). Since R is dominant over r and Y is dominant over y, all F1 show the dominant phenotype for both traits: round and yellow. This was the basis of Mendel's first (F1) generation experiments."},{"stem":"A new gene therapy treatment corrects a mutation in the somatic cells of a patient's lungs. Will this change be inherited by the patient's children?","A":"Yes — all mutations are passed to offspring","B":"No — only germline (gamete) mutations are inherited; somatic cell changes do not affect eggs or sperm","C":"Yes — if enough somatic cells are corrected, the change spreads to gametes","D":"Only if the mutation was originally in the patient's gametes","correct":"B","explain":"Germline mutations (in sperm or eggs) are heritable — they are passed to offspring. Somatic mutations affect only the individual's body cells and cannot be inherited. Gene therapy that targets somatic cells (e.g. lung cells) treats the patient's symptoms but does not alter the patient's gametes — their children could still inherit the original uncorrected alleles."},{"stem":"A student constructs a family pedigree for an inherited condition. In every generation, roughly half the individuals are affected, and the condition appears in both males and females equally. What is the most likely inheritance pattern?","A":"Autosomal recessive","B":"Autosomal dominant","C":"X-linked recessive","D":"Mitochondrial","correct":"B","explain":"Autosomal dominant inheritance produces: (1) approximately 50% of offspring affected in each generation; (2) at least one affected parent in every generation (the condition is never \"skipped\"); (3) equal frequency in males and females (autosomal, not sex-linked). This matches the pattern described."},{"stem":"A scientist proposes screening all newborns for a recessive genetic condition. Which argument best supports this proposal?","A":"Screening can alter the child's genotype before symptoms develop","B":"Early identification allows treatment to begin before symptoms cause irreversible damage, improving outcomes","C":"Screening eliminates the alleles from the population within one generation","D":"All genetic conditions can be cured if detected early enough","correct":"B","explain":"Newborn screening enables early diagnosis before symptoms appear. For some conditions (e.g. PKU, congenital hypothyroidism), early intervention — dietary adjustment or hormone replacement — can prevent the irreversible neurological damage that would otherwise occur. Screening does not alter the genotype but allows management that changes the phenotypic outcome. It is one of the clearest examples of using genetic knowledge to improve health outcomes."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
