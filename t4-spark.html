<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T4 Evolution and Inheritance Spark | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T4: Evolution and Inheritance &mdash; Spark</h1><span class="tier-badge spark">Spark</span></header><main><div class="quiz-meta"><span>20 questions &middot; Evolution and Inheritance</span><span>Spark: Recall</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"What is natural selection?","A":"The deliberate breeding of organisms by humans to produce desired traits","B":"The process by which organisms with favourable adaptations survive, reproduce and pass on beneficial alleles to the next generation","C":"The random mutation of DNA that changes an organism's characteristics within its lifetime","D":"The process by which organisms consciously adapt to their environment","correct":"B","explain":"Natural selection is driven by variation within a population, competition for resources, differential survival and reproduction, and inheritance. Individuals with favourable adaptations are more likely to survive and reproduce, increasing the frequency of their alleles in future generations over many generations."},{"stem":"Which of the following best summarises the mechanism of natural selection?","A":"Organisms mutate deliberately in response to their environment; those that mutate best survive","B":"Variation exists in a population → individuals with favourable adaptations survive better → survivors reproduce → beneficial alleles increase in frequency over generations","C":"Humans select the best organisms and breed them together","D":"Competition → migration → adaptation → cloning","correct":"B","explain":"Darwin's mechanism: (1) variation — individuals differ due to mutations and sexual reproduction; (2) selection pressure — competition, predation, disease; (3) survival — better-adapted individuals more likely to survive and reproduce; (4) inheritance — offspring inherit beneficial alleles. Over many generations, advantageous alleles become more common."},{"stem":"What does the fossil record provide evidence for?","A":"That species remain unchanged throughout geological time","B":"That organisms have changed (evolved) over millions of years — fossils show gradual anatomical changes from earlier to more recent forms","C":"That evolution only occurs in marine environments","D":"That all species appeared simultaneously at the beginning of life on Earth","correct":"B","explain":"Fossils are the preserved remains or traces of organisms. The fossil record shows that life has changed progressively over hundreds of millions of years — from simple organisms in ancient rocks to more complex ones in more recent strata. Transitional fossils show intermediate forms between ancestral and descendant species."},{"stem":"What does the development of antibiotic resistance in bacteria demonstrate?","A":"That bacteria deliberately mutate their DNA when exposed to antibiotics","B":"Natural selection — bacteria with random pre-existing mutations conferring resistance survive antibiotic treatment and reproduce, passing on resistance alleles","C":"That antibiotics are always ineffective and should be withdrawn from use","D":"That bacteria can learn from their environment and adapt their genetic material","correct":"B","explain":"Antibiotic resistance is evolution by natural selection, observed in real time. Random mutations produce some bacteria with resistance. When antibiotics are applied, sensitive bacteria die; resistant ones survive and reproduce. Their offspring inherit the resistance alleles. The antibiotic acts as the selection pressure. This is why antibiotic overuse is dangerous."},{"stem":"Who is credited with proposing the theory of evolution by natural selection?","A":"Gregor Mendel","B":"Charles Darwin and Alfred Russel Wallace, independently","C":"Louis Pasteur","D":"Carl Linnaeus","correct":"B","explain":"Darwin developed the theory of evolution by natural selection during his Beagle voyage (1831–36) and published \"On the Origin of Species\" in 1859. Alfred Russel Wallace arrived at the same theory independently in 1858. Both papers were presented jointly to the Linnean Society in 1858."},{"stem":"What is extinction?","A":"The evolution of a new species from an existing one","B":"The permanent loss of all individuals of a species from Earth","C":"The temporary absence of a species from a habitat","D":"A significant reduction in a species' population size","correct":"B","explain":"Extinction is permanent — once a species is extinct, it is gone forever. It occurs when a species cannot adapt quickly enough to environmental changes, or when its population declines to zero due to habitat loss, competition, disease, predation or other factors. Current extinction rates are considered to be accelerating due to human activity."},{"stem":"What is Linnaeus's two-part naming system called?","A":"Trinomial nomenclature","B":"Binomial nomenclature — each species has a genus name and a species name","C":"The five-kingdom system","D":"The phylogenetic naming system","correct":"B","explain":"Linnaeus introduced binomial nomenclature: every species has a unique two-part Latin name — genus (capitalised) followed by species (lower case), e.g. Homo sapiens. This standardised naming replaced the previous chaos of common names (which vary by language and region) and is still used universally in biology today."},{"stem":"Which of the following correctly lists the five kingdoms in Linnaeus's classification system?","A":"Plants, Animals, Fungi, Bacteria, Viruses","B":"Animals, Plants, Fungi, Protists, Prokaryotes","C":"Vertebrates, Invertebrates, Plants, Fungi, Bacteria","D":"Mammals, Reptiles, Amphibians, Fish, Plants","correct":"B","explain":"The five kingdoms are: Animalia (animals), Plantae (plants), Fungi, Protoctista (protists) and Prokaryotae (prokaryotes/bacteria). Viruses are not classified as living organisms and are not included. Modern classification has since moved towards a three-domain system based on DNA evidence."},{"stem":"What is selective breeding?","A":"The natural process by which organisms are selected by environmental pressures","B":"The deliberate choice by humans of organisms with desired traits for breeding to produce offspring with those characteristics","C":"The modification of an organism's genome using laboratory techniques","D":"The production of identical copies of an organism","correct":"B","explain":"Selective breeding (artificial selection) involves humans choosing which individuals reproduce based on desired traits. Over many generations, this shifts allele frequencies in the population towards those controlling the desired traits. Examples: dairy cows selected for high milk yield; wheat selected for disease resistance; dogs bred for specific behaviours."},{"stem":"What is genetic engineering?","A":"The process of natural selection changing gene frequencies over generations","B":"The deliberate modification of an organism's genome by inserting, deleting or altering genes using laboratory techniques","C":"The selective breeding of organisms over many generations to change their characteristics","D":"The use of antibiotics to change bacterial DNA sequences","correct":"B","explain":"Genetic engineering uses tools including restriction enzymes, ligases and vectors (plasmids or viruses) to cut and paste DNA between organisms. It allows specific genes to be transferred between species (producing transgenic organisms), genes to be \"knocked out,\" or mutations to be corrected. CRISPR-Cas9 is a modern example."},{"stem":"What is a transgenic organism?","A":"An organism produced exclusively by selective breeding over many generations","B":"An organism that has had a gene from another species inserted into its genome","C":"A cloned organism produced by somatic cell nuclear transfer","D":"An organism that has undergone a naturally occurring beneficial mutation","correct":"B","explain":"A transgenic organism carries a gene from a different species. Classic examples: GM insulin — human insulin gene inserted into bacteria, which then produce human insulin for diabetics; Bt maize — bacterial gene inserted into maize to produce a pest-resistant protein; golden rice — beta-carotene genes from other plants inserted into rice."},{"stem":"What is adult cell cloning (somatic cell nuclear transfer)?","A":"Splitting a fertilised embryo into individual cells, each developing into an identical organism","B":"Removing the nucleus from an enucleated egg cell, replacing it with the nucleus from an adult body cell, and stimulating the egg to develop into a new organism","C":"Growing cells from an adult organism in a nutrient medium","D":"Injecting new genes into an adult cell to change its characteristics","correct":"B","explain":"Adult cell cloning (used to produce Dolly the sheep, 1996): (1) remove nucleus from egg cell; (2) insert nucleus from adult donor body cell; (3) stimulate egg to divide; (4) implant into surrogate mother. The resulting offspring is genetically identical to the donor of the nucleus — a clone."},{"stem":"What is tissue culture (micropropagation)?","A":"Growing whole plants from seeds under laboratory conditions","B":"Cloning plants by growing small pieces of plant tissue on a sterile nutrient medium in laboratory conditions","C":"Transferring embryos between surrogate mothers","D":"The selective breeding of plants under controlled environmental conditions","correct":"B","explain":"Tissue culture (micropropagation) involves taking a small piece of plant tissue (often from the growing tip) and placing it on a nutrient medium containing hormones. Under sterile conditions, the cells divide and differentiate, producing many genetically identical plantlets — all clones of the parent. This is used commercially to rapidly propagate rare or high-value plants."},{"stem":"What does DNA comparison between species provide evidence for?","A":"DNA comparison disproves evolution by showing all species have entirely different genes","B":"Greater similarity in DNA sequences between species indicates more recent common ancestry and closer evolutionary relationships","C":"DNA evidence shows that evolution always produces more complex organisms over time","D":"DNA comparison can only be used within a single species, not between species","correct":"B","explain":"Comparing DNA sequences between species reveals evolutionary relationships. Species that share a recent common ancestor have more similar DNA than those that diverged long ago. For example, humans and chimpanzees share approximately 98.7% of their DNA sequence, reflecting their recent common ancestor. DNA evidence has refined and sometimes corrected traditional classification based on anatomy."},{"stem":"What is an evolutionary (phylogenetic) tree?","A":"A diagram showing the food web relationships in an ecosystem","B":"A branching diagram showing the evolutionary relationships between species and their common ancestors","C":"A pedigree chart showing the inheritance of alleles through generations in a family","D":"A map of the complete genome sequence of an organism","correct":"B","explain":"A phylogenetic tree is a branching diagram where each branch point (node) represents a common ancestor. Species that share a recent node are more closely related. Modern phylogenetic trees are increasingly based on molecular data (DNA and protein sequence comparisons) rather than anatomical features alone."},{"stem":"What does \"survival of the fittest\" mean in Darwin's theory?","A":"The physically strongest animals always survive in all environments","B":"Organisms best adapted to their particular environment are most likely to survive and reproduce","C":"The largest organisms survive regardless of environmental conditions","D":"Only those with the most mutations survive to reproduce","correct":"B","explain":"\"Fittest\" in evolution means best adapted to the specific environment — not necessarily strongest or largest. A cave fish that is blind is \"fitter\" than a sighted fish in a dark cave. Fitness is always relative to the environment and changes as environments change. An adaptation that is beneficial in one environment may be neutral or harmful in another."},{"stem":"What are the main factors that can cause extinction?","A":"Only climate change leads to extinction in modern times","B":"Habitat destruction, new diseases, climate change, competition from invasive species, and predation/hunting can all cause extinction","C":"Only direct hunting by humans leads to extinction of modern species","D":"Extinction is impossible for modern species — it only affected ancient organisms","correct":"B","explain":"Extinction results from species failing to adapt faster than conditions change. Drivers include: habitat destruction (the leading cause globally), climate change, introduced predators/competitors, disease, and overexploitation. Current extinction rates are estimated at 100–1000 times the natural background rate, largely due to human activity."},{"stem":"What is a mutation in the context of evolution?","A":"A deliberate change made by a scientist to improve an organism's characteristics","B":"A random change in the DNA base sequence that may introduce a new allele, providing the raw material for natural selection","C":"A change in an organism's phenotype caused by environmental factors","D":"A change in behaviour that helps an organism survive","correct":"B","explain":"In evolution, mutations are the ultimate source of new alleles and therefore of new variation. Most mutations are neutral (no effect on phenotype) or harmful. Occasionally a mutation produces an allele that improves survival in a particular environment — natural selection then increases its frequency in the population over generations."},{"stem":"What is a common ancestor?","A":"The most abundant species in a given ecosystem","B":"An ancestral species from which two or more modern species have descended through evolution","C":"The most recently evolved species on a phylogenetic tree","D":"The single organism from which all life on Earth directly descended","correct":"B","explain":"A common ancestor is a shared ancestor from which two or more lineages have diverged. All life on Earth shares a universal common ancestor (LUCA — last universal common ancestor), but the term is usually used for more recent shared ancestors. The closer in time the common ancestor, the more closely related the species."},{"stem":"What advantage does GM (genetically modified) golden rice offer?","A":"It grows faster than conventional rice","B":"It contains beta-carotene (a vitamin A precursor) — which conventional rice lacks — helping to prevent vitamin A deficiency in populations that rely on rice as a staple food","C":"It is resistant to all known rice diseases","D":"It produces more grains per plant, increasing food security","correct":"B","explain":"Golden rice was engineered by inserting genes from daffodil and bacteria that produce beta-carotene, giving the rice its golden colour. Beta-carotene is converted to vitamin A in the body. Vitamin A deficiency causes blindness and increased child mortality in populations dependent on rice. Golden rice is one of the most well-known examples of genetic engineering for nutritional purposes."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
