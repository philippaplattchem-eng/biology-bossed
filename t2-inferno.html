<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T2 Growth and Development Inferno | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T2: Growth and Development &mdash; Inferno</h1><span class="tier-badge inferno">Inferno</span></header><main><div class="quiz-meta"><span>20 questions &middot; Growth and Development</span><span>Inferno: Higher</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"Multiple sclerosis (MS) is an autoimmune disease in which the immune system attacks the myelin sheath. Which effect on nerve function would you predict, and why?","A":"Impulses would travel faster because the bare axon has lower resistance","B":"Impulses would be slower and may fail — without myelin, saltatory conduction is lost and continuous (slower) depolarisation is required; signals can also leak and weaken","C":"Impulse speed would be unaffected because the axon membrane is intact","D":"Impulses would be replaced by slower chemical signals along the axon","correct":"B","explain":"Myelin enables saltatory conduction — the impulse jumps between nodes of Ranvier, travelling far faster than in unmyelinated axons. When myelin is stripped away, the axon must be continuously depolarised along its entire length — much more slowly. Additionally, without insulation, the electrical signal leaks across the bare membrane, reducing amplitude. This explains the progressive loss of coordination, sensation and muscle control seen in MS."},{"stem":"A nerve agent inhibits acetylcholinesterase — the enzyme that breaks down acetylcholine at synapses. What would be the physiological consequence?","A":"No acetylcholine would reach the post-synaptic membrane — muscles would relax","B":"Acetylcholine would accumulate in the synapse and continuously stimulate receptors — causing uncontrolled muscle contractions including respiratory muscles, which can be fatal","C":"The synapse would eventually repair itself using an alternative enzyme","D":"Post-synaptic receptors would be destroyed by the excess neurotransmitter","correct":"B","explain":"Normally, acetylcholinesterase rapidly hydrolyses acetylcholine after it has triggered a response, resetting the synapse. If this enzyme is inhibited, acetylcholine builds up and repeatedly stimulates receptors, causing continuous muscle contraction (tetanic paralysis). Respiratory muscles cannot relax — the victim cannot breathe. This is why organophosphate nerve agents are lethal within minutes."},{"stem":"A mutation in a proto-oncogene causes its protein product to be permanently activated, continuously signalling cell division regardless of external signals. What type of mutation is this and what is its consequence?","A":"A loss-of-function mutation in a tumour suppressor gene — cell division checkpoints fail","B":"A gain-of-function mutation that converts the proto-oncogene into an oncogene — the cell drives its own uncontrolled division","C":"A frameshift mutation causing early termination of the growth factor protein","D":"A neutral mutation that does not affect cell division","correct":"B","explain":"Proto-oncogenes normally encode proteins that promote cell division in a controlled way (in response to growth signals). A gain-of-function mutation permanently activates this protein — division signals are sent continuously, regardless of whether external growth factors are present. The proto-oncogene is converted to an oncogene, a hallmark of cancer. Unlike tumour suppressor gene mutations (where both copies must be lost), a single oncogene mutation can be sufficient to drive cancer."},{"stem":"After a stroke that destroyed Broca's area (speech production), a patient initially cannot speak. After months of intensive therapy, speech partially returns. What does this suggest about the adult brain?","A":"New neurones grew to replace those destroyed in Broca's area — neurogenesis restored the function","B":"The adult brain retains plasticity — other brain regions reorganised to take over the speech function through strengthened alternative neural pathways","C":"The patient's speech returned because glial cells regenerated the myelin in the damaged area","D":"Speech is not localised — Broca's area is not really the speech centre","correct":"B","explain":"The adult brain has limited neurogenesis but retains significant synaptic plasticity. With intensive rehabilitation, surviving neural circuits can be reorganised (rewired) so that neighbouring or contralateral regions partially take over lost functions. This is the basis of speech therapy after stroke. True recovery of Broca's area tissue does not occur — the improvement comes from functional reorganisation of remaining circuits."},{"stem":"Identical twins are raised apart. One develops a major depressive disorder; the other does not. What does this tell us about the cause of depression?","A":"Depression is entirely genetic — the unaffected twin simply has not yet developed it","B":"Depression is entirely environmental — genetics plays no role at all","C":"Depression has both genetic and environmental components — genetics creates a predisposition but is not deterministic; environmental factors (e.g. life events, stress) also contribute","D":"The diagnosis of one twin must be incorrect — identical twins always share all psychiatric conditions","correct":"C","explain":"Identical (monozygotic) twins share 100% of their DNA. If depression were wholly genetic, concordance would be 100%. The fact that one can develop it and the other not shows that non-genetic factors matter. The high but incomplete concordance (~37–50%) in identical twins demonstrates significant genetic risk alongside substantial environmental contribution. This is a key example of the nature–nurture interaction in mental health."},{"stem":"An fMRI study compares brain activation in professional violinists and non-musicians during a violin-playing task. Violinists show greater activation in the left motor cortex (controlling right-hand finger movements) and the cerebellum. What does this suggest?","A":"Violinists are born with genetically larger motor cortices","B":"Sustained musical practice physically reorganises and strengthens neural circuits — the brain reflects years of training history through neuroplasticity","C":"The cerebellum's role in music playing is coincidental; it is normally active during all tasks","D":"fMRI cannot distinguish between genetic and training-related brain differences","correct":"B","explain":"fMRI studies consistently show that expert performers have structurally and functionally different brains in skill-relevant regions. For musicians, years of practice strengthen synaptic connections in the motor cortex (for precise finger movements) and cerebellum (for timing and coordination). This is use-dependent plasticity — the brain physically changes to reflect the demands placed upon it. The effect is specific to the trained skill."},{"stem":"An astronomer notices that looking slightly to one side of a very faint star makes it easier to see at night than looking directly at it. What is the biological basis of this technique?","A":"Peripheral vision is controlled by a different, more sensitive brain region","B":"Looking to the side directs the faint image onto the rod-rich peripheral retina — rods are far more sensitive to dim light than the cone-rich fovea at the centre","C":"The fovea has higher photoreceptor density, giving better sensitivity in all light conditions","D":"Looking to the side uses the tear film as a magnifying lens","correct":"B","explain":"The fovea is densely packed with cone cells, which require relatively bright light and provide high-acuity colour vision. Rod cells are concentrated in the peripheral retina and are highly sensitive in low light (they contain rhodopsin, which bleaches at low light levels). By using averted vision — looking slightly to the side — the faint light from the star falls on the rod-rich periphery, where it can be detected. This technique is routinely used in observational astronomy."},{"stem":"A myopic patient undergoes Lasik laser eye surgery. The laser ablates (removes) tissue from the centre of the cornea. In which direction is the corneal curvature changed, and why does this correct myopia?","A":"The cornea is made more curved, increasing refractive power so distant objects focus further forward","B":"The cornea is made flatter (less curved), reducing the eye's total refractive power so the focal point for parallel light moves back onto the retina","C":"The cornea is removed entirely and replaced with a synthetic converging lens","D":"Only the lens is reshaped — the cornea does not contribute to refraction","correct":"B","explain":"In myopia, the eye converges light too strongly — the focal point lands in front of the retina. Lasik flattens the central cornea, reducing its curvature and therefore its refractive power (the cornea contributes about two-thirds of total ocular power). This moves the focal point for distant (parallel) light rays back to the retina. The procedure is permanent because corneal tissue does not regenerate after ablation."},{"stem":"A myelinated axon (diameter 10 µm) conducts impulses at 60 m/s. An unmyelinated axon of the same diameter conducts at 0.5 m/s — approximately 120 times slower. What accounts for this difference?","A":"The myelinated axon has more voltage-gated ion channels, allowing faster ion flow","B":"Saltatory conduction in the myelinated axon — the impulse jumps between nodes of Ranvier rather than continuously depolarising the entire membrane — is far faster and more energy-efficient","C":"Myelin produces ATP that powers faster active transport of ions","D":"The unmyelinated axon has a smaller effective diameter due to its cytoplasm viscosity","correct":"B","explain":"In myelinated axons, only the nodes of Ranvier (gaps in the myelin) are depolarised. The impulse regenerates at each node and effectively \"jumps\" from node to node (saltatory conduction). In unmyelinated axons, the entire length of membrane must be sequentially depolarised — far slower and more energy-intensive. Myelination is therefore a major adaptation for fast signal transmission in vertebrate nervous systems."},{"stem":"A drug binds to serotonin receptors on post-synaptic membranes but does not activate them. What is this drug's pharmacological classification and what effect does it have?","A":"A serotonin agonist — it mimics serotonin and activates the receptor","B":"A serotonin antagonist — it blocks the receptor without activating it, preventing serotonin from binding and reducing serotonergic signalling","C":"A reuptake inhibitor — it prevents serotonin removal from the synapse","D":"An enzyme inhibitor — it prevents the breakdown of serotonin","correct":"B","explain":"An antagonist binds to a receptor without activating it, competitively blocking the natural ligand (here, serotonin) from binding. This reduces post-synaptic signalling. An agonist would activate the receptor. Reuptake inhibitors (like SSRIs) have the opposite effect — they increase serotonin in the synapse by blocking its removal, boosting serotonergic activity."},{"stem":"Spinal cord injury in humans rarely results in functional recovery, unlike peripheral nerve injury which can regenerate. Which research approach is being explored to overcome this limitation?","A":"Transplanting fully differentiated adult motor neurones from donors","B":"Using stem cells to generate neural progenitor cells that can integrate into damaged spinal cord circuits and restore connectivity","C":"Injecting extra myelin proteins into the injured region to repair the sheath","D":"Stimulating muscles electrically to bypass the nervous system entirely","correct":"B","explain":"CNS axons face an inhibitory environment (from astrocytes and oligodendrocytes producing molecules like Nogo and chondroitin sulphate proteoglycans) that prevents regeneration. Research focuses on: (1) neural stem cell transplantation to replace lost cells and form new connections; (2) blocking inhibitory signals to allow endogenous axon regrowth; (3) iPSC-derived motor neurones. This is one of the most active areas in regenerative medicine."},{"stem":"A study finds that people who work permanent night shifts have a significantly higher risk of colorectal cancer. Which biological mechanism best explains this finding?","A":"Night workers eat more food, causing obesity which causes cancer","B":"Disruption of circadian rhythms impairs DNA repair processes and disrupts cell cycle checkpoint proteins, allowing damaged cells to proliferate","C":"Night workers are exposed to more blue light from computer screens, which directly mutates DNA","D":"Sleep deprivation causes overproduction of growth hormones that stimulate cancer cell division","correct":"B","explain":"Circadian rhythms regulate many biological processes, including DNA repair (most active at night), immune surveillance of abnormal cells and expression of cell cycle regulators (e.g. p53, CDKs). Chronic circadian disruption impairs these mechanisms, potentially allowing cells with DNA damage to escape apoptosis and continue dividing. The WHO classifies night shift work as a probable human carcinogen (Group 2A). The mechanism is multifactorial, but circadian rhythm disruption is a key component."},{"stem":"Red-green colour blindness is far more common in males than females. The gene encoding one of the colour-sensitive opsins is located on the X chromosome. Using genetic reasoning, explain why.","A":"Males produce higher levels of sex hormones that degrade the opsin protein","B":"Males have only one X chromosome — a single recessive allele on that X is always expressed, with no second allele to mask it; females need two recessive alleles to be affected","C":"The Y chromosome actively suppresses expression of colour vision genes","D":"Females have a stronger immune response that maintains opsin protein production","correct":"B","explain":"Red-green colour blindness is X-linked recessive. Males (XY) carry only one X chromosome — any recessive allele on that X is expressed (hemizygous expression). Females (XX) would need two copies of the recessive allele to be colour blind; carrying one copy, they are unaffected carriers. Because two independent rare events must coincide in females, female colour blindness is much rarer. This is the genetic basis for X-linked recessive disorders being more prevalent in males."},{"stem":"The case of Phineas Gage (1848) — who survived an iron rod passing through his frontal lobe and subsequently showed dramatic personality change — provided early evidence for brain localisation. What specific function does this suggest is associated with the frontal (pre-frontal) cortex?","A":"Primary sensory processing of touch and temperature","B":"Executive functions: planning, impulse control, decision-making and aspects of personality","C":"Regulation of heart rate and breathing — vital autonomic functions","D":"Processing of visual information from the retina","correct":"B","explain":"The Gage case was historically pivotal evidence that the frontal cortex is involved in \"executive functions\" — the high-level cognitive processes of planning, decision-making, social behaviour and impulse control. After his injury, Gage became impulsive, unreliable and socially inappropriate despite retained basic cognitive and motor functions. Modern neuroimaging has confirmed the prefrontal cortex's role in these functions."},{"stem":"A patient has selective damage to only the sensory neurones entering the spinal cord on the right side, at lumbar level. The motor neurones and relay neurones are intact. What is the effect on the right-leg withdrawal reflex?","A":"The reflex is unaffected — motor neurones can initiate the reflex without sensory input","B":"The reflex is absent — no signal reaches the relay neurone, so the motor neurone cannot be activated and no response occurs","C":"The reflex is slower but still present, as partial signals get through","D":"The voluntary response replaces the reflex because the brain compensates","correct":"B","explain":"The reflex arc is a sequential pathway — each component is essential. Without sensory neurone input, no signal reaches the relay neurone in the spinal cord. The relay neurone cannot spontaneously activate the motor neurone. The effector receives no instruction to contract. The reflex is abolished, even though the motor and relay neurones themselves are intact. This is the basis of clinical sensory testing after spinal injury."},{"stem":"SSRIs (selective serotonin reuptake inhibitors) treat depression by blocking serotonin transporter proteins. How does this produce their effect?","A":"They increase the rate of serotonin synthesis in the pre-synaptic neurone","B":"They prevent serotonin being reabsorbed into the pre-synaptic neurone, increasing its concentration and duration of action in the synaptic cleft, enhancing post-synaptic receptor stimulation","C":"They block serotonin receptors on the post-synaptic membrane, preventing overstimulation","D":"They activate serotonin degradation by monoamine oxidase enzymes","correct":"B","explain":"Normally, after serotonin binds to post-synaptic receptors, it is reabsorbed into the pre-synaptic terminal via transporter proteins (reuptake). SSRIs block this transporter. Serotonin remains in the cleft longer and at higher concentration, prolonging and enhancing post-synaptic signalling. The antidepressant effect is thought to result from restored serotonergic signalling in mood-regulating circuits, though the full mechanism is more complex."},{"stem":"A researcher compares the percentage of myelinated axons in the prefrontal cortex of 12-year-olds versus 25-year-olds. The 25-year-olds have a significantly higher percentage. Which behavioural difference between these age groups is most directly explained by this finding?","A":"25-year-olds are taller and have greater muscle mass","B":"25-year-olds show better impulse control, planning and risk assessment — executive functions dependent on fast prefrontal processing","C":"12-year-olds have faster basic reaction times because their neurons are more sensitive","D":"25-year-olds sleep less, making their neural circuits more active","correct":"B","explain":"The prefrontal cortex is the last brain region to be fully myelinated — a process not complete until approximately age 25. During adolescence, the prefrontal cortex (responsible for impulse control, forward planning and risk assessment) is still being myelinated. Incomplete myelination means slower, less reliable prefrontal signalling — contributing to the risk-taking and impulsive behaviour characteristic of adolescence. Full myelination improves the speed and reliability of executive function circuits."},{"stem":"A malignant tumour invades surrounding connective tissue. Which molecular mechanism most directly enables tumour cell invasion?","A":"Tumour cells produce extra ATP, using energy to push through tissue barriers","B":"Tumour cells secrete matrix metalloproteinases (MMPs) that degrade the extracellular matrix, allowing cells to migrate into surrounding tissue","C":"Tumour cells lose their nucleus, reducing their adhesion to adjacent cells","D":"Tumour cells undergo meiosis, producing motile daughter cells","correct":"B","explain":"The extracellular matrix (ECM) — composed of collagen, fibronectin and other structural proteins — forms a physical barrier between tissues. Cancer cells often upregulate matrix metalloproteinases (MMPs), proteolytic enzymes that degrade ECM components. This physical dissolution of the tissue barrier enables invasion of adjacent tissue, a key step in cancer progression. MMP inhibition is an active area of anti-cancer drug research."},{"stem":"Peripheral nervous system (PNS) axons can regenerate after injury, but central nervous system (CNS) axons generally cannot. Which combination of factors explains this difference?","A":"PNS axons are shorter, so regeneration is simply easier","B":"PNS Schwann cells clear debris and produce growth factors that guide axon regrowth; CNS oligodendrocytes and reactive astrocytes produce inhibitory molecules (e.g. Nogo, chondroitin sulphate proteoglycans) that actively block axon growth","C":"CNS axons lack myelin sheaths, preventing regeneration","D":"PNS neurons divide by mitosis after injury to produce new cells","correct":"B","explain":"After PNS injury, Schwann cells enter a regeneration-promoting state: they clear myelin debris, produce growth factors (e.g. NGF, BDNF) and form a structural \"tube\" (band of Büngner) to guide the regenerating axon along its original path. In the CNS, by contrast, oligodendrocytes and reactive astrocytes create a scar-like environment rich in axon growth inhibitors. This fundamental difference is why spinal cord injuries are so much harder to treat than peripheral nerve injuries."},{"stem":"A cancer cell carries a loss-of-function mutation in both copies of the TP53 gene (encoding the p53 tumour suppressor protein). Why is this particularly dangerous in terms of cancer progression?","A":"p53 is needed for oxygen transport — its loss causes hypoxia in the tumour","B":"p53 normally halts the cell cycle at DNA damage checkpoints and triggers apoptosis in irreparably damaged cells — losing both copies removes this critical safeguard, allowing cells with accumulating mutations to continue dividing unchecked","C":"p53 builds the blood vessels supplying the tumour — its loss starves the tumour of nutrients","D":"p53 produces the myelin sheath; its loss causes neurone degeneration that enables tumour invasion","correct":"B","explain":"p53 is the \"guardian of the genome.\" When DNA damage is detected, p53 accumulates and activates genes that: (1) halt the cell cycle (p21 → CDK inhibition) to allow repair; or (2) trigger apoptosis if damage is irreparable. Loss of p53 function (both alleles must be mutated — a two-hit event) removes this key checkpoint. Cells with damaged DNA continue dividing and accumulating further mutations at an increasing rate. TP53 is the most commonly mutated gene in human cancers (~50%), highlighting its central role in preventing cancer."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
