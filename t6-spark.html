<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T6 Plant Biology Spark | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T6: Plant Biology &mdash; Spark</h1><span class="tier-badge spark">Spark</span></header><main><div class="quiz-meta"><span>20 questions &middot; Plant Biology</span><span>Spark: Recall</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"What is the word equation for photosynthesis?","A":"Glucose + oxygen → carbon dioxide + water + energy","B":"Carbon dioxide + water → glucose + oxygen (using light energy)","C":"Oxygen + water → glucose + carbon dioxide","D":"Glucose + water → oxygen + carbon dioxide","correct":"B","explain":"Photosynthesis: carbon dioxide + water → glucose + oxygen (light energy required). The balanced symbol equation is: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂. Light energy is absorbed by chlorophyll and used to drive the reaction. Photosynthesis is the reverse of aerobic respiration."},{"stem":"Where in the plant cell does photosynthesis take place?","A":"Mitochondria","B":"Ribosomes","C":"Chloroplasts","D":"Vacuole","correct":"C","explain":"Photosynthesis occurs in chloroplasts, which contain the green pigment chlorophyll. Chlorophyll absorbs light energy (mainly red and blue wavelengths, reflecting green — which is why plants appear green). Chloroplasts have a double membrane and internal membrane stacks (thylakoids) containing chlorophyll."},{"stem":"What are the three main limiting factors of photosynthesis?","A":"Temperature, water availability, and wind speed","B":"Light intensity, carbon dioxide concentration, and temperature","C":"Light intensity, oxygen concentration, and soil pH","D":"Temperature, glucose concentration, and nitrogen availability","correct":"B","explain":"A limiting factor is the factor in shortest supply that restricts the rate of photosynthesis. The three main limiting factors are: light intensity (energy input), carbon dioxide concentration (raw material), and temperature (affects enzyme activity in the light-independent reactions). Increasing any of these beyond their current level will increase the rate, until another factor becomes limiting."},{"stem":"What is the word equation for aerobic respiration?","A":"Carbon dioxide + water → glucose + oxygen","B":"Glucose + oxygen → carbon dioxide + water + energy (ATP)","C":"Glucose → carbon dioxide + ethanol + energy","D":"Oxygen + glucose → water + carbon dioxide + ATP","correct":"B","explain":"Aerobic respiration: glucose + oxygen → carbon dioxide + water (+ ATP). This is the process by which plants (and all organisms) release energy from glucose. Unlike photosynthesis, respiration occurs in all living cells at all times, in the mitochondria."},{"stem":"What are the main uses of glucose produced by photosynthesis in plants?","A":"Only for respiration — glucose is burned for energy","B":"Respiration (energy release), storage as starch, cellulose synthesis (cell walls), protein synthesis, and conversion to lipids for storage","C":"Glucose is immediately converted to fructose for transport in the phloem","D":"Photosynthesis glucose is used only for reproduction — not for growth","correct":"B","explain":"Plants use photosynthetic glucose for: (1) respiration — releasing energy for metabolism; (2) synthesis of cellulose — for cell walls; (3) conversion to starch — for storage in leaves, roots, seeds; (4) conversion to amino acids (with mineral ions from soil) — for protein synthesis; (5) conversion to lipids — for seed storage. Glucose is the central molecule linking all these pathways."},{"stem":"What is transpiration?","A":"The movement of water and dissolved minerals upward through the xylem","B":"The loss of water vapour from the aerial parts of a plant, mainly through stomata","C":"The movement of sugars from leaves to other parts of the plant through the phloem","D":"The absorption of water through the root hair cells","correct":"B","explain":"Transpiration is the evaporation of water from the leaf surface — primarily through open stomata — and its diffusion into the surrounding air. The resulting water loss creates a transpiration stream that draws water up the xylem from the roots. Transpiration is driven by the concentration gradient of water vapour between the moist leaf interior and drier air outside."},{"stem":"What is the function of xylem?","A":"Transporting sugars and amino acids from the leaves to all parts of the plant","B":"Transporting water and dissolved mineral ions from the roots to all parts of the plant","C":"Storing starch in the roots","D":"Carrying hormones from the leaves to the roots","correct":"B","explain":"Xylem vessels transport water and mineral ions upward from the roots to the leaves and other aerial parts. Xylem cells are dead, hollow and lignified — their thick walls provide support and prevent collapse under the tension of the transpiration stream. Water movement is passive — driven by transpiration pull (cohesion-tension mechanism)."},{"stem":"What is the function of phloem?","A":"Transporting water and minerals from roots to leaves","B":"Transporting dissolved sugars (sucrose) and amino acids from source to sink throughout the plant","C":"Providing structural support to the plant stem","D":"Absorbing light for photosynthesis","correct":"B","explain":"Phloem transports dissolved organic molecules — mainly sucrose (and amino acids) — from sources (where they are produced, e.g. leaves) to sinks (where they are used or stored, e.g. roots, growing shoots, developing fruits). This process is called translocation and requires metabolic energy (active transport loads sucrose into phloem at the source)."},{"stem":"What is the role of stomata?","A":"To absorb water from the soil","B":"To allow gas exchange (CO₂ in, O₂ out during photosynthesis; O₂ in, CO₂ out during respiration) and the evaporation of water vapour","C":"To transport sugars from the leaf to the roots","D":"To anchor the leaf to the stem","correct":"B","explain":"Stomata are microscopic pores on the leaf surface (mainly the lower epidermis) surrounded by guard cells. They open to allow CO₂ to diffuse in for photosynthesis and O₂ to diffuse out. They also allow water vapour to evaporate (transpiration). Guard cells open and close the stoma by changing their turgidity — they open in light and close in darkness or when water is scarce."},{"stem":"What are auxins?","A":"Digestive enzymes produced in the roots","B":"Plant hormones that regulate growth by controlling cell elongation, primarily in response to light and gravity","C":"Pigments in leaves that absorb light for photosynthesis","D":"Molecules that transport water through the xylem","correct":"B","explain":"Auxins (e.g. IAA, indole-3-acetic acid) are plant hormones produced in growing tips (meristems). They stimulate cell elongation. Unequal auxin distribution causes differential growth — more elongation on the shaded side of a shoot causes it to bend towards light (phototropism). Auxins are also involved in gravitropism (roots grow downward) and apical dominance."},{"stem":"What is phototropism?","A":"The movement of chloroplasts towards light sources","B":"The growth response of a plant part towards (or away from) a light source","C":"The opening of stomata in response to light","D":"The production of chlorophyll when light is available","correct":"B","explain":"Phototropism is a growth response to light. Shoots are positively phototropic — they grow towards light. This is caused by unequal distribution of auxin: light causes auxin to migrate to the shaded side of the shoot tip; higher auxin concentration on the shaded side causes greater cell elongation there, bending the shoot towards the light. This maximises light absorption for photosynthesis."},{"stem":"What is gravitropism (geotropism)?","A":"The growth of plants in response to temperature","B":"The growth response of a plant part to gravity — roots grow towards gravity (positively), shoots grow away from gravity (negatively)","C":"The movement of leaves to face the sun throughout the day","D":"The closure of stomata in response to gravity","correct":"B","explain":"Gravitropism ensures roots grow downward (into the soil for water and minerals) and shoots grow upward (towards light). Auxin redistributes in response to gravity: in roots, the lower side accumulates more auxin, which at higher concentrations inhibits root elongation — causing the lower side to grow slower, bending the root downward. In shoots, higher auxin on the lower side stimulates elongation, bending the shoot upward."},{"stem":"Name one commercial use of plant hormones.","A":"Adding nitrogen to fertilisers","B":"Rooting powder (auxin) to promote root growth in cuttings; weedkillers (synthetic auxins kill weeds); gibberellins to promote fruit growth or end seed dormancy; ethene to ripen fruits","C":"Improving photosynthesis rates in glasshouses","D":"Preventing disease in crop plants","correct":"B","explain":"Commercial applications of plant hormones: (1) auxins — rooting powders for cuttings; selective weedkillers (synthetic auxins cause uncontrolled growth in broadleaf weeds, killing them without harming grasses/cereals); (2) gibberellins — inducing germination in brewing, producing seedless fruits, increasing fruit size; (3) ethene — ripening bananas and other fruits during transport."},{"stem":"What does a deficiency of magnesium ions cause in plants?","A":"Stunted growth due to lack of cell wall material","B":"Yellowing of leaves (chlorosis) because magnesium is needed to make chlorophyll","C":"Wilting because magnesium is needed to maintain turgor","D":"Brown spots on leaves because magnesium is an enzyme cofactor for photosynthesis","correct":"B","explain":"Magnesium (Mg²⁺) is a component of the chlorophyll molecule. Without sufficient magnesium, plants cannot produce enough chlorophyll, causing yellowing of leaves (chlorosis). This is a classic symptom of magnesium deficiency seen in hydroponics experiments. Magnesium is absorbed from the soil via active transport in root hair cells."},{"stem":"What does a deficiency of nitrate ions cause in plants?","A":"Yellowing of leaves due to lack of chlorophyll","B":"Stunted growth because nitrates are needed to make amino acids and proteins","C":"Wilting because nitrates maintain turgor pressure in cells","D":"Premature fruit drop because nitrates are needed for seed development only","correct":"B","explain":"Nitrate ions (NO₃⁻) are absorbed from the soil and used to synthesise amino acids (combined with glucose-derived carbon skeletons). Without adequate nitrates, plants cannot make sufficient proteins for growth, resulting in stunted growth and small, pale leaves. Nitrate is the most commonly limiting mineral in agricultural soils and is the primary nutrient in fertilisers."},{"stem":"What is the transpiration stream?","A":"The flow of sugar solution from leaves down to the roots in the phloem","B":"The continuous movement of water from the roots, through the xylem, and out through the stomata as water vapour","C":"The circulation of hormones through the plant via the vascular bundles","D":"The flow of ions from the soil into the root hair cells","correct":"B","explain":"The transpiration stream is the continuous upward flow of water through the plant: soil → root hair cells (osmosis) → root cortex → xylem vessels → leaf mesophyll → stomata (evaporation). It is driven by the tension created at the top (leaves) as water evaporates. This stream carries dissolved mineral ions absorbed from the soil to all parts of the plant."},{"stem":"How do guard cells open stomata in light?","A":"Guard cells detect light and actively contract to open the pore","B":"In light, guard cells take up potassium ions by active transport, increasing their solute concentration; water enters by osmosis making them turgid — their curved shape means they bow apart, opening the stoma","C":"Guard cells produce glucose in light, making them heavier and pulling them apart","D":"Light causes guard cells to die, creating a gap (the stoma)","correct":"B","explain":"In light, guard cells actively pump K⁺ ions in from surrounding cells. This lowers their water potential; water enters by osmosis. The guard cells swell (become turgid). Because their inner walls are thicker than outer walls, the cells bow outward, opening the stomatal pore. In darkness or water stress, K⁺ leaves, water follows by osmosis, guard cells lose turgor, and the pore closes."},{"stem":"What is the effect of increasing light intensity on photosynthesis rate (assuming temperature and CO₂ are not limiting)?","A":"The rate decreases because bright light damages chlorophyll","B":"The rate increases until another factor (CO₂ or temperature) becomes limiting, then plateaus","C":"The rate remains constant regardless of light intensity","D":"The rate increases indefinitely as light intensity increases","correct":"B","explain":"Increasing light intensity provides more energy for photosynthesis, increasing the rate proportionally — until another factor (CO₂ concentration or temperature/enzyme activity) limits the rate. The rate then plateaus at a maximum even if light continues to increase. This is the classic limiting factor relationship (Blackman's law of limiting factors)."},{"stem":"What are the symptoms of rose black spot disease?","A":"Yellowing of all leaves due to chlorophyll breakdown","B":"Purple or black spots on leaves, followed by yellowing and early leaf drop","C":"Wilting and root decay","D":"White powdery coating on stems and leaves","correct":"B","explain":"Rose black spot is caused by the fungus Diplocarpon rosae. Characteristic symptoms are purple or black circular spots on leaf surfaces, followed by yellowing of the affected areas and premature leaf drop. Significant defoliation reduces photosynthesis and weakens the plant. It spreads in damp conditions via spores. Treatment includes fungicide sprays and removing infected leaves."},{"stem":"What is translocation in plants?","A":"The transport of water through the xylem from roots to leaves","B":"The transport of dissolved sugars and amino acids through the phloem from source to sink","C":"The movement of auxins from the shoot tip to the elongation zone","D":"The diffusion of CO₂ into leaves through stomata","correct":"B","explain":"Translocation is the movement of dissolved organic molecules (mainly sucrose and amino acids) through the phloem. It moves from source (where sugars are produced or released from storage, e.g. leaves, germinating seeds) to sink (where sugars are used or stored, e.g. roots, growing tips, developing fruits). Unlike xylem transport, translocation is a metabolically active process (requiring ATP)."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
