<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T3 Reproduction Spark | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T3: Reproduction &mdash; Spark</h1><span class="tier-badge spark">Spark</span></header><main><div class="quiz-meta"><span>20 questions &middot; Reproduction</span><span>Spark: Recall</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"What is sexual reproduction?","A":"Reproduction involving only one parent, producing identical offspring","B":"Reproduction involving the fusion of male and female gametes, producing genetically varied offspring","C":"Reproduction that always produces clones of the parent","D":"Reproduction that only occurs in plants","correct":"B","explain":"Sexual reproduction requires two parents. Gametes (sperm and egg) are produced by meiosis, each with a unique combination of alleles. Fertilisation — fusion of the two gametes — produces offspring that are genetically different from each other and from both parents."},{"stem":"What is asexual reproduction?","A":"Reproduction requiring two parents and gametes","B":"Reproduction involving a single parent, producing genetically identical offspring (clones)","C":"Reproduction that always produces both male and female offspring","D":"Reproduction that only occurs in animals","correct":"B","explain":"Asexual reproduction involves one parent only. No gametes are formed. The offspring are produced by mitosis and are genetically identical to the parent (clones). Examples: bacteria dividing by binary fission, strawberry plants producing runners, potato plants producing tubers."},{"stem":"What is meiosis?","A":"Cell division producing two genetically identical daughter cells","B":"Cell division producing four genetically varied cells, each with half the chromosome number of the parent","C":"Cell division that produces gametes with the same chromosome number as the parent","D":"Cell division that only occurs in somatic (body) cells","correct":"B","explain":"Meiosis is the cell division that produces gametes. It involves two rounds of division and produces four non-identical daughter cells, each haploid (half the chromosome number of the parent). The genetic variation is generated by independent assortment and crossing over."},{"stem":"What is a gamete?","A":"A body cell with the full diploid chromosome number","B":"A sex cell (sperm or egg) containing half (haploid) the chromosome number","C":"A stem cell found in bone marrow","D":"A cell produced by mitosis during growth","correct":"B","explain":"Gametes are the sex cells — sperm in males and eggs (ova) in females. They are haploid, containing half the normal chromosome number (23 in humans). At fertilisation, two gametes fuse to restore the diploid number (46) in the offspring."},{"stem":"How many chromosomes do normal human body (somatic) cells contain?","A":"23","B":"46","C":"92","D":"24","correct":"B","explain":"Human somatic cells are diploid — they contain 46 chromosomes, arranged as 23 pairs of homologous chromosomes. One chromosome from each pair was inherited from the mother, one from the father. Pair 23 is the sex chromosome pair (XX or XY)."},{"stem":"How many chromosomes does a human gamete contain?","A":"46","B":"23","C":"48","D":"92","correct":"B","explain":"Human gametes (sperm and eggs) are haploid — they contain 23 chromosomes, one from each homologous pair. When a sperm (23 chromosomes) fuses with an egg (23 chromosomes) at fertilisation, the resulting zygote has the full diploid number of 46 chromosomes."},{"stem":"What is an allele?","A":"A type of chromosome found in all body cells","B":"A different version of the same gene","C":"A section of transfer RNA","D":"The physical appearance resulting from a gene","correct":"B","explain":"A gene can exist in different forms called alleles. For example, the gene for eye colour has alleles for brown eyes and alleles for blue eyes. Many genes have two alleles; some (e.g. ABO blood group) have three or more alleles in the population."},{"stem":"What does homozygous mean?","A":"Having two different alleles for a gene","B":"Having two identical alleles for the same gene","C":"Having only one allele for a gene (as in gametes)","D":"Having no dominant allele for a gene","correct":"B","explain":"A homozygous organism carries two copies of the same allele for a gene — either two dominant alleles (homozygous dominant, e.g. TT) or two recessive alleles (homozygous recessive, e.g. tt). Homozygous individuals breed true for that characteristic."},{"stem":"What does heterozygous mean?","A":"Having two identical alleles for a gene","B":"Having two different alleles for a gene","C":"Having three copies of a chromosome","D":"Having no alleles for a particular gene","correct":"B","explain":"A heterozygous organism carries one of each type of allele for a gene (e.g. Tt). In most cases, only the dominant allele is expressed in the phenotype. Heterozygous individuals are often called carriers when the unexpressed allele codes for an inherited condition."},{"stem":"What is the phenotype?","A":"The combination of alleles an organism carries for a particular gene","B":"The observable physical and biochemical characteristics of an organism","C":"Only the external physical appearance of an organism","D":"The total DNA sequence of an organism","correct":"B","explain":"The phenotype is everything that can be observed or measured about an organism — its physical appearance, behaviour, biochemistry and physiology. It is determined by the genotype (alleles carried) and, for many traits, also by environmental factors."},{"stem":"What is the genotype?","A":"The physical appearance of an organism","B":"The alleles that an organism carries for a particular gene (or genes)","C":"The sequence of amino acids in a protein","D":"The total number of chromosomes in a cell","correct":"B","explain":"The genotype describes the specific alleles an organism carries. It may be expressed using letter symbols (e.g. Tt = heterozygous). The genotype determines what is potentially expressed; the phenotype is what is actually expressed (sometimes influenced by the environment)."},{"stem":"What is cystic fibrosis caused by?","A":"A dominant allele on chromosome 4","B":"A recessive allele on chromosome 7","C":"A sex-linked allele on the X chromosome","D":"A codominant allele on chromosome 21","correct":"B","explain":"Cystic fibrosis (CF) is caused by inheriting two copies of the recessive allele (ff) for the CFTR gene on chromosome 7. Carriers (Ff) are unaffected. CF causes mucus to build up in the lungs and digestive system because the chloride channel protein is non-functional."},{"stem":"Which sex chromosome combination determines biological sex in humans?","A":"XY = female; XX = male","B":"XX = female; XY = male","C":"XO = female; XXY = male","D":"YY = male; XX = female","correct":"B","explain":"In humans, females carry two X chromosomes (XX) and males carry one X and one Y chromosome (XY). The Y chromosome carries the SRY gene, which triggers male development. The sex of an offspring is determined at fertilisation by which type of sperm (X or Y) fertilises the egg."},{"stem":"What type of inheritance does Huntington's disease follow?","A":"Autosomal recessive — both copies must be faulty to cause disease","B":"Autosomal dominant — one copy of the faulty allele is sufficient to cause disease","C":"X-linked recessive — more common in males","D":"Mitochondrial — inherited only from the mother","correct":"B","explain":"Huntington's disease is autosomal dominant. A single copy of the dominant allele (H) is sufficient to cause the disease. This means that an affected person (Hh) has a 50% chance of passing it to each child. The disease typically develops symptoms in middle age (30–50 years)."},{"stem":"What is continuous variation?","A":"Variation that shows only a small number of distinct categories","B":"Variation that forms a range of values with no distinct boundaries (e.g. height, mass)","C":"Variation caused entirely by genetic factors with no environmental influence","D":"Variation that is identical in all members of a population","correct":"B","explain":"Continuous variation shows a gradual range of values — there are no clear categories. Height is a classic example: people can be any height within a range, and values cluster around a mean in a normal distribution. It is usually controlled by several genes and influenced by the environment."},{"stem":"What is discontinuous variation?","A":"Variation that forms a smooth curve across a range of values","B":"Variation that falls into distinct, separate categories with no intermediates","C":"Variation caused entirely by environmental factors","D":"Variation that changes with age","correct":"B","explain":"Discontinuous variation shows two or more distinct, separate categories with no intermediate values. ABO blood group is a classic example — a person is A, B, AB or O, never \"between\" groups. It is typically controlled by one or a small number of genes and is not influenced by the environment."},{"stem":"What causes the genetic variation seen in the offspring of sexual reproduction?","A":"Mitosis in the gonads, which produces slight variations each time","B":"Independent assortment and crossing over during meiosis, plus random fertilisation","C":"Mutations only — meiosis itself introduces no new combinations","D":"Environmental influences on gametes before fertilisation","correct":"B","explain":"Genetic variation in sexually reproduced offspring arises from: (1) independent assortment during meiosis — chromosomes from each homologous pair are separated randomly; (2) crossing over — homologous chromosomes exchange segments during meiosis I, creating new allele combinations; (3) random fertilisation — any sperm can fertilise any egg."},{"stem":"What is a mutation?","A":"A change in the sequence of bases in DNA","B":"A change in the shape of a protein caused by temperature","C":"The loss of a whole chromosome during mitosis","D":"A change in phenotype caused only by environmental factors","correct":"A","explain":"A mutation is a change in the DNA base sequence. It may alter a single base (point mutation), insert or delete bases (frameshift), or involve larger chromosomal changes. Mutations are the only source of new alleles. Most mutations are neutral; some are harmful; a very few are beneficial."},{"stem":"What did the Human Genome Project achieve?","A":"It produced the first genetically modified organism","B":"It mapped and sequenced all the DNA (approximately 3 billion base pairs) in the human genome","C":"It created a database of all human proteins","D":"It identified and cured all inherited genetic disorders","correct":"B","explain":"The Human Genome Project (completed 2003) was an international collaboration that sequenced the ~3 billion base pairs of the human genome and identified approximately 20,000–25,000 genes. It has transformed medicine, enabling genetic screening, personalised treatments and a much deeper understanding of inherited diseases."},{"stem":"Which statement correctly describes crossing over during meiosis?","A":"Crossing over occurs during mitosis when chromosomes replicate","B":"Homologous chromosomes exchange segments of DNA during meiosis I, creating new allele combinations on each chromosome","C":"Crossing over involves the sex chromosomes only","D":"Crossing over increases the chromosome number in gametes","correct":"B","explain":"During meiosis I, homologous chromosomes pair up (bivalents) and exchange corresponding segments of DNA at points called chiasmata. This process — crossing over — shuffles alleles between chromosomes, creating new combinations that were not present in either parent chromosome. It is a major source of genetic variation."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
