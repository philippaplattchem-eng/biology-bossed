<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T5 Health, Disease and Medicine Inferno | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T5: Health, Disease and Medicine &mdash; Inferno</h1><span class="tier-badge inferno">Inferno</span></header><main><div class="quiz-meta"><span>20 questions &middot; Health, Disease and Medicine</span><span>Inferno: Higher</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"Antibiotic resistance in bacteria can spread not only by vertical inheritance (parent to daughter cells) but by horizontal gene transfer (HGT). Why does HGT make resistance spread particularly difficult to control?","A":"HGT causes bacteria to mutate more rapidly than they would naturally","B":"HGT allows resistance genes to be transferred between completely different bacterial species simultaneously, without reproduction — a previously susceptible species can acquire resistance instantly from a resistant one","C":"HGT reverses the effect of antibiotics in host tissues","D":"HGT causes bacteria to become viruses, making antibiotic treatment irrelevant","correct":"B","explain":"Via HGT mechanisms (conjugation: plasmid transfer through a pilus; transformation: uptake of free DNA; transduction: bacteriophage-mediated transfer), resistance genes on plasmids can move between species rapidly. A resistant E. coli can donate its resistance plasmid to Salmonella or Klebsiella — without any parent-offspring relationship. This \"lateral\" spread means resistance can jump to entirely new pathogens within a patient or environment, making containment extremely challenging."},{"stem":"A new vaccine uses lipid nanoparticles to deliver mRNA encoding a viral surface protein. The mRNA is translated by ribosomes, producing the antigen in host cells, which stimulates an immune response. How does this differ mechanistically from a traditional inactivated virus vaccine?","A":"mRNA vaccines work faster initially but provide no long-term immunity","B":"Traditional vaccines introduce the whole (inactivated) pathogen, presenting many antigens; mRNA vaccines deliver instructions for producing one specific antigen inside host cells — the immune system responds to the expressed protein, never encountering the live virus at all","C":"Traditional vaccines cause the immune system to produce antibodies; mRNA vaccines stimulate only T cells","D":"mRNA vaccines insert their sequence permanently into host chromosomal DNA","correct":"B","explain":"Traditional inactivated vaccines deliver whole killed pathogen particles containing many antigens. mRNA vaccines (like the COVID-19 vaccines) deliver mRNA encoding a single antigen (e.g. the spike protein). Host cells translate this mRNA, producing the antigen on their surface, and the immune system mounts a response — including antibody production and memory cell formation. The mRNA is degraded within days and never enters the nucleus or integrates into DNA."},{"stem":"Quinine, derived from the bark of the cinchona tree, was the first effective antimalarial drug. Explain why scientists use traditional plant medicines as a starting point for drug discovery.","A":"Plants are the only source of effective medicines — synthetic molecules never work","B":"Plants evolve chemical defences against pathogens and herbivores — these molecules have been naturally selected for biological activity over millions of years, making plant extracts a rich source of bioactive compounds with potential therapeutic activity","C":"Using plant extracts avoids the need for clinical trials","D":"Traditional medicines are always safer than synthetic drugs","correct":"B","explain":"Plants cannot escape predators or pathogens and instead produce a vast array of secondary metabolites — alkaloids, terpenes, polyphenols — as chemical defences. Natural selection has refined these molecules for millions of years to interact with biological systems. Ethnobotanical leads (plants used in traditional medicine) have a statistically higher hit rate in drug screening than random compounds. Penicillin (fungal), aspirin (willow bark), and artemisinin (wormwood, for malaria) are all derived from natural organisms."},{"stem":"A 25-year-old patient develops Kaposi's sarcoma — a cancer normally seen only in elderly, immunosuppressed patients. What underlying condition should the doctor immediately test for, and why?","A":"Type 2 diabetes — it suppresses immune function and causes unusual cancers","B":"HIV/AIDS — HIV destroys CD4⁺ T cells; a severely weakened immune system allows opportunistic infections and cancers (like Kaposi's, caused by HHV-8) to develop that the immune system would normally suppress","C":"Cystic fibrosis — it causes immune deficiency in young adults","D":"Leukaemia — white blood cell cancers cause immune suppression and secondary cancers","correct":"B","explain":"Kaposi's sarcoma is caused by human herpesvirus 8 (HHV-8), which the immune system normally controls. Its appearance in a young adult strongly suggests severe immunocompromise, most commonly HIV/AIDS. HIV systematically destroys CD4⁺ T helper lymphocytes — the central coordinators of adaptive immunity. When CD4⁺ counts fall below ~200 cells/μl, the immune system can no longer suppress latent infections or nascent tumour cells."},{"stem":"Scientists are developing \"phage therapy\" — using bacteriophages (viruses that infect bacteria) to treat antibiotic-resistant bacterial infections. What is the theoretical advantage over antibiotics?","A":"Bacteriophages are cheaper to produce than antibiotics","B":"Bacteriophages can be designed to target specific bacterial strains with high specificity — leaving beneficial microbiome bacteria unharmed — and as bacteria evolve resistance to phages, new phages can be matched to the resistant bacteria (co-evolutionary approach)","C":"Bacteriophages kill bacteria without causing any side effects in humans","D":"Bacteriophages can also kill viruses that antibiotic-resistant bacteria rely on to reproduce","correct":"B","explain":"Antibiotics are typically broad-spectrum — killing beneficial gut microbiome bacteria alongside the pathogen. Phages are highly specific: a phage targeting Pseudomonas aeruginosa will not harm E. coli or Lactobacillus. Additionally, bacteria that evolve phage resistance often lose virulence factors as a trade-off. New phages can be isolated from the environment to match resistant bacterial strains. This evolutionary \"arms race\" approach is tailored rather than fixed — a potential advantage over static antibiotic molecules."},{"stem":"A pharmaceutical company claims its new painkiller is better than ibuprofen, based on a study in which patients rated their pain relief as higher. The study was not double-blind. What is the critical methodological weakness?","A":"The study used patients — it should have used animal subjects only","B":"Without double-blinding, patients knowing they are taking the new (presumably \"better\") drug may report higher pain relief due to the placebo effect; and clinicians may record more positive outcomes due to observer bias — neither of which reflects the drug's true pharmacological effect","C":"The sample size must have been too small to be valid","D":"Pain relief studies should never use self-reported data","correct":"B","explain":"The placebo effect means people often report real improvements simply from believing they are being treated. Without double-blinding, the new drug group knows they are receiving the novel treatment, inflating subjective pain scores. Clinicians also unconsciously rate outcomes more favourably for the group they believe is receiving the better treatment (observer bias). Double-blinding eliminates both confounders. Regulatory bodies (MHRA, FDA) require double-blind RCT evidence for drug approval."},{"stem":"In 2020, scientists noted that individuals with blood group O appeared less likely to develop severe COVID-19 compared to blood group A individuals. Which investigation would most appropriately determine whether this is a causal relationship?","A":"Asking A and O blood group patients which disease they would prefer to get","B":"A large prospective cohort study tracking thousands of individuals of known blood groups over time, recording COVID-19 infection rates and severity, controlling for age, sex, BMI, and comorbidities — ideally complemented by mechanistic studies identifying how blood group antigens interact with the virus","C":"A case report of one patient with blood group A who recovered from COVID-19","D":"An in vitro study testing whether the COVID-19 spike protein binds to A antigens on red blood cells","correct":"B","explain":"Establishing causation from an initial observation requires: (1) a large, well-controlled epidemiological study to confirm the association independently of confounding variables; (2) mechanistic evidence explaining the biological basis (e.g. A antigens may facilitate viral binding, or anti-A antibodies in group O individuals may neutralise the virus). A single in vitro study or case report cannot establish causation. This is the standard approach for investigating genetic risk factors for complex diseases."},{"stem":"The protozoan parasite Toxoplasma gondii can infect any warm-blooded animal but can only sexually reproduce in cats. Infected rodents show reduced fear of cats and may be attracted to cat urine. How is this relevant to the concept of parasites manipulating host behaviour?","A":"This is coincidental — Toxoplasma has no ability to manipulate behaviour","B":"Toxoplasma appears to have evolved the ability to alter its intermediate host's (rodent's) brain chemistry — reducing predator avoidance — increasing the probability of the rodent being eaten by the definitive host (cat), completing the parasite's life cycle; this is parasite-driven host manipulation","C":"Cats infect rodents with fear reduction toxins when they bite them","D":"The behaviour change is caused by a completely different pathogen that Toxoplasma carries","correct":"B","explain":"Evidence suggests Toxoplasma gondii specifically reduces the innate fear of cat odours in infected rodents (while leaving other fear responses intact) — a highly specific behavioural manipulation. By making the intermediate host more likely to be eaten by the definitive host, Toxoplasma increases transmission to where it can sexually reproduce. This is a striking example of parasite-driven extended phenotype — the parasite \"manipulating\" the host organism for its own reproductive benefit."},{"stem":"Explain why a person infected with HIV may remain healthy for several years before developing AIDS, despite ongoing viral replication.","A":"HIV replicates slowly — it takes years before any viral copies are produced","B":"The immune system can initially replace CD4⁺ T cells approximately as fast as HIV destroys them, maintaining near-normal immune function; only when the rate of destruction exceeds the capacity to replenish does the CD4⁺ count fall to dangerous levels and AIDS-defining conditions emerge","C":"HIV is dormant for years and only becomes active after a trigger event","D":"Antiretroviral drugs given at the time of infection prevent any symptoms from appearing","correct":"B","explain":"After initial infection, HIV levels briefly rise (primary infection), then fall as the immune response partially controls the virus. During the chronic phase (typically 2–10 years), HIV continues replicating, destroying CD4⁺ cells, but the bone marrow and thymus produce new lymphocytes approximately fast enough to maintain counts above ~500 cells/μl. As viral replication gradually wins this attrition battle, CD4⁺ counts decline. Below ~200 cells/μl, immune defence is inadequate and AIDS-defining illnesses emerge."},{"stem":"A scientist discovers a coral reef pathogen that spreads faster when sea water temperature rises. What does this suggest about the interaction between climate change and infectious disease?","A":"Warmer temperatures always reduce pathogen spread","B":"Climate change can expand the geographic range, virulence and transmission rate of some pathogens — both by directly favouring pathogen growth and by stressing host organisms (coral) so they are more susceptible, creating a compound threat to biodiversity","C":"Pathogens only affect animals, not marine invertebrates","D":"The disease spread is unrelated to temperature — other factors must explain the correlation","correct":"B","explain":"Climate warming can affect infectious disease dynamics in multiple ways: (1) warmer temperatures may accelerate pathogen reproduction; (2) stressed hosts have weakened immune responses; (3) warming expands the geographic range of vectors (e.g. Anopheles mosquitoes at higher latitudes and altitudes); (4) altered rainfall patterns change disease transmission. Coral bleaching events and associated pathogen outbreaks illustrate the interaction between abiotic stressors (temperature) and biotic ones (pathogens)."},{"stem":"Monoclonal antibodies used in pregnancy tests detect the hormone hCG (human chorionic gonadotropin). The antibody is highly specific — it does not cross-react with other hormones. How does this specificity arise?","A":"The antibody is filtered in the kidney to remove cross-reacting molecules","B":"The antibody's variable region has a unique three-dimensional binding site complementary in shape and charge to one specific epitope on hCG — only this structure fits, explaining the lock-and-key specificity","C":"The antibody contains hCG molecules that attract like molecules in the urine sample","D":"hCG is the only hormone present in pregnancy — no cross-reactivity can occur","correct":"B","explain":"Antibody specificity arises from the unique amino acid sequence of the variable (V) region, which folds into a specific 3D binding site (paratope) complementary to one epitope (a region of the antigen). Only the complementary antigen fits — like a lock and key. Other hormones have different 3D surface structures, so they do not bind. This exquisite specificity makes MABs valuable as diagnostic and therapeutic tools."},{"stem":"In the 1950s, thalidomide was prescribed for morning sickness in pregnancy. It was later found to cause severe limb defects in babies. The drug had passed animal safety trials. What does this reveal about limitations of animal testing?","A":"Animal testing is completely useless — all drug testing should be done on humans directly","B":"Some drug effects are species-specific or pregnancy-specific and may not be detected in animal models; thalidomide's teratogenic (foetus-damaging) effects were not replicated in the species used for testing (though they are in some strains) — highlighting that animal models cannot guarantee safety in all human populations and conditions","C":"Thalidomide was never tested on animals — it went straight to human trials","D":"The drug was safe — the limb defects were caused by an unrelated factor","correct":"B","explain":"Thalidomide was extensively tested in animals and appeared safe. It causes limb defects (phocomelia) in humans — particularly when taken during the first trimester. Some animal species used did not show the same teratogenic response to the racemic mixture. This tragic case led directly to stricter drug testing requirements, including testing in pregnant animals of multiple species, and separate testing of drug enantiomers. It illustrates that species differences can mean animal safety data does not fully predict human outcomes."},{"stem":"Scientists have developed personalised cancer vaccines that are unique to each patient — made from neoantigen peptides derived from sequencing that patient's tumour mutations. Why might such vaccines be more effective than conventional treatments?","A":"Personalised vaccines are cheaper and faster to produce than chemotherapy","B":"Tumour neoantigens are unique to that individual's cancer cells — the vaccine trains the immune system to specifically recognise and kill that patient's cancer cells, while leaving normal cells (which lack the neoantigen) unharmed — more precise than chemotherapy","C":"Personalised vaccines provide immunity to all future cancers the patient might develop","D":"Conventional vaccines already target all cancer types effectively","correct":"B","explain":"Cancer cells accumulate somatic mutations producing novel peptides (neoantigens) not found on normal cells. A personalised vaccine presents these unique neoantigens to the immune system, training tumour-infiltrating T cells to recognise and kill cells displaying them. Because normal cells do not carry these mutations, the immune attack is highly targeted. This precision minimises damage to healthy tissue — the main source of side effects in conventional chemotherapy and radiotherapy."},{"stem":"A patient with severe combined immunodeficiency (SCID) lacks functional T and B lymphocytes. Without treatment, they develop life-threatening infections from pathogens that barely affect healthy people. Why does SCID prevent effective immune responses to previously vaccinated antigens?","A":"Vaccination requires a functioning liver to produce antibodies","B":"Without B lymphocytes, no antibodies can be produced; without T helper lymphocytes, B cells cannot be activated for the adaptive immune response; no memory lymphocytes form after vaccination — so previous exposure provides no protection","C":"SCID destroys existing antibodies in the bloodstream","D":"SCID only affects the innate immune system; adaptive responses are unaffected","correct":"B","explain":"The adaptive immune response requires: T helper cells (CD4⁺) to activate B cells; B cells to differentiate into plasma cells (producing antibodies) and memory B cells; cytotoxic T cells to kill infected cells. SCID eliminates both T and B lymphocytes — no adaptive response can occur. Previous vaccinations cannot produce memory cells; even antibodies from the mother's placental transfer decay. Any pathogen, including normally harmless commensals, can cause fatal infection."},{"stem":"Aspirin was discovered empirically (from willow bark use in folk medicine) before its mechanism was understood. Modern drug discovery typically works in reverse — identifying a biological target first, then designing a molecule to interact with it. What is the advantage of the target-based approach?","A":"Target-based drugs are always cheaper to produce than empirically discovered ones","B":"Knowing the target allows rational design of molecules that fit the active site of the target protein — improving specificity, reducing off-target effects, and allowing optimisation of binding affinity before synthesis; this is more efficient than screening millions of random compounds","C":"Target-based drugs never require clinical trials","D":"All diseases have clearly defined molecular targets — the approach works for every condition","correct":"B","explain":"Target-based drug discovery (rational drug design) starts by identifying a key protein in a disease pathway (e.g. an enzyme or receptor) and solving its 3D structure (by X-ray crystallography or cryo-EM). Computational chemistry then designs molecules that fit the target's active site. This is more directed than empirical screening, producing higher-affinity, more selective drugs with fewer off-target effects. However, many complex diseases (psychiatric disorders, most cancers) lack clear single-protein targets, limiting this approach."},{"stem":"A patient contracts malaria in West Africa and is treated with chloroquine. The drug is initially effective but resistance develops during treatment. Analysis of the parasite's genome shows a mutation in the pfcrt gene. What does this demonstrate about how drug resistance arises?","A":"Chloroquine caused the pfcrt mutation directly during treatment","B":"A small number of parasites with a pre-existing pfcrt mutation were naturally resistant to chloroquine; selective pressure from the drug eliminated sensitive parasites while these resistant ones survived, reproduced and came to dominate the population within the patient","C":"The patient's immune system mutated the parasite's genes to resist the drug","D":"The pfcrt gene was acquired from a different Plasmodium species during treatment","correct":"B","explain":"Drug resistance follows the same natural selection mechanism as antibiotic resistance: (1) pre-existing random mutation (pfcrt) confers resistance; (2) drug treatment kills sensitive parasites; (3) resistant parasites survive and reproduce; (4) resistance allele frequency increases. This occurs within a single patient over the course of treatment. It is why combination antimalarial therapy (artemisinin-combination therapy, ACT) is used — reducing the probability that a single parasite carries resistance to all components simultaneously."},{"stem":"Interferon proteins are produced by virus-infected cells and signal to neighbouring cells to produce antiviral proteins. How does this represent an \"alarm signal\" system in innate immunity?","A":"Interferons stimulate B lymphocytes to produce specific antibodies against the virus","B":"Infected cells release interferons that bind to receptors on neighbouring uninfected cells, activating transcription of antiviral genes — putting those cells in a \"warning state\" resistant to viral infection before the virus reaches them","C":"Interferons directly destroy the virus in the bloodstream","D":"Interferons activate the adaptive immune response by stimulating memory cell division","correct":"B","explain":"Interferons (type I: IFN-α, IFN-β) are the first rapid warning system against viral infection. An infected cell senses viral RNA/DNA via pattern recognition receptors and secretes interferons. These cytokines bind to neighbouring uninfected cells, triggering expression of hundreds of interferon-stimulated genes (ISGs) — including antiviral proteins such as oligoadenylate synthetase and protein kinase R — which inhibit viral replication if the virus subsequently invades. This acts as a rapid pre-adaptive immune \"early warning\" system."},{"stem":"Why do some viruses (e.g. influenza, SARS-CoV-2) evolve rapidly while others (e.g. measles, poliovirus) remain relatively stable antigenically over decades?","A":"Rapidly evolving viruses are more dangerous — slower evolution indicates weaker viruses","B":"RNA viruses with error-prone RNA polymerases (lacking proofreading) accumulate mutations rapidly; large population sizes and short generation times amplify this. Viruses like measles and poliovirus, though RNA viruses, have lower mutation rates or limited viable genetic space for immune-evading mutations","C":"RNA viruses mutate faster than DNA viruses — DNA viruses never change antigenically","D":"Influenza mutates because it is injected annually, making it adapt to new hosts","correct":"B","explain":"RNA-dependent RNA polymerases lack proofreading activity, giving RNA viruses mutation rates ~10³–10⁶ higher than DNA viruses. Influenza also undergoes antigenic shift (reassortment of gene segments when two strains co-infect the same cell) and antigenic drift (point mutations). Measles virus mutates slowly in practice because its surface proteins have limited room to change while remaining functional — the functional constraints limit viable antigenic escape. These differences determine whether annual reformulation (influenza vaccine) or lifelong immunity from a single vaccine (MMR) is feasible."},{"stem":"A new pathogen emerges with an R₀ (basic reproduction number) of 5. This means each infected person infects 5 others on average. What vaccination coverage is theoretically required to achieve herd immunity?","A":"50%","B":"60%","C":"80%","D":"100%","correct":"C","explain":"The herd immunity threshold is calculated as: 1 − (1/R₀). For R₀ = 5: threshold = 1 − (1/5) = 1 − 0.2 = 0.8 = 80%. This is the proportion of the population that must be immune for each infectious person to, on average, infect fewer than one other person — causing the outbreak to decline. Higher R₀ values require higher vaccination thresholds. Measles (R₀ ~12–18) requires >94% coverage, which is why measles vaccination rates must remain very high to prevent outbreaks."},{"stem":"CRISPR-Cas9 has been proposed as a treatment for sickle cell anaemia by editing the patient's haematopoietic stem cells to reactivate fetal haemoglobin (HbF), compensating for the faulty adult haemoglobin. Why is targeting haematopoietic stem cells specifically important for a lasting cure?","A":"Haematopoietic stem cells produce red blood cells — they are the only cells affected by sickle cell anaemia","B":"Editing mature red blood cells is impossible — they have no nucleus and no DNA to edit; haematopoietic stem cells self-renew and continuously produce all blood cell types throughout life, so editing them creates a permanent supply of corrected red blood cells","C":"CRISPR only works in stem cells — it cannot edit any differentiated cell type","D":"Haematopoietic stem cells produce the immunoglobulins needed to correct haemoglobin folding","correct":"B","explain":"Mature red blood cells have no nucleus or DNA — they cannot be edited. Haematopoietic stem cells in the bone marrow continuously replenish blood cells throughout life. Editing their DNA with CRISPR (to reactivate the HBG gene encoding HbF) creates a permanent source of red blood cells producing functional fetal haemoglobin, compensating for the faulty HbS. Clinical trials (2023) have shown functional cures using this approach — one of the most significant applications of CRISPR in medicine to date."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
