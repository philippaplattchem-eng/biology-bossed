<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T2 Growth and Development Flame | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T2: Growth and Development &mdash; Flame</h1><span class="tier-badge flame">Flame</span></header><main><div class="quiz-meta"><span>20 questions &middot; Growth and Development</span><span>Flame: Application</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"A patient is diagnosed with a malignant lung tumour. Cancer cells are later found in lymph nodes in the abdomen. What process does this demonstrate?","A":"Normal mitosis — the cells are simply growing in a new location","B":"Metastasis — cancer cells have spread from the original site through the lymphatic system","C":"Mutation — the cells have changed their function to become lymph cells","D":"Differentiation — the cells have specialised to suit their new environment","correct":"B","explain":"Metastasis is the spread of cancer cells from the primary tumour to other parts of the body via the blood or lymphatic system. Cells break away from the original tumour, travel through vessels, and establish secondary tumours (metastases) in distant organs. Metastatic cancer is far harder to treat than localised cancer."},{"stem":"A doctor taps the tendon just below the kneecap and the lower leg kicks forward automatically. Why does this happen without conscious thought?","A":"The signal travels to the brain, which sends an immediate response","B":"The reflex arc processes the signal in the spinal cord — the response occurs before the brain can intervene","C":"The knee-jerk is coordinated by the cerebellum, which is faster than the cerebrum","D":"Tendons can contract independently of the nervous system","correct":"B","explain":"The knee-jerk (patellar) reflex arc: receptor (stretch receptor in tendon) → sensory neurone → relay neurone in spinal cord → motor neurone → effector (quadriceps muscle). The whole arc is completed in the spinal cord — the impulse only reaches the brain after the leg has already kicked. This is why reflexes are faster than voluntary responses."},{"stem":"A student practises catching a ball every day for two weeks. Their reaction time improves significantly. What is the most likely biological explanation?","A":"The myelin sheath grows thicker with practice, permanently speeding all impulses","B":"Repeated practice strengthens synaptic connections in the relevant neural pathway, making signal transmission faster and more reliable","C":"The cerebellum takes over from the cerebrum after extensive practice, using faster pathways","D":"Muscle fibres become larger with practice and respond faster to signals","correct":"B","explain":"Neural pathways that are used repeatedly become more efficient — synaptic connections are strengthened through long-term potentiation and relevant axons become more fully myelinated. This is the neural basis of skill learning and habit formation. The improvement is specific to the practised action."},{"stem":"A person shifts their gaze from a close book to a distant tree. Which combination of changes occurs in the eye?","A":"Ciliary muscles contract; suspensory ligaments slacken; lens becomes more curved","B":"Ciliary muscles relax; suspensory ligaments become taut; lens is pulled flatter","C":"Pupil dilates; iris contracts; lens becomes more curved","D":"The cornea changes shape to redirect light to the retina for distant objects","correct":"B","explain":"To focus on a distant object (parallel light rays): ciliary muscles relax → suspensory ligaments become taut and pull the lens → lens flattens (less curvature, less refractive power). A flatter lens is needed because distant light rays require less bending to converge on the retina."},{"stem":"In bright sunlight, the pupil constricts. In a dark room, the pupil dilates. What is the biological purpose of these changes?","A":"To adjust the focal length of the lens according to light levels","B":"To protect the retina from damage in bright light and maximise light capture in dim conditions","C":"To warm the retina in cold, dark environments","D":"To enable accommodation for near and far objects at different light levels","correct":"B","explain":"Photoreceptors in the retina can be damaged by excessive light intensity. In bright conditions, the circular muscles of the iris contract, constricting the pupil and reducing light entering the eye. In dim conditions, radial muscles contract, dilating the pupil to maximise the amount of light reaching the retina."},{"stem":"A patient with a head injury loses the ability to coordinate balance and fine movement. Which brain region has most likely been damaged?","A":"The cerebral cortex","B":"The medulla oblongata","C":"The cerebellum","D":"The hypothalamus","correct":"C","explain":"The cerebellum coordinates balance, posture and fine motor movements. It receives continuous information from proprioceptors, balance organs and the motor cortex, and makes real-time adjustments. Damage causes ataxia — uncoordinated, unsteady movement — without affecting conscious thought or vital functions."},{"stem":"A person walks from a dim corridor into a brightly lit room. Which pupil reflex occurs and which muscles cause it?","A":"The pupil dilates — radial muscles contract","B":"The pupil constricts — circular muscles of the iris contract","C":"The pupil constricts — radial muscles of the iris contract","D":"The pupil dilates — circular muscles of the iris contract","correct":"B","explain":"In bright light, the circular (sphincter) muscles of the iris contract, reducing the pupil diameter (constriction). This is a reflex controlled by the autonomic nervous system. In dim light, the radial (dilator) muscles contract, increasing the pupil diameter (dilation). The two sets of muscles are antagonistic."},{"stem":"Why must a chemical neurotransmitter (rather than an electrical signal) be used to cross a synapse?","A":"Neurotransmitters travel faster than electrical signals","B":"The synaptic cleft is a fluid-filled gap — electrical impulses cannot jump across fluid, so a chemical messenger diffuses across and binds to receptors to generate a new impulse","C":"Electrical signals would destroy the receiving neurone's membrane","D":"Neurotransmitters amplify the signal so it gets stronger with each synapse","correct":"B","explain":"The synaptic cleft is approximately 20 nm wide and filled with fluid. Electrical impulses cannot bridge this gap. Arrival of an impulse at the pre-synaptic terminal triggers vesicles of neurotransmitter to fuse with the membrane, releasing neurotransmitter into the cleft. It diffuses across and binds to post-synaptic receptors, generating a new impulse."},{"stem":"Which combination of lens shape and ciliary muscle state describes the eye correctly focused on a very close object?","A":"Flat lens; ciliary muscles relaxed; suspensory ligaments taut","B":"More rounded (curved) lens; ciliary muscles contracted; suspensory ligaments slack","C":"Flat lens; ciliary muscles contracted; suspensory ligaments taut","D":"More rounded lens; ciliary muscles relaxed; suspensory ligaments taut","correct":"B","explain":"Near object: ciliary muscles contract → suspensory ligaments go slack → lens, freed from tension, becomes rounder due to its own elasticity → greater curvature = greater refractive power → converges diverging light from the close object onto the retina."},{"stem":"A patient's eyeball is longer than normal from front to back. Why does this cause blurred vision for distant objects?","A":"The lens cannot dilate in the elongated eye, blocking accommodation","B":"Parallel light rays from distant objects focus in front of the retina rather than on it, producing a blurred image","C":"The cornea is too flat to refract incoming light","D":"The retina contains fewer photoreceptors due to the elongation","correct":"B","explain":"An eyeball that is too long means the retina is positioned further back than normal. Even after the cornea and lens converge light from a distant object, the focal point falls in front of the retina. The image that reaches the retina is out of focus (blurred). This is the defining feature of myopia."},{"stem":"Scientists want to identify which brain regions are active when a person reads aloud. Which technique would best allow them to do this safely in a living person?","A":"EEG — measures electrical brain waves across the scalp","B":"Functional MRI (fMRI) — detects changes in blood flow to active brain regions in real time","C":"Removing tissue from the suspected brain area and examining cells under a microscope","D":"An X-ray of the skull to identify structural differences","correct":"B","explain":"fMRI (functional MRI) detects changes in blood oxygen levels — active neurons receive more oxygenated blood. It produces a spatial map of brain activity during a task in real time. It is non-invasive and safe. EEG measures electrical activity but cannot pinpoint specific regions as precisely as fMRI."},{"stem":"A drug blocks acetylcholine receptors at the junction between motor neurones and muscles. What is the most likely effect?","A":"Muscles contract continuously because the inhibitory signal is blocked","B":"Muscles cannot receive the signal to contract — the neuromuscular junction is non-functional","C":"Motor neurones fire more rapidly, causing uncontrolled muscle spasms","D":"The drug has no effect because muscle cells receive only electrical signals, not chemical ones","correct":"B","explain":"Acetylcholine is the neurotransmitter at the neuromuscular junction. If its post-synaptic receptors are blocked, acetylcholine cannot bind and no new impulse is generated in the muscle fibre. The muscle cannot contract. This is the mechanism of several paralytic drugs and toxins, including curare."},{"stem":"Many cancer drugs target rapidly dividing cells. Why are cancer cells more affected than most normal body cells?","A":"Cancer cells are the only cells that contain mitochondria","B":"Cancer cells have structurally different DNA from normal cells, making them more susceptible","C":"Most cancer drugs disrupt DNA replication or spindle formation — processes most active in rapidly dividing cells, which cancer cells undergo far more frequently than most normal cells","D":"Cancer cells lack a cell membrane, making them easier targets for drugs","correct":"C","explain":"Chemotherapy drugs interfere with cell division (e.g. by blocking DNA replication, damaging DNA or preventing spindle formation). Because cancer cells divide much more rapidly and frequently than most normal cells, they are disproportionately affected. However, normal rapidly dividing cells (hair follicles, gut lining, bone marrow) are also harmed — causing common chemotherapy side effects."},{"stem":"A student measures reaction time before and after consuming two units of alcohol. Reaction time increases significantly after alcohol. What is the most likely explanation?","A":"Alcohol increases neurotransmitter production, overwhelming the synapses","B":"Alcohol depresses the nervous system — it slows synaptic transmission and reduces the speed and reliability of nerve impulse conduction","C":"Alcohol causes the ciliary muscles to tighten, reducing vision and slowing response","D":"Alcohol permanently reduces the number of motor neurones in the spinal cord","correct":"B","explain":"Alcohol is a central nervous system depressant. It interferes with neurotransmitter release and receptor binding at synapses, slowing the transmission of signals. This increases reaction time, impairs coordination and reduces judgement — explaining why drinking and driving is dangerous."},{"stem":"The myelin sheath around axons is not fully formed at birth and develops through childhood and adolescence. Which observation is most consistent with this fact?","A":"Newborn babies are unable to breathe without assistance","B":"Young children develop complex motor skills (riding a bike, playing an instrument) progressively, as myelination improves the speed and reliability of neural circuits","C":"Teenagers grow faster than adults because myelination drives cell division","D":"Emotional responses in adults are slower than in children because the adult brain is fully myelinated","correct":"B","explain":"Myelination increases the speed and reliability of impulse transmission via saltatory conduction. As myelination progresses through childhood and into early adulthood (fully complete around age 25 in the prefrontal cortex), neural circuits — especially those for motor coordination, executive function and impulse control — become more efficient. This is reflected in the gradual development of complex skills and behaviour."},{"stem":"In a ruler-drop reaction time test, a student deliberately looks at the experimenter's fingers rather than the ruler, anticipating when it will be dropped. How would this affect the measured reaction time compared to a genuine surprise drop?","A":"No effect — the nervous system speed is fixed","B":"Reaction time would appear shorter, because the student can partially prepare the motor response before the stimulus — anticipation reduces processing time","C":"Reaction time would be longer, because concentrating on the fingers is distracting","D":"Reaction time would be longer, because the reflex arc takes more time when a stimulus is expected","correct":"B","explain":"Genuine reaction time is the time from stimulus to response. When a stimulus is anticipated, the brain can pre-activate motor pathways — reducing or eliminating the processing stage. This effectively converts a reaction into a pre-planned movement, giving an artificially short result. Reaction time studies use unpredictable stimuli to avoid this confounding factor."},{"stem":"A student claims that all reflexes are processed in the spinal cord. Is this correct, and why?","A":"Yes — all reflexes must use the spinal cord","B":"No — cranial reflexes (e.g. the pupil light reflex, blinking) are coordinated in the brainstem, not the spinal cord","C":"No — all reflexes bypass the entire nervous system","D":"Yes — the brain is never involved in any reflex response","correct":"B","explain":"Spinal reflexes (e.g. withdrawal from pain, knee jerk) use relay neurones in the spinal cord. However, cranial reflexes — such as the pupil light reflex (coordinated in the midbrain) and the blink reflex (coordinated in the pons and medulla) — use brainstem relay centres. Both types are fast and automatic but their neural pathways differ."},{"stem":"A contact lens for a myopic patient is rated at −3.5 dioptres. What does the negative value tell you about the lens type?","A":"It is a convex (converging) lens that adds refractive power to the eye","B":"It is a concave (diverging) lens that reduces the eye's total refractive power, moving the focal point back onto the retina","C":"It is a flat lens that corrects colour vision","D":"The negative sign refers to the fact that it is worn directly on the eye","correct":"B","explain":"Negative dioptres indicate a concave (diverging) lens. Myopia means the eye converges light too strongly (focal point falls in front of retina). A concave lens pre-diverges light before it enters the eye, reducing total refractive power and shifting the focal point back to the retina. Positive dioptres indicate converging lenses, used for hyperopia."},{"stem":"A person touches a hot object and pulls their hand away before consciously feeling pain. What explains this sequence?","A":"Pain receptors in the hand respond more slowly than touch receptors","B":"The withdrawal reflex arc (via the spinal cord) is completed before the pain signal has travelled to the cerebral cortex for conscious perception","C":"Pain signals are blocked by the spinal cord and never reach the brain","D":"The hand withdraws due to a voluntary decision made very rapidly by the prefrontal cortex","correct":"B","explain":"The withdrawal reflex arc operates within the spinal cord, producing a motor response before the pain signal has had time to travel up to and be processed by the cerebral cortex. The pain signal travels the same initial pathway (sensory neurone → spinal cord) but must then ascend to the brain — this extra distance adds a brief delay. You feel the pain a fraction of a second after your hand has already moved."},{"stem":"A neuroscientist measures reaction times in sprinters compared to untrained people. Sprinters are significantly faster. Which explanation best accounts for this?","A":"Sprinters have genetically faster muscles that do not depend on neural speed","B":"Years of specific training strengthen synaptic connections and promote myelination along the relevant neural pathways, making signal transmission faster and more efficient","C":"Sprinters have more neurones in the motor cortex as a result of genetic differences","D":"Sprinters' increased heart rates deliver more oxygen to neurones, speeding impulse transmission","correct":"B","explain":"Training physically reorganises neural circuits through synaptic strengthening (long-term potentiation) and increased myelination of active axons. Sprinters' years of practising start responses create highly optimised pathways between auditory cortex, motor cortex and the relevant muscles. This shortens total reaction time from ~250 ms to ~120–150 ms. This is an example of neural plasticity driven by training."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
