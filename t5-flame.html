<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T5 Health, Disease and Medicine Flame | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T5: Health, Disease and Medicine &mdash; Flame</h1><span class="tier-badge flame">Flame</span></header><main><div class="quiz-meta"><span>20 questions &middot; Health, Disease and Medicine</span><span>Flame: Application</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"A new antibiotic successfully kills bacteria in a Petri dish but causes liver damage in animal trials. What should happen next in the drug testing process?","A":"The drug should be approved immediately — it kills bacteria effectively","B":"The drug should be abandoned or reformulated — demonstrating effectiveness in vitro is not sufficient; it must also be safe in living organisms before any human trials","C":"The drug should go straight to clinical trials in human volunteers","D":"The liver damage is acceptable if the antibiotic is effective enough","correct":"B","explain":"Drug development requires both efficacy (the drug works) and safety. A drug that damages the liver in animal trials would likely harm humans too. It must be reformulated or discarded before proceeding. The sequence is: laboratory testing (cell cultures) → animal testing (safety and dosage) → clinical trials (human volunteers) → regulatory approval. Each stage must be passed before the next begins."},{"stem":"During a measles outbreak in a school, 95% of pupils are vaccinated. The 5% who are unvaccinated do not develop measles despite the outbreak. What explains this?","A":"The unvaccinated pupils were naturally immune to measles","B":"Herd immunity — the high vaccination rate disrupted transmission chains; the unvaccinated pupils were very unlikely to come into contact with an infected individual","C":"The measles virus mutated and became less virulent during the outbreak","D":"The unvaccinated pupils took antibiotics that prevented the infection","correct":"B","explain":"Herd immunity works by reducing the probability of contact between susceptible and infected individuals. When ~95% of a population is immune, an infected person rarely encounters a susceptible person — transmission chains break. The unvaccinated 5% benefit from this indirect protection. This is why maintaining high vaccination coverage is critical, especially to protect immunocompromised individuals who cannot be vaccinated."},{"stem":"A patient develops bacterial tonsillitis. The doctor prescribes an antibiotic but warns the patient to complete the full course even after feeling better. Why is completing the course important?","A":"Stopping early wastes the remaining tablets, which is expensive","B":"Stopping early leaves some bacteria alive — those that survive may be more resistant; they reproduce and pass on resistance alleles, contributing to antibiotic resistance","C":"The antibiotic has no effect until the full course is taken","D":"Antibiotics cause harm if not completely metabolised","correct":"B","explain":"Antibiotics reduce bacterial numbers rapidly — patients feel better quickly. However, the last bacteria to die tend to have slightly more resistance than average. Stopping early leaves these survivors to reproduce. Their offspring will be more resistant than the original population. Repeating this across millions of patients selects for increasingly resistant strains. This is a major driver of the antibiotic resistance crisis."},{"stem":"HIV is treated with antiretroviral drugs, not antibiotics. Why can't antibiotics treat HIV infection?","A":"HIV is too large for antibiotics to penetrate","B":"Antibiotics target specific bacterial structures (e.g. cell walls, bacterial ribosomes) that viruses do not have — viruses lack these structures entirely","C":"HIV mutates too quickly for antibiotics to work","D":"Antibiotics are effective against HIV but doctors choose not to use them","correct":"B","explain":"Antibiotics work by targeting structures unique to bacteria — cell walls (penicillin inhibits cell wall synthesis), bacterial 70S ribosomes (streptomycin), or specific enzymes. Viruses have none of these structures. They have no cell wall, no ribosomes of their own, and reproduce using the host cell's machinery. Antivirals must target virus-specific processes instead (e.g. reverse transcriptase in HIV)."},{"stem":"A patient's immune system is compromised after chemotherapy. They develop a severe chest infection from a fungus (Aspergillus) that rarely infects healthy people. What term describes this type of infection?","A":"A primary infection — the first infection this patient has ever had","B":"An opportunistic infection — a pathogen that causes disease only when the immune system is weakened","C":"A genetic disease — caused by mutations induced by chemotherapy","D":"A communicable disease — easily passed on to other patients","correct":"B","explain":"Opportunistic infections are caused by pathogens that normally exist at low numbers or are controlled by a healthy immune system. When immunity is impaired (by chemotherapy, HIV/AIDS, immunosuppressant drugs), these pathogens can cause severe, sometimes life-threatening infections. Aspergillus fumigatus is a common environmental fungus but rarely causes illness in immunocompetent individuals."},{"stem":"A scientist produces monoclonal antibodies specific to a cancer cell surface protein. The antibodies are linked to a radioactive isotope. When injected into a patient, the drug accumulates in the tumour. What is the advantage of this approach over conventional radiotherapy?","A":"Radioactive antibodies are cheaper to produce than radiotherapy machines","B":"Monoclonal antibodies deliver the radioactive payload specifically to cancer cells — minimising damage to surrounding healthy tissue compared to external beam radiotherapy which irradiates everything in its path","C":"Radioactive antibodies stimulate the immune system to kill cancer cells","D":"Radioactive antibodies can cross the blood-brain barrier more easily than radiation","correct":"B","explain":"Targeted therapy using antibody-drug or antibody-radioisotope conjugates is more precise than conventional radiotherapy. The antibody's specificity ensures most of the toxic payload reaches cancer cells (which express the target antigen) rather than normal tissue. This reduces side effects such as radiation burns, fatigue and damage to healthy organs. The trade-off is higher production cost and the need to identify a suitable tumour-specific antigen."},{"stem":"A food factory has a contamination event — Salmonella is detected in a batch of chicken. Staff are instructed to cook all chicken thoroughly before sale. Why does thorough cooking prevent Salmonella infection?","A":"Cooking stimulates the chicken's own immune system to fight the bacteria","B":"Thorough cooking reaches temperatures that kill Salmonella bacteria, preventing them from being ingested alive and causing disease","C":"Cooking denatures the toxins already produced by Salmonella, making them harmless","D":"Salmonella only infects the surface of food — cooking the surface is sufficient","correct":"B","explain":"Salmonella are bacteria killed at temperatures above 70°C (sustained). Thorough cooking throughout the meat destroys the bacteria before consumption, breaking the transmission route. Undercooked meat can contain viable Salmonella that multiply in the gut, produce toxins and cause gastroenteritis. Food hygiene measures (cooking temperature, storage, cross-contamination prevention) are public health interventions against communicable disease."},{"stem":"A clinical trial for a new cancer drug uses a double-blind randomised controlled design. Half the patients receive the drug; half receive a placebo. Neither the patients nor the doctors know who receives which until the trial ends. Why is this design important?","A":"It ensures the drug is tested on as many patients as possible","B":"The double-blind design eliminates placebo effect (patients' belief they are being treated) and observer bias (doctors unconsciously recording better outcomes for treated patients), making the results more reliable","C":"It reduces the cost of the trial by using fewer resources","D":"It guarantees that the drug is safe before the trial begins","correct":"B","explain":"A double-blind randomised controlled trial (RCT) is the gold standard in drug testing. Blinding the patient eliminates the placebo effect (subjective improvement from the belief of being treated). Blinding the clinician eliminates observer bias (unconsciously interpreting results in favour of the treated group). Randomisation ensures the two groups are comparable at the start. Together, these controls ensure that any difference in outcomes is due to the drug, not confounding factors."},{"stem":"The MMR vaccine (measles, mumps and rubella) was wrongly linked to autism in a 1998 paper that was later retracted due to data fabrication. Vaccination rates dropped and measles outbreaks followed. What does this episode illustrate about the relationship between science and public health?","A":"The autism link was real — vaccination should be studied more carefully","B":"A single fraudulent study, amplified by media, can cause serious public health harm; scientific peer review and replication are essential to distinguish reliable evidence from false claims","C":"Vaccines are dangerous and the public was right to be cautious","D":"Doctors should always accept published research without question","correct":"B","explain":"The MMR controversy illustrates how scientific misinformation can have deadly real-world consequences. Despite subsequent studies involving millions of children showing no link to autism, vaccine hesitancy persisted. The episode highlighted the importance of peer review, replication, and critically evaluating the quality and integrity of evidence — rather than responding to a single study, especially one with serious methodological flaws and conflicts of interest."},{"stem":"A student investigates the effect of antiseptic concentration on bacterial growth using agar plates. As antiseptic concentration increases, the inhibition zone (clear area around the antiseptic) increases. What does this tell us?","A":"Higher concentrations of antiseptic are more toxic to the bacteria","B":"Higher concentrations of antiseptic diffuse further through the agar AND are more effective at killing bacteria — both concentration gradient and bactericidal effect increase the zone","C":"The bacteria are moving away from the antiseptic","D":"Higher antiseptic concentrations accelerate bacterial growth in the affected area","correct":"B","explain":"The inhibition zone in an agar diffusion assay shows the area where antiseptic concentration is sufficient to prevent bacterial growth. A larger zone with higher concentration reflects: (1) the antiseptic diffuses further from the disc or well; and (2) a higher concentration is more effective at killing or inhibiting the bacteria. This is a standard method for comparing antimicrobial effectiveness."},{"stem":"Rose black spot is a fungal disease of roses caused by Diplocarpon rosae. It causes purple or black spots on leaves, leading to yellowing and leaf drop. Why does significant leaf loss harm the plant?","A":"The leaves produce hormones needed for root growth — their loss stops root development","B":"Fewer leaves means less photosynthesis — less glucose is produced for growth, respiration and reproduction, weakening and potentially killing the plant","C":"Leaf loss exposes the stem to UV radiation, causing DNA damage","D":"Leaf drop causes the soil pH to change, preventing mineral absorption","correct":"B","explain":"Leaves are the main site of photosynthesis. If significant leaf area is lost, the plant's ability to capture light and produce glucose is reduced. This limits the energy and organic molecules available for respiration, growth, reproduction and all other metabolic processes. Severely affected plants may die or fail to reproduce. Fungal diseases of crops can devastate yields for the same reason."},{"stem":"Tobacco mosaic virus (TMV) infects tobacco, tomato and many other plants, causing a mosaic pattern of discolouration on leaves. Why does TMV infection reduce crop yields?","A":"TMV infects root cells, blocking water absorption","B":"TMV infects leaf cells, disrupting chloroplast function and reducing photosynthesis — less glucose is produced, limiting growth and yield","C":"TMV produces toxins that are absorbed by fruits, making them poisonous","D":"TMV causes root nodules to stop fixing nitrogen, reducing plant nutrition","correct":"B","explain":"TMV disrupts chloroplasts in infected leaf cells, impairing photosynthesis and producing characteristic light-green and yellow patches (mosaic pattern). Reduced photosynthesis means less glucose for growth and development. In crop plants (tomato, pepper, cucumber), this reduces the biomass of edible parts, directly lowering yield. TMV spreads rapidly through mechanical contact (touching, tools) and has no effective cure."},{"stem":"An epidemiologist notices that countries with higher rates of obesity have proportionally higher rates of type 2 diabetes and cardiovascular disease. Is this sufficient to conclude that obesity causes these diseases?","A":"Yes — a positive correlation is always evidence of causation","B":"No — correlation shows association but does not prove causation; a third variable (e.g. physical inactivity, poor diet) could cause both; however, combined with mechanistic evidence (e.g. how excess adipose tissue causes insulin resistance), the case for causation becomes much stronger","C":"No — epidemiological data is always unreliable and should be ignored","D":"Yes — any statistical association between two variables proves one causes the other","correct":"B","explain":"Correlation indicates that two variables change together, but cannot alone prove causation — a confounding variable might cause both. However, when a correlation is strong, consistent across many studies, has a dose-response relationship, and is supported by a plausible biological mechanism, the case for causation is compelling. For obesity and T2 diabetes, the mechanism (excess adipose tissue causing insulin resistance through inflammatory cytokines and free fatty acids) is well established. Correlation plus mechanism equals a strong causal inference."},{"stem":"A patient with a bacterial infection is given a course of penicillin. Their symptoms worsen on day 3. Tests show the bacteria are penicillin-resistant. The doctor switches to a different antibiotic. Why did the penicillin fail?","A":"The patient's immune system destroyed the penicillin before it could work","B":"The bacteria produce β-lactamase (or a similar enzyme) that breaks down penicillin, or have modified penicillin-binding proteins — a pre-existing resistance that natural selection has increased in frequency in the population","C":"The doctor prescribed an insufficient dose on day 1","D":"Penicillin only works against viral infections","correct":"B","explain":"Penicillin resistance arises through natural selection: bacteria with mutations producing β-lactamase (an enzyme that hydrolyses the β-lactam ring of penicillin) survived previous antibiotic exposure. Their offspring carry the resistance gene. These bacteria are unaffected by penicillin. A different antibiotic with a different mechanism of action must be used. This is why doctors culture bacteria from patients to identify the infecting organism and test its antibiotic sensitivity."},{"stem":"A public health campaign aims to reduce malaria in sub-Saharan Africa by distributing insecticide-treated bed nets. Which transmission route does this target?","A":"Direct contact between infected and uninfected individuals","B":"The vector (Anopheles mosquito) — preventing the mosquito bite that transmits Plasmodium from an infected person to an uninfected one","C":"The waterborne route — Plasmodium in contaminated drinking water","D":"The airborne route — Plasmodium in respiratory droplets","correct":"B","explain":"Malaria is a vector-borne disease — the Plasmodium protist is transmitted through the bite of an infected Anopheles mosquito. Insecticide-treated bed nets (ITNs) prevent mosquito bites during sleep (when Anopheles are most active), killing or repelling mosquitoes. This breaks the transmission cycle. ITNs are one of the most cost-effective malaria prevention tools. Other interventions target breeding sites (draining standing water) or the parasite directly (antimalarial drugs)."},{"stem":"A scientist discovers a new bacterium that causes a serious disease. Testing shows the bacterium is killed by high concentrations of three different antibiotics but remains fully viable at clinical doses. What does this suggest about treatment?","A":"The bacterium is untreatable and all infected patients will die","B":"The bacterium may require higher-than-standard doses of these antibiotics; combination therapy using two or three together might achieve the necessary effect while minimising resistance development","C":"The bacterium is resistant to all known antibiotics and new drugs must be developed immediately","D":"The clinical doses should be reduced to avoid side effects regardless of efficacy","correct":"B","explain":"If high concentrations kill the bacterium but clinical doses do not, the minimum inhibitory concentration (MIC) exceeds standard dosing. Combination therapy using multiple antibiotics can increase the combined bactericidal effect. Drug pharmacokinetics (how the drug distributes and concentrates in different tissues) must also be considered — the concentration at the infection site may differ from blood levels. This is why antibiotic susceptibility testing guides clinical prescribing."},{"stem":"A student argues that washing hands with soap is just as effective as surgical scrubbing with antiseptic before an operation. What is wrong with this argument?","A":"Soap and antiseptic are chemically identical","B":"Soap physically removes many microorganisms but does not kill them; surgical antiseptics achieve far greater microbial kill rates (reducing viable organisms by >99.9%), necessary to prevent wound infections that can be life-threatening","C":"Hand washing is more effective than antiseptic for all purposes","D":"The argument is correct — soap is just as effective as antiseptic for surgical use","correct":"B","explain":"Standard hand washing removes most transient microorganisms physically. Surgical scrubbing with antiseptic (e.g. chlorhexidine, povidone-iodine) kills or inhibits the vast majority of microorganisms, including those in the deeper layers of skin. In surgery, even very small numbers of bacteria introduced into an open wound can cause serious post-operative infections (e.g. sepsis). The standard of microbial reduction needed is far higher than for everyday hygiene."},{"stem":"Zika virus can be transmitted sexually as well as by mosquito bites. A couple are planning to travel to an area where Zika is endemic. The woman is pregnant. What advice should they receive to reduce transmission risk?","A":"Only the woman needs to take precautions — Zika is only dangerous to women","B":"Both should use insect repellent and mosquito protection; if the man is exposed to Zika, he should use barrier contraception for several months afterwards to prevent sexual transmission to his pregnant partner, as Zika can cause severe foetal brain defects","C":"The couple should avoid all travel but do not need additional precautions in the UK","D":"Zika is not sexually transmitted — only mosquito precautions are needed","correct":"B","explain":"Zika can be sexually transmitted (by both male and female partners). In pregnancy, Zika causes microcephaly and other severe neurological defects in the developing foetus. Reducing transmission requires: preventing mosquito bites (repellent, clothing, nets); sexual barrier protection if either partner is potentially exposed; and avoiding travel to endemic regions if pregnant. This illustrates how the same pathogen can use multiple transmission routes."},{"stem":"A pathologist examines a tissue sample from a patient with a suspected tumour. They observe cells dividing much more frequently than normal and with irregular chromosome numbers. Which feature is most significant in diagnosing malignancy?","A":"The cells are dividing — all living tissue must divide","B":"Uncontrolled, frequent cell division combined with chromosomal instability (abnormal chromosome number per cell — aneuploidy) are hallmarks of malignant cells; benign cells may divide but maintain chromosomal stability","C":"Irregular chromosomes are always due to normal ageing, not cancer","D":"Only large tumours can be malignant — small dividing cell clusters are always benign","correct":"B","explain":"Malignant cells typically show: (1) uncontrolled mitosis — far higher than normal division rates; (2) chromosomal instability — incorrect chromosome numbers, translocations and deletions resulting from faulty cell division checkpoints; (3) abnormal cell morphology — large nuclei, irregular shape. Chromosomal instability drives further genetic changes, accelerating cancer progression. Benign tumours divide but usually maintain normal chromosome complements and do not invade surrounding tissue."},{"stem":"A 2019 study shows that countries with higher sugar consumption per capita have higher rates of type 2 diabetes. A food company uses this correlation to argue that it should not be blamed for any specific individual's diabetes. Evaluate the strength of this argument.","A":"The food company is entirely correct — individual choice is the only relevant factor","B":"Population-level correlations do not establish individual causation, but mechanistic evidence (excess sugar → obesity → insulin resistance) and dose-response relationships together support the conclusion that high sugar intake is a significant risk factor — regulatory and product reformulation responses are therefore scientifically justified","C":"The correlation proves definitively that all diabetes is caused by the food industry","D":"The study is meaningless because it only looks at countries, not individuals","correct":"B","explain":"Epidemiological evidence (correlation) is stronger when supported by biological mechanisms and dose-response relationships. The mechanism linking high sugar consumption → weight gain → visceral fat accumulation → chronic inflammation → insulin resistance → T2 diabetes is well established. While individual factors (genetics, physical activity) also contribute, the food environment is a modifiable population-level risk factor. Public health policy targeting food composition is scientifically justified even if individual cases have multiple causes."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
