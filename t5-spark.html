<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T5 Health, Disease and Medicine Spark | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T5: Health, Disease and Medicine &mdash; Spark</h1><span class="tier-badge spark">Spark</span></header><main><div class="quiz-meta"><span>20 questions &middot; Health, Disease and Medicine</span><span>Spark: Recall</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"What is the difference between a communicable and a non-communicable disease?","A":"Communicable diseases are always fatal; non-communicable ones are not","B":"Communicable diseases can be passed from one person to another; non-communicable diseases cannot be transmitted between individuals","C":"Communicable diseases are caused by genetics; non-communicable ones by pathogens","D":"Non-communicable diseases are more common than communicable ones in all countries","correct":"B","explain":"Communicable (infectious) diseases are caused by pathogens and can spread between individuals. Non-communicable diseases (e.g. heart disease, type 2 diabetes, cancer) cannot be passed on — they arise from genetic, lifestyle or environmental factors. Understanding the distinction guides public health strategies."},{"stem":"What are the four main types of pathogen?","A":"Bacteria, viruses, fungi, protists","B":"Bacteria, viruses, worms, prions","C":"Fungi, protists, insects, bacteria","D":"Viruses, bacteria, toxins, allergens","correct":"A","explain":"Pathogens are microorganisms that cause disease. The four main types are: bacteria (e.g. Salmonella, Gonorrhoea), viruses (e.g. measles, HIV, TMV), fungi (e.g. rose black spot), and protists (e.g. Plasmodium, which causes malaria). Each type has distinct features and requires different treatments."},{"stem":"How do bacteria cause disease in the body?","A":"They directly destroy cell nuclei","B":"They produce toxins that damage cells and tissues, and reproduce rapidly within the body","C":"They cause mutations in the host's DNA","D":"They only cause disease by blocking blood vessels","correct":"B","explain":"Bacteria cause disease by: (1) reproducing rapidly inside the body, competing for nutrients and space; (2) producing toxins (poisons) that damage host cells and disrupt normal body functions. Some bacteria also directly invade and destroy cells. The body's immune response to infection also contributes to symptoms such as fever and inflammation."},{"stem":"How do viruses cause disease?","A":"They produce toxins in the bloodstream","B":"They reproduce inside host cells and burst out, destroying the cells","C":"They block the transport of oxygen in the blood","D":"They attack only the nervous system","correct":"B","explain":"Viruses invade host cells, hijack the cell's ribosomes and other machinery to reproduce, then burst out of the cell (lysis), destroying it and releasing new viruses. Unlike bacteria, viruses are not living cells — they cannot be treated with antibiotics. Antiviral drugs target specific stages of the viral life cycle."},{"stem":"Which disease is caused by the protist Plasmodium?","A":"Salmonella food poisoning","B":"Malaria","C":"Rose black spot","D":"Gonorrhoea","correct":"B","explain":"Malaria is caused by Plasmodium — a single-celled protist. It is spread by the bite of female Anopheles mosquitoes (the vector), which inject Plasmodium into the bloodstream. Plasmodium infects and destroys red blood cells, causing fever, chills and anaemia. Malaria kills over 600,000 people per year, mostly in sub-Saharan Africa."},{"stem":"What is the function of white blood cells in the immune response?","A":"Transporting oxygen to tissues","B":"Producing antibodies and engulfing pathogens by phagocytosis","C":"Clotting the blood to prevent infection entering wounds","D":"Producing digestive enzymes to break down pathogens in the gut","correct":"B","explain":"White blood cells (leucocytes) are the key cells of the immune system. Phagocytes engulf and digest pathogens (phagocytosis). Lymphocytes produce antibodies that bind to specific antigens on pathogens, neutralising them or labelling them for destruction. Some lymphocytes become memory cells for long-term immunity."},{"stem":"What is an antigen?","A":"A protein produced by white blood cells that destroys pathogens","B":"A molecule (usually a protein) on the surface of a pathogen that is recognised by the immune system","C":"A chemical that neutralises toxins in the bloodstream","D":"The toxin produced by a bacterium","correct":"B","explain":"Antigens are surface molecules — usually proteins — found on pathogens. The immune system recognises them as foreign. Each pathogen has unique antigens. Lymphocytes produce complementary antibodies that bind specifically to these antigens, initiating the immune response."},{"stem":"What is an antibody?","A":"A type of pathogen that attacks white blood cells","B":"A protein produced by lymphocytes that binds to a specific antigen","C":"A drug used to kill bacteria","D":"An enzyme that digests viruses","correct":"B","explain":"Antibodies are proteins (immunoglobulins) produced by B lymphocytes. Each antibody has a unique binding site complementary to one specific antigen — they are highly specific. Antibodies can neutralise pathogens, flag them for phagocytosis, or cause clumping (agglutination). The specific antibody-antigen relationship underpins vaccination and monoclonal antibody therapy."},{"stem":"How do vaccines protect against disease?","A":"Vaccines kill all pathogens in the body before infection occurs","B":"Vaccines contain antigens (from weakened, dead or fragmented pathogens) that stimulate the immune system to produce antibodies and memory cells without causing disease","C":"Vaccines provide antibiotics that the body uses when infected","D":"Vaccines stimulate the production of phagocytes only","correct":"B","explain":"Vaccines expose the immune system to harmless antigens (weakened pathogens, inactivated pathogens, specific proteins or mRNA). The body mounts a primary immune response and produces memory lymphocytes. On subsequent exposure to the real pathogen, the memory cells enable a rapid, large secondary immune response before the person becomes ill."},{"stem":"What is herd immunity?","A":"When all members of a population have been vaccinated","B":"When a large enough proportion of a population is immune (through vaccination or past infection) that the pathogen cannot spread easily, protecting even unvaccinated individuals","C":"When animals develop immunity to diseases that affect humans","D":"When a disease disappears permanently from a population","correct":"B","explain":"Herd immunity occurs when enough individuals are immune (typically 70–95% depending on the pathogen's transmissibility) to disrupt transmission chains. Even unvaccinated or immunocompromised individuals are protected because they are unlikely to encounter an infected person. This is why high vaccination rates in a community protect vulnerable individuals who cannot be vaccinated."},{"stem":"What is the role of the skin as a defence against disease?","A":"The skin produces antibodies on its surface","B":"The skin acts as a physical barrier preventing most pathogens from entering the body","C":"The skin secretes antibiotics that kill nearby bacteria","D":"The skin absorbs pathogens before they can enter the bloodstream","correct":"B","explain":"The skin is the first line of non-specific defence. It forms a continuous physical barrier that pathogens cannot penetrate unless broken (by a wound or cut). Sweat produced by the skin also contains lysozyme (an enzyme that damages bacterial cell walls) and has a slightly acidic pH that inhibits microbial growth."},{"stem":"What do mucus and cilia in the respiratory tract do?","A":"Produce antibodies to neutralise inhaled pathogens","B":"Mucus traps pathogens and particles; cilia beat to sweep the mucus (and trapped pathogens) up towards the throat, where it is swallowed","C":"Cilia produce acid to kill pathogens; mucus seals the airways","D":"Mucus digests pathogens; cilia push them into the lungs for destruction","correct":"B","explain":"The respiratory tract is lined with mucus-secreting goblet cells and ciliated cells. Mucus is sticky and traps dust, bacteria and viruses. Cilia beat rhythmically, moving the mucus escalator upward to the back of the throat. This is a key non-specific defence. Smoking paralyses cilia, impairing this defence and increasing respiratory infection risk."},{"stem":"What is phagocytosis?","A":"The production of antibodies by lymphocytes","B":"The process by which phagocytes engulf and digest pathogens","C":"The release of toxins by bacteria to kill white blood cells","D":"The process by which viruses enter host cells","correct":"B","explain":"Phagocytes (e.g. neutrophils, macrophages) are white blood cells that engulf pathogens by wrapping their membrane around them, forming a phagosome. Lysosomes fuse with the phagosome and release digestive enzymes that break down the pathogen. Phagocytosis is a rapid, non-specific defence — it does not depend on recognising specific antigens."},{"stem":"What is gonorrhoea caused by, and how is it treated?","A":"A virus; treated with antiviral drugs","B":"A bacterium (Neisseria gonorrhoeae); treated with antibiotics","C":"A protist; treated with antiprotozoal drugs","D":"A fungus; treated with antifungal medication","correct":"B","explain":"Gonorrhoea is a sexually transmitted infection caused by the bacterium Neisseria gonorrhoeae. Symptoms include thick discharge from the genitals and pain when urinating. It is treated with antibiotics, though antibiotic-resistant strains are an increasing global health concern. It can be prevented by using barrier contraception."},{"stem":"What is the role of monoclonal antibodies in cancer treatment?","A":"They directly kill cancer cells by producing toxic chemicals","B":"They can be designed to bind specifically to cancer cell antigens and deliver drug payloads directly to tumour cells, or flag them for immune destruction","C":"They stimulate the immune system to produce more phagocytes to attack tumours","D":"They prevent cancer cells from dividing by blocking DNA replication directly","correct":"B","explain":"Monoclonal antibodies (MABs) are produced by cloning a single B-lymphocyte that makes a specific antibody. In cancer treatment, MABs can: target surface antigens on cancer cells; deliver toxic drugs or radioactive atoms directly to tumour cells (reducing side effects); or block growth factor receptors on cancer cells to prevent proliferation. Examples include Herceptin (trastuzumab) for breast cancer."},{"stem":"What is the difference between antiseptics and antibiotics?","A":"Antiseptics kill bacteria inside the body; antibiotics kill bacteria on external surfaces","B":"Antibiotics kill or inhibit bacteria inside the body; antiseptics kill microorganisms on external surfaces (skin, equipment) and are too toxic to use internally","C":"Both kill bacteria equally; the terms are interchangeable","D":"Antibiotics are natural; antiseptics are always synthetic chemicals","correct":"B","explain":"Antibiotics (e.g. penicillin) are drugs taken internally to kill or inhibit bacteria within the body. They are specific enough to damage bacteria without harming human cells. Antiseptics (e.g. iodine, alcohol) kill microorganisms on external surfaces — wounds, skin, surgical instruments. They are too toxic for internal use. Neither type is effective against viruses."},{"stem":"What are risk factors for cardiovascular disease?","A":"Being young, exercising regularly and eating a balanced diet","B":"Smoking, high blood pressure, high LDL cholesterol, obesity, physical inactivity and a diet high in saturated fat","C":"Consuming a diet high in fruits and vegetables","D":"Having a viral infection","correct":"B","explain":"Cardiovascular disease (CVD) risk factors include: smoking (damages blood vessel walls), high blood pressure (increases arterial stress), high LDL cholesterol (deposits in artery walls forming plaques), obesity, physical inactivity, diabetes, and a diet high in saturated fats. Family history (genetics) also plays a role. Many risk factors are modifiable through lifestyle changes."},{"stem":"What is the role of stomach acid in defence against disease?","A":"It produces antibodies that neutralise pathogens in food","B":"The low pH (around 2) of stomach acid kills most pathogens swallowed with food or in mucus","C":"Stomach acid seals the stomach lining to prevent pathogens entering the bloodstream","D":"It stimulates phagocytes to engulf pathogens in the digestive tract","correct":"B","explain":"Stomach acid (hydrochloric acid, pH ~2) is a chemical non-specific defence. The highly acidic environment denatures proteins in most bacteria and viruses swallowed with food or transported from the respiratory tract in mucus. This prevents infection via the digestive route. Pathogens that survive (e.g. Helicobacter pylori) have specific adaptations to resist acid."},{"stem":"What is the HIV virus and how does it cause AIDS?","A":"HIV is a bacterium; it causes AIDS by producing a toxin that destroys red blood cells","B":"HIV is a virus that infects and destroys CD4⁺ T helper lymphocytes — as their number falls, the immune system is weakened until the body cannot fight infections (AIDS)","C":"HIV is a protist that attacks the brain and causes dementia","D":"HIV is a virus; it causes AIDS by triggering overproduction of antibodies","correct":"B","explain":"HIV (human immunodeficiency virus) is a retrovirus that targets CD4⁺ T helper lymphocytes — key cells that coordinate the immune response. As HIV gradually destroys these cells over years, the immune system weakens. When the CD4⁺ count falls below a threshold, the person develops AIDS (acquired immune deficiency syndrome) — defined by opportunistic infections and cancers that a healthy immune system would control."},{"stem":"What are clinical trials and why are they important in drug development?","A":"Experiments performed on computer models to predict drug effects","B":"Controlled tests of new drugs in human volunteers to establish safety, correct dosage and effectiveness before the drug is approved for general use","C":"Laboratory tests performed on cell cultures only — no human participants","D":"Trials in which the drug is administered to patients as soon as it is synthesised","correct":"B","explain":"Clinical trials are the final and most important stage of drug testing. They follow laboratory and animal testing. Trials progress in phases: Phase 1 (small group, safety and dosage); Phase 2 (larger group, efficacy); Phase 3 (large randomised controlled trial, double-blind where possible, comparison with placebo or existing treatment). Only drugs that pass all phases gain regulatory approval. They protect the public from ineffective or dangerous medicines."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
