<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T7 Homeostasis Spark | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T7: Homeostasis &mdash; Spark</h1><span class="tier-badge spark">Spark</span></header><main><div class="quiz-meta"><span>20 questions &middot; Homeostasis</span><span>Spark: Recall</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"What is homeostasis?","A":"The process by which organisms digest food and absorb nutrients","B":"The maintenance of a stable internal environment within narrow limits, despite changes in external conditions","C":"The control of movement and coordination by the nervous system","D":"The regulation of gene expression in response to environmental stimuli","correct":"B","explain":"Homeostasis is the process by which organisms regulate their internal conditions — such as body temperature, blood glucose concentration, water content and pH — within narrow ranges. It involves detecting changes (receptors), processing information (control centres) and making corrective responses (effectors). This is essential because enzymes and cells function optimally only within narrow conditions."},{"stem":"What is the endocrine system?","A":"The system of nerves that carries electrical impulses around the body","B":"A system of glands that produce and secrete hormones directly into the blood, which carry chemical messages to target organs","C":"The system of lymph vessels that transports white blood cells","D":"The network of receptors that detect changes in the internal environment","correct":"B","explain":"The endocrine system consists of glands (e.g. pituitary, thyroid, adrenal glands, pancreas, ovaries, testes) that secrete hormones. Hormones are chemical messengers released into the bloodstream and transported throughout the body. They act on specific target organs that have the correct receptor proteins. Hormonal responses are slower but longer-lasting than nervous responses."},{"stem":"What is the role of adrenaline?","A":"Regulates blood glucose concentration by stimulating glycogen breakdown","B":"Prepares the body for \"fight or flight\" — increases heart rate, diverts blood to muscles, raises blood glucose and dilates pupils","C":"Controls the menstrual cycle and stimulates egg development","D":"Regulates body temperature by controlling metabolic rate","correct":"B","explain":"Adrenaline is produced by the adrenal glands (above the kidneys) in response to stress or fear. It prepares the body for rapid action: increases heart rate (more O₂ and glucose to muscles), causes glycogen to be converted to glucose (more fuel for muscles), dilates pupils (better vision), redirects blood from the gut to muscles. These effects occur rapidly and are short-lived."},{"stem":"What is the role of thyroxine?","A":"Controls blood glucose by stimulating insulin release from the pancreas","B":"Regulates metabolic rate and is important for normal growth and development","C":"Triggers ovulation and controls the menstrual cycle","D":"Prepares the body for stress by increasing heart rate and blood pressure","correct":"B","explain":"Thyroxine is produced by the thyroid gland in the neck. It regulates the basal metabolic rate (the rate at which cells respire at rest). It is also essential for normal growth and brain development in children. Thyroxine levels are controlled by a negative feedback loop involving the pituitary gland (TSH) and hypothalamus (TRH)."},{"stem":"What hormone stimulates the release of thyroxine from the thyroid gland?","A":"Adrenaline, from the adrenal glands","B":"Thyroid-stimulating hormone (TSH), from the pituitary gland","C":"Insulin, from the pancreas","D":"Oestrogen, from the ovaries","correct":"B","explain":"The pituitary gland releases thyroid-stimulating hormone (TSH) which travels in the blood to the thyroid gland and stimulates it to produce and release thyroxine. This is part of the hypothalamus-pituitary-thyroid axis. The hypothalamus releases TRH (thyrotropin-releasing hormone) which stimulates TSH release. High thyroxine levels feed back to suppress both TRH and TSH — a negative feedback loop."},{"stem":"What hormones control the menstrual cycle?","A":"Insulin, glucagon, adrenaline and thyroxine","B":"FSH (follicle-stimulating hormone), LH (luteinising hormone), oestrogen and progesterone","C":"ADH, oxytocin, cortisol and testosterone","D":"Adrenaline, thyroxine, FSH and progesterone","correct":"B","explain":"The menstrual cycle is controlled by four hormones: FSH (from pituitary) — stimulates egg follicle development and oestrogen production; oestrogen (from ovaries) — repairs uterus lining and triggers LH surge; LH (from pituitary) — triggers ovulation; progesterone (from corpus luteum) — maintains uterus lining in second half of cycle. If no fertilisation, progesterone falls and menstruation occurs."},{"stem":"What is ovulation?","A":"The implantation of a fertilised egg into the uterus wall","B":"The release of a mature egg (ovum) from the ovary, usually around day 14 of the menstrual cycle","C":"The thickening of the uterus lining in preparation for pregnancy","D":"The shedding of the uterus lining at the start of the menstrual cycle","correct":"B","explain":"Ovulation is the release of a mature secondary oocyte (egg) from the ovary. It occurs approximately mid-cycle (around day 14 in a 28-day cycle), triggered by a surge in LH from the pituitary gland. The egg travels down the fallopian tube, where fertilisation can occur if sperm are present. If not fertilised within ~24 hours, the egg degenerates."},{"stem":"What is the role of the pancreas in blood glucose regulation?","A":"It produces bile that helps digest glucose in the small intestine","B":"It monitors blood glucose and produces insulin (to lower glucose) and glucagon (to raise glucose), both secreted from the islets of Langerhans","C":"It stores glycogen and releases glucose when blood glucose is low","D":"It produces adrenaline in response to low blood glucose","correct":"B","explain":"The pancreas contains clusters of cells called islets of Langerhans. Beta cells secrete insulin when blood glucose is too high; alpha cells secrete glucagon when blood glucose is too low. This is a negative feedback system. The liver responds to both hormones — insulin causes liver cells to convert glucose to glycogen (glycogenesis); glucagon causes the liver to convert glycogen back to glucose (glycogenolysis)."},{"stem":"What does insulin do?","A":"Stimulates the liver to break down glycogen into glucose, raising blood glucose","B":"Stimulates liver and muscle cells to convert excess glucose into glycogen for storage, lowering blood glucose concentration","C":"Stimulates the kidneys to reabsorb more water from the filtrate","D":"Increases heart rate and diverts blood to muscles when blood glucose is high","correct":"B","explain":"Insulin is released by beta cells in the pancreas when blood glucose is too high (e.g. after a meal). It causes body cells (especially liver and muscle) to take up glucose from the blood, and stimulates the liver to convert glucose to glycogen (glycogenesis). Insulin also increases glucose uptake by muscle cells for respiration. Together, these effects lower blood glucose back to the normal range."},{"stem":"What does glucagon do?","A":"Stimulates cells to take up glucose from the blood, lowering blood glucose","B":"Stimulates the liver to convert glycogen back into glucose (glycogenolysis), raising blood glucose concentration","C":"Stimulates the pancreas to produce more insulin","D":"Promotes glycogen synthesis in muscle cells","correct":"B","explain":"Glucagon is released by alpha cells in the pancreas when blood glucose is too low (e.g. between meals or during exercise). It travels to the liver and stimulates glycogenolysis — the breakdown of stored glycogen to glucose — and gluconeogenesis (making new glucose from non-carbohydrate sources). Glucose is released into the blood, raising blood glucose back to the normal level. Insulin and glucagon act antagonistically."},{"stem":"What is type 1 diabetes?","A":"A condition where the pancreas produces too much insulin, causing dangerously low blood glucose","B":"A condition where the pancreas cannot produce insulin — caused by autoimmune destruction of beta cells; managed with insulin injections or pump","C":"A condition where body cells stop responding to insulin, usually linked to obesity","D":"A condition where glucagon overproduction causes persistently high blood glucose","correct":"B","explain":"Type 1 diabetes is an autoimmune condition where the body's immune system destroys the insulin-producing beta cells in the pancreas. Without insulin, blood glucose cannot be properly regulated — it rises dangerously after meals (hyperglycaemia). It is managed by monitoring blood glucose and administering insulin (by injection or insulin pump) to replace what the pancreas cannot produce. Type 1 typically develops in childhood or adolescence."},{"stem":"What is type 2 diabetes?","A":"An autoimmune condition causing complete loss of insulin production from birth","B":"A condition where body cells become less responsive to insulin (insulin resistance), often linked to being overweight, older age or genetic factors; blood glucose remains high","C":"A condition where the liver produces too much glucagon, counteracting insulin","D":"A viral infection that destroys beta cells in the pancreas","correct":"B","explain":"Type 2 diabetes develops when body cells become resistant to insulin — they stop responding normally to its signal. The pancreas may still produce insulin (or even overproduce it initially), but cells don't take up enough glucose. Risk factors include obesity, physical inactivity, family history and older age. It is managed by lifestyle changes (diet, exercise, weight loss) and sometimes medication. It is the most common form of diabetes."},{"stem":"How does the body respond to a rise in core body temperature?","A":"Blood vessels in the skin constrict; sweating increases; shivering begins","B":"Blood vessels in the skin vasodilate (widening); sweating increases; metabolic rate decreases — all helping to lose heat and cool the body","C":"Blood vessels in the skin vasodilate; sweating stops; shivering begins","D":"Blood vessels in the skin constrict; metabolic rate increases; hair stands on end","correct":"B","explain":"When core temperature rises: (1) vasodilation — skin arterioles widen, more blood flows near the surface, heat is lost by radiation; (2) sweating — water evaporates from the skin, removing latent heat; (3) the body reduces heat generation (resting, reduced metabolic rate if possible). These responses are coordinated by the thermoregulatory centre in the hypothalamus."},{"stem":"How does the body respond to a fall in core body temperature?","A":"Vasodilation and sweating increase to generate heat","B":"Vasoconstriction (reduces blood flow to skin surface), shivering (involuntary muscle contraction generates heat), erector muscles raise hairs (trapping air — more effective in other mammals)","C":"Blood glucose is lowered to reduce heat production in cells","D":"Increased sweating to stimulate the skin and warm it through friction","correct":"B","explain":"When core temperature falls: (1) vasoconstriction — skin arterioles narrow, reducing blood flow to the skin surface, retaining heat in the core; (2) shivering — rapid, involuntary muscle contractions generate heat by respiration; (3) erection of body hairs (via erector pili muscles) — traps a layer of insulating air (limited in humans, more effective in furry animals). The hypothalamus coordinates these responses."},{"stem":"Where is the thermoregulatory centre located?","A":"In the cerebellum","B":"In the hypothalamus (in the brain)","C":"In the medulla oblongata","D":"In the cerebral cortex","correct":"B","explain":"The thermoregulatory centre is located in the hypothalamus, a region at the base of the brain. It has receptors that monitor blood temperature directly (central thermoreceptors) and receives signals from peripheral thermoreceptors in the skin. It acts as the body's thermostat, sending nerve signals and hormonal signals to effectors (skin blood vessels, sweat glands, muscles) to maintain core temperature at approximately 37°C."},{"stem":"What is ADH (antidiuretic hormone) and what does it do?","A":"A hormone from the adrenal glands that raises blood glucose concentration","B":"A hormone from the pituitary gland that increases water reabsorption by kidney tubules, reducing urine volume and concentrating the urine when the body is dehydrated","C":"A hormone from the kidneys that stimulates red blood cell production","D":"A hormone that controls the menstrual cycle by triggering ovulation","correct":"B","explain":"ADH (antidiuretic hormone, also called vasopressin) is produced by the hypothalamus and released from the posterior pituitary gland. When blood water concentration falls (e.g. dehydration, eating salty food), more ADH is released. ADH increases the permeability of the collecting duct in the kidney, allowing more water to be reabsorbed by osmosis back into the blood — producing smaller volumes of more concentrated urine."},{"stem":"Where are the kidneys located and what are their main functions?","A":"In the chest cavity behind the lungs; main function is to filter blood and produce hormones","B":"In the abdominal cavity, either side of the spine; main functions are filtration of blood to remove urea and other waste, regulation of water and ion balance, and maintenance of blood pH","C":"In the lower abdomen; main function is to store urine before excretion","D":"Attached to the liver; main function is to produce bile and remove excess glucose","correct":"B","explain":"The kidneys are located in the abdomen, on either side of the vertebral column (spine). Their main functions are: (1) excretion — filtering blood to remove urea (from protein breakdown), excess salts and other metabolic waste; (2) osmoregulation — regulating water and ion balance in the blood; (3) pH regulation — maintaining blood pH ~7.4. The filtrate is processed in nephrons and excess waste is expelled as urine."},{"stem":"What is urea and where is it produced?","A":"A waste product of glucose breakdown, produced in muscle cells during exercise","B":"A nitrogenous waste product formed in the liver from the breakdown of excess amino acids (deamination); transported in the blood to the kidneys for excretion in urine","C":"A salt produced when sodium and chloride are metabolised in body cells","D":"A toxic gas produced by bacteria in the gut and transported to the lungs for excretion","correct":"B","explain":"Urea is produced in the liver by the process of deamination — the removal of amino groups from excess amino acids that cannot be stored. The amino group is converted to ammonia (toxic), which is then combined with CO₂ to form urea (less toxic). Urea enters the blood and is filtered out by the kidneys, concentrated in urine and excreted. Urine is approximately 2–3% urea."},{"stem":"What is negative feedback and why is it important in homeostasis?","A":"A mechanism where a change in a variable causes a response that increases the change further","B":"A mechanism where a change in a variable triggers a corrective response that reverses the original change, returning the variable to its set point","C":"A mechanism where hormones are released at a constant rate regardless of internal conditions","D":"A mechanism where the nervous system overrides hormonal control to maintain homeostasis","correct":"B","explain":"Negative feedback is the fundamental principle of homeostasis. When a variable (e.g. blood glucose, body temperature) deviates from its set point, the deviation itself triggers a response that opposes (negates) the change and returns the variable toward the set point. Examples: high blood glucose → insulin released → glucose lowered; high temperature → sweating/vasodilation → temperature reduced. Without negative feedback, small disturbances would amplify rather than stabilise."},{"stem":"How is fertility treated in people who cannot conceive due to low FSH levels?","A":"By giving injections of insulin to stimulate the ovaries directly","B":"By giving FSH (and sometimes LH) injections to stimulate egg development and ovulation — used in IVF treatment to collect mature eggs","C":"By giving oestrogen alone to restore the menstrual cycle","D":"By giving progesterone injections to trigger ovulation","correct":"B","explain":"FSH stimulates follicle development and egg maturation in the ovaries. People with low FSH levels may not ovulate normally. Fertility treatment involves giving FSH (and sometimes LH) by injection to artificially stimulate follicle development and ovulation. In IVF (in vitro fertilisation), higher doses of FSH are given to stimulate superovulation — producing multiple eggs that are collected, fertilised outside the body, and the resulting embryos transferred to the uterus."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
