<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T8 Exchange and Transport Spark | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T8: Exchange and Transport &mdash; Spark</h1><span class="tier-badge spark">Spark</span></header><main><div class="quiz-meta"><span>20 questions &middot; Exchange and Transport</span><span>Spark: Recall</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"What does surface area to volume ratio (SA:V ratio) measure and why is it important for exchange?","A":"The ratio of the organism's height to its mass — larger organisms have higher SA:V ratios","B":"The ratio of an organism's external surface area to its internal volume — a higher SA:V ratio means more surface available relative to volume for exchange; small organisms have high SA:V ratios and can rely on diffusion alone; large organisms have low SA:V ratios and require specialised exchange surfaces","C":"The total surface area of all cells in the body — larger organisms have more total surface area","D":"The ratio of membrane surface area to cell volume — only relevant at the cellular level","correct":"B","explain":"As organisms increase in size, volume grows faster than surface area (volume ∝ r³, surface area ∝ r²) — SA:V ratio falls. Small organisms (e.g. Amoeba) have high SA:V ratios — sufficient surface area relative to volume for diffusion to supply all cells. Large organisms have low SA:V ratios — diffusion across the body surface cannot supply internal cells quickly enough, requiring specialised exchange surfaces (lungs, gills, villi) and transport systems (circulatory systems)."},{"stem":"What are the features of an efficient exchange surface?","A":"Small surface area, thin membrane, poor blood supply, no ventilation","B":"Large surface area, thin membrane, steep concentration gradient (maintained by blood supply and ventilation), moist surface","C":"Large surface area, thick membrane (for protection), and low blood supply","D":"Small, concentrated surface with very fast diffusion rate to compensate","correct":"B","explain":"Efficient exchange surfaces share these features: (1) large surface area — maximises the number of molecules crossing per unit time; (2) thin — short diffusion distance; (3) steep concentration gradient — maintained by blood supply removing/delivering molecules on one side, and ventilation on the other (in gas exchange surfaces); (4) moist — gases dissolve in water before diffusing through the membrane. Examples: alveoli, villi, fish gills, root hair cells."},{"stem":"Where does gas exchange take place in the lungs?","A":"In the bronchi — the large airways leading to the lungs","B":"In the alveoli — tiny air sacs with very thin walls, large total surface area, and surrounded by a dense capillary network","C":"In the trachea — the main airway connecting the throat to the bronchi","D":"In the bronchioles — the smaller airways branching from the bronchi","correct":"B","explain":"Alveoli are the site of gas exchange in the lungs. They are tiny spherical air sacs at the ends of bronchioles. Features that make them ideal for gas exchange: very thin walls (one cell thick — type I pneumocytes); large total surface area (~70 m² in adult lungs); surrounded by a dense network of pulmonary capillaries; moist inner surface (gases dissolve before diffusing). O₂ diffuses from alveolar air into the blood; CO₂ diffuses from the blood into the alveolar air."},{"stem":"What is the word equation for aerobic respiration?","A":"Glucose + water → carbon dioxide + oxygen + energy","B":"Glucose + oxygen → carbon dioxide + water (+ energy/ATP)","C":"Carbon dioxide + water → glucose + oxygen","D":"Glucose → lactic acid + energy","correct":"B","explain":"Aerobic respiration: glucose + oxygen → carbon dioxide + water (releasing energy/ATP). This occurs in the mitochondria and is the main way cells release energy. It requires a continuous supply of O₂ and glucose, and produces CO₂ and water as waste products. All organisms that use aerobic respiration require an efficient gas exchange and transport system to supply O₂ and remove CO₂."},{"stem":"What is anaerobic respiration in animal cells?","A":"Respiration using carbon dioxide instead of oxygen","B":"Respiration without oxygen — in animal cells, glucose is partially broken down to lactic acid (lactate), releasing a small amount of ATP","C":"Respiration that occurs only in plant cells, producing ethanol","D":"Respiration in the absence of mitochondria, producing water as a by-product","correct":"B","explain":"Anaerobic respiration (animals/humans): glucose → lactic acid (lactate) + small amount of ATP. It occurs when oxygen is insufficient for aerobic respiration (e.g. during intense exercise). It releases far less energy per glucose molecule than aerobic respiration but allows ATP production to continue without oxygen. Lactic acid accumulates in muscles, causing the \"burn\" sensation. It must be converted back to glucose (oxygen debt) when O₂ becomes available again."},{"stem":"What is anaerobic respiration in yeast and plants?","A":"Glucose → lactic acid + ATP (same as animal cells)","B":"Glucose → ethanol + carbon dioxide + small amount of ATP — this process is called fermentation","C":"Glucose → water + carbon dioxide (same as aerobic respiration but without oxygen)","D":"Glucose → glycogen + ATP, for storage in times of low oxygen","correct":"B","explain":"Anaerobic respiration in yeast and plants (fermentation): glucose → ethanol + carbon dioxide + ATP. This is the basis of brewing (yeast ferments sugars in grapes/grain to produce alcohol) and bread-making (CO₂ produced makes dough rise). Like animal anaerobic respiration, it produces far less ATP per glucose than aerobic respiration but allows survival in low-oxygen conditions."},{"stem":"What are the four chambers of the heart?","A":"Left atrium, right atrium, aorta, pulmonary vein","B":"Left atrium, left ventricle, right atrium, right ventricle","C":"Left ventricle, right ventricle, left bronchus, right bronchus","D":"Aorta, vena cava, pulmonary artery, pulmonary vein","correct":"B","explain":"The heart has four chambers: two atria (upper chambers that receive blood) — left atrium (receives oxygenated blood from lungs via pulmonary veins) and right atrium (receives deoxygenated blood from body via vena cava); two ventricles (lower chambers that pump blood out) — left ventricle (pumps oxygenated blood to body via aorta) and right ventricle (pumps deoxygenated blood to lungs via pulmonary artery)."},{"stem":"What is the difference between arteries, veins and capillaries?","A":"Arteries carry blood to the heart; veins carry blood away; capillaries connect them","B":"Arteries carry blood away from the heart (thick muscular walls, high pressure, no valves); veins carry blood back to the heart (thinner walls, low pressure, valves); capillaries are single-cell-thick exchange vessels","C":"Arteries always carry oxygenated blood; veins always carry deoxygenated blood; capillaries carry both","D":"Arteries are found only in the legs; veins are found only in the arms","correct":"B","explain":"Arteries: carry blood away from heart, thick elastic/muscular walls to withstand high pressure, narrow lumen, no valves. Veins: carry blood back to heart, thinner walls, wider lumen, semi-lunar valves to prevent backflow. Capillaries: one cell thick (endothelium only), connects arterioles to venules, site of exchange between blood and tissues (O₂, glucose, CO₂, waste pass across the thin wall). Note: arteries don't always carry oxygenated blood — the pulmonary artery carries deoxygenated blood to the lungs."},{"stem":"What is the function of valves in the heart and veins?","A":"To pump blood by opening and closing rhythmically","B":"To prevent the backflow of blood, ensuring it flows in one direction only","C":"To filter blood and remove waste products","D":"To regulate blood pressure by controlling the diameter of the vessel","correct":"B","explain":"Valves ensure one-way blood flow. In the heart: atrioventricular valves (mitral/bicuspid on left; tricuspid on right) prevent backflow from ventricles to atria; semi-lunar valves (in the aorta and pulmonary artery) prevent backflow from arteries back into ventricles after each heartbeat. In veins: semi-lunar valves prevent blood pooling and flowing backward in low-pressure veins (important in limbs working against gravity)."},{"stem":"What is the role of red blood cells in transporting oxygen?","A":"Red blood cells absorb oxygen by osmosis through their cell membrane","B":"Red blood cells contain haemoglobin — a protein that binds oxygen in the lungs (forming oxyhaemoglobin) and releases it in respiring tissues","C":"Red blood cells produce oxygen by photosynthesis and release it to tissues","D":"Red blood cells carry oxygen dissolved in their cytoplasm, without using any protein","correct":"B","explain":"Red blood cells (erythrocytes) transport oxygen using haemoglobin (Hb) — an iron-containing protein that can carry four O₂ molecules per molecule. In the lungs (high O₂ concentration), O₂ binds to Hb forming oxyhaemoglobin (HbO₂). In tissues (low O₂ concentration), oxyhaemoglobin dissociates, releasing O₂ for aerobic respiration. RBCs are adapted for this: biconcave shape (large SA for O₂ exchange), no nucleus (more room for Hb), flexible (squeeze through capillaries)."},{"stem":"How is carbon dioxide transported in the blood?","A":"Carbon dioxide is carried only on haemoglobin","B":"Most CO₂ (about 70%) is transported as hydrogen carbonate ions (HCO₃⁻) in the plasma; some is dissolved in plasma; a small amount binds to haemoglobin (carbaminohaemoglobin)","C":"Carbon dioxide is transported dissolved only in red blood cells","D":"CO₂ binds permanently to haemoglobin, preventing O₂ from binding","correct":"B","explain":"CO₂ transport: ~70% as HCO₃⁻ (hydrogen carbonate) ions — CO₂ enters red blood cells, combines with water via carbonic anhydrase to form carbonic acid, which dissociates into HCO₃⁻ and H⁺; ~7% dissolved in plasma; ~23% as carbaminohaemoglobin (CO₂ bound to amino groups of Hb). In the lungs, these reactions reverse and CO₂ is exhaled. This efficient multiple-transport system ensures rapid CO₂ removal from tissues."},{"stem":"What is plasma and what does it transport?","A":"Plasma is the solid part of blood that contains red blood cells","B":"Plasma is the liquid component of blood — a watery, yellowish fluid that transports dissolved substances including glucose, amino acids, urea, hormones, CO₂ (as HCO₃⁻), antibodies, and mineral ions","C":"Plasma contains only red and white blood cells — it has no other transport function","D":"Plasma is produced in the kidneys and only carries waste products","correct":"B","explain":"Plasma is the straw-coloured liquid matrix of blood (~55% of total blood volume). It is mostly water (~90%) and transports: dissolved nutrients (glucose, amino acids, fatty acids), hormones, antibodies, waste products (urea, CO₂ as hydrogen carbonate), heat and clotting factors. It is distinct from serum (which lacks clotting factors). Plasma proteins (albumin, globulins, fibrinogen) also help maintain osmotic pressure."},{"stem":"What is coronary heart disease (CHD)?","A":"A condition where the heart produces too many white blood cells","B":"A disease where fatty deposits (plaques) build up in the coronary arteries, narrowing them and reducing blood flow to the heart muscle, potentially causing angina or heart attack","C":"A disease where the heart valves fail to open properly, reducing blood flow through the heart","D":"A condition caused by viral infection of the heart muscle","correct":"B","explain":"Coronary heart disease develops when fatty deposits (atheroma) accumulate in the walls of the coronary arteries (the vessels supplying the heart muscle with blood). This narrows the arteries (atherosclerosis), reducing blood flow and O₂ delivery to the myocardium. Consequences: angina (chest pain on exertion), heart attack (myocardial infarction — if a coronary artery becomes completely blocked). Risk factors include smoking, high cholesterol, high blood pressure, diabetes and obesity."},{"stem":"Name two treatments for coronary heart disease.","A":"Insulin injections and blood transfusions","B":"Lifestyle changes (diet, exercise, stopping smoking); statins (reduce blood cholesterol); antihypertensives; aspirin (antiplatelet); stents (widen narrowed arteries); bypass surgery (using a vessel graft to route blood around the blockage)","C":"Antibiotics and antiviral drugs","D":"Kidney dialysis and hormone replacement therapy","correct":"B","explain":"CHD treatments: (1) Lifestyle — reduced saturated fat, increased exercise, stop smoking; (2) Statins — lower LDL cholesterol (reducing atheroma formation); (3) Antihypertensives — lower blood pressure; (4) Aspirin — antiplatelet effect reduces clot formation; (5) Stents — metal mesh tube inserted into the coronary artery to keep it open; (6) Bypass surgery — vein or artery graft routes blood around blocked sections; (7) Heart transplant in severe cases. Most treatments aim to maintain blood flow to the heart muscle."},{"stem":"What is the double circulatory system?","A":"A system where blood passes through the heart once per complete circuit around the body","B":"A system where blood passes through the heart twice per complete circuit — once through the pulmonary (lungs) circuit and once through the systemic (body) circuit, maintaining high pressure","C":"A system in which two separate hearts pump blood simultaneously","D":"A system where oxygenated and deoxygenated blood are mixed in the heart before being pumped to the body","correct":"B","explain":"Humans (and all mammals/birds) have a double circulation: Circuit 1 — right ventricle → pulmonary artery → lungs → pulmonary veins → left atrium (pulmonary circuit — deoxygenated blood is oxygenated). Circuit 2 — left ventricle → aorta → body tissues → vena cava → right atrium (systemic circuit — oxygenated blood delivers O₂ to tissues). Advantage: blood returns to the heart between circuits, allowing it to be re-pressurised for the high-pressure systemic circuit."},{"stem":"What is the role of platelets and fibrin in blood clotting?","A":"Platelets produce haemoglobin; fibrin transports oxygen to the clotting site","B":"Platelets (cell fragments) clump at the site of a wound; they release clotting factors that trigger a cascade converting fibrinogen → fibrin, which forms a mesh trapping red blood cells and forming a clot that seals the wound","C":"Fibrin dissolves bacteria; platelets produce antibodies to prevent infection at wound sites","D":"Platelets produce thyroxine; fibrin transports platelets to wounds","correct":"B","explain":"When a blood vessel is damaged: (1) platelets aggregate at the wound site (platelet plug); (2) they release chemicals that trigger the clotting cascade; (3) prothrombin → thrombin (enzyme); (4) fibrinogen (soluble plasma protein) → fibrin (insoluble threads); (5) fibrin mesh traps red blood cells → forms a solid blood clot (thrombus). The clot seals the wound, preventing blood loss and pathogen entry. The wound heals beneath the clot."},{"stem":"What is the role of white blood cells in the immune system?","A":"Transporting oxygen around the body","B":"Defending the body against infection — phagocytes engulf and destroy pathogens; lymphocytes produce antibodies","C":"Clotting blood at wound sites","D":"Producing haemoglobin to carry oxygen in the blood","correct":"B","explain":"White blood cells (leucocytes) are the cellular immune defence. Key types: phagocytes (neutrophils, macrophages) — engulf and digest pathogens by phagocytosis (non-specific); lymphocytes — B cells produce specific antibodies; T cells coordinate immune responses and kill infected cells; NK cells destroy virus-infected and cancer cells. Both types respond to infection and provide the body's specific and non-specific defences."},{"stem":"What happens during inhalation (breathing in)?","A":"The diaphragm moves up and the ribcage moves in — increasing lung pressure","B":"The diaphragm contracts and flattens; intercostal muscles contract raising the ribcage; thorax volume increases; pressure in the lungs falls below atmospheric pressure → air flows in","C":"The diaphragm relaxes; the ribcage rises; pressure increases inside the lungs","D":"The alveoli actively pump air inward by contracting their muscular walls","correct":"B","explain":"Inhalation is an active process: (1) the diaphragm (dome-shaped muscle below the lungs) contracts → flattens, moving downward; (2) external intercostal muscles contract → rib cage lifts up and out; (3) thorax volume increases → pressure falls below atmospheric (Boyle's Law: volume ↑ → pressure ↓); (4) air flows in down the pressure gradient through the nose/mouth → trachea → bronchi → bronchioles → alveoli. Exhalation is mostly passive — the muscles relax, volume decreases, pressure rises, air flows out."},{"stem":"What is the role of the left ventricle's thicker muscular wall compared to the right ventricle?","A":"The left ventricle pumps blood only to the lungs — it needs less muscle because the lungs are nearby","B":"The left ventricle pumps oxygenated blood to the entire body (systemic circuit) — much further and at higher pressure than the right ventricle which only pumps blood to the nearby lungs (pulmonary circuit); the thicker wall generates greater force and pressure","C":"The left ventricle has a thicker wall to prevent the heart from collapsing under high pressure","D":"Both ventricles have identical wall thicknesses — they pump with the same force","correct":"B","explain":"The left ventricle has a much thicker muscular wall than the right because it must pump blood around the entire systemic circulation at high pressure (~120 mmHg systolic). The right ventricle only pumps blood the short distance to the lungs at lower pressure (~25 mmHg systolic) — too much pressure would damage the delicate, thin-walled pulmonary capillaries. The difference in wall thickness reflects the difference in work done."},{"stem":"Why is exercise important for maintaining cardiovascular health?","A":"Exercise directly lowers blood glucose by destroying glucose in muscle cells","B":"Regular aerobic exercise strengthens the heart muscle, lowers resting heart rate, improves blood vessel elasticity, reduces LDL cholesterol, lowers blood pressure, and reduces obesity risk — all decreasing the risk of coronary heart disease and stroke","C":"Exercise increases blood viscosity, making the blood more efficient at carrying oxygen","D":"Exercise eliminates all pathogens from the blood, reducing inflammation in blood vessels","correct":"B","explain":"Regular exercise has multiple cardiovascular benefits: (1) cardiac muscle hypertrophy → stronger contractions, higher stroke volume, lower resting heart rate; (2) improved arterial elasticity → lower blood pressure; (3) raises HDL cholesterol, lowers LDL → reduced atheroma formation; (4) reduces obesity → lowers blood pressure, insulin resistance and inflammation; (5) improves glucose tolerance → reduces type 2 diabetes risk (a CVD risk factor). Sedentary lifestyle is an independent risk factor for CHD."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
