<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T7 Homeostasis Inferno | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}

body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}

.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}

.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}

.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}

.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}

.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}

.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}

.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}

@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T7: Homeostasis &mdash; Inferno</h1><span class="tier-badge inferno">Inferno</span></header><main><div class="quiz-meta"><span>20 questions &middot; Homeostasis</span><span>Inferno: Higher</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"The hypothalamus acts as both a sensor and a control centre in thermoregulation. However, peripheral skin thermoreceptors also send information to the hypothalamus. Why is this dual input system advantageous over central sensing alone?","A":"Peripheral receptors are more accurate than central blood temperature sensors","B":"Skin receptors detect rapid changes in external temperature and allow anticipatory thermoregulatory responses before core temperature actually changes — a feedforward component that reduces lag time; central thermoreceptors then provide corrective feedback to fine-tune the response; together they provide both predictive and corrective control","C":"The two receptor types cancel each other out, preventing overreaction to temperature changes","D":"Peripheral receptors only detect pain, not temperature — they do not contribute to thermoregulation","correct":"B","explain":"Pure feedback control (acting only when core temperature deviates) has inherent lag — the core must already be off-target before correction begins. Peripheral cold receptors in the skin fire when external temperature falls, sending signals to the hypothalamus before the blood temperature changes. This feedforward signal triggers preemptive vasoconstriction and early shivering, reducing the core temperature deviation. Central blood temperature sensing (negative feedback) then fine-tunes the response. The dual system combines anticipatory (open-loop) and corrective (closed-loop) control — analogous to engineering control systems."},{"stem":"The GLUT4 glucose transporter is found in muscle and adipose tissue but not in the liver or brain. GLUT4 is normally intracellular; insulin causes it to be inserted into the cell membrane. What is the functional significance of this mechanism?","A":"GLUT4 allows muscle and adipose cells to take up glucose continuously regardless of blood glucose levels","B":"GLUT4 insertion is an insulin-dependent \"gate\" — only when blood glucose is high (insulin released) do muscle and adipose cells rapidly take up glucose; this prevents these tissues from depleting blood glucose during fasting when the brain needs a continuous supply; liver and brain use insulin-independent transporters (GLUT2 and GLUT1/3) for constant access","C":"GLUT4 transports glucose against its concentration gradient, requiring ATP — hence its insulin regulation","D":"GLUT4 is found in all cells but is inactivated by insulin to prevent glucose toxicity","correct":"B","explain":"GLUT4 is a facilitated diffusion transporter sequestered in intracellular vesicles. Insulin binding to its receptor triggers PI3K/Akt signalling → GLUT4 vesicles fuse with the plasma membrane → rapid glucose uptake into muscle (for glycogen/respiration) and adipose (for lipogenesis). In the fasted state, GLUT4 is absent from the membrane — muscle and adipose cannot compete for blood glucose. Brain uses GLUT1/GLUT3 (insulin-independent, always at membrane) — ensuring constant glucose supply. Liver GLUT2 is high-capacity, bidirectional and insulin-independent — allowing liver to monitor and buffer portal glucose levels. This compartmentalisation protects the brain from glucose deprivation."},{"stem":"People with anorexia nervosa develop hypothermia and fine hair growth (lanugo) on their bodies. Explain both phenomena using hormonal and physiological reasoning.","A":"Hypothermia is caused by low blood glucose; lanugo grows to replace lost muscle","B":"Severe caloric restriction → low body fat and reduced metabolic fuel → reduced thyroxine levels (hypothyroidism due to poor nutrition) → lower BMR → reduced heat generation → hypothermia; lanugo (fine vellus hair) growth may be a thermoregulatory adaptation — the body grows an insulating hair layer to conserve heat when normal fat insulation is depleted and metabolic heat output is reduced","C":"Hypothermia results from damaged hypothalamic temperature sensors; lanugo results from excess testosterone","D":"Both are caused by excess cortisol production due to psychological stress","correct":"B","explain":"In severe undernutrition: (1) reduction in T3/T4 (thyroxine) synthesis (limited substrate availability and active downregulation as an energy-conservation response) → suppressed BMR → less metabolic heat → hypothermia; (2) loss of subcutaneous fat (the primary thermal insulator) compounds heat loss; (3) lanugo — the same fine hair coat seen in newborns — may represent a reactivation of an ancestral thermoregulatory response to compensate for fat loss, though its exact mechanism is not fully understood; it regresses with nutritional recovery. Both symptoms resolve with nutritional rehabilitation."},{"stem":"Insulin secretion from beta cells involves a signalling cascade triggered by glucose itself. Outline the mechanism from glucose entry to insulin exocytosis.","A":"Glucose binds to insulin receptors on beta cells and directly triggers exocytosis","B":"Glucose enters beta cells via GLUT2 → metabolised → ATP:ADP ratio rises → ATP-sensitive K⁺ channels close → membrane depolarises → voltage-gated Ca²⁺ channels open → Ca²⁺ influx → insulin-containing granules fuse with membrane and exocytose","C":"Glucose is detected by glucoreceptors on the beta cell surface without entering the cell","D":"High blood glucose increases osmolarity, causing beta cells to shrink and release insulin by mechanical pressure","correct":"B","explain":"This is the canonical glucose-stimulated insulin secretion (GSIS) pathway: (1) glucose enters beta cells via GLUT2 (high-Km, high-capacity transporter — flux proportional to blood glucose); (2) glycolysis + oxidative phosphorylation → ↑ATP/ADP ratio; (3) ATP closes KATP channels (K⁺ channels blocked) → K⁺ accumulates inside → membrane potential depolarises; (4) depolarisation opens L-type voltage-gated Ca²⁺ channels → Ca²⁺ influx; (5) Ca²⁺ triggers insulin-containing secretory granule fusion with plasma membrane → insulin exocytosis. Sulfonylurea diabetes drugs (e.g. glibenclamide) mimic this by directly closing KATP channels regardless of glucose."},{"stem":"The renal threshold for glucose is ~10 mmol/L. Below this level, all filtered glucose is reabsorbed. Why does the renal threshold exist, and why might it be adaptive at this specific level?","A":"The renal threshold prevents the kidneys from filtering glucose at all during normal conditions","B":"SGLT transporters (sodium-glucose cotransporters) in the proximal tubule have a maximum transport capacity (Tmax) — when filtered glucose load exceeds Tmax, glucose spills into urine; the threshold (~10 mmol/L) is set well above normal fasting glucose (~5 mmol/L), providing a safety margin but signalling severe hyperglycaemia when exceeded; glucosuria thus acts as an overflow safety mechanism preventing extremely high blood glucose","C":"The renal threshold was set by evolution to allow glucose excretion during meals","D":"Below the renal threshold, glucose is actively secreted into the filtrate; above it, secretion stops","correct":"B","explain":"SGLT1 and SGLT2 cotransporters in the proximal convoluted tubule actively reabsorb glucose (coupled to Na⁺ gradient). Their combined maximum transport rate (Tmax) corresponds to the renal threshold. Normal blood glucose (3.5–7 mmol/L) is well below Tmax — all filtered glucose is recovered. Only when blood glucose exceeds ~10 mmol/L does the filtered load exceed Tmax → glucose in urine. This is adaptive: it prevents unnecessary glucose loss during normal physiology, while the overflow at extreme hyperglycaemia provides urinary glucose excretion that modestly reduces blood glucose. SGLT2 inhibitors (gliflozins) are diabetes drugs that deliberately lower this threshold to promote glucose excretion."},{"stem":"Type 2 diabetes is characterised by peripheral insulin resistance. At a molecular level, what changes in adipose and muscle cells contribute to this resistance?","A":"Beta cells decrease insulin gene expression in response to obesity","B":"Excess lipid metabolites (diacylglycerol, ceramides, fatty acyl-CoA) from lipid overload activate serine/threonine kinases (PKC, JNK, IKK) that phosphorylate insulin receptor substrate proteins (IRS-1) at inhibitory serine residues — instead of the normal activating tyrosine phosphorylation — disrupting PI3K/Akt signalling and GLUT4 translocation; inflammation via TNF-α and IL-6 from macrophages in adipose tissue compounds the resistance","C":"Insulin receptors are degraded by lysosomes in obese individuals, reducing receptor numbers","D":"Excess glucose directly damages insulin receptors by glycation, inactivating them","correct":"B","explain":"The molecular basis of insulin resistance: obesity → excess fatty acids → accumulation of intracellular lipid metabolites in muscle and adipose; these activate PKCθ, JNK and IKKβ → serine phosphorylation of IRS-1 (at Ser307 and other sites) → IRS-1 cannot be tyrosine-phosphorylated by the insulin receptor → PI3K not activated → Akt not activated → GLUT4 remains intracellular → impaired glucose uptake. Adipose inflammation (macrophage infiltration, TNF-α, IL-6 secretion) further impairs insulin signalling. This creates a feed-forward cycle: resistance → hyperglycaemia → beta cell stress → eventual beta cell failure."},{"stem":"Brown adipose tissue (BAT) contains a protein called uncoupling protein 1 (UCP1) that makes the inner mitochondrial membrane permeable to protons. How does BAT generate heat and why is this mechanism more efficient for heat generation than shivering?","A":"BAT generates heat by burning glucose in glycolysis, releasing lactic acid which releases heat","B":"UCP1 creates a proton leak, bypassing ATP synthase — protons flow down the electrochemical gradient directly through UCP1 as heat rather than driving ATP synthesis; the electron transport chain can run at maximum rate without the ATP back-pressure, releasing all energy as heat; BAT generates heat continuously without the mechanical energy cost of muscle contraction (shivering), and is metabolically efficient for sustained thermogenesis in cold-adapted mammals (including human neonates)","C":"BAT generates heat by increasing the rate of anaerobic respiration, producing heat from lactic acid","D":"UCP1 generates heat by creating futile cycles of ATP synthesis and hydrolysis","correct":"B","explain":"UCP1 (thermogenin) is a proton channel in the inner mitochondrial membrane. Normally, the proton gradient (created by the electron transport chain) can only dissipate through ATP synthase (coupling respiration to ATP production). UCP1 provides an alternative, uncoupled pathway — protons \"leak\" across the membrane, releasing the electrochemical energy entirely as heat. Since ATP back-pressure is removed, the ETC can operate at maximum rate, producing maximum heat. Compared to shivering (mechanically inefficient, causes fatigue, depletes glycogen rapidly), BAT thermogenesis is chemically efficient for sustained heat production. Human neonates rely on BAT (they cannot shiver effectively); adult BAT has attracted interest as an anti-obesity target."},{"stem":"GLP-1 (glucagon-like peptide-1) is an incretin hormone released by gut cells after a meal. It stimulates insulin secretion and suppresses glucagon. GLP-1 receptor agonists are now used to treat type 2 diabetes and obesity. Explain how this class of drug achieves its effects.","A":"GLP-1 agonists mimic insulin directly, replacing the need for pancreatic function","B":"GLP-1 receptor agonists bind pancreatic beta cell GLP-1 receptors → amplify glucose-stimulated insulin secretion; bind alpha cells → suppress glucagon (reducing hepatic glucose output); act on hypothalamus → suppress appetite; slow gastric emptying → reduce postprandial glucose spike; net effect: lower postprandial blood glucose, reduced appetite → weight loss; additionally, GLP-1-mediated insulin release is glucose-dependent (only when glucose is high), reducing hypoglycaemia risk vs sulfonylureas","C":"GLP-1 agonists work by blocking glucagon receptors in the liver, preventing glycogenolysis","D":"GLP-1 agonists increase insulin receptor expression on muscle cells, reversing insulin resistance directly","correct":"B","explain":"GLP-1 is the basis for semaglutide (Ozempic/Wegovy) and related drugs. Mechanism: GLP-1R on beta cells → cAMP/PKA pathway → potentiates GSIS (only when glucose is elevated — \"glucose-dependent\" = low hypoglycaemia risk); GLP-1R on alpha cells → suppresses glucagon → reduces hepatic glucose output; hypothalamic GLP-1R → satiety signalling → reduced caloric intake; delayed gastric emptying → blunts postprandial glucose absorption rate. Clinical result: improved HbA1c, weight loss (5–15%), and emerging cardiovascular benefits. GLP-1 is normally rapidly degraded by DPP-4 enzyme — injectable agonists are engineered to resist DPP-4 degradation."},{"stem":"Positive feedback is generally destabilising and avoided in homeostasis. However, there are physiological examples of useful positive feedback. Give one example and explain why positive feedback is appropriate there.","A":"Positive feedback is never found in physiology — it always leads to system failure","B":"Examples include: oxytocin during childbirth — cervical stretching triggers oxytocin release → stronger contractions → more stretching → more oxytocin — the positive feedback drives labour to completion; blood clotting — activated platelets release chemicals that recruit more platelets → amplifying clot formation rapidly at a wound; nerve action potential depolarisation phase — Na⁺ influx depolarises membrane → more Na⁺ channels open → more influx; all are appropriate because they drive a discrete, all-or-nothing process to completion quickly, then are terminated by a separate mechanism","C":"Positive feedback is used for blood glucose regulation — high glucose stimulates more insulin, which further raises insulin in a cascade","D":"Body temperature regulation uses positive feedback — sweating promotes more sweating to cool the body faster","correct":"B","explain":"Positive feedback amplifies deviations rather than correcting them — normally destabilising. But some physiological events require rapid, definitive completion rather than smooth regulation: (1) Parturition (childbirth) — the cervix must fully dilate; positive feedback ensures contractions escalate to expel the fetus (terminated when the baby is born and stretching ceases); (2) Haemostasis — a wound requires rapid, robust clot formation; positive feedback amplifies platelet aggregation locally (spatially limited, terminated by natural anticoagulants); (3) Ovulation LH surge — oestrogen at high levels switches from negative to positive feedback on LH release, creating the massive LH surge needed to trigger ovulation. All are terminated by removing the initial stimulus or by inhibitory circuits."},{"stem":"A patient has diabetes insipidus — they produce 15–20 litres of dilute urine per day. This can be caused by either (a) damage to the hypothalamus/pituitary preventing ADH release, or (b) kidney collecting ducts unresponsive to ADH. How would you distinguish these two causes using a water deprivation test followed by ADH administration?","A":"Both causes produce identical responses to water deprivation — they cannot be distinguished","B":"Water deprivation test: both types still produce large volumes of dilute urine (cannot concentrate). Then give synthetic ADH (desmopressin): (a) central DI — collecting duct responds normally → urine concentrates → confirms ADH deficiency as the cause; (b) nephrogenic DI — collecting duct still cannot respond → urine remains dilute → confirms receptor/tubule defect as the cause; blood ADH levels can also be measured (high in nephrogenic DI, low in central DI)","C":"Nephrogenic DI patients concentrate urine normally during water deprivation; central DI patients do not","D":"ADH administration causes dangerous hypernatraemia in both types — it cannot be used diagnostically","correct":"B","explain":"Diagnostic approach: (1) Baseline — both produce huge volumes of dilute urine. (2) Water deprivation test — if central DI, endogenous ADH should be released when blood osmolarity rises; if the tubules work, urine would concentrate. In practice, neither type concentrates well under deprivation alone (central DI: no ADH; nephrogenic DI: tubules non-responsive). (3) Desmopressin (synthetic ADH analogue) challenge: Central DI patients have functional collecting ducts → desmopressin → aquaporin-2 inserted → water reabsorption → concentrated urine. Nephrogenic DI patients have non-functional V2 receptors or aquaporins → no response to desmopressin → still dilute urine. Blood ADH assay: elevated in nephrogenic (body produces ADH, tubules don't respond), undetectable in central."},{"stem":"The set point for core body temperature is ~37°C in healthy adults. Why is maintaining temperature precisely at 37°C critical, rather than allowing a wider range?","A":"37°C is the temperature at which the heart pumps most efficiently — other temperatures cause cardiac arrest","B":"Enzyme kinetics are optimal near 37°C for mammalian enzymes (Km and Vmax values evolved at this temperature); above ~40°C, many enzymes begin to irreversibly denature (loss of tertiary structure); below ~35°C, reaction rates fall significantly (Q10 effect) reducing metabolic capacity; precise regulation maximises metabolic efficiency while preventing protein denaturation — a narrow optimal window","C":"37°C prevents all bacterial and viral infections — the temperature is lethal to all pathogens","D":"Below 37°C, DNA replication stops completely; above 37°C, cells undergo apoptosis","correct":"B","explain":"Mammalian enzyme systems co-evolved with body temperature — their kinetic properties (Km, Vmax, Arrhenius activation energy) are optimised near 37°C. Above this, progressive denaturation begins (heat-labile proteins have Tm values only slightly above 37°C). Below it, Q10 effects slow reaction rates (~halving for every 10°C drop) and membrane fluidity decreases. The narrow 36–37.5°C range represents the compromise between: maximum reaction rates (high temperature favourable) and protein stability (low temperature favourable). Fever (up to ~40°C) can be adaptive (speeds immune responses, inhibits some pathogens) but above 41°C protein denaturation becomes dangerous."},{"stem":"The renin-angiotensin-aldosterone system (RAAS) regulates blood volume and blood pressure. How does low blood pressure ultimately lead to increased sodium and water retention by the kidneys?","A":"Low blood pressure directly activates ADH release, which retains water","B":"Low blood pressure → juxtaglomerular cells in the kidney release renin → renin cleaves angiotensinogen (liver) → angiotensin I → ACE (lung) converts to angiotensin II → angiotensin II stimulates adrenal cortex to release aldosterone → aldosterone increases Na⁺ reabsorption in collecting duct → water follows osmotically → blood volume increases → blood pressure rises","C":"Low blood pressure directly causes the renal tubule to reabsorb more water without hormone involvement","D":"Low blood pressure stimulates glucagon release, which causes the liver to release glucose, which osmotically draws water into the blood","correct":"B","explain":"RAAS is a key blood pressure homeostatic pathway: low BP → renal perfusion pressure falls → juxtaglomerular (JG) cells secrete renin; renin (a protease) cleaves plasma angiotensinogen → angiotensin I (10 AA peptide); ACE (angiotensin-converting enzyme) in lung endothelium removes 2 AAs → angiotensin II (8 AA); Ang II → (1) vasoconstriction (raises BP directly); (2) stimulates adrenal cortex → aldosterone; aldosterone → principal cells of collecting duct → upregulates ENaC (Na⁺ channels) and Na⁺/K⁺-ATPase → more Na⁺ reabsorbed → osmotic water retention → blood volume → BP rises. ACE inhibitors and ARBs (common antihypertensives) block this cascade."},{"stem":"A researcher discovers a mutation that makes the KATP channel in pancreatic beta cells permanently closed. Predict the effect on blood glucose regulation and explain whether this would cause hyperglycaemia or hypoglycaemia.","A":"Permanent KATP closure prevents glucose metabolism, causing chronic hyperglycaemia","B":"Permanently closed KATP channels → constant membrane depolarisation → constant Ca²⁺ influx → continuous insulin exocytosis regardless of blood glucose level → chronic hypoglycaemia (dangerous low blood glucose) because insulin is released even during fasting when blood glucose is already low","C":"Permanently closed KATP channels prevent glucose entry into beta cells, so no insulin is produced — hyperglycaemia results","D":"Permanently closed KATP channels have no effect because other channels compensate","correct":"B","explain":"Normal beta cell function: at low glucose → low ATP:ADP → KATP channels open → K⁺ flows out → membrane hyperpolarised → Ca²⁺ channels closed → no insulin. Permanently closed KATP channels → membrane is always depolarised → L-type Ca²⁺ channels are always open (or open very readily) → Ca²⁺ always elevated → continuous insulin secretion regardless of blood glucose. This would produce persistent, severe hypoglycaemia. This is exactly the mechanism of congenital hyperinsulinism (CHI) — a rare neonatal condition caused by gain-of-function mutations in KATP channel subunits (ABCC8, KCNJ11). Treatment involves surgical removal of pancreatic tissue or diazoxide (which opens KATP channels, counteracting the mutation)."},{"stem":"Kidney dialysis removes urea and regulates ion/water balance in patients with kidney failure. Why must the dialysis fluid (dialysate) have the same concentration of glucose and essential ions as normal blood plasma, but zero urea?","A":"Glucose and ions move into the dialysate to correct blood deficiencies; urea stays in the blood","B":"If dialysate were hypotonic in glucose and ions, these would diffuse out of the blood down their concentration gradient, causing dangerous hypoglycaemia and ion depletion; matching plasma concentrations creates zero gradient for glucose and essential ions → they are not lost; dialysate contains zero urea → maximum concentration gradient for urea (blood to dialysate) → urea diffuses out and is removed; the principle is controlled selective diffusion across the dialysis membrane","C":"Glucose and ions must be at higher concentration in dialysate than blood to be actively transported","D":"The dialysate must be sterile water only — all components are added to blood during dialysis","correct":"B","explain":"Dialysis uses a semi-permeable membrane between blood and dialysate. Substances move by diffusion down concentration gradients. If dialysate glucose = plasma glucose (e.g. 5 mmol/L): no gradient → no net glucose transfer → blood glucose unchanged. If dialysate K⁺ = plasma K⁺: no net K⁺ transfer. If dialysate urea = 0 (plasma urea ~25–50 mmol/L in renal failure): maximum concentration gradient → urea diffuses from blood → dialysate → removed. The dialysate composition is precisely engineered to selectively remove waste (urea, creatinine) while preserving essential solutes — mimicking the kidney's discriminating reabsorption but using passive diffusion rather than active transport."},{"stem":"Continuous glucose monitoring (CGM) devices measure interstitial fluid glucose rather than blood glucose directly. Why might interstitial glucose levels lag behind blood glucose levels, and what are the clinical implications?","A":"Interstitial fluid contains more glucose than blood — CGM always overestimates blood glucose","B":"Interstitial glucose must equilibrate across the capillary wall and through interstitial fluid to reach the CGM sensor — this diffusion introduces a lag of 5–15 minutes; during periods of rapid glucose change (eating, exercise, insulin action), interstitial glucose may significantly under- or over-estimate actual blood glucose; clinically, CGM readings may not reliably reflect blood glucose during rapid transitions, requiring calibration with fingerprick blood tests at these moments to avoid insulin dosing errors","C":"CGM devices measure oxygen levels, not glucose — no lag exists because oxygen equilibrates instantly","D":"Interstitial glucose is always identical to blood glucose — the lag is a manufacturing defect","correct":"B","explain":"Glucose must cross the capillary endothelium and diffuse through interstitial fluid to the CGM sensor (which uses amperometric glucose oxidase detection). This equilibration takes 5–15 minutes. Under steady-state conditions, interstitial ≈ blood glucose. But during: (a) rapid postprandial glucose rise — blood glucose rises faster than interstitial → CGM underestimates blood glucose → insulin dose may be underestimated; (b) rapid glucose fall after insulin → CGM overestimates true blood glucose → hypoglycaemia may be missed. Clinical guideline: do not make critical insulin dosing decisions (driving, suspected hypoglycaemia) based on CGM alone during periods of rapid change — confirm with fingerprick. Modern CGMs have algorithms that partially compensate for this physiological lag."},{"stem":"Negative feedback in the HPT axis (hypothalamus-pituitary-thyroid axis) means that high thyroxine suppresses TSH and TRH. Why is this long-loop negative feedback supplemented by ultra-short and short-loop feedback within the hypothalamus and pituitary respectively?","A":"Extra feedback loops amplify thyroxine's effect, making it a positive feedback system overall","B":"Long-loop feedback (T4/T3 → pituitary/hypothalamus) has significant time delay (hormone travel, receptor activation, gene transcription, protein synthesis, release). Ultra-short feedback (TRH suppresses TRH neurones directly) and short-loop feedback (TSH suppresses TRH from hypothalamus) operate on faster timescales, providing fine-grained second-to-second regulation and preventing overshoot before circulating T4/T3 feedback arrives — multi-loop feedback provides rapid correction + long-term set-point maintenance at multiple timescales","C":"The extra feedback loops bypass the pituitary to allow the thyroid to self-regulate independently","D":"Ultra-short and short loops increase TSH production, compensating for long-loop suppression","correct":"B","explain":"A pure long-loop axis (T4 → pituitary → TSH suppressed → less T4) has a lag equal to the time for T4 to travel to pituitary + receptor/gene/protein timescales (~hours). During this lag, TSH might continue releasing, causing overshoot. Short-loop (TSH → hypothalamus, suppresses TRH) and ultra-short (TRH → TRH neurons, auto-suppression) feedbacks are mediated by direct neuropeptide/receptor interactions that operate in minutes. This multi-timescale nested feedback architecture is common in endocrine axes (HPG, HPA also show it) and provides both fast corrective precision and long-term hormonal stability. It also allows the set point to be altered by starvation, stress, etc. without losing dynamic stability."},{"stem":"Some competitive athletes misuse recombinant human growth hormone (rhGH). Apart from muscle effects, explain one mechanism by which hGH administration affects blood glucose homeostasis.","A":"hGH stimulates insulin receptor expression, improving blood glucose regulation","B":"hGH is a counter-regulatory hormone: it stimulates lipolysis (fat breakdown) in adipose tissue, providing fatty acids as an alternative fuel for muscle → muscles use less glucose → blood glucose rises (diabetogenic effect); hGH also directly antagonises insulin signalling in muscle and liver → reduces GLUT4 translocation and glycogen synthesis → further raises blood glucose; prolonged hGH misuse can cause type 2 diabetes-like insulin resistance (\"acromegalic diabetes\")","C":"hGH increases insulin secretion from beta cells, lowering blood glucose","D":"hGH acts only on muscle protein synthesis — it has no effect on blood glucose","correct":"B","explain":"Growth hormone is a key counter-regulatory hormone (alongside glucagon, cortisol, adrenaline). It: (1) stimulates lipolysis in adipose tissue → free fatty acid mobilisation → Randle cycle (glucose-fatty acid cycle) in muscle → reduced glucose oxidation → sparing of blood glucose; (2) directly opposes insulin signalling at post-receptor level in liver and muscle → insulin resistance; (3) these effects become especially problematic in acromegaly (pituitary GH-secreting tumour) where ~25–50% of patients develop glucose intolerance or frank diabetes. The diabetogenic effect of hGH is why stress (which elevates cortisol and GH) raises blood glucose — relevant to surgical/ICU management."},{"stem":"Explain how the countercurrent multiplier system in the loop of Henle enables the kidney to produce hypertonic urine, and why a longer loop of Henle correlates with greater urine-concentrating ability.","A":"The loop of Henle pumps urea into the medulla to create an osmotic gradient; longer loops store more urea","B":"The descending limb is permeable to water (not salt); the ascending limb actively transports NaCl out (impermeable to water) — creating a progressively concentrated medullary interstitium (500–1200 mOsm from cortex to papilla); as filtrate moves through the collecting duct, ADH opens aquaporins → water moves out by osmosis into the hypertonic interstitium → urine concentrates; longer loops extend deeper into the concentrated papilla, exposing more filtrate to a steeper osmotic gradient → greater potential for water reabsorption and more concentrated urine","C":"Longer loops have more active transport pumps, directly removing more urea from the filtrate","D":"The loop of Henle dilutes the filtrate in both limbs; the collecting duct then concentrates it using active transport","correct":"B","explain":"The countercurrent multiplier: (1) Thick ascending limb: Na⁺/K⁺/2Cl⁻ (NKCC2) cotransporters actively transport NaCl into the interstitium (this limb is water-impermeable → no water follows → filtrate becomes hypotonic, interstitium becomes hypertonic); (2) Descending thin limb: highly water-permeable (AQP1) but poorly permeable to solutes → water leaves by osmosis into hypertonic interstitium → filtrate becomes hypotonic; (3) Countercurrent arrangement multiplies the osmotic gradient along the medullary axis to ~1200 mOsm at the tip; (4) Collecting duct: ADH opens AQP2 → water reabsorbed into concentrated interstitium → concentrated urine. Desert animals (kangaroo rat, sand cat) have extremely long loops of Henle → interstitial osmolarity up to 9000 mOsm → near-solid urine. Humans can concentrate to ~1200 mOsm."},{"stem":"A patient receives a drug that blocks all muscarinic acetylcholine receptors (antimuscarinic drug). Predict the effect on thermoregulation and explain your reasoning.","A":"The drug will cause shivering to increase dramatically as parasympathetic inhibition is lost","B":"Antimuscarinic drugs block the parasympathetic/sympathetic cholinergic innervation of sweat glands (which use ACh even though they are sympathetic fibres) → sweating is abolished → evaporative cooling fails → patient cannot dissipate heat effectively in warm conditions → risk of hyperthermia; skin vasodilation (which is also partly cholinergically mediated) may also be impaired; this is the mechanism of anticholinergic hyperthermia seen with atropine poisoning or antipsychotic drugs with antimuscarinic effects","C":"Antimuscarinic drugs increase ADH release, causing water retention that increases plasma volume and enables more heat dissipation","D":"Blocking muscarinic receptors increases shivering efficiency by removing parasympathetic suppression of thermogenesis","correct":"B","explain":"Sweat glands are unusual: they are innervated by sympathetic nerves but the neurotransmitter is ACh (not noradrenaline). ACh binds muscarinic M3 receptors on sweat gland cells → exocytosis of sweat. Antimuscarinic drugs (atropine, some antihistamines, tricyclic antidepressants) block M3 receptors → anhidrosis (inability to sweat). In heat: the body cannot evaporate water → core temperature rises → heat stroke risk. Classic anticholinergic toxidrome includes: hot, dry, flushed skin (vasodilated but no sweat), tachycardia, confusion. This is clinically important in elderly patients on antimuscarinics who are exposed to heat waves — significantly elevated heat mortality risk."},{"stem":"The insulin gene is expressed only in pancreatic beta cells, even though every cell in the body contains the same DNA sequence. Explain how a non-beta cell fails to produce insulin, linking gene regulation to the concept of cell differentiation in homeostasis.","A":"Non-beta cells lack the insulin gene — differentiation involves selective deletion of unnecessary genes","B":"All cells contain the insulin gene, but expression requires beta-cell-specific transcription factors (e.g. PDX-1, NeuroD1, MafA) that bind promoter/enhancer elements of the insulin gene; in non-beta cells, the insulin gene locus is wrapped in heterochromatin (DNA methylation at CpG islands, repressive histone modifications H3K9me3, H3K27me3) making it transcriptionally inaccessible; beta cell differentiation involves epigenetic reprogramming that opens this chromatin, allows transcription factor binding and activates insulin expression — linking epigenetics, transcription factor availability and cell identity to tissue-specific function","C":"Non-beta cells degrade insulin mRNA immediately after transcription using cell-specific ribonucleases","D":"The insulin gene is present in all cells but is only translated in beta cells because beta cells have special ribosomes","correct":"B","explain":"Cell-type-specific gene expression is central to understanding how 200+ cell types with identical genomes have different functions. Insulin gene regulation involves: (1) chromatin accessibility — beta cells remodel chromatin at the insulin locus (via HATs, SWI/SNF chromatin remodellers) to allow transcription factor access; non-beta cells maintain this locus in closed, methylated heterochromatin; (2) transcription factor network — PDX-1 (key beta cell master regulator), MafA, NeuroD1 are expressed specifically in beta cells and cooperatively bind insulin promoter elements; these TFs are absent/repressed in other cell types; (3) consequently, RNA Pol II cannot be recruited in non-beta cells. This explains why forcing PDX-1 expression in liver cells can partially induce insulin expression — the cell identity → chromatin → TF → gene expression axis governs homeostatic specialisation."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
