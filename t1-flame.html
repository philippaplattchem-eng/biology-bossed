<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T1 Cell Biology Flame | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T1: Cell Biology &mdash; Flame</h1><span class="tier-badge flame">Flame</span></header><main><div class="quiz-meta"><span>20 questions &middot; Cell Biology</span><span>Flame: Application</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"A student views a cell through a microscope at ×400 magnification. The image of the cell measures 8 mm wide. What is the actual width of the cell?","A":"3200 mm","B":"0.02 mm","C":"0.002 mm","D":"20 mm","correct":"B","explain":"Actual size = image size ÷ magnification = 8 ÷ 400 = 0.02 mm. To convert to micrometres: 0.02 mm = 20 µm. A common error is to multiply rather than divide — always divide the image size by the magnification to find actual size."},{"stem":"A plant cell is placed in a concentrated sucrose solution. The cell loses water and the cytoplasm pulls away from the cell wall. What is this called?","A":"Turgor","B":"Lysis","C":"Plasmolysis","D":"Crenation","correct":"C","explain":"Plasmolysis occurs when a plant cell is placed in a solution more concentrated (lower water potential) than the cell contents. Water leaves by osmosis, causing the cytoplasm and membrane (the protoplast) to shrink away from the rigid cell wall. The cell is no longer turgid."},{"stem":"Which combination of adaptations makes a red blood cell efficient at transporting oxygen?","A":"Large nucleus to control haemoglobin production; spherical shape to maximise volume","B":"Biconcave disc shape; no nucleus; packed with haemoglobin","C":"Many mitochondria; thick cell wall; large vacuole","D":"Ciliated surface; ability to carry out photosynthesis","correct":"B","explain":"Red blood cells are adapted in three ways: (1) biconcave disc shape increases surface area for oxygen absorption; (2) absence of nucleus maximises space for haemoglobin; (3) high haemoglobin concentration maximises oxygen-carrying capacity. These adaptations explain why red blood cells are excellent oxygen carriers."},{"stem":"Plant cells are placed in distilled water. What will be observed after 30 minutes?","A":"The cells shrink (plasmolysis occurs)","B":"The cells burst, as there is no cell wall","C":"The cells swell and become turgid but do not burst","D":"Nothing — osmosis does not occur in plant cells","correct":"C","explain":"Distilled water has a higher water potential than the cell contents, so water enters by osmosis. The cell membrane pushes against the rigid cell wall, which resists further expansion — this creates turgor pressure. Unlike animal cells, plant cells do not burst because the inextensible cell wall prevents it."},{"stem":"Why do cells in the small intestine sometimes need active transport to absorb glucose from the gut?","A":"Glucose molecules are too large to cross the membrane by diffusion","B":"After most glucose has been absorbed, the concentration inside intestinal cells exceeds that in the gut lumen — diffusion cannot work against a concentration gradient","C":"Active transport is always the only method of glucose absorption","D":"Osmosis blocks glucose diffusion in the small intestine","correct":"B","explain":"Once most glucose has been absorbed from the gut, the remaining concentration in the lumen may be lower than in the intestinal cells. Since diffusion works down a concentration gradient, it cannot continue. Cells use carrier proteins and ATP (active transport) to continue absorbing glucose into the bloodstream against the gradient."},{"stem":"A sperm cell must travel through the female reproductive tract to reach an egg. Which adaptations best suit it for this task?","A":"Large vacuole to store energy reserves; many chloroplasts","B":"Streamlined shape; flagellum (tail); large numbers of mitochondria","C":"Biconcave shape; no nucleus; high haemoglobin content","D":"Cilia on its surface; thick cell wall; large nucleus","correct":"B","explain":"Sperm cells are highly adapted: a streamlined head reduces resistance; the flagellum propels the cell through fluid; large numbers of mitochondria provide ATP for sustained movement. The acrosome (enzyme-containing tip) helps penetrate the egg membrane at fertilisation."},{"stem":"A neurone (nerve cell) has an axon up to 1 metre long. How does this relate to its function?","A":"A long axon increases the cell's surface area for photosynthesis","B":"A long axon allows the cell to transport large quantities of oxygen","C":"A long axon allows electrical impulses to travel over long distances without relay","D":"A long axon stores extra nutrients for the cell","correct":"C","explain":"Nerve cells transmit electrical impulses from one part of the body to another. A long axon means the impulse can travel from the spinal cord to a distant muscle — for example, in the leg — without a junction, which would slow the signal. Nerve cells are a clear example of structure matching function."},{"stem":"A student places potato cylinders in sucrose solutions of different concentrations. After 1 hour in a 0.8 mol/dm³ solution, the mass has decreased significantly. Why?","A":"The sucrose dissolves the potato starch, reducing its mass","B":"Active transport pumps water out of the cells","C":"Water leaves the cells by osmosis, as the external solution has a lower water potential than the cell contents","D":"Glucose diffuses out of the cells down its concentration gradient","correct":"C","explain":"A 0.8 mol/dm³ sucrose solution is more concentrated (lower water potential) than the potato cells' contents. Water moves out of the cells by osmosis, down the water potential gradient, causing the cells to lose mass and become flaccid."},{"stem":"An embryonic stem cell is described as \"pluripotent.\" Which statement best explains this term?","A":"The cell can divide an unlimited number of times","B":"The cell can differentiate into almost any specialised cell type in the body","C":"The cell cannot divide — it is terminally differentiated","D":"The cell is found only in adult bone marrow","correct":"B","explain":"Pluripotent means \"many potentials\" — the cell can differentiate into almost any cell type found in the body. Embryonic stem cells are pluripotent because most of their genes remain switched on. This makes them scientifically and medically valuable, but harvesting them destroys the embryo, which is ethically controversial."},{"stem":"Why does a muscle cell contain far more mitochondria than a fat storage cell?","A":"Muscle cells are larger and therefore need more organelles to fill the space","B":"Muscle cells contract repeatedly and need large amounts of ATP; mitochondria produce ATP by aerobic respiration","C":"Fat storage cells carry out their own energy production using stored triglycerides, without needing mitochondria","D":"Mitochondria prevent muscle cells from accumulating lactic acid during exercise","correct":"B","explain":"Mitochondria are the site of aerobic respiration, which produces ATP. Skeletal muscle cells contract repeatedly and consume ATP rapidly. Cells with high energy demands require more mitochondria. Fat storage cells are metabolically less active and need relatively little ATP, so they contain fewer mitochondria."},{"stem":"A student makes a microscope slide from onion epidermal cells and stains with iodine. Which organelle would she NOT expect to see in these cells?","A":"Cell wall","B":"Vacuole","C":"Chloroplast","D":"Nucleus","correct":"C","explain":"Onion epidermal cells are underground and not exposed to light, so they have no photosynthetic function and contain no chloroplasts. They are colourless. The student would see the cell wall, vacuole and nucleus (stained by iodine). This is a common microscopy investigation in GCSE Biology."},{"stem":"What is the key advantage of using an electron microscope rather than a light microscope to study the internal structure of a mitochondrion?","A":"Electron microscopes are cheaper and simpler to operate","B":"Electron microscopes use visible light, which is safer for delicate specimens","C":"Electron microscopes have far greater resolution, allowing internal membranes (cristae) to be resolved","D":"Electron microscopes can view living cells in real time","correct":"C","explain":"Electron microscopes use electrons with a much shorter wavelength than visible light, giving resolution about 1000× better than light microscopes. This allows subcellular detail to be seen — including the folded inner membrane (cristae) of mitochondria, which is invisible under a light microscope."},{"stem":"A bacterial cell and a liver cell both carry out aerobic respiration. However, only the liver cell contains mitochondria. Where does aerobic respiration occur in the bacterial cell?","A":"In small plasmid-linked organelles","B":"In the nucleus","C":"On and in the cytoplasm, using the cell membrane for the electron transport chain","D":"In chloroplasts","correct":"C","explain":"Bacteria are prokaryotes and lack membrane-bound organelles including mitochondria. Their aerobic respiration reactions occur using the cell membrane (for the electron transport chain) and the cytoplasm. This is consistent with the endosymbiotic theory, which proposes that mitochondria evolved from an engulfed bacterium."},{"stem":"A student adds amylase to a starch solution and tests with iodine every 2 minutes. After 8 minutes, the iodine no longer turns blue-black. What has happened?","A":"The amylase has broken down the iodine","B":"All the starch has been digested to maltose/glucose","C":"The enzyme has been denatured by the starch","D":"The iodine has been absorbed by the amylase","correct":"B","explain":"Amylase catalyses the breakdown of starch into maltose (and then glucose). When no starch remains, iodine stays orange-brown — it only turns blue-black in the presence of starch. The time taken for the colour change to stop is used to measure the rate of enzyme activity."},{"stem":"An enzyme has maximum activity at pH 7. At pH 4, activity falls sharply. At pH 10, activity is also very low. What is the best explanation?","A":"The enzyme needs a neutral temperature to function","B":"Extreme pH values destroy the substrate before it can bind","C":"Deviation from the optimum pH disrupts the bonds maintaining the active site's shape, reducing enzyme-substrate complementarity","D":"pH values above and below 7 increase the kinetic energy of substrate molecules, preventing binding","correct":"C","explain":"Each enzyme has an optimum pH where its active site precisely complements its substrate. Moving away from this optimum alters hydrogen bonds and ionic interactions within the enzyme's tertiary structure, changing the active site shape. The substrate no longer fits as well, reducing catalytic efficiency. Extreme deviations can denature the enzyme irreversibly."},{"stem":"Why is it important for cells to differentiate during embryonic development?","A":"To ensure all cells are identical so the organism functions as one unit","B":"To produce specialised cells that carry out different functions efficiently, enabling complex multicellular life","C":"To reduce the total number of cells in the organism","D":"To prevent stem cells from dividing uncontrollably and forming tumours","correct":"B","explain":"A multicellular organism requires many different cell types — nerve cells for signalling, muscle cells for movement, red blood cells for oxygen transport. Differentiation allows the same DNA to generate cells with very different structures and functions by selectively switching genes on or off."},{"stem":"A photograph shows a cell with an image size of 60 mm. The actual cell is 30 µm long. What is the magnification?","A":"×2","B":"×200","C":"×2000","D":"×0.0005","correct":"C","explain":"Convert units first: 60 mm = 60,000 µm. Magnification = image size ÷ actual size = 60,000 ÷ 30 = ×2000. Always express both measurements in the same unit before dividing — a common error is to mix mm and µm."},{"stem":"A cell divides by mitosis. Which statement correctly describes the daughter cells?","A":"They contain half the chromosome number of the parent cell","B":"They are genetically identical to each other and to the parent cell","C":"They always differentiate immediately after division","D":"They contain twice the DNA of the parent cell","correct":"B","explain":"Before mitosis, DNA replicates so that each daughter cell receives a complete, identical copy of the genome. Both daughter cells are genetically identical to each other and to the parent cell. (Meiosis halves the chromosome number to produce genetically varied gametes for sexual reproduction.)"},{"stem":"An animal cell is placed in a very dilute solution (lower solute concentration than the cell). What will happen?","A":"The cell shrinks, as water leaves by osmosis","B":"The cell swells and may burst, as water enters by osmosis and there is no cell wall to resist expansion","C":"The cell becomes turgid but does not burst, like a plant cell","D":"Nothing happens, as animal cells are not affected by osmosis","correct":"B","explain":"A dilute solution has a higher water potential than the cell contents. Water moves in by osmosis, causing the cell to swell. Unlike plant cells, animal cells lack a rigid cell wall. If the influx of water continues unchecked, the cell may lyse (burst). This is why the body carefully regulates blood plasma concentration (osmoregulation)."},{"stem":"A scientist proposes growing replacement heart muscle cells from stem cells in a laboratory. Which type of stem cell would be most appropriate and why?","A":"Adult muscle stem cells from the patient, because these already produce muscle proteins","B":"Embryonic stem cells, because they are pluripotent and can be directed to differentiate into cardiac muscle cells","C":"Mature red blood cells, because they contain no nucleus and can be reprogrammed easily","D":"Skin stem cells, because they divide more rapidly than other stem cell types","correct":"B","explain":"Embryonic stem cells are pluripotent — they can differentiate into virtually any cell type, including cardiac muscle cells (cardiomyocytes), with the right chemical signals. Adult stem cells are more limited (multipotent). The main challenges are directing differentiation precisely and managing immune rejection if donor cells are used."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
