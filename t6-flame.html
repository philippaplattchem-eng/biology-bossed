<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T6 Plant Biology Flame | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T6: Plant Biology &mdash; Flame</h1><span class="tier-badge flame">Flame</span></header><main><div class="quiz-meta"><span>20 questions &middot; Plant Biology</span><span>Flame: Application</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"A student investigates photosynthesis by measuring the rate of oxygen production from pondweed at different light intensities. The results plateau at high light intensities even when light continues to increase. What is the most likely explanation?","A":"The pondweed has run out of chlorophyll","B":"Another factor — most likely CO₂ concentration or temperature — has become the limiting factor","C":"Oxygen is toxic to the plant at high concentrations, slowing photosynthesis","D":"The light is now too intense and is destroying the photosynthetic enzymes","correct":"B","explain":"When the rate of photosynthesis plateaus despite increasing light intensity, a different factor has become limiting. In this experiment CO₂ concentration or temperature is most likely limiting — the plant cannot increase its photosynthesis rate further until these are increased. This demonstrates Blackman's law of limiting factors: the rate is determined by the factor in shortest supply."},{"stem":"A glasshouse owner wants to maximise crop yield. Which combination of conditions would most effectively increase the rate of photosynthesis?","A":"Low temperature, high CO₂, low light","B":"Optimal temperature (~25–30°C), elevated CO₂ concentration, and high light intensity","C":"High temperature (>40°C), low CO₂, and high light intensity","D":"Optimal temperature, low CO₂, and high light intensity","correct":"B","explain":"To maximise photosynthesis, all three limiting factors must be optimised simultaneously. Elevated CO₂ (commercial glasshouses often enrich to ~1000 ppm vs atmospheric ~420 ppm), high light intensity (supplementary lighting), and optimal temperature for enzyme-catalysed reactions (~25–30°C for most crops). Above ~40°C, photosynthetic enzymes denature, reducing the rate."},{"stem":"A plant is kept in the dark for 48 hours and then given light. A test for starch on a leaf initially shows a negative result. After several hours in light, the test becomes positive. What does this demonstrate?","A":"The leaf absorbed starch from the soil when given light","B":"The leaf was using starch reserves in the dark; photosynthesis in light produced glucose, which was converted to starch for storage","C":"Starch is only produced in leaves when temperatures are high","D":"The negative result shows the leaf was diseased; the positive result shows recovery","correct":"B","explain":"De-starching a plant (keeping it in darkness) removes stored starch by respiration and translocation. When returned to light, photosynthesis resumes and glucose is produced — any excess is converted to insoluble starch for storage in chloroplasts. The iodine starch test on a destarched-then-illuminated leaf demonstrates that photosynthesis produces glucose (converted to starch)."},{"stem":"A student measures the mass of potato cylinders placed in sucrose solutions of different concentrations. At 0.3 mol/dm³ sucrose, the cylinders show no change in mass. What does this tell us?","A":"The potato cells are dead and cannot respond to osmosis","B":"The water potential of the potato cell contents is equal to the water potential of the 0.3 mol/dm³ sucrose solution — this is the isotonic point","C":"Active transport is moving water out of cells to compensate for osmosis","D":"The potato cells have no cell membrane and therefore water cannot move","correct":"B","explain":"When cylinders show no mass change, water is moving equally in and out — the potato cell water potential equals the external solution water potential. This is the isotonic (or iso-osmotic) point. Solutions more dilute than 0.3 mol/dm³ will cause cells to gain mass (water enters by osmosis); more concentrated solutions cause mass loss (water leaves by osmosis)."},{"stem":"A wilting plant is watered. Explain why the plant becomes firm (turgid) again after watering.","A":"Water dissolves minerals in the soil that are absorbed and directly inflate cells","B":"Water enters root hair cells by osmosis (lower water potential in cells than surrounding water), moves through the plant by osmosis, enters leaf cells, and the pressure of water inside vacuoles makes cells turgid and rigid","C":"The plant absorbs water by active transport which requires ATP, restoring cell pressure","D":"Water moves into cells via facilitated diffusion through aquaporins, driven by concentration gradients of glucose","correct":"B","explain":"When soil is moist, the water potential outside root cells is higher than inside (cells have dissolved solutes). Water enters by osmosis. As cells fill with water, the contents push against the cell wall — this is turgor pressure. Turgid cells push against each other, providing mechanical support. Wilting occurs when water loss by transpiration exceeds uptake, reducing turgor."},{"stem":"Leaves have a large surface area, thin structure, and many stomata on the lower surface. How are these features adapted for photosynthesis and gas exchange?","A":"Large SA maximises water loss; thin leaves reduce photosynthesis; stomata on the lower surface prevent gas exchange","B":"Large SA maximises light absorption; thin leaves minimise diffusion distance for CO₂ to reach chloroplasts; lower-surface stomata reduce direct water loss while allowing gas exchange","C":"Large SA increases wind resistance; thin leaves are lighter; stomata on the lower surface absorb rain water","D":"Large SA reduces light absorption by spreading light too thinly; thin leaves are more flexible; stomata position has no effect on water loss","correct":"B","explain":"Leaf adaptations for photosynthesis: (1) large, flat surface area — maximises light absorption by chloroplasts; (2) thin — short diffusion distance for CO₂ from stomata to chloroplasts; (3) stomata mainly on lower epidermis — away from direct sunlight, reducing water evaporation while still allowing gas exchange. Palisade cells near the upper surface are packed with chloroplasts to absorb the most light."},{"stem":"In an experiment, a shoot tip is covered with an opaque cap, while an uncovered shoot of the same age is illuminated from one side. Predict the difference in growth between the two shoots after 48 hours.","A":"Both shoots will bend towards the light at the same rate","B":"The uncapped shoot will bend towards the light due to auxin redistribution; the capped shoot will grow straight because the tip (where auxin is produced) cannot detect light","C":"The capped shoot will bend away from the light; the uncapped shoot will grow straight","D":"Both shoots will grow straight — auxin has no effect on shoot direction","correct":"B","explain":"Auxin is produced in the shoot tip. When light shines from one side, auxin migrates to the shaded side of the tip and moves downward — causing greater cell elongation on the shaded side, bending the shoot towards the light. Capping the tip prevents light detection, so auxin is distributed equally — no differential elongation occurs and the shoot grows straight. This demonstrates that the tip controls phototropism."},{"stem":"A gardener uses a selective weedkiller containing synthetic auxin on a lawn. The broadleaf weeds die but the grass is unaffected. Explain why.","A":"The synthetic auxin is only absorbed by broadleaf plants; grasses cannot absorb it","B":"Synthetic auxins (at high concentrations) cause uncontrolled, disorganised growth in broadleaf plants that kills them; grasses have a different growth pattern or metabolise the auxin quickly, so they are unaffected","C":"Grasses produce antibodies against synthetic auxins; broadleaf plants do not","D":"Synthetic auxins block photosynthesis only in broadleaf plants","correct":"B","explain":"Synthetic auxins (like 2,4-D) mimic natural auxin but cannot be broken down as efficiently. In broadleaf (dicotyledonous) plants, they cause abnormal, rapid growth leading to twisted stems, organ malformation and eventually death. Monocotyledonous plants (grasses and cereals) metabolise or compartmentalise the synthetic auxin quickly and show little effect. This selectivity makes them safe to use on lawns."},{"stem":"A student measures transpiration rate in a plant using a potometer. The rate increases significantly when a fan is turned on. Explain this result.","A":"Wind increases CO₂ delivery to the leaves, speeding up photosynthesis and therefore water use","B":"Wind removes water vapour from around the stomata, increasing the concentration gradient between the humid leaf interior and the drier external air — this increases the rate of diffusion of water vapour out of the stomata","C":"Wind causes stomata to open wider, directly increasing transpiration","D":"Fan-generated air cools the leaf, increasing the solute concentration inside cells and drawing more water in by osmosis","correct":"B","explain":"Transpiration is driven by the diffusion gradient for water vapour between the humid air spaces inside the leaf and the surrounding air. Normally a boundary layer of humid air builds up around the leaf, reducing the gradient. Wind disrupts this boundary layer, maintaining a steep concentration gradient — water vapour diffuses out faster. This is why transpiration rate is higher on windy days."},{"stem":"An experiment grows identical plants in solutions lacking either nitrate ions or magnesium ions. Which symptoms would you expect from each deficiency?","A":"Nitrate deficiency → yellowing leaves; magnesium deficiency → stunted growth","B":"Nitrate deficiency → stunted growth and yellowing; magnesium deficiency → yellowing leaves (chlorosis)","C":"Both deficiencies cause identical symptoms — stunted growth only","D":"Nitrate deficiency → root death; magnesium deficiency → leaf curling","correct":"B","explain":"Nitrate (NO₃⁻) is needed for amino acid/protein synthesis — deficiency causes stunted growth (cannot make structural or enzymatic proteins) plus pale/yellow leaves (insufficient protein for chlorophyll maintenance). Magnesium (Mg²⁺) is a structural component of chlorophyll — deficiency causes yellowing (chlorosis) of leaves specifically. Both affect leaf colour but nitrate deficiency has the broader growth impact."},{"stem":"A gardener notices that plants growing in waterlogged soil show signs of mineral deficiency even though minerals are present. What is the most likely reason?","A":"Excess water dilutes minerals so their concentration is too low for absorption","B":"Waterlogging reduces oxygen availability around roots — without oxygen, root cells cannot carry out aerobic respiration to produce ATP for the active transport of mineral ions","C":"Waterlogging causes the roots to absorb water too fast, pushing minerals back out","D":"Excess water causes root cell membranes to rupture, preventing mineral uptake","correct":"B","explain":"Active transport is required to absorb mineral ions against their concentration gradient. Active transport requires ATP, produced by aerobic respiration in root cells. In waterlogged soil, oxygen is displaced by water — anaerobic conditions mean root cells cannot respire aerobically efficiently, producing insufficient ATP. Without adequate ATP, active transport of minerals fails, leading to deficiency symptoms even when minerals are present in the soil."},{"stem":"A student cuts the stem of a plant and places it in red dye solution. After one hour, a cross-section of the stem shows red dye in a ring of small, thick-walled cells. What does this tell us?","A":"The red dye has been transported via phloem to the leaves","B":"The dye has moved through xylem vessels — the ring of stained cells represents the xylem, which transports water and dissolved substances upward through dead, hollow vessels","C":"The dye was absorbed by all cells equally — the ring shows normal plant cell distribution","D":"The red cells are phloem companion cells responding to the dye by producing pigment","correct":"B","explain":"Xylem vessels are the route for upward water movement (transpiration stream). They form a distinct ring in a cross-section of a dicot stem. The dye travels with the water in the transpiration stream up through the xylem. The stained ring of small, thick-walled cells is characteristic of xylem — their lignified walls appear as the ring. This experiment demonstrates xylem's water-transport function."},{"stem":"Ripe bananas are often stored with unripe ones to speed up ripening. Which plant hormone causes this, and how is it used commercially?","A":"Auxin; it is sprayed on fruit in storage to stimulate enzyme production","B":"Ethene; it is a gas produced by ripe fruit that diffuses to neighbouring fruits and triggers the ripening process — commercially, ethene gas is piped into warehouses or fruit is transported unripe and gassed on arrival","C":"Gibberellin; it is injected into unripe fruits to break down starch into sugar","D":"Abscisic acid; it promotes ripening by triggering programmed cell death in fruit tissue","correct":"B","explain":"Ethene is a gaseous plant hormone that triggers fruit ripening — it stimulates enzymes that break down cell walls (softening), convert starch to sugar (sweetening), and produce volatile flavour compounds. Ripe fruit releases ethene, which ripens nearby fruit (\"one bad apple\" effect). Commercially, bananas are shipped unripe (green) to prevent bruising, then ethene-gassed at destination to ripen uniformly before sale."},{"stem":"A plant is placed on its side in a dark box. After 48 hours, the shoot tip has curved upward and the root tip has curved downward. Which hormones and mechanisms explain this?","A":"Different light intensities cause auxin redistribution","B":"Gravity causes auxin to accumulate on the lower side of both the shoot and root; in the shoot, more auxin causes more elongation on the lower side (shoots are sensitive — growth upward); in the root, the high auxin concentration inhibits elongation on the lower side (roots are highly sensitive to auxin — growth downward)","C":"The shoot grows upward because of phototropism; the root grows downward because of hydrotropism","D":"Auxin accumulates on the upper side in both shoot and root, causing differential growth","correct":"B","explain":"Gravity redistributes auxin to the lower side of both shoot and root. In the shoot tip (lower sensitivity), lower-side auxin stimulates greater elongation — the shoot bends upward (negative gravitropism). In the root tip (high sensitivity), the same high auxin concentration on the lower side inhibits elongation — the upper side elongates more and the root bends downward (positive gravitropism). This is the key distinction: roots are more sensitive to auxin than shoots."},{"stem":"Phloem transport (translocation) moves sugars from source to sink. Give an example of a source and a sink in: (a) a growing seedling in spring; (b) a plant in summer with ripe fruit.","A":"(a) Source = roots; Sink = leaves. (b) Source = fruit; Sink = leaves","B":"(a) Source = germinating seed (releasing stored starch as sugars); Sink = growing shoot tip. (b) Source = leaves (photosynthesising); Sink = developing fruit","C":"(a) Source = shoot tip; Sink = seed. (b) Source = roots; Sink = fruit","D":"Sources and sinks are fixed throughout the plant's life — they do not change","correct":"B","explain":"Sources produce or release sugars; sinks consume or store them. (a) In a germinating seedling, the seed cotyledons (releasing stored starch) are the source; the growing shoot and root tips are sinks. (b) In summer, photosynthesising leaves are the main source; developing fruits (building up sugars and starch) are the main sinks. Sources and sinks can switch depending on season and developmental stage."},{"stem":"A scientist growing plants in a sealed glasshouse notices that photosynthesis rate drops in the afternoon even though light intensity and temperature remain constant. What is the most likely cause?","A":"The plants have used up all their chlorophyll by afternoon","B":"As plants photosynthesize throughout the day, CO₂ concentration in the sealed glasshouse falls — eventually CO₂ becomes the limiting factor, reducing the photosynthesis rate","C":"High afternoon light intensity bleaches the chlorophyll, reducing absorption","D":"The plants switch to anaerobic respiration in the afternoon, producing ethanol that inhibits photosynthesis","correct":"B","explain":"In a sealed glasshouse, plants continuously consume CO₂ for photosynthesis and produce O₂. By afternoon, atmospheric CO₂ has been significantly depleted. Even with adequate light and optimal temperature, CO₂ becomes the limiting factor — the rate of photosynthesis drops. Commercial glasshouses enrich CO₂ to prevent this and maximise yield throughout the day."},{"stem":"Rose black spot reduces the plant's photosynthesis rate. Explain why infected leaves drop early and how this affects the plant.","A":"Leaves drop because the fungus produces auxin that triggers abscission; this helps the plant save energy","B":"Infected areas die and yellow (chlorophyll breaks down), reducing photosynthesis in those leaves; the plant drops affected leaves to limit fungal spread — but significant defoliation leaves fewer photosynthesising leaves, reducing glucose production and weakening the plant","C":"Leaves drop to release spores, helping the fungus spread — this has no effect on plant health","D":"Yellow leaves absorb more light than green leaves, so photosynthesis actually increases before leaves drop","correct":"B","explain":"Rose black spot (Diplocarpon rosae, a fungus) causes black spots followed by yellowing (chloroplast breakdown, loss of chlorophyll) and premature leaf abscission. Dropping infected leaves may limit fungal spread, but severe defoliation reduces the total leaf area available for photosynthesis. Less glucose is produced for growth and respiration. Severely affected plants are weakened and more vulnerable to other stresses."},{"stem":"A student notices that stomata are mostly closed on a hot, dry day even though light intensity is high. Explain this response and its trade-off.","A":"High temperatures directly close stomata by denaturing guard cell enzymes; no trade-off — this is always beneficial","B":"When water is scarce, the plant produces abscisic acid (ABA) which causes guard cells to close stomata — this conserves water and prevents wilting, but also limits CO₂ entry, reducing photosynthesis rate","C":"Strong sunlight causes stomata to close to prevent chlorophyll damage; the trade-off is reduced gas exchange","D":"High temperature causes guard cells to lose potassium ions due to heat; stomata close as a side effect with no adaptive benefit","correct":"B","explain":"Under water stress, plants produce ABA (abscisic acid), which triggers K⁺ loss from guard cells — water follows by osmosis, guard cells lose turgor and stomata close. This prevents dehydration and wilting. The trade-off: closed stomata prevent CO₂ entry, limiting photosynthesis. Plants must balance water conservation against the need for CO₂ — this is the key tension in plant physiology on hot, dry days."},{"stem":"Gibberellins are used commercially to produce larger, seedless grapes. Explain how gibberellins achieve this effect.","A":"Gibberellins suppress fruit development to keep grapes small and firm","B":"Gibberellins promote cell elongation and division in fruit tissue — applied to flowers, they stimulate fruit growth without fertilisation (parthenocarpy), producing seedless fruits; they also increase internode elongation, spreading the bunch to reduce fungal infection","C":"Gibberellins stimulate seed production, which then drives fruit growth","D":"Gibberellins cause stomata to open wider in fruit cells, increasing water uptake and fruit size","correct":"B","explain":"Gibberellins naturally promote stem elongation, seed germination and fruit development. Applied to grape flowers, they: (1) stimulate parthenocarpy — fruit development without fertilisation — producing seedless grapes; (2) promote cell elongation in developing berries, increasing fruit size; (3) increase internode length (stalk elongation), loosening the bunch to improve air circulation and reduce grey mould (Botrytis) infection. Thompson Seedless grapes treated with gibberellins are a major commercial product."},{"stem":"An experiment comparing transpiration rates in sun plants (Helianthus) and shade plants (Oxalis) finds sun plants have a much higher transpiration rate. Give two structural reasons why.","A":"Sun plants have fewer stomata and thicker leaves than shade plants","B":"Sun plants typically have more stomata per unit leaf area, a larger total leaf area, a thinner cuticle, and a higher density of xylem vessels — all of which increase the rate of water loss compared to shade-adapted plants with fewer, smaller features","C":"Sun plants transpire more because they absorb more light, which directly evaporates water from leaf surfaces without involving stomata","D":"Sun plants have a thicker waxy cuticle to protect against water loss, but more stomata to compensate","correct":"B","explain":"Sun plants are adapted for high light environments where water is often available: more stomata (more exit points for water vapour), larger leaf surface area, thinner cuticle (less waterproofing needed when water is plentiful), and higher xylem density (supporting higher water flux). Shade plants in low-light, humid environments need to conserve water and tend to have fewer stomata, thicker cuticles, and smaller leaf area. These structural differences produce the observed difference in transpiration rates."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
