@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T8: Exchange and Transport &mdash; Inferno</h1><span class="tier-badge inferno">Inferno</span></header><main><div class="quiz-meta"><span>20 questions &middot; Exchange and Transport</span><span>Inferno: Higher</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"The oxygen-haemoglobin dissociation curve is sigmoidal (S-shaped) rather than linear. What is the biological significance of the sigmoidal shape?","A":"The sigmoid shape indicates that haemoglobin binds oxygen randomly rather than cooperatively","B":"The sigmoid shape reflects cooperative binding: binding of the first O₂ molecule increases affinity for subsequent molecules (conformational change from T-state to R-state); the flat upper portion means Hb remains nearly saturated even at moderately reduced pO₂ (loading is insensitive to small lung pO₂ fluctuations); the steep middle portion means small drops in tissue pO₂ cause large O₂ release — maximising unloading at tissues; this design simultaneously maximises loading efficiency at lungs and unloading efficiency at tissues","C":"The sigmoid shape is a mathematical artifact of measuring haemoglobin saturation — it has no physiological meaning","D":"The sigmoid curve shows that haemoglobin saturation decreases linearly with oxygen — the S-shape is due to measurement error","correct":"B","explain":"Haemoglobin has four subunits (α₂β₂); binding one O₂ shifts the quaternary structure, increasing O₂ affinity of the remaining subunits (positive cooperativity). Consequences of the sigmoid shape: (1) plateau at high pO₂ (~13 kPa in alveoli) — 97–98% saturation; small fluctuations in alveolar pO₂ don't compromise loading; (2) steep section at tissue pO₂ (~4–5 kPa) — small pO₂ decreases unload proportionally large amounts of O₂; (3) highly active tissues generate more CO₂/heat/H⁺ → Bohr shift → curve shifts right → even more O₂ released at active sites. A hyperbolic (non-cooperative) curve would be far less efficient at tissue unloading."},{"stem":"The Bohr effect describes a rightward shift in the oxygen-haemoglobin dissociation curve in response to increased CO₂ and decreased pH. Explain the molecular mechanism and its physiological consequences.","A":"Increased CO₂ directly blocks O₂ binding sites on haemoglobin, shifting the curve right","B":"CO₂ dissolves in blood → carbonic acid → H⁺ + HCO₃⁻; H⁺ binds to histidine and N-terminal residues of haemoglobin → conformational change toward T-state (lower O₂ affinity) → rightward shift; at active tissues (high CO₂, low pH), haemoglobin releases more O₂ at any given pO₂; at lungs (low CO₂, high pH), the shift reverses, favouring O₂ loading — ensuring targeted delivery of extra O₂ to the most metabolically active tissues","C":"The Bohr effect only operates in red blood cells — it has no effect on tissue O₂ delivery","D":"Increased pH (more alkaline) causes the rightward shift — active tissues are alkaline due to CO₂ production","correct":"B","explain":"CO₂ is produced by aerobic respiration. In RBCs: CO₂ + H₂O → H₂CO₃ → H⁺ + HCO₃⁻ (carbonic anhydrase). H⁺ ions bind to specific amino acid residues (histidine 146β in deoxy-Hb) → stabilise T-state → lower O₂ affinity → Bohr shift. Consequence: working muscle producing CO₂ experiences local acidosis → Hb delivers proportionally more O₂. Also: CO₂ can form carbaminohaemoglobin directly. In lungs: CO₂ is exhaled → pH rises → H⁺ released from Hb → equilibrium shifts to R-state → higher O₂ affinity → efficient loading. The Bohr effect is a physiologically elegant negative feedback — harder-working tissues automatically receive more O₂."},{"stem":"Fetal haemoglobin (HbF) has a higher O₂ affinity than adult haemoglobin (HbA). Explain the structural basis and physiological necessity of this difference.","A":"HbF contains more iron atoms per molecule, allowing it to bind more O₂","B":"HbF has γ subunits replacing the adult β subunits — γ subunits have lower affinity for 2,3-BPG (bisphosphoglycerate, which reduces O₂ affinity in HbA); without effective BPG binding, HbF remains in the high-affinity R-state; this higher affinity means HbF can extract O₂ from maternal HbA across the placenta even when maternal blood pO₂ is only ~30–40 mmHg, ensuring adequate fetal oxygenation","C":"HbF is larger than HbA and has more O₂ binding sites per molecule","D":"HbF is identical to HbA — the difference in affinity is due to fetal blood having lower pH","correct":"B","explain":"HbF: α₂γ₂ (gamma subunits); HbA: α₂β₂. The γ subunit has low affinity for 2,3-BPG (which normally binds the central cavity of deoxy-HbA between β subunits, stabilising the T-state and reducing O₂ affinity). Without BPG binding, HbF favours the R-state. Result: HbF dissociation curve is shifted left relative to HbA — at any given pO₂, HbF is more saturated. At the placenta: maternal blood (HbA) releases O₂ → pO₂ ~40 mmHg → HbF is still ~70% saturated at this pO₂ vs HbA being much less saturated → net transfer of O₂ from mother to fetus. After birth, HbF is gradually replaced by HbA (~6 months)."},{"stem":"Fick's law states: diffusion rate ∝ (SA × concentration gradient × membrane permeability) / distance. Use this to explain why the alveolar-capillary barrier has evolved its specific properties.","A":"Alveolar membranes are thick and impermeable to prevent water loss from the lungs","B":"To maximise diffusion rate: (1) SA is maximised — ~70 m² in adult lungs from ~300 million alveoli, plus flattened type I pneumocytes; (2) distance is minimised — combined alveolar epithelium + capillary endothelium + fused basement membranes ≈ 0.2–0.5 μm; (3) concentration gradient is maintained — ventilation replenishes alveolar O₂ and removes CO₂; perfusion removes O₂ from blood and delivers CO₂; (4) moist surface with surfactant — reduces surface tension (preventing collapse) while maintaining solubility of gases; these adaptations directly address each term in Fick's law","C":"The alveolar membrane is thick to resist the high pressures of the circulatory system","D":"Fick's law only applies to artificial membranes — biological membranes use active transport for gas exchange","correct":"B","explain":"Fick's law is the theoretical framework that alveolar design optimises. Each variable: SA: 300 million alveoli, total ~70 m²; distance: type I pneumocyte (~0.1 μm) + fused basement membrane + capillary endothelial cell (~0.1 μm) = ~0.2–0.5 μm total path; concentration gradient: ventilation/perfusion matching maintains ~13 kPa O₂ in alveoli vs ~5 kPa in venous blood, and ~5 kPa CO₂ in venous blood vs ~5.3 kPa in alveoli; permeability: phospholipid membrane permeable to O₂ and CO₂ (both small, non-polar). Surfactant (dipalmitoylphosphatidylcholine, from type II pneumocytes) prevents alveolar collapse by reducing surface tension — maintaining the large SA."},{"stem":"Sickle cell disease causes red blood cells to deform into crescent shapes under low O₂ conditions. Explain the molecular basis and why sickling is particularly likely in capillaries.","A":"Sickle cells form because haemoglobin S lacks iron, causing cells to deform","B":"Haemoglobin S (HbS) has a valine → glutamic acid substitution at position 6 of the β chain; in deoxy-HbS, the hydrophobic valine creates a sticky patch that causes HbS molecules to polymerise into rigid fibres → distorts RBC into sickle shape; in capillaries, pO₂ is lowest (tissue O₂ extraction) → maximum HbS polymerisation → sickling most likely; sickled cells are rigid, block capillaries, cause infarction, and are destroyed faster than normal RBCs → haemolytic anaemia","C":"Sickle cells form due to abnormal iron accumulation in the cell membrane that makes it rigid","D":"HbS polymerises only when temperature is above 40°C — sickling only occurs during fever","correct":"B","explain":"HbS: Glu6Val (glutamic acid, charged/hydrophilic → valine, nonpolar/hydrophobic) in the β chain. In the deoxy (T-state) conformation, a hydrophobic \"sticky\" patch is exposed on HbS surface. Multiple HbS molecules polymerise into long fibres that distort the RBC membrane. Capillaries: pO₂ lowest (~4–5 kPa) due to O₂ extraction by tissues → most HbS in deoxy form → highest polymerisation/sickling risk. Sickled cells: (1) block capillaries → ischaemic pain/organ damage (vasoocclusive crisis); (2) rigid, fragile → haemolytic anaemia (lifespan 10–20 days vs normal 120 days). Heterozygotes (HbAS) rarely sickle under normal conditions — explains malaria resistance advantage."},{"stem":"Why do patients with heart failure develop pulmonary oedema (fluid accumulation in the lungs), and how does this impair gas exchange?","A":"Heart failure causes the lungs to produce excess mucus, blocking alveoli","B":"Left heart failure → left ventricle cannot pump blood effectively → blood backs up in pulmonary veins → elevated pulmonary venous/capillary pressure → hydrostatic pressure exceeds oncotic pressure → fluid forced out of pulmonary capillaries into alveoli and interstitium (pulmonary oedema); fluid in alveoli increases diffusion distance, dilutes O₂ concentration in alveolar fluid, and reduces surfactant effectiveness → gas exchange severely impaired → acute breathlessness (cardiac dyspnoea)","C":"Heart failure reduces blood pressure so severely that O₂ cannot diffuse from low-pressure blood into tissues","D":"Heart failure causes the diaphragm to weaken, reducing ventilation and causing fluid accumulation from reduced breathing","correct":"B","explain":"Starling forces govern capillary fluid balance: net filtration = hydrostatic pressure − oncotic (colloid osmotic) pressure. Normal pulmonary capillary pressure: ~8–10 mmHg. Left heart failure → reduced LV output → back-pressure → pulmonary capillary pressure rises to >25 mmHg → net filtration into alveoli/interstitium. Alveolar fluid: (1) increases diffusion distance (Fick's law — diffusion ∝ 1/distance); (2) dilutes dissolved O₂; (3) inactivates surfactant → alveolar collapse (reduced SA); (4) reduces ventilation (stiff, wet lungs). Clinically: acute pulmonary oedema presents as severe breathlessness, pink frothy sputum, crackles on auscultation — a medical emergency."},{"stem":"The energy yield of aerobic vs anaerobic respiration differs greatly. Explain, using the electron transport chain, why aerobic respiration produces far more ATP.","A":"Aerobic respiration involves more steps — each step produces one ATP molecule","B":"Glycolysis (both pathways) yields 2 ATP; anaerobic stops here (pyruvate → lactate/ethanol to regenerate NAD⁺); aerobic continues: pyruvate → acetyl-CoA → Krebs cycle yields NADH and FADH₂; these electron carriers donate electrons to the ETC → proteins pump H⁺ across the inner mitochondrial membrane → proton gradient drives ATP synthase (chemiosmosis) → ~32–34 additional ATP per glucose; the ETC (requiring O₂ as the terminal electron acceptor) is responsible for the vast majority of aerobic ATP yield","C":"Aerobic respiration produces more ATP because O₂ is a better \"fuel\" than glucose","D":"The Krebs cycle produces ATP directly — it does not require the ETC or O₂","correct":"B","explain":"ATP accounting per glucose: Glycolysis: 2 ATP (substrate level); Pyruvate oxidation + Krebs cycle: 2 ATP (substrate level) + 8 NADH + 2 FADH₂; ETC: each NADH yields ~2.5 ATP; each FADH₂ yields ~1.5 ATP → 8×2.5 + 2×1.5 = 23 ATP; total aerobic ≈ 30–38 ATP (textbook varies). Anaerobic: 2 ATP total (glycolysis only). The ETC uses O₂ as the terminal electron acceptor: O₂ + 4e⁻ + 4H⁺ → 2H₂O. Without O₂, electrons cannot be offloaded from the ETC → ETC halts → NADH cannot be regenerated → Krebs cycle stops → only glycolysis continues (using substrate-level phosphorylation). NAD⁺ is regenerated by reducing pyruvate to lactate (animals) or ethanol+CO₂ (yeast) — allowing glycolysis to continue despite no ETC activity."},{"stem":"Atherosclerosis progresses through several stages involving inflammation. Explain why atherosclerosis is now considered an inflammatory disease, not just a lipid accumulation problem.","A":"Atherosclerosis is caused purely by passive lipid deposition — inflammation is a secondary bystander effect with no causal role","B":"Endothelial damage → monocyte recruitment → macrophage infiltration → oxidised LDL phagocytosis → foam cell formation; foam cells release pro-inflammatory cytokines (TNF-α, IL-1β, IL-6) → smooth muscle cell migration and proliferation; oxidised LDL activates endothelium → expression of adhesion molecules (ICAM-1, VCAM-1) → more leucocyte recruitment → sustained inflammation; fibrous cap forms around the necrotic core; plaque rupture involves metalloproteinase release by macrophages → inflammation directly destabilises plaques leading to thrombosis","C":"Atherosclerosis inflammation is caused by bacterial infection — statins work as antibiotics","D":"Inflammation in atherosclerosis is protective — it breaks down the plaque and prevents heart attacks","correct":"B","explain":"The inflammatory model of atherosclerosis (Ross's \"response to injury\" hypothesis): (1) endothelial dysfunction (from hypertension, smoking, hyperglycaemia, dyslipidaemia) → increased permeability, monocyte adhesion; (2) sub-endothelial LDL oxidation (oxLDL) → macrophage phagocytosis via scavenger receptors → foam cells (not saturable, continue accumulating lipid); (3) foam cells + T cells form fatty streak → earliest visible lesion; (4) fibrous plaque — smooth muscle cells migrate from media → collagen cap; (5) vulnerable plaque — large necrotic lipid core, thin fibrous cap with active macrophages releasing MMPs that digest the cap; (6) plaque rupture → exposed collagen + tissue factor → thrombus → acute coronary syndrome. CRP (inflammatory marker) predicts CVD risk independently of cholesterol."},{"stem":"During strenuous exercise, cardiac output can increase from 5 L/min to 25 L/min. What physiological mechanisms achieve this 5-fold increase?","A":"The heart simply pumps faster — stroke volume does not change during exercise","B":"(1) Heart rate increases (sympathetic nervous activation → noradrenaline/adrenaline → SA node fires faster → increased chronotropy); (2) stroke volume increases via the Frank-Starling mechanism (greater venous return → increased end-diastolic volume → stretched myocardium → stronger contraction → greater ejection fraction); (3) sympathetic stimulation also increases contractility (inotropy) independently; (4) vasodilation in working muscles reduces afterload, facilitating ejection; redistributed blood flow (vasoconstriction in gut/skin) → more blood directed to muscles","C":"The heart pumps harder only — heart rate does not change significantly during moderate exercise","D":"During exercise, the heart rate triples but stroke volume falls, so net cardiac output is unchanged","correct":"B","explain":"Cardiac output = HR × SV. At rest: ~70 bpm × 70 mL = 4.9 L/min. During maximal exercise (trained athlete): HR can reach 180–200 bpm; SV can reach 120–180 mL → CO = 25–35 L/min. Mechanisms: (1) Sympathetic (via SA node): increases HR (chronotropy) and force of contraction (inotropy — β₁ adrenoreceptors, noradrenaline/adrenaline); (2) Frank-Starling: exercise → increased venous return (muscle pump, respiratory pump) → increased EDV → greater stretch → Starling mechanism → more force → higher SV; (3) reduced TPR (peripheral vasodilation in working muscles) → reduced afterload → more complete ejection; (4) increased vagal withdrawal (parasympathetic withdrawal also raises HR). Distribution shifts: blood redistributed from gut, kidneys, skin → working muscles and heart."},{"stem":"Carbon monoxide (CO) from cigarette smoke competes with O₂ for haemoglobin binding. CO has ~200× higher affinity for Hb than O₂. Explain two mechanisms by which CO poisoning impairs O₂ delivery beyond simply reducing binding sites.","A":"CO causes haemoglobin to release all O₂ permanently, converting it to carboxyhaemoglobin permanently","B":"(1) CO occupies O₂ binding sites (forming carboxyhaemoglobin — HbCO) reducing functional Hb; (2) CO binding shifts the dissociation curve leftward (increases affinity for remaining O₂ on the same molecule → Haldane effect) — so remaining binding sites release less O₂ at tissue pO₂ values; (3) CO also binds cytochrome c oxidase in the ETC, directly inhibiting mitochondrial respiration in tissues; combined effects: less O₂ loaded AND less O₂ unloaded AND direct cellular respiration inhibition → severe cellular hypoxia even when pO₂ appears adequate","C":"CO reacts with O₂ in the blood to form CO₂, reducing available O₂ without affecting haemoglobin","D":"CO increases blood viscosity, slowing delivery of O₂ to tissues by reducing blood flow velocity","correct":"B","explain":"Mechanisms of CO toxicity: (1) Haemoglobin competition: CO binds Hb at the same Fe²⁺ site as O₂, forming HbCO (cherry-red colour), reducing O₂-carrying capacity. (2) Haldane effect: CO bound to one subunit increases O₂ affinity of remaining subunits (allosteric T→R shift, analogous to Bohr effect in reverse) → dissociation curve shifts left → O₂ released less readily at tissues → compounding the capacity reduction with reduced unloading efficiency. (3) Intracellular: CO binds cytochrome oxidase (Complex IV of ETC) → blocks electron transfer to O₂ → ETC halts → ATP synthesis fails → cellular energy failure. This triple mechanism explains why CO toxicity at tissue level exceeds what the % HbCO alone predicts."},{"stem":"In capillary beds, the balance of Starling forces determines whether fluid moves out of or into capillaries at different points. Explain why fluid moves OUT at the arterial end and BACK IN at the venous end of a capillary.","A":"Fluid moves in and out of capillaries by active transport, not pressure differences","B":"At the arterial end: high hydrostatic pressure (~35 mmHg) from blood pressure exceeds oncotic pressure (~25 mmHg) of plasma proteins → net outward filtration → fluid enters interstitium. At the venous end: hydrostatic pressure has fallen (~15 mmHg, due to resistance along capillary) → oncotic pressure (~25 mmHg) now exceeds hydrostatic → net inward reabsorption → most filtered fluid returns to capillary. Any excess is drained by lymph vessels. This exchange delivers O₂/glucose to tissue fluid and retrieves CO₂/waste.","C":"Fluid moves out at both ends of the capillary — the excess is removed entirely by the lymphatic system","D":"At the arterial end, negative pressure draws fluid in; at the venous end, positive pressure forces it out","correct":"B","explain":"Starling's hypothesis (revised): Net filtration pressure = (Pc − Pi) − (πc − πi), where Pc = capillary hydrostatic, Pi = interstitial hydrostatic, πc = plasma oncotic, πi = interstitial oncotic. Arterial end: Pc high (~35 mmHg) → outward force dominates → filtration → tissue fluid formed. Venous end: Pc fallen (~15 mmHg) → oncotic dominates → reabsorption. Net: ~90% filtered fluid is reabsorbed; ~10% enters lymphatics. Plasma proteins (albumin, globulins — cannot cross the capillary wall) create the oncotic pressure that draws fluid back. Hypoproteinaemia (e.g. malnutrition, liver disease) → reduced oncotic pressure → oedema from excess filtration without sufficient reabsorption."},{"stem":"Some elite athletes have arterial pO₂ values that actually fall during maximal exercise (exercise-induced arterial hypoxaemia, EIAH). Explain why this might occur despite maximal ventilation.","A":"At maximal exercise, ventilation shuts down to conserve energy — O₂ falls as a result","B":"During maximal exercise, cardiac output is extremely high → blood passes through pulmonary capillaries very rapidly (transit time may fall from normal ~0.75 s to <0.25 s); at rest, complete equilibration of alveolar pO₂ to capillary blood takes ~0.25 s — but at very high cardiac output, blood may exit before complete equilibration (diffusion-limited exchange); also, plasma expansion from training reduces haemoglobin concentration; ventilation may not increase proportionally to metabolic demand at extreme intensities; combined → arterial pO₂ falls despite adequate ventilation","C":"Elite athletes produce too much CO₂ which displaces O₂ from all haemoglobin binding sites","D":"EIAH only occurs because athletes breathe through their nose, restricting airflow — it would not occur with mouth breathing","correct":"B","explain":"Normally at rest, pulmonary capillary transit time is ~0.75 s; O₂ equilibration takes ~0.25 s — plenty of reserve. During maximal exercise in highly trained athletes: cardiac output reaches 25–35 L/min; transit time can fall to <0.3 s; at very high diffusion demand, time may be insufficient for complete equilibration (diffusion-limited, not perfusion-limited exchange). Additionally: (1) plasma volume expansion in trained athletes → dilution anaemia (lower [Hb]); (2) elevated alveolar pCO₂ + Bohr shift; (3) ventilatory limitation (breathing frequency, dead space inefficiency) at extreme intensities. EIAH affects ~50% of elite endurance athletes and actually limits their maximal O₂ uptake — their lungs are the bottleneck, not their hearts or muscles."},{"stem":"The lymphatic system is sometimes called the \"second circulatory system.\" Explain how it relates to the blood circulatory system and what would happen if lymphatic drainage failed.","A":"The lymphatic system circulates oxygenated blood independently of the venous system","B":"The lymphatic system collects the ~10% of capillary filtrate not reabsorbed by venous end Starling forces → transports it as lymph through lymph vessels → returns it to venous circulation (via thoracic duct into left subclavian vein); lymphatics also absorb dietary fat (chylomicrons) from the gut. If lymphatic drainage failed: interstitial fluid would accumulate progressively → severe oedema; proteins leaking from capillaries would not be returned → plasma oncotic pressure falls → worsens oedema; pathogens normally surveilled in lymph nodes would spread unchecked","C":"The lymphatic system only functions during infection — it has no role in normal fluid balance","D":"Lymphatic failure causes blood pressure to fall because lymph normally boosts blood volume","correct":"B","explain":"Normal fluid balance: ~20 L/day filtered from capillaries; ~18 L reabsorbed at venous end; ~2 L enters lymphatics → returned to venous blood. Lymph also carries: absorbed dietary lipids (as chylomicrons from lacteals in intestinal villi), large proteins that crossed capillary walls, immune cells (lymphocytes). Lymphatic failure (e.g. lymphedema from filariasis — parasitic worm blockage; or post-cancer surgery removal of nodes) → protein-rich fluid accumulates in interstitium → pitting oedema → fibrosis → eventually \"non-pitting\" brawny oedema. The failure to return proteins is self-worsening: lower plasma oncotic pressure → more capillary filtration → more accumulation. Elephantiasis (extreme lymphedema from filarial worms) is a dramatic example."},{"stem":"Explain why the human heart has an intrinsic pacemaker (sino-atrial node) that generates spontaneous electrical activity, rather than relying entirely on nervous input.","A":"The SA node compensates for the fact that nerves cannot reach the heart","B":"The SA node's intrinsic automaticity (ability to spontaneously depolarise) ensures the heart continues beating even if all nervous input is lost — vital for survival (cardiac transplants, which sever all nerves, still beat because the SA node is intact); autonomic nervous system (sympathetic/parasympathetic via vagus) modulates the rate UP or DOWN from this intrinsic baseline (~60–100 bpm) but doesn't initiate beating; this provides robustness: the heart cannot stop due to nervous failure, though rate can be regulated rapidly","C":"The SA node is needed because the heart is too large for nerves to coordinate simultaneously","D":"Intrinsic pacemaker activity evolved to compensate for the slow speed of electrical signals in cardiac muscle","correct":"B","explain":"The SA node contains autorhythmic cells with \"funny current\" (If, mixed Na⁺/K⁺ inward current) that spontaneously depolarises the membrane from ~-60 mV to threshold ~-40 mV → action potential → excitation spreads through atria → AV node → bundle of His → Purkinje fibres → ventricles. This intrinsic 60–100 bpm rate is modulated: (1) Parasympathetic (vagus, ACh on M2 receptors) → increased K⁺ conductance → slower depolarisation → bradycardia; (2) Sympathetic (noradrenaline on β₁ receptors) → enhanced If and Ca²⁺ current → faster depolarisation → tachycardia. Transplanted hearts (denervated) beat at intrinsic ~100 bpm and respond poorly to exercise initially (no sympathetic acceleration) but over time re-innervation partially occurs."},{"stem":"Describe how respiratory acidosis develops and how the body compensates over short and long timescales.","A":"Respiratory acidosis is caused by excess breathing — CO₂ falls and blood becomes acidic","B":"Respiratory acidosis: hypoventilation (or lung disease) → CO₂ accumulates in blood → CO₂ + H₂O → H₂CO₃ → H⁺ + HCO₃⁻ → blood pH falls (acidosis). Short-term (minutes): peripheral/central chemoreceptors detect ↑PCO₂ and ↓pH → increased breathing rate (drives off CO₂); buffers (haemoglobin, bicarbonate, phosphate) bind H⁺. Long-term (hours–days): kidneys compensate — increase H⁺ excretion in urine and HCO₃⁻ reabsorption → blood pH rises back toward normal (metabolic compensation); net result: elevated PCO₂ with near-normal pH (compensated respiratory acidosis)","C":"Respiratory acidosis develops when blood O₂ falls — compensation involves increased O₂ consumption","D":"Respiratory acidosis cannot be compensated — it leads to irreversible coma within minutes","correct":"B","explain":"CO₂ is the primary driver of blood pH (carbonic acid/bicarbonate buffer system dominates plasma buffering). Respiratory acidosis: primary insult is ↑PCO₂ → ↓pH. Immediate compensation: ventilation increases (PCO₂ detected by central chemoreceptors in medulla oblongata and peripheral in carotid/aortic bodies). Chemical buffering: H⁺ buffered by Hb, proteins and phosphates (minutes). Renal compensation: intercalated cells in collecting duct increase H⁺-ATPase and H⁺-K⁺-ATPase → more H⁺ secreted → HCO₃⁻ retained → plasma [HCO₃⁻] rises → partially compensates pH; takes 2–5 days for full renal compensation. Arterial blood gas interpretation: Respiratory acidosis: ↑PCO₂, ↓pH; Compensated: ↑PCO₂, ↑HCO₃⁻, pH approaching normal."},{"stem":"Heart muscle (cardiac myocytes) is striated like skeletal muscle but has properties that prevent tetanic contraction. Why is tetanic (sustained) contraction absolutely lethal in the heart, and what prevents it?","A":"Tetanus in the heart is harmless — the heart naturally undergoes tetanic contraction during exercise","B":"Tetanic contraction would prevent ventricular filling (diastole) — the heart cannot pump without relaxing to fill; a tetanic heart has no cardiac output → immediate cardiac arrest. Prevention: cardiac action potentials have a very long refractory period (~200–250 ms = duration of systole); during this period, the membrane cannot be re-stimulated regardless of stimulus; the plateau phase of the cardiac AP (caused by slow L-type Ca²⁺ channel inactivation) extends the AP duration to match contraction duration, ensuring the muscle is mechanically relaxing before it can be re-stimulated","C":"Cardiac tetanus is prevented by very weak electrical signals that cannot stimulate repeated contractions","D":"The heart has no Ca²⁺ channels, so it cannot enter tetanic contraction","correct":"B","explain":"Skeletal muscle AP: short (~2 ms); refractory period: short; summation and tetanus possible (desired for sustained force). Cardiac muscle AP: long (~200–300 ms) with plateau phase (maintained by L-type Ca²⁺ channels balanced by delayed rectifier K⁺ channels); absolute refractory period covers nearly the entire contraction period. Physiological consequence: the heart cannot be re-stimulated until it has almost completely relaxed → ventricular filling (diastole) is preserved → cardiac output maintained. If the refractory period were short (as in cardiac diseases like Brugada syndrome, long-QT syndrome) → R-on-T phenomenon → re-entry arrhythmias → ventricular fibrillation → no coordinated pumping → fatal."},{"stem":"A patient taking beta-blockers has a lower maximum heart rate during exercise. Explain the mechanism and why beta-blockers are prescribed for hypertension.","A":"Beta-blockers increase the sensitivity of the SA node to parasympathetic signals, slowing the heart","B":"Beta-blockers competitively block β₁ adrenoreceptors on SA node and ventricular myocytes; adrenaline and noradrenaline cannot bind → cannot increase heart rate (chronotropy) or force (inotropy); resting HR falls (vagal tone dominates); maximum exercise HR is limited; reduced HR and contractility → reduced cardiac output and reduced myocardial O₂ demand; lower cardiac output → lower blood pressure (BP = CO × TPR); also reduce renin secretion from kidneys → less angiotensin II → less aldosterone → less Na⁺/water retention → lower blood volume → lower BP","C":"Beta-blockers work by dilating peripheral blood vessels, reducing the load on the heart","D":"Beta-blockers block pain receptors in the heart, reducing hypertension by preventing angina","correct":"B","explain":"β₁-adrenoreceptors mediate sympathetic stimulation of the heart. Beta-blockers (atenolol, bisoprolol, metoprolol): competitive antagonists at β₁ → block adrenaline/noradrenaline effects. Cardiac effects: ↓HR (chronotropy: slowed If, slower SA node depolarisation); ↓contractility (inotropy: less Ca²⁺ mobilisation); ↓cardiac output. BP effects: BP = CO × TPR → ↓CO → ↓BP (short-term); long-term: also ↓renin release from juxtaglomerular cells (β₁ on JG cells) → ↓angiotensin II → ↓aldosterone → ↓Na⁺ reabsorption → ↓blood volume → ↓BP. Clinical uses: hypertension, angina (↓O₂ demand), post-MI, heart failure, certain arrhythmias. Side effect: exercise intolerance (reduced maximum HR limits aerobic capacity)."},{"stem":"Explain why divers who ascend too quickly from depth develop decompression sickness (\"the bends\") and relate this to gas solubility and exchange physiology.","A":"Rapid ascent causes water in the blood to evaporate, forming water vapour bubbles","B":"At depth, high partial pressure of N₂ causes more N₂ to dissolve in blood and tissues (Henry's Law: gas solubility ∝ pressure); on rapid ascent, pressure falls quickly — N₂ comes out of solution faster than it can be transported to lungs for exhalation → N₂ forms bubbles in tissues and blood; bubbles in joints (pain — \"the bends\"), spinal cord (paralysis), coronary vessels (infarction) and cerebral vessels (stroke); treatment: hyperbaric oxygen chamber (re-compresses tissues, forces N₂ back into solution, then slow controlled decompression)","C":"Rapid ascent causes haemoglobin to release O₂ too quickly, causing O₂ toxicity in the brain","D":"Decompression sickness is caused by CO₂ accumulating in blood — exhaling CO₂ quickly on ascent prevents it","correct":"B","explain":"Henry's Law: at equilibrium, dissolved gas concentration ∝ partial pressure. At 30 m depth: total pressure ~4 atm; pN₂ ~3 atm → blood/tissues dissolve ~4× normal N₂. On slow ascent, N₂ diffuses from tissues → blood → alveoli → exhaled — the normal decompression procedure. On rapid ascent: pressure falls faster than N₂ can diffuse out → supersaturation → bubble nucleation in tissues. Gas bubbles: (1) mechanical — compress nerves (pain, neurological damage); (2) endothelial damage → platelet activation → thrombus; (3) block microvascular flow. Treatment: 100% O₂ breathing (speeds N₂ washout by raising pO₂, maintaining N₂ gradient) + recompression in hyperbaric chamber → gradual controlled decompression (often 2,4,6,10 m decompression stops)."},{"stem":"Why do the bronchioles (but not the trachea or bronchi) lack cartilage in their walls, and what clinical consequence does this have in asthma?","A":"Bronchioles lack cartilage because they are too small for cartilage to form — this is a developmental constraint with no clinical significance","B":"Cartilage provides structural rigidity in larger airways (trachea, bronchi) to prevent collapse under negative inspiratory pressure; bronchioles are small enough and embedded in lung parenchyma that elastic recoil and surrounding tissue support keeps them open; lacking rigid cartilage, bronchioles are patent (or collapsed) based on smooth muscle tone; in asthma, smooth muscle hyperresponsiveness → bronchoconstriction → bronchiole lumen narrows dramatically → airflow resistance increases → wheeze, air trapping, hyperinflation; bronchodilators (β₂ agonists) relax smooth muscle","C":"Bronchioles lack cartilage to allow them to stretch during deep inhalation — cartilage would prevent expansion","D":"Bronchioles do contain cartilage — only the alveoli lack structural support","correct":"B","explain":"Airway anatomy: Trachea → main bronchi → lobar bronchi → segmental bronchi → bronchioles. Cartilage disappears at the level of bronchioles (<1 mm diameter). Bronchioles are supported by their attachment to alveolar walls (interdependence — surrounding elastic tissue holds them open during inspiration). Smooth muscle in bronchiole walls controls luminal diameter. Asthma: trigger (allergen, cold air, exercise, infection) → mast cell degranulation → histamine, leukotrienes → smooth muscle contraction (immediate) + mucus secretion + late-phase inflammation; without rigid cartilage, bronchiole lumens narrow dramatically (Poiseuille's law: resistance ∝ 1/r⁴ — halving radius increases resistance 16-fold) → expiratory airflow limitation → wheeze → gas trapping → hyperinflated \"barrel chest.\" β₂ agonists (salbutamol) → adenylyl cyclase → cAMP → PKA → smooth muscle relaxation → bronchodilation."},{"stem":"Evaluate the relative effectiveness of heart transplantation vs mechanical ventricular assist devices (VADs) for end-stage heart failure, relating to the physiology of cardiac function.","A":"Heart transplants are always superior to VADs — VADs are only used as a last resort because they don't work","B":"Heart transplant: replaces failed heart with donor organ; can restore near-normal cardiac output and long-term quality of life; limited by donor organ shortage, rejection (immunosuppression required → infection risk), and denervation (transplanted heart lacks autonomic innervation → fixed HR response, poor exercise adaptation initially); VADs: mechanical pumps that augment or replace ventricular pumping; no rejection; always available; can serve as bridge to transplant or destination therapy; limitations: infection risk (transcutaneous driveline), stroke risk (thromboembolism), mechanical failure, patient remains tethered to power source; physiologically, VADs provide near-normal cardiac output but lack baroreflex sensitivity and the nuanced preload/afterload matching of a healthy heart","C":"VADs are always superior because they never fail and do not require immunosuppression","D":"Neither treatment works for heart failure — only lifestyle modification can treat end-stage heart failure","correct":"B","explain":"End-stage heart failure = heart cannot maintain adequate CO despite maximal medical therapy. Transplant: completely replaces myocardium; 5-year survival ~75%; quality of life generally excellent; limitation — only ~3500 donor hearts available per year in the US vs >100,000 patients who might benefit; chronic immunosuppression required (risk of infection, malignancy, renal failure). VADs: (1) Bridge to transplant — maintains perfusion while awaiting donor; (2) Bridge to recovery — some myopathies recover; (3) Destination therapy — permanent for patients ineligible for transplant. Modern left VADs (HeartMate 3 continuous flow device): 2-year survival approaching transplant outcomes; issues include stroke, GI bleeding (from altered pulse pressure), infection. Physiologically, VADs cannot replicate the natural cardiac output response to preload (Starling mechanism) or autonomic HR control — fixed flow in some devices — but remain life-saving alternatives when transplant is unavailable."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
