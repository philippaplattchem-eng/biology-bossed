<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T6 Plant Biology Inferno | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}

.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}

.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}

@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T6: Plant Biology &mdash; Inferno</h1><span class="tier-badge inferno">Inferno</span></header><main><div class="quiz-meta"><span>20 questions &middot; Plant Biology</span><span>Inferno: Higher</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"The light compensation point is where the rate of photosynthesis equals the rate of respiration. A shade-adapted plant has a lower light compensation point than a sun plant. What is the adaptive significance of this?","A":"Shade plants must respire faster to survive in low light — a lower compensation point means higher respiration","B":"A low compensation point means the shade plant achieves net carbon gain at lower light intensities — in a forest understorey, this allows it to grow and reproduce in conditions that would starve a sun plant","C":"A lower compensation point means the shade plant photosynthesises faster than sun plants at all light levels","D":"Sun plants have a higher compensation point because they are less efficient at photosynthesis","correct":"B","explain":"At the compensation point, all photosynthetic carbon is used by respiration — no net growth. Below it, the plant is losing carbon mass. Shade plants achieve this balance at low light intensity (low compensation point) by: lower respiration rates, more efficient chlorophyll use (more chlorophyll b relative to a, absorbing green/yellow wavelengths), and larger, thinner leaves. This enables net carbon gain in light levels where sun plants would show net carbon loss — a critical adaptation for understorey survival."},{"stem":"C4 plants (e.g. maize) have a biochemical adaptation that allows them to concentrate CO₂ in bundle sheath cells before it enters the Calvin cycle. What advantage does this give over C3 plants in hot, dry climates?","A":"C4 plants photosynthesize faster at all temperatures than C3 plants","B":"By concentrating CO₂ near RuBisCO, C4 plants suppress photorespiration — the wasteful oxygenase reaction of RuBisCO that increases when CO₂:O₂ ratio falls in closed-stomata conditions during hot days","C":"C4 plants do not require light for photosynthesis — they can fix CO₂ in darkness","D":"C4 plants have more chloroplasts per cell, compensating for lower CO₂ availability","correct":"B","explain":"RuBisCO can bind O₂ instead of CO₂ (photorespiration), wasting fixed carbon. This increases in hot, dry conditions when stomata close to conserve water, reducing internal CO₂ and raising O₂:CO₂ ratio. C4 plants use a spatial separation: mesophyll cells fix CO₂ into 4-carbon acids (hence C4) using PEP carboxylase (high CO₂ affinity, no oxygenase activity), then release concentrated CO₂ in bundle sheath cells where RuBisCO operates. This suppresses photorespiration, giving C4 plants superior water use efficiency and yield in high-temperature, high-light environments."},{"stem":"In a Venus flytrap, rapid leaf closure occurs within 0.1 seconds of stimulation — far faster than auxin-mediated responses. Proposed mechanisms include action potentials and rapid turgor changes. What does this suggest about the generality of auxin as a signalling molecule in plants?","A":"It confirms auxin is responsible for all rapid plant movements including the Venus flytrap","B":"It shows plants have evolved multiple signalling mechanisms beyond auxin — electrical signalling (action potentials) and hydraulic signalling can mediate rapid responses, while auxin is better suited to slower, developmental growth responses over hours or days","C":"It proves Venus flytraps are not true plants because they use animal-like nerve signals","D":"Auxin is the signal but it travels faster in carnivorous plants than in other species","correct":"B","explain":"Auxin-mediated responses involve gene transcription changes and cell elongation — occurring over minutes to hours. Trap closure in 0.1 s is orders of magnitude faster. Research shows mechanosensory trigger hairs generate action potentials (electrical signals propagated via plasmodesmata), causing rapid redistribution of water (hydraulic turgor change) that snaps the trap shut. This demonstrates that plants possess rapid non-auxin signalling (action potentials, hydraulic signals, calcium waves), with auxin being one of several phytohormone systems, each suited to different timescales and responses."},{"stem":"Phloem loading at the source uses symplastic or apoplastic pathways. In apoplastic loading, sucrose is actively transported into phloem sieve tube elements against a concentration gradient. Why is companion cell activity essential to this process?","A":"Companion cells produce the sucrose that is loaded into sieve tube elements","B":"Sieve tube elements have no nucleus or ribosomes and cannot synthesise the ATP or H⁺-ATPase pumps needed for active transport — companion cells are metabolically active, generate the proton gradient that powers sucrose co-transport into sieve tubes via symporters","C":"Companion cells physically block sucrose from diffusing out of phloem, acting as valves","D":"Companion cells convert sucrose to glucose and fructose before loading it into sieve tubes","correct":"B","explain":"Sieve tube elements are enucleate (no nucleus) and have few organelles — they are metabolically dependent on companion cells connected via numerous plasmodesmata. Apoplastic loading involves: (1) sucrose diffuses into the cell wall (apoplast); (2) H⁺-ATPase pumps in companion cells generate a proton gradient; (3) sucrose/H⁺ symporters use this gradient to co-transport sucrose into companion cells and sieve tubes against a concentration gradient. The companion cell provides all the machinery (proteins, ATP) that the enucleate sieve tube element cannot produce itself."},{"stem":"Experiments with ring-barking (removing a ring of bark from a tree trunk) show that sugars accumulate above the ring. If only xylem is left intact below the ring, the tree's roots eventually die. Explain these observations.","A":"Ring-barking removes xylem, stopping water transport — roots die of dehydration, and sugars accumulate in leaves","B":"The bark contains phloem — removing it interrupts downward translocation of sucrose to the roots; roots are non-photosynthetic sinks dependent on phloem supply; starvation kills root cells. Xylem (in the wood) is unaffected so water/mineral transport continues — explaining why the top of the tree survives longer than the roots","C":"Ring-barking causes the tree to produce excessive ethylene, killing the roots","D":"Removing bark exposes xylem to air, causing air locks (embolisms) that kill roots by dehydration","correct":"B","explain":"Phloem is located in the bark (outside the xylem). Ring-barking removes the phloem transport pathway. Sugars synthesised in leaves can no longer move downward to roots — they accumulate above the ring (callus formation is attempted). Roots have no chloroplasts and cannot photosynthesize — they depend entirely on phloem-delivered sucrose for respiration and growth. Without this supply, root cells starve and die. The intact xylem (in the wood below the ring) continues delivering water to the canopy — the tree's top survives longer than its roots."},{"stem":"Auxin promotes cell elongation at low concentrations but inhibits it at high concentrations in roots. This dual effect is described by a bell-curve dose-response relationship. How does this explain root positive gravitropism?","A":"High auxin in roots causes rapid elongation, pushing roots downward","B":"Gravity causes auxin to accumulate on the lower side of the root tip — but roots are highly sensitive to auxin; the high concentration there is on the inhibitory part of the dose-response curve, causing less elongation on the lower side than the upper side — the root bends downward (positive gravitropism)","C":"Auxin is absent from roots — gravitropism in roots is caused by statolith (starch grain) redistribution only","D":"Auxin accumulates on the upper side of roots due to gravity, suppressing growth there and bending the root downward","correct":"B","explain":"Roots and shoots have different sensitivities to auxin. The optimal auxin concentration for shoot elongation is ~10⁻⁸ mol/L — the same concentration inhibits root elongation. Gravity causes statoliths (amyloplasts) to sediment to the lower side of root cap cells, triggering auxin redistribution to the lower side. In the root elongation zone, the lower-side auxin concentration is on the supra-optimal (inhibitory) part of the dose-response curve — elongation is suppressed there. The upper side elongates more, bending the root downward toward gravity."},{"stem":"CAM plants (e.g. cacti) fix CO₂ at night and store it as malic acid, releasing it during the day when stomata are closed. What is the selective pressure that drove the evolution of CAM photosynthesis?","A":"CAM plants evolved to photosynthesize faster than C3 plants in all environments","B":"In arid environments, opening stomata during the hot, dry day causes severe water loss — CAM plants evolved temporal separation of CO₂ fixation (night, stomata open, cool, humid, low transpiration) from the Calvin cycle (day, stomata closed, using stored CO₂ from malate), allowing photosynthesis with minimal water loss","C":"CAM plants cannot photosynthesize in light — they evolved to use darkness exclusively","D":"CAM evolved because CO₂ concentration is higher at night due to human activity","correct":"B","explain":"The selective pressure is extreme water scarcity in desert environments. Opening stomata in daylight (when photosynthesis could use CO₂ directly) results in massive water loss through transpiration in hot, dry, low-humidity air. CAM plants open stomata only at night (lower VPD — vapour pressure deficit — so less water lost), fixing CO₂ into malic acid stored in vacuoles. During the day, stomata close; malate is decarboxylated, releasing CO₂ that is fixed by RuBisCO in the Calvin cycle. Water use efficiency is 3–10× higher than C3 plants — a critical adaptation to desert life."},{"stem":"An experiment measures the apical dominance effect: when the shoot apex of a plant is present, lateral buds are suppressed; removing the apex allows lateral buds to grow. More recent research shows that cytokinins (produced in roots) and strigolactones (from shoots) interact with auxin in lateral bud suppression. What does this suggest about plant hormone action?","A":"Auxin alone controls lateral bud suppression — cytokinins and strigolactones are irrelevant","B":"Plant hormone action is rarely the result of a single hormone — it involves complex interactions (synergism and antagonism) between multiple hormones, where the ratio and relative concentrations of multiple signals determine the cellular response","C":"Cytokinins replace auxin as the main apical dominance hormone in all plants","D":"Strigolactones promote lateral bud growth, opposing auxin's inhibitory effect","correct":"B","explain":"The apical dominance mechanism was originally attributed solely to high auxin from the apex inhibiting lateral buds. Modern research shows it is more complex: auxin from the apex inhibits cytokinin production in buds (cytokinins promote bud outgrowth); strigolactones (systemically mobile) reinforce bud inhibition independently of auxin in some conditions. The balance of these signals (high auxin + high strigolactone + low cytokinin = dormant bud; low auxin + low strigolactone + high cytokinin = bud growth) determines bud fate. This exemplifies how phytohormone responses require network analysis rather than single-hormone models."},{"stem":"A researcher measures stomatal density on the upper and lower leaf surfaces of aquatic plants (floating leaves) vs. terrestrial plants. Aquatic plant floating leaves have stomata almost exclusively on the upper surface, while terrestrial plant leaves have them predominantly on the lower surface. Explain this difference.","A":"Aquatic plants photosynthesize faster so they need more stomata on top; terrestrial plants photosynthesize slowly and need fewer stomata","B":"Aquatic floating leaves have their lower surface in contact with water — stomata there would be waterlogged and non-functional; upper surface stomata allow gas exchange with air. Terrestrial plants place stomata on the cooler, shadier lower surface to reduce water loss — the lower surface boundary layer is more humid, reducing the transpiration gradient","C":"Aquatic plants need to absorb water through stomata — upper surface placement facilitates this","D":"Terrestrial plants have more stomata on the lower surface to absorb CO₂ that is denser than air and settles below leaves","correct":"B","explain":"Stomatal position is an adaptation to the gas exchange requirements and water economy of the specific environment. Aquatic floating leaves: the lower surface is submerged — water would block gas exchange there; upper surface stomata access atmospheric CO₂. Terrestrial leaves: upper surface receives direct sunlight and has higher temperature and lower humidity — placing stomata there would dramatically increase water loss; lower surface is cooler, in the shadow of the leaf, with a humid boundary layer — all reducing the VPD driving transpiration. Amphibious plants show intermediate distributions."},{"stem":"In the spring, deciduous trees transport stored starch from roots and stems to growing buds before leaves emerge. At this stage, the roots are acting as a source and the buds as sinks. Later in summer, the direction reverses. Explain the mechanism that allows phloem to reverse flow direction.","A":"Phloem vessels reverse the orientation of their membranes seasonally to switch flow direction","B":"The source-sink gradient drives flow by osmosis in the pressure-flow hypothesis — in spring, high sugar concentration in root storage cells (source) creates high turgor pressure; in summer, photosynthesising leaves become the high-sugar source; phloem flow always moves from high to low turgor pressure (high to low sugar concentration), so reversing which organ is the source automatically reverses flow direction","C":"Phloem contains motors that can switch direction, like motor proteins in neurons","D":"Separate, directional phloem vessels exist for upward and downward flow — the tree uses different sets seasonally","correct":"B","explain":"The pressure-flow (mass flow) hypothesis explains phloem transport: active loading of sucrose at the source raises osmotic pressure, drawing water in from xylem — this generates hydrostatic pressure that drives bulk flow toward the sink (where sucrose is unloaded, pressure is lower). Flow direction is entirely determined by which organ has higher sucrose concentration (higher turgor). In spring: roots/stems release starch-derived sugars (source) → flow toward buds (sink). In summer: leaves photosynthesize and load sucrose (source) → flow toward roots, fruits, etc. (sinks). The phloem vessels themselves are passive conduits; flow direction emerges from the concentration gradient."},{"stem":"Gibberellins and auxins both promote stem elongation but through different mechanisms. Dwarf mutant plants (deficient in gibberellin) can be restored to normal height by gibberellin application but not by auxin application. What does this reveal about the relationship between these two hormones?","A":"Gibberellins and auxins act through identical pathways — dwarfism reflects a general hormone deficiency","B":"Gibberellins and auxins act via distinct molecular pathways — gibberellins promote elongation partly by stimulating the degradation of DELLA proteins (growth repressors), which is independent of the auxin signalling pathway; the dwarf phenotype results specifically from DELLA accumulation that auxin cannot overcome via its own receptor/signalling cascade","C":"Auxin is ineffective in all plants — only gibberellins control stem elongation","D":"The dwarf mutant lacks auxin receptors, so auxin cannot act — gibberellin uses different receptors that are still functional","correct":"B","explain":"DELLA proteins are transcriptional repressors of gibberellin-responsive genes, including those for cell elongation enzymes. Gibberellins bind GID1 receptors → target DELLAs for proteasomal degradation → growth genes expressed → elongation. Auxin promotes elongation via a separate pathway (TIR1/AFB receptors → degradation of Aux/IAA repressors → expansin genes expressed → cell wall loosening). Gibberellin-deficient dwarfs have DELLA accumulation that blocks gibberellin-specific elongation pathways; exogenous auxin can activate its own pathway but cannot resolve DELLA repression. This demonstrates hormones act via parallel, partially independent molecular cascades."},{"stem":"An ecologist studying forest regeneration finds that seedlings of pioneer species (light-demanding) fail to establish in dense shade, while climax species (shade-tolerant) can. Both species show similar photosynthesis rates in full sun. Explain the physiological basis for this difference.","A":"Climax species have more chlorophyll, so they photosynthesize faster in all light conditions","B":"Shade-tolerant climax species have a lower light compensation point and lower light saturation point — lower respiration rates, higher chlorophyll b:a ratio (absorbing more wavelengths), thinner leaves with fewer layers — meaning they achieve net photosynthetic gain at low light where pioneer species are below their higher compensation point and making a net carbon loss","C":"Pioneer species are smaller, so they need less glucose — they should survive shade better than climax species","D":"Climax species avoid shade by growing taller faster than pioneer species, accessing full sunlight above the canopy","correct":"B","explain":"Pioneer (light-demanding) species are adapted for high-light open habitats: high light saturation points, high photosynthetic rates in bright light, high respiration rates — meaning their compensation point is high. In shade, photosynthesis rate falls below their high respiration rate → net carbon loss → seedling death. Shade-tolerant climax species: low respiration rates (lower compensation point), high chlorophyll b content (absorbs wavelengths that penetrate canopy shade), large thin leaves (maximise light capture). They can achieve net carbon gain at light intensities where pioneer seedlings cannot survive. This allows forest succession — shade-tolerant species establish under pioneers, eventually replacing them."},{"stem":"Ethylene (ethene) gas promotes fruit ripening but also causes leaf abscission (fall). In both processes, ethylene upregulates cell wall-degrading enzymes. Why might leaf abscission in autumn be adaptive despite causing resource loss?","A":"Leaves are shed to prevent caterpillar damage — ethylene is a defence signal","B":"Deciduous trees shed leaves before winter to prevent water loss through transpiration when roots cannot absorb frozen water, and to avoid mechanical damage from ice and snow loading on flat leaves — the cost of losing leaf nitrogen is offset by nutrient resorption (chlorophyll and proteins are broken down and sugars/amino acids translocated to storage before abscission)","C":"Leaf abscission is a disease response — healthy trees keep their leaves year-round","D":"Leaves are shed to increase light reaching the forest floor, benefiting the tree's seedlings","correct":"B","explain":"Deciduous leaf abscission is an adaptation to cold, dry winters where soil water is frozen (unavailable) and light levels are low (insufficient for net photosynthesis in costly-to-maintain leaves). Keeping leaves would lead to net water loss through transpiration without replenishment, and structural damage from ice. Before abscission: chlorophyll is broken down, nitrogen/phosphorus from proteins are resorbed into twigs and stored as organic molecules. Ethylene triggers formation of the abscission zone (cell wall-degrading enzymes weaken the leaf base). The adaptive trade-off: leaf nitrogen resorption recovers ~50–70% of the investment; the discarded carbon is acceptable compared to the cost of a winter-killed tree."},{"stem":"Mycorrhizal fungi form symbiotic associations with plant roots, dramatically increasing the effective surface area for mineral uptake. In phosphorus-deficient soils, plants invest significantly more photosynthate (sugars) into mycorrhizal symbionts. What does this cost-benefit relationship suggest about the evolutionary stability of this mutualism?","A":"Plants are exploited by fungi — the fungi take sugars without providing real benefit","B":"The mutualism is evolutionarily stable because each partner provides something the other cannot efficiently produce alone: the fungus provides phosphorus (and other minerals) that would be energetically very costly to acquire by root extension alone; the plant provides carbon (photosynthate) that the heterotrophic fungus cannot produce — both partners increase their fitness, stabilising the relationship by reciprocal dependence","C":"Mycorrhizal associations are temporary — plants eventually destroy the fungus once mineral needs are met","D":"The cost in photosynthate is so high that mycorrhizal plants always grow slower than non-mycorrhizal plants","correct":"B","explain":"Evolutionary stability of mutualisms requires that cheating (taking benefit without providing it) is less fit than cooperating. Here: phosphorus is essential for ATP, nucleic acids and membranes — acquiring it by root growth alone in low-P soils is extremely costly (root:shoot ratio must increase, diverting carbon from growth). Fungal hyphae access soil pores roots cannot penetrate, delivering P at a lower carbon cost per unit P than root extension. The plant pays in sugars — but the fungus is entirely heterotrophic and cannot fix carbon independently. Evolutionary theory (biological market, partner fidelity feedback) predicts plants preferentially reward fungal symbionts that deliver more mineral uptake — this \"sanctions\" poor partners and maintains mutualism stability."},{"stem":"Transgenic herbicide-resistant crops (e.g. Roundup Ready soybean) contain a bacterial gene (EPSPS) that is insensitive to glyphosate, allowing the crop to survive herbicide treatment that kills weeds. What ecological risks does this technology introduce?","A":"The transgenic crops photosynthesize too efficiently, shading out native species","B":"Gene flow via pollen to wild relatives could create herbicide-resistant \"superweeds\"; reduction in weed diversity reduces habitat and food sources for invertebrates and birds; selection pressure from widespread glyphosate use accelerates evolution of naturally glyphosate-resistant weed populations; and crop monocultures reduce agricultural biodiversity","C":"Glyphosate residues accumulate in the EPSPS enzyme of crop plants and become toxic to consumers","D":"Transgenic crops attract more insect pests because the novel EPSPS protein is nutritious for insects","correct":"B","explain":"Herbicide-resistant GM crops introduce several ecological risks: (1) transgene escape — if the herbicide-resistance gene transfers via cross-pollination to wild relatives (e.g. wild radish, oilseed rape relatives), those could become hard-to-control weeds; (2) biodiversity loss — broad-spectrum herbicide use eliminates arable weeds that form the base of food webs for invertebrates, seed-eating birds and mammals; (3) resistance evolution — intensive selection pressure drives natural herbicide-resistance mutations in weed populations (multiple glyphosate-resistant species now documented); (4) reduced crop genetic diversity in monocultures increases vulnerability to novel pathogens. These risks require management through resistance refuges, crop rotation and ecological monitoring."},{"stem":"The chemiosmotic theory explains ATP synthesis in chloroplasts by a proton gradient across the thylakoid membrane (similar to mitochondria). Why must the thylakoid membrane be impermeable to protons (H⁺) for this process to work?","A":"Proton impermeability prevents water from entering the thylakoid lumen","B":"The proton gradient (high H⁺ in thylakoid lumen, lower in stroma) stores potential energy — if the membrane were freely permeable to H⁺, protons would equilibrate instantly, dissipating the gradient before ATP synthase (CF₀CF₁ complex) could harness the flow to phosphorylate ADP; impermeability forces H⁺ to flow only through ATP synthase, coupling proton flow to ATP synthesis","C":"Proton impermeability prevents NADPH from being oxidised before it can be used","D":"H⁺ impermeability keeps the lumen acidic, which directly activates the Calvin cycle enzymes in the stroma","correct":"B","explain":"Chloroplast ATP synthesis (photophosphorylation) uses the same chemiosmotic principle as mitochondria. Light reactions split water and pump H⁺ into the thylakoid lumen via the electron transport chain, creating a proton motive force (electrical + pH gradient). The thylakoid membrane's impermeability to H⁺ (maintained by its lipid bilayer composition) is thermodynamically essential — it preserves the gradient as potential energy. Controlled discharge of H⁺ through the CF₀CF₁ ATP synthase rotates its subunit, driving conformational changes that catalyse ATP synthesis from ADP + Pi. Free proton permeability would uncouple electron transport from ATP synthesis (an uncoupler — some pesticides work by this mechanism)."},{"stem":"In an aquaporin-blocking experiment, researchers find that root cells with blocked aquaporins absorb water at only 10% of the normal rate despite an identical osmotic gradient. What does this reveal about the mechanism of water uptake in roots?","A":"Osmosis through lipid bilayers accounts for 90% of water movement in roots — aquaporins are minor contributors","B":"Aquaporins (transmembrane water channels, a type of channel protein) account for ~90% of water flux across root cell membranes — the lipid bilayer alone is largely impermeable to rapid water flow; osmosis provides the driving force but aquaporin channels determine the rate of water movement","C":"Aquaporins actively pump water against the osmotic gradient — blocking them prevents active transport","D":"The 10% residual uptake is through plasmodesmata, which are unaffected by aquaporin blockers","correct":"B","explain":"Water molecules are small but polar — they cross lipid bilayers slowly by simple diffusion. Aquaporins (AQP proteins, e.g. TIP and PIP families in plants) form hydrophilic channels that allow rapid facilitated diffusion of water molecules in single file. The experiment shows that ~90% of water flux in root cells depends on aquaporin channels. Osmotic potential provides the driving force (thermodynamic gradient) but aquaporin abundance and activity determine the conductance (rate). Plants regulate water uptake by controlling aquaporin expression and phosphorylation-dependent gating — relevant to drought responses and root pressure."},{"stem":"Carnivorous plants like Drosera (sundew) grow in nitrogen-poor bogs. They obtain nitrogen by digesting insects using proteases, but still require photosynthesis. Why does carnivory not completely replace the need for photosynthesis?","A":"Carnivory provides too much nitrogen — plants must photosynthesize to dilute the nitrogen with carbon","B":"Carnivory provides organic nitrogen (amino acids) but cannot supply the carbon skeletons needed for all biomolecules, or the ATP needed for all metabolic processes — photosynthesis remains essential for carbon fixation (glucose) and energy provision; carnivory supplements the nitrogen supply that the low-nutrient habitat cannot provide","C":"Insect digestion destroys all nutrients including carbon, so no carbon is obtained from prey","D":"Carnivory is used only for phosphorus acquisition — nitrogen is still obtained from the soil","correct":"B","explain":"Plants require large amounts of carbon (for cellulose, starch, lipids, most amino acids) — only photosynthesis can fix atmospheric CO₂ into organic carbon at the scale needed. Carnivory solves a nitrogen (and phosphorus) deficiency problem: bog soils have very low mineral nitrogen, limiting protein synthesis and enzyme production. Digested insects supply amino acids/ammonium that the plant cannot obtain sufficiently from the soil. However, the caloric energy from insect carbon is trivial compared to photosynthetic output. Experiments removing sunlight from carnivorous plants show growth failure even with plentiful prey — confirming photosynthesis remains the primary energy/carbon source."},{"stem":"During investigations into phytochrome-mediated flowering (photoperiodism), scientists discover that it is the length of uninterrupted darkness, not daylength, that determines flowering in short-day plants. A brief flash of red light in the middle of the night inhibits flowering. A subsequent far-red flash restores the ability to flower. Explain the molecular basis of this reversibility.","A":"Red light destroys the flowering hormone; far-red light resynthesises it","B":"Phytochrome exists in two interconvertible forms: Pr (inactive, absorbs red light ~660 nm, converts to Pfr) and Pfr (active signalling form, absorbs far-red ~730 nm, converts back to Pr or reverts slowly in darkness). In short-day plants, Pfr inhibits flowering — a night-break red flash converts Pr → Pfr, resetting the dark-period clock; subsequent far-red converts Pfr → Pr, reversing the inhibition and restoring flowering ability","C":"Red light activates stomata closure, preventing CO₂ entry needed for flower development; far-red reverses stomatal closure","D":"Phytochrome is destroyed by red light and resynthesised by far-red light — flowering occurs only when phytochrome concentration is above a threshold","correct":"B","explain":"Phytochrome is a photoreversible pigment: Pr ⇌ Pfr (red ↔ far-red light). In darkness, Pfr gradually reverts to Pr. Short-day (long-night) plants flower when nights exceed a critical minimum: during long darkness, Pfr:Pr ratio falls below the threshold that inhibits flowering. A red night-break converts Pr → Pfr, raising the ratio above threshold → flowering inhibited (as if night was interrupted). Subsequent far-red converts Pfr → Pr, lowering the ratio again → flowering restored. This photoreversibility demonstrates phytochrome as a red/far-red photoreversible switch controlling circadian timing, seasonal timing, shade avoidance, germination and de-etiolation."},{"stem":"A student claims: \"Plants do not need to respire because they can make their own food by photosynthesis.\" Evaluate this statement using evidence from plant physiology.","A":"The student is correct — plants only respire as a backup when light is unavailable","B":"The claim is incorrect: photosynthesis produces glucose but respiration is needed to release ATP from glucose for all metabolic work; photosynthesis occurs only in chloroplasts (not in roots, stems, meristems) only when light is available; respiration occurs in all cells, at all times, in mitochondria; at night the plant is entirely dependent on respiration; even in light, the net photosynthesis rate must exceed respiration rate to produce surplus glucose — both processes are obligatory and distinct","C":"The student is correct for daylight hours — photosynthesis produces ATP directly, eliminating the need for respiration during the day","D":"Plants photosynthesize only in roots and respire only in leaves — both processes are always occurring in different organs simultaneously","correct":"B","explain":"This is a classic misconception. Photosynthesis produces glucose (chemical potential energy) and O₂ in chloroplasts using light energy — it does not directly produce ATP for cellular work. Respiration in mitochondria oxidises glucose to produce ATP — the universal cellular energy currency. All plant cells (roots, stems, non-green tissues, meristems) lack chloroplasts and must respire. Chloroplast-containing cells respire in the dark. Even illuminated leaf cells both photosynthesize and respire simultaneously — the apparent net gas exchange depends on which rate dominates. Plants are heterotrophic at night and in non-photosynthetic tissues. Photosynthesis and respiration are complementary, not alternative, pathways."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
