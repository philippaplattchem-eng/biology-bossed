<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T7 Homeostasis Flame | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T7: Homeostasis &mdash; Flame</h1><span class="tier-badge flame">Flame</span></header><main><div class="quiz-meta"><span>20 questions &middot; Homeostasis</span><span>Flame: Application</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"A patient's blood test shows persistently high blood glucose levels even after fasting. Their pancreas is producing normal amounts of insulin. What is the most likely diagnosis and cause?","A":"Type 1 diabetes — the immune system has destroyed beta cells","B":"Type 2 diabetes — body cells have developed insulin resistance, so they do not take up glucose normally despite adequate insulin levels","C":"Hypoglycaemia — excess glucagon is being produced by alpha cells","D":"Thyroid disease — low thyroxine is preventing glucose uptake","correct":"B","explain":"In type 2 diabetes, the pancreas produces insulin but target cells (liver, muscle, adipose) have reduced sensitivity to its signal — fewer or less responsive insulin receptors. Blood glucose remains elevated (hyperglycaemia) despite insulin being present. This is different from type 1, where beta cells are destroyed and insulin is absent. Type 2 is closely linked to obesity (excess lipids interfere with insulin signalling) and physical inactivity, which reduce insulin sensitivity."},{"stem":"A marathon runner starts a race with blood glucose at 5 mmol/L. After 2 hours, blood glucose is still approximately 5 mmol/L despite intensive muscle use. Explain how blood glucose is maintained.","A":"The runner stops using glucose after 30 minutes and switches entirely to fat metabolism — no glucose regulation is needed","B":"Falling blood glucose triggers glucagon release from the pancreas → liver converts stored glycogen to glucose (glycogenolysis) → glucose released into blood; additionally, gluconeogenesis converts amino acids and glycerol to glucose; adrenaline also promotes glycogenolysis — these mechanisms maintain blood glucose throughout exercise","C":"Muscle cells produce glucose from CO₂ during aerobic respiration, maintaining blood glucose","D":"The liver absorbs oxygen and converts it to glucose to replace what muscles use","correct":"B","explain":"During prolonged exercise, muscles rapidly consume blood glucose. This triggers: (1) glucagon release (alpha cells detect falling glucose) → glycogenolysis in the liver; (2) adrenaline release (stress hormone) → reinforces glycogenolysis and mobilises fatty acids; (3) as liver glycogen depletes, gluconeogenesis begins — making glucose from lactate, amino acids and glycerol. These mechanisms together prevent dangerous hypoglycaemia during marathon running, maintaining blood glucose close to the set point throughout."},{"stem":"On a hot day, a student notices their urine is much darker and produced in smaller volumes than usual. Explain this using ADH.","A":"Hot weather causes the kidneys to produce more urine to cool the body","B":"Sweating on a hot day causes water loss from the blood, increasing blood solute concentration; the hypothalamus detects this and signals the pituitary to release more ADH; ADH increases water reabsorption in kidney collecting ducts → less water in urine → smaller volume of more concentrated (darker) urine","C":"Hot weather directly thickens the blood, forcing the kidneys to filter less","D":"Increased body temperature inactivates the kidney filtration mechanism, reducing urine production","correct":"B","explain":"Sweating reduces blood water content → blood osmolarity increases → hypothalamic osmoreceptors detect this → pituitary releases more ADH → collecting duct permeability increases → more water reabsorbed by osmosis into blood → urine becomes more concentrated (darker colour from higher urea/solute concentration) and smaller in volume. Drinking water dilutes the blood → less ADH released → more dilute, larger volume urine. This is a clear negative feedback loop controlling water balance."},{"stem":"A patient is found to have an overactive thyroid gland (hyperthyroidism). Predict four symptoms they might experience and explain why.","A":"Weight gain, low heart rate, feeling cold, and sluggishness — due to increased metabolic rate","B":"Weight loss despite eating well, elevated heart rate, feeling hot, sweating, and anxiety — because excess thyroxine increases metabolic rate, causing cells to respire faster, generating more heat and using more fuel","C":"Low blood glucose, pale skin, muscle weakness, and dry hair — due to thyroid overactivity affecting the adrenal glands","D":"Increased urine production, thirst, and blurred vision — because thyroxine regulates kidney function","correct":"B","explain":"Thyroxine controls basal metabolic rate. Excess thyroxine (hyperthyroidism) causes: (1) increased cellular respiration → weight loss despite normal or increased appetite; (2) more heat generated → feeling hot, sweating, heat intolerance; (3) increased cardiac output → elevated heart rate (palpitations); (4) nervous system effects → anxiety, tremor, irritability; (5) increased oxygen demand. The opposite — hypothyroidism (underactive thyroid) — causes weight gain, feeling cold, fatigue and bradycardia."},{"stem":"Explain why insulin must be injected rather than taken orally by people with type 1 diabetes.","A":"Insulin is too large to pass through the stomach wall and would accumulate there","B":"Insulin is a protein — if swallowed, it would be broken down by proteases in the stomach and small intestine before being absorbed, destroying its function; injection delivers intact insulin directly into the bloodstream","C":"Oral insulin would pass straight through the digestive system without being absorbed at all","D":"Insulin tablets are available but doctors prefer injections because they are cheaper","correct":"B","explain":"Insulin is a polypeptide hormone. Like all proteins, it would be denatured and hydrolysed by pepsin (stomach) and proteases (pancreatic enzymes) in the small intestine if swallowed — the amino acids would be absorbed but the functional hormone structure would be destroyed. Injection delivers insulin directly into subcutaneous tissue or bloodstream, bypassing the digestive system entirely. Research into oral insulin delivery (using protective nano-encapsulation) is ongoing but not yet clinically standard."},{"stem":"A person drinks a large volume of water in a short time. Predict what happens to ADH levels and urine production over the next 2 hours.","A":"ADH increases and urine production decreases as the body stores the extra water","B":"The extra water dilutes the blood, lowering blood osmolarity → hypothalamic osmoreceptors detect the fall → pituitary releases less ADH → collecting duct permeability decreases → less water reabsorbed → large volume of dilute, pale urine produced; ADH levels gradually return to normal as urine production corrects blood osmolarity","C":"ADH levels do not change — urine volume is controlled by blood pressure alone","D":"Extra water increases blood pressure, which directly stimulates the kidneys to produce more urine without involving ADH","correct":"B","explain":"Drinking excess water dilutes the blood (lowers osmolarity) → hypothalamic osmoreceptors detect this change → less ADH released from pituitary → collecting duct walls become less permeable to water → less water reabsorbed → high volume of dilute (pale, low osmolarity) urine produced. This corrects blood osmolarity back toward normal. The whole cycle takes 1–2 hours. This is a textbook negative feedback loop of osmoregulation."},{"stem":"Explain why the body temperature of a person running a marathon increases despite the body's cooling mechanisms.","A":"The thermoregulatory centre shuts down during exercise to allow higher temperatures","B":"The rate of heat production by contracting muscles (respiration) exceeds the rate at which sweating and vasodilation can remove heat — especially in hot, humid conditions where sweat evaporation is less effective; core temperature rises until a new balance between heat production and loss is reached","C":"Exercise causes vasoconstriction, trapping heat in the core and preventing cooling","D":"The hypothalamus raises the set point during exercise to increase performance","correct":"B","explain":"Muscle contraction is only ~25% efficient — ~75% of energy from respiration is released as heat. This heat production rate can exceed the capacity of cooling mechanisms (sweating, vasodilation). In hot/humid conditions, the vapour pressure deficit is small — sweat evaporates slowly — so evaporative cooling is less effective. Core temperature may rise to 39–40°C during intense endurance exercise. Above 40°C (hyperthermia), enzymes begin to denature — heat stroke is a medical emergency."},{"stem":"A student's blood glucose rises sharply after eating a meal high in refined carbohydrates but rises only slowly after a meal with the same amount of complex carbohydrates. Explain this difference.","A":"Refined carbohydrates contain more energy per gram, so they raise blood glucose more overall","B":"Refined carbohydrates (sugars, white bread) are quickly digested and absorbed → rapid spike in blood glucose. Complex carbohydrates (starch with intact cell walls, wholegrain) are digested more slowly → gradual release of glucose → steadier rise in blood glucose; this is the basis of glycaemic index","C":"Complex carbohydrates are absorbed directly without digestion, bypassing the digestive system and not affecting blood glucose","D":"Refined carbohydrates travel to the liver first and are stored directly as glycogen, so blood glucose doesn't rise","correct":"B","explain":"Refined carbohydrates (glucose, sucrose, white flour) are rapidly digested/absorbed into the portal blood, causing a sharp postprandial glucose spike. This demands a large, rapid insulin response. Complex carbohydrates and whole foods require prolonged enzymatic digestion before monosaccharides are released — a slower, smaller, more manageable blood glucose rise follows. Frequent large glucose spikes stress beta cells and are associated with insulin resistance development in type 2 diabetes — the basis for dietary management advice."},{"stem":"Predict what happens to blood glucose and hormone levels in a person who has not eaten for 16 hours (overnight fast).","A":"Blood glucose rises steadily overnight as the liver produces glucose continuously; insulin increases","B":"Blood glucose falls gradually → alpha cells release glucagon → liver breaks down glycogen (glycogenolysis) → glucose released into blood; as glycogen stores deplete, gluconeogenesis begins; adrenaline may rise slightly in early morning (dawn effect); insulin remains low; blood glucose stabilises in the low-normal range (approximately 3.5–5.5 mmol/L)","C":"Blood glucose falls to zero during an overnight fast — this is normal and harmless","D":"Overnight, the liver absorbs blood glucose and stores it all as glycogen, causing hypoglycaemia","correct":"B","explain":"During an overnight fast, blood glucose gradually falls as cells continue to respire. Falling glucose triggers glucagon release from alpha cells → liver glycogenolysis releases glucose. As glycogen stores diminish (~12–16 hours into fasting), gluconeogenesis (converting amino acids, glycerol, lactate to glucose) maintains blood glucose. Insulin is suppressed; glucagon is elevated. Blood glucose is maintained within approximately 3.5–5.5 mmol/L. A prolonged fast eventually requires fatty acid and ketone body metabolism to spare glucose."},{"stem":"Why must blood glucose be kept above a minimum level at all times?","A":"Glucose is needed to make DNA in dividing cells — if levels fall, cell division stops","B":"The brain relies almost entirely on glucose for energy — it cannot use fatty acids or most amino acids directly; sustained hypoglycaemia causes confusion, seizures and brain damage; red blood cells also have no mitochondria and depend solely on anaerobic glycolysis using glucose","C":"Blood glucose must remain high to maintain blood viscosity and prevent clotting","D":"Low blood glucose causes the kidneys to shut down, leading to toxic waste accumulation","correct":"B","explain":"The brain and central nervous system rely almost exclusively on glucose for respiration (unlike muscle, which can switch to fatty acids). Red blood cells lack mitochondria and rely entirely on glycolysis. Hypoglycaemia (blood glucose <3 mmol/L) causes neuroglycopenia — glucose-starved brain cells malfunction, causing: confusion, sweating (adrenaline release), trembling, loss of consciousness and, if prolonged, irreversible brain damage. This is why maintenance of a minimum blood glucose is a physiological priority."},{"stem":"A patient has kidney damage and cannot reabsorb glucose from the filtrate. What symptom would this cause and how could it be detected?","A":"The patient would have low blood glucose because glucose is being lost; detected by blood glucose monitoring","B":"Glucose would appear in the urine (glycosuria) — normally all filtered glucose is reabsorbed in the proximal convoluted tubule; failure to reabsorb means glucose passes to urine; detected by urine glucose testing strip (dipstick)","C":"The patient would produce no urine because glucose blocks the filtration pores","D":"Excess glucose in the filtrate would draw water by osmosis into the tubule, causing excessive urine production and dehydration","correct":"B","explain":"Normally, all glucose filtered at the glomerulus is reabsorbed by active transport in the proximal convoluted tubule and returned to the blood. If reabsorption fails (or is overwhelmed, as in uncontrolled diabetes when blood glucose exceeds the renal threshold), glucose passes into urine — glycosuria. Detected by a simple urine dipstick test. This is also observed in uncontrolled diabetes where blood glucose is so high it exceeds the kidney's reabsorption capacity."},{"stem":"Explain why athletes training at altitude (low oxygen) for several weeks have improved performance when they return to sea level.","A":"Low oxygen at altitude forces athletes to use anaerobic respiration, building up lactate which improves endurance at sea level","B":"Low oxygen at altitude stimulates the kidneys to release EPO (erythropoietin), which increases red blood cell production; more red blood cells means more oxygen can be carried to muscles, improving endurance performance at sea level","C":"Altitude improves lung capacity permanently, allowing more air to be inhaled at sea level","D":"The cold temperatures at altitude increase metabolic rate, improving performance when the athlete returns","correct":"B","explain":"At altitude, lower partial pressure of O₂ reduces blood oxygen saturation. The kidneys detect hypoxia and release erythropoietin (EPO). EPO stimulates bone marrow to produce more red blood cells, increasing haematocrit and blood oxygen-carrying capacity. When athletes return to sea level (normal O₂), they have more red blood cells → greater oxygen delivery to muscles → improved aerobic performance. This is the rationale for altitude training camps and why EPO doping is banned in sport."},{"stem":"A woman taking a contraceptive pill containing synthetic oestrogen and progesterone does not ovulate. Explain why.","A":"The synthetic hormones make eggs unable to travel down the fallopian tube","B":"High levels of oestrogen and progesterone feed back negatively to the pituitary, suppressing FSH and LH release — without the FSH surge needed for follicle development and the LH surge needed for ovulation, ovulation does not occur","C":"The pill directly kills eggs in the ovaries before they can mature","D":"The pill causes the uterus lining to become hostile, so ovulation is irrelevant","correct":"B","explain":"The combined contraceptive pill contains synthetic oestrogen and progesterone at levels that mimic the second half of the menstrual cycle. These high levels negatively feed back to the hypothalamus and pituitary, suppressing release of GnRH, FSH and LH. Without the mid-cycle FSH-driven follicle growth and LH surge, ovulation does not occur. The pill essentially \"tricks\" the body into a continuous luteal-phase hormonal state where ovulation is inhibited."},{"stem":"Explain why a person with hypothyroidism (underactive thyroid — too little thyroxine) would feel cold most of the time.","A":"Low thyroxine prevents the hypothalamus from detecting temperature, so the body cannot thermoregulate","B":"Thyroxine increases the basal metabolic rate — insufficient thyroxine means cells respire more slowly, generating less heat as a by-product; the resting heat output falls, making the person feel persistently cold","C":"Low thyroxine causes vasoconstriction of skin blood vessels, preventing heat loss — paradoxically causing cold sensation","D":"Hypothyroidism reduces sweating, causing overheating and then overcooling","correct":"B","explain":"Thyroxine is the primary regulator of basal metabolic rate (BMR). It stimulates cells to respire faster — increasing heat generation. In hypothyroidism, BMR falls: cells produce less heat at rest. The person feels cold because their resting heat output is below normal. Other symptoms of hypothyroidism include: weight gain (lower energy expenditure), fatigue, slow heart rate, constipation, dry skin and depression. Treatment is synthetic thyroxine (levothyroxine) replacement."},{"stem":"Describe how IVF uses hormonal manipulation to achieve a successful pregnancy.","A":"IVF uses surgery only — no hormones are involved","B":"FSH is given to stimulate superovulation (multiple egg maturation); eggs are collected; fertilised in vitro with sperm; embryos cultured; progesterone given to prepare the uterus lining; one or two embryos transferred; progesterone continued in early pregnancy to maintain the lining","C":"LH alone is given to trigger ovulation of a single egg, which is then collected and fertilised","D":"IVF replaces all natural hormones with synthetic versions permanently during the pregnancy","correct":"B","explain":"IVF protocol: (1) superovulation — daily FSH (± GnRH agonist to suppress natural cycle) stimulates multiple follicle development; (2) trigger injection — hCG (mimics LH) triggers final egg maturation; (3) egg collection — ultrasound-guided needle aspiration; (4) fertilisation — eggs mixed with processed sperm in lab; (5) embryo culture (2–5 days); (6) endometrial preparation — progesterone given to thicken uterine lining; (7) embryo transfer — 1–2 embryos placed in uterus; (8) progesterone continued to support early pregnancy until placenta takes over."},{"stem":"A doctor measures a patient's core temperature as 35.2°C (hypothermia). Predict the physiological responses happening in the patient's body.","A":"Sweating and vasodilation are occurring to prevent further cooling","B":"Vasoconstriction reduces blood flow to the skin surface (reducing heat loss); shivering generates heat via muscle respiration; piloerection (hair standing) traps an insulating air layer; adrenaline and thyroxine may increase metabolic heat production — all driven by the hypothalamus detecting blood temperature below 37°C","C":"The patient's hypothalamus has shut down, so no thermoregulatory response is possible","D":"At 35.2°C, the body has already overridden all regulatory mechanisms and hypothermia is irreversible","correct":"B","explain":"Below 37°C, the hypothalamus activates heat-conservation and heat-generation responses: (1) vasoconstriction — peripheral arterioles narrow, blood diverted to core organs; (2) shivering — rapid muscle contractions produce heat via ATP hydrolysis and respiration; (3) piloerection (limited in humans); (4) behavioural responses (seeking warmth, curling up); (5) hormonal — adrenaline and thyroxine can increase metabolic rate. At 35°C, shivering becomes vigorous; below 33°C, shivering may cease (muscles cannot function effectively) and hypothermia becomes life-threatening."},{"stem":"Explain the role of the liver in blood glucose homeostasis in addition to the role of the pancreas.","A":"The liver monitors blood glucose and releases insulin directly into the portal blood","B":"The liver is the key effector organ: it converts excess blood glucose to glycogen for storage (glycogenesis) in response to insulin; breaks down glycogen back to glucose (glycogenolysis) in response to glucagon; and can synthesise new glucose from non-carbohydrate sources (gluconeogenesis) during prolonged fasting or exercise","C":"The liver only stores glucose as fat — it does not produce or break down glycogen","D":"The liver produces glucagon when blood glucose is low and insulin when blood glucose is high — acting as both sensor and effector","correct":"B","explain":"The pancreas acts as the sensor and endocrine signal source; the liver is the primary effector. Liver hepatocytes: (1) glycogenesis — after a meal, insulin drives uptake of glucose and its polymerisation into glycogen stores; (2) glycogenolysis — glucagon (or adrenaline) stimulates phosphorylase enzymes to break glycogen to glucose-1-phosphate → glucose released to blood; (3) gluconeogenesis — synthesis of glucose from pyruvate, lactate, glycerol, glucogenic amino acids — important in prolonged fasting. The liver can store ~100g of glycogen (enough for ~12 hours' basal needs)."},{"stem":"A person with uncontrolled type 1 diabetes produces large volumes of very dilute urine. Explain why, using your knowledge of the kidneys.","A":"The diabetic kidneys produce more filtrate than normal due to high blood pressure","B":"High blood glucose exceeds the renal threshold → glucose appears in the filtrate; glucose in the filtrate lowers the water potential of the filtrate (osmotic effect) → less water reabsorbed by osmosis in the tubules and collecting duct → more water remains in filtrate → large volume of dilute urine produced (osmotic diuresis)","C":"Type 1 diabetes causes ADH levels to fall, reducing water reabsorption in the collecting duct","D":"Insulin directly controls water reabsorption — without insulin, the kidney cannot reabsorb water normally","correct":"B","explain":"In uncontrolled type 1 diabetes, blood glucose is extremely high → exceeds renal threshold (~10 mmol/L) → glucose filtered but not fully reabsorbed. Glucose remaining in the filtrate lowers its water potential — this is osmotic diuresis: water that would normally be reabsorbed by osmosis is retained in the tubule (it cannot move against the glucose-lowered water potential gradient). Result: high volume of glucose-containing urine. Osmotic diuresis also causes thirst (blood becomes hyperosmotic). These are classic symptoms of uncontrolled diabetes (polyuria + polydipsia)."},{"stem":"A researcher uses a radioactive tracer to follow the fate of glucose injected into a fasting person. She finds glucose is incorporated into glycogen in the liver within 30 minutes, and into adipose tissue as fat within 2 hours. What hormonal changes would explain this sequence?","A":"No hormones are involved — glucose passively enters all tissues simultaneously","B":"The injected glucose raises blood glucose → pancreatic beta cells release insulin; insulin stimulates liver glycogen synthesis first (liver has high insulin sensitivity and glucose uptake capacity); as blood glucose and liver uptake stabilise, insulin continues to act on adipose tissue → activates lipogenesis (glucose → fatty acids → triglycerides stored in fat cells)","C":"Glucagon causes glycogen synthesis; adrenaline drives fat storage","D":"The liver converts all glucose to glycogen first; insulin converts glycogen to fat in adipose tissue later","correct":"B","explain":"Insulin is the anabolic hormone that promotes fuel storage after a glucose load. Liver: high portal insulin + glucose → glycogen synthase activated → glucose rapidly polymerised to glycogen (30 min timeframe). Adipose: insulin stimulates uptake of glucose via GLUT4 transporters, and activates acetyl-CoA carboxylase and fatty acid synthase for lipogenesis — slower process (2 h). Insulin also inhibits fat breakdown (lipolysis) in adipose, promoting net fat accumulation. This shows insulin's dual role: storing carbohydrate (liver) and converting excess glucose to fat (adipose)."},{"stem":"A student says: \"Homeostasis only applies to blood glucose and temperature.\" Evaluate this claim with two other examples.","A":"The student is correct — only these two variables are regulated by negative feedback","B":"The claim is incorrect: homeostasis applies to any internal variable that must be maintained within limits. Examples: (1) blood CO₂/pH — respiratory rate adjusts to keep blood CO₂ and pH constant (detected by chemoreceptors in the medulla and aortic/carotid bodies); (2) blood water potential — ADH system maintains blood osmolarity; (3) blood calcium — parathyroid hormone and calcitonin regulate Ca²⁺; (4) blood pressure — baroreceptors trigger heart rate and vessel tone adjustments; all use negative feedback","C":"The student is incorrect but only blood O₂ is regulated in addition to glucose and temperature","D":"The claim is partially correct — blood glucose is regulated but body temperature is not homeostatic because it changes during exercise","correct":"B","explain":"Homeostasis encompasses the regulation of all key internal variables. Additional examples: Blood CO₂/pH — peripheral and central chemoreceptors detect rising CO₂ → medulla increases respiratory rate → more CO₂ exhaled → pH restored. Blood water potential — osmoreceptors in hypothalamus → ADH system (as covered). Blood calcium — parathyroid hormone (PTH) raises Ca²⁺ (bone resorption, kidney reabsorption, gut absorption); calcitonin lowers Ca²⁺; critical for nerve and muscle function. Blood pressure — baroreceptors in aortic arch → autonomic nervous system adjusts heart rate and vessel diameter. All involve sensors, control centres, effectors and negative feedback — the universal homeostatic mechanism."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
