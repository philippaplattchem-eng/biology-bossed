<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T4 Evolution and Inheritance Flame | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}

.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}

.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}

.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}

.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}

@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T4: Evolution and Inheritance &mdash; Flame</h1><span class="tier-badge flame">Flame</span></header><main><div class="quiz-meta"><span>20 questions &middot; Evolution and Inheritance</span><span>Flame: Application</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"MRSA (methicillin-resistant Staphylococcus aureus) has become a serious problem in hospitals. Using natural selection, explain how MRSA arose.","A":"Staphylococcus bacteria deliberately altered their DNA to resist methicillin when exposed to it","B":"Random mutations in some bacteria produced methicillin resistance before any antibiotic was used; these bacteria survived treatment while others died, reproduced, and passed resistance alleles to offspring — the resistant strain became dominant through natural selection","C":"Methicillin caused mutations in all bacteria, producing resistance in all survivors","D":"Bacteria obtained resistance genes from human cells in the hospital environment","correct":"B","explain":"Natural selection of antibiotic resistance: (1) variation — random mutation in a small number of bacteria produced methicillin resistance; (2) selection pressure — antibiotic treatment killed sensitive bacteria; (3) survival — resistant bacteria survived and reproduced; (4) inheritance — resistance alleles passed to daughter cells. Over time, the population became predominantly resistant. Misuse of antibiotics (incomplete courses, overuse in agriculture) accelerates this process."},{"stem":"Dog breeds such as the Chihuahua and the Great Dane look very different from each other, yet both descended from wolves over thousands of years of selective breeding. What does this demonstrate?","A":"That evolution by natural selection is extremely rapid","B":"That artificial selection can produce dramatic phenotypic differences within a species over a relatively short time by selecting for extreme traits in each generation","C":"That dogs and wolves are different species because they look different","D":"That natural selection and artificial selection are the same process","correct":"B","explain":"Selective breeding operates on the same genetic principles as natural selection — alleles for desired traits become more common with each generation of deliberate selection. The difference is that humans, not the environment, choose which individuals breed. The enormous variety of dog breeds — all derived from the wolf — demonstrates how rapidly phenotypic diversity can be generated through consistent artificial selection."},{"stem":"A population of moths contains mostly pale-coloured individuals. Due to air pollution, tree trunks become darkened by soot. Over decades, the proportion of dark moths increases dramatically. Which concept best explains this?","A":"The pale moths evolved dark colouration in response to the darker environment","B":"Industrial melanism — natural selection favoured dark moths (better camouflaged on soot-darkened trees, less likely to be taken by predators) over pale moths (more visible and more likely to be eaten)","C":"Pale moths migrated away and were replaced by dark moths from another population","D":"The pollution directly mutated pale moths to become dark, producing the change within a generation","correct":"B","explain":"The peppered moth (Biston betularia) is a classic example of natural selection in action. Dark moths existed before industrialisation (due to pre-existing mutations) but were rare — they were conspicuous on pale lichen-covered trees. As pollution darkened the trees, dark moths became better camouflaged and more likely to survive predation. Their allele frequency increased. When air quality improved, pale moths again became more common."},{"stem":"DNA sequencing shows that humans and chimpanzees share approximately 98.7% of their DNA, while humans and mice share approximately 85%. What can be concluded from these comparisons?","A":"Humans are more closely related to mice than to chimpanzees","B":"Humans and chimpanzees share a more recent common ancestor than humans and mice — the greater the DNA similarity, the more recently the lineages diverged","C":"Mice and chimpanzees are more closely related to each other than either is to humans","D":"DNA comparisons are unreliable because different species have different amounts of DNA","correct":"B","explain":"DNA similarities reflect evolutionary distance. Species that share a recent common ancestor have had less time for independent mutations to accumulate — their DNA sequences diverge more slowly. The 98.7% similarity between humans and chimpanzees reflects their relatively recent divergence (~6–7 million years ago). The 85% similarity with mice reflects a much earlier divergence (~80–90 million years ago)."},{"stem":"A scientist discovers a fossil of an organism with features intermediate between fish and four-limbed vertebrates (tetrapods), dated to approximately 375 million years ago. What is the significance of this fossil (like Tiktaalik)?","A":"It disproves evolution because the features cannot be explained by natural selection","B":"It is a transitional fossil — evidence that fish-like ancestors gradually evolved features enabling movement onto land, supporting the theory of evolution from aquatic to terrestrial vertebrates","C":"It shows that fish and tetrapods evolved independently on separate continents","D":"It demonstrates that natural selection does not operate across geological timescales","correct":"B","explain":"Transitional fossils show intermediate forms between ancestral and descendant groups — they have a mixture of features from both. Tiktaalik (discovered 2004, dated ~375 Ma) had fish features (scales, fins) and tetrapod features (neck, ribs, limb-like fins). It fills a predicted evolutionary gap between fish and early tetrapods and is strong evidence for gradual evolutionary change as predicted by Darwin's theory."},{"stem":"A farmer uses pesticides on crops for many years. Over time, the pests are no longer controlled by the pesticide. Explain this using natural selection.","A":"The pesticide mutated the pest DNA to produce resistance","B":"Initially, most pests are killed; the few with random pre-existing resistance mutations survive, reproduce and pass resistance alleles to offspring — over time, the population is predominantly resistant","C":"Pests deliberately avoided the pesticide until their DNA changed to resist it","D":"The pesticide caused the pests to develop stronger exoskeletons within their lifetime","correct":"B","explain":"The same mechanism operates for pesticide resistance as for antibiotic resistance: (1) random variation — a few individuals have pre-existing resistance mutations; (2) selection — pesticide kills non-resistant individuals; (3) reproduction — resistant survivors reproduce; (4) inheritance — resistance alleles passed on. After several generations, the population is predominantly resistant. This is why pesticide rotation is recommended in agriculture."},{"stem":"The Galápagos finches have different beak shapes suited to different food sources on different islands. A single ancestral finch species colonised all the islands. What evolutionary process produced the current diversity?","A":"Each finch species deliberately chose a beak shape that suited its island","B":"Adaptive radiation — the ancestral population was geographically separated on different islands; different selection pressures on each island favoured different beak shapes; over many generations, populations diverged genetically into separate species","C":"The finches interbred with local bird species on each island","D":"All finch species existed before reaching the Galápagos and simply migrated to suitable islands","correct":"B","explain":"Adaptive radiation is the diversification of a single ancestral species into multiple species, each adapted to a different ecological niche. Geographic isolation prevents interbreeding, so each island population evolves independently. Different food sources (seeds of different sizes, insects, cacti) select for different beak morphologies. Over thousands of generations, populations accumulate enough genetic differences to become reproductively isolated — new species."},{"stem":"Selective breeding of cows has produced breeds with milk yields that would have been impossible 200 years ago. However, there are welfare concerns about modern dairy breeds. What is the key ethical concern?","A":"Selective breeding introduces dangerous mutations into the genome","B":"Selecting exclusively for high milk yield can inadvertently select for poor health traits — oversized udders, lameness and metabolic disease — because the focus on single traits ignores overall animal wellbeing","C":"High-yielding cows have smaller genomes than wild ancestors","D":"Selective breeding makes cows genetically identical, creating epidemic disease risk","correct":"B","explain":"Intensive selective breeding for single traits can have unintended consequences. High-producing dairy cows often suffer metabolic disorders (e.g. ketosis) because their bodies cannot sustain the nutritional demands of extreme milk production. They may also have lameness, mastitis and reproductive problems. This raises the ethical question of whether the pursuit of maximum productivity is compatible with animal welfare — a key consideration in modern animal breeding."},{"stem":"A new, highly pathogenic strain of avian flu virus spreads globally. Most birds die, but a small number survive and reproduce. Their offspring show increased resistance. What does this demonstrate?","A":"Birds developed immunity within their lifetime and passed this immunity to offspring via hormones","B":"Natural selection — a pre-existing mutation conferring partial resistance allowed some individuals to survive; they reproduced and passed the resistance allele to offspring, increasing its frequency in the population","C":"The virus deliberately mutated to become less pathogenic after killing most birds","D":"Resistant birds migrated from a safe area and replaced the susceptible population","correct":"B","explain":"This is natural selection in real time: the virus acts as a selection pressure; individuals with pre-existing resistance mutations (from random variation) survive; they reproduce; offspring inherit resistance alleles. Over generations, resistance frequency increases in the population. This process drives the co-evolution of host resistance and pathogen virulence."},{"stem":"Why did Darwin initially hesitate to publish his theory of natural selection for over 20 years after developing it?","A":"He lacked any fossil evidence to support his ideas","B":"He knew the theory would be controversial — it contradicted religious beliefs about divine creation and the fixed nature of species, and he wanted to gather overwhelming evidence first","C":"He was not a professional scientist and lacked the confidence to publish","D":"He was unable to explain the mechanism of inheritance (genetics was not yet understood)","correct":"B","explain":"Darwin delayed publication from roughly 1838 (when he developed the theory) to 1859 (publication of \"Origin of Species\") — partly to accumulate evidence, partly knowing the religious and social controversy his ideas would provoke. He was also acutely aware that he lacked a mechanism for inheritance (Mendel's work was not yet known). He was prompted to publish when Alfred Russel Wallace independently developed the same idea and was about to publish."},{"stem":"Golden rice was genetically engineered to produce beta-carotene. Critics of GM crops argue that traditional selective breeding could have achieved the same result. Which response best evaluates this argument?","A":"The critics are correct — selective breeding always achieves the same results as genetic engineering given enough time","B":"Selective breeding can only use variation already present within a species; genetic engineering allows genes from entirely different species to be introduced — conventional breeding cannot produce rice varieties that synthesise beta-carotene, as the necessary genes are absent from the rice gene pool","C":"Selective breeding is faster than genetic engineering for producing nutritional changes","D":"The two techniques are identical — selective breeding and genetic engineering both use gene insertion","correct":"B","explain":"Selective breeding can only shuffle and select alleles that already exist within a species or closely related species. It cannot introduce genes for entirely new biochemical pathways. Beta-carotene synthesis requires genes from other species (daffodil and bacteria) that are absent from the rice genome. Genetic engineering allows transfer of functional genes between any organisms, making it possible to introduce traits that simply cannot be achieved by conventional breeding."},{"stem":"The three-domain system replaced the five-kingdom system after DNA sequencing became possible. What was the key discovery that drove this change?","A":"New fossils showed that organisms previously classified as bacteria were actually unrelated to each other","B":"DNA sequencing revealed that prokaryotes are divided into two fundamentally different domains — Bacteria and Archaea — which are more distantly related to each other than either is to Eukarya; a two-domain \"prokaryote\" kingdom was therefore invalid","C":"Scientists discovered that viruses belonged in their own kingdom","D":"DNA analysis showed that plants and fungi were the same domain","correct":"B","explain":"The five-kingdom system grouped all prokaryotes (lacking nuclei) into one kingdom. DNA sequencing by Carl Woese in the 1970s–80s revealed that archaea and bacteria have profoundly different DNA sequences, ribosomal RNA and cell biology — more different from each other than either is from eukaryotes. This led to the three-domain system: Bacteria, Archaea, Eukarya. It shows that appearance (no nucleus) is not always a reliable guide to evolutionary relationship."},{"stem":"Embryo splitting can be used to produce clones of a prize bull. The embryo is split into cells at an early stage and each is implanted into a surrogate cow. What is the advantage of this technique over adult cell cloning?","A":"Embryo splitting produces more variation in offspring","B":"Embryo splitting is simpler, has higher success rates and produces multiple calves from a single fertilisation, rapidly expanding the number of genetically superior animals","C":"Adult cell cloning is illegal in most countries","D":"Embryo splitting introduces new genes not present in the original bull","correct":"B","explain":"Embryo splitting exploits the totipotency of early embryo cells — each can develop into a complete organism. It is technically simpler than adult cell cloning (somatic cell nuclear transfer) and has higher success rates. From a single prize bull and cow mating, multiple identical calves can be produced in surrogate mothers simultaneously, rapidly multiplying genetically desirable animals. However, it reduces genetic diversity."},{"stem":"A species of insect was abundant 10,000 years ago but is now extinct. Analysis of rock strata shows no fossils of the species after a specific geological layer. What most likely happened at this layer?","A":"The insects evolved into a new species — their descendants are still alive today","B":"An environmental change (e.g. climate shift, habitat loss, or a new predator/disease) eliminated the population faster than it could adapt, leading to extinction","C":"The insects migrated underground and were not preserved as fossils","D":"The species became too small to leave visible fossils","correct":"B","explain":"The absence of fossils above a specific layer suggests the species disappeared at that point in geological time. Sudden disappearance in the fossil record often corresponds to environmental events — mass extinction events (e.g. asteroid impact ~66 Ma, volcanic events), climate changes or habitat loss. If adaptation through natural selection is too slow relative to the rate of environmental change, extinction results."},{"stem":"An agricultural company produces GM soya beans resistant to a specific herbicide, allowing farmers to spray fields to kill weeds without harming the crop. One environmental concern is gene flow to wild relatives. Why is this a problem?","A":"Gene flow would make wild relatives less genetically diverse","B":"If the herbicide-resistance gene transferred to wild relatives via cross-pollination, those weeds could become resistant to the herbicide — creating \"superweeds\" that are very difficult to control","C":"Wild relatives would become identical to the crop, reducing biodiversity irreversibly","D":"Wild relatives would compete with the GM crop for the resistance gene","correct":"B","explain":"A key concern with GM herbicide-resistant crops is horizontal gene flow — pollen carrying the resistance gene fertilising wild relatives. If related weed species acquired herbicide resistance, they would be impossible to control with that herbicide, removing a key weed management tool. This is a genuine ecological concern, though the probability and impact vary by species and geography."},{"stem":"Which piece of evidence would most strongly support placing two species in the same genus?","A":"They live in the same habitat","B":"They have very similar DNA sequences, indicating very recent common ancestry","C":"They are the same size and colour","D":"They eat the same food","correct":"B","explain":"Modern classification is increasingly based on molecular data (DNA sequences, protein sequences) rather than morphology. Species in the same genus should reflect genuine evolutionary closeness — sharing a very recent common ancestor and therefore having very similar DNA. Habitat, size, colour and diet can be similar in unrelated species (convergent evolution) and are therefore less reliable for classification."},{"stem":"Humans have selectively bred wheat from ancient wild grasses over thousands of years. Modern wheat has much larger, non-shattering seed heads compared to wild ancestors. What does this show about the relationship between selective breeding and natural selection?","A":"Selective breeding and natural selection are completely different processes with no relationship","B":"Both work by changing allele frequencies through differential reproduction — selective breeding simply substitutes human choice for environmental selection pressures","C":"Natural selection produced modern wheat; humans only recently discovered and used it","D":"Selective breeding always produces healthier organisms than natural selection","correct":"B","explain":"The underlying mechanism of selective breeding and natural selection is identical: individuals with certain alleles (for desired traits) reproduce more than others, increasing those allele frequencies over generations. The difference is the agent of selection — humans (artificial) vs. the environment (natural). Traits advantageous to humans (larger seeds, non-shattering heads) would not be selected by nature, but are perpetuated by agricultural selection over thousands of plant generations."},{"stem":"A team of scientists proposes using CRISPR to remove the gene for a fatal childhood disease from human embryos. What is the main ethical concern with this approach, even if technically successful?","A":"CRISPR is not accurate enough to use in human embryos","B":"Editing the germline means the change would be inherited by all descendants of that person — this has permanent, unpredictable consequences for future generations who have not consented, and could lead to eugenics","C":"The disease gene also controls an important developmental process, so removal would be lethal","D":"The technique only works in mouse embryos, not human embryos","correct":"B","explain":"Germline editing (editing embryos' DNA) is heritable — all cells in the resulting person, and all their descendants, carry the edit. This raises profound ethical issues: future generations cannot consent; off-target edits could cause harm not detectable until children are born; it opens the door to \"designer babies\" and genetic discrimination. Most countries have laws prohibiting germline editing in humans for these reasons."},{"stem":"The axolotl (a Mexican salamander) is extinct in the wild due to habitat loss and invasive species. However, it survives in captivity in large numbers worldwide. A breeding programme proposes reintroducing captive-bred axolotls. What is the key risk of a prolonged captive population?","A":"Captive animals become too aggressive for reintroduction","B":"Reduced genetic diversity — over many captive generations, inbreeding reduces variation, making the reintroduced population less able to adapt to disease or environmental changes","C":"Captive-bred animals are too large to survive in the wild","D":"Reintroduction always causes extinction of related species through competition","correct":"B","explain":"Small captive populations are vulnerable to inbreeding depression — close relatives are more likely to mate, increasing the frequency of homozygous recessive genotypes (including harmful alleles). Over generations, the population's genetic diversity declines. If reintroduced, the population has reduced ability to respond to new diseases or changed environments. Conservation breeding programmes carefully manage pedigrees to maximise genetic diversity."},{"stem":"Why is it impossible to produce a mammoth by selective breeding alone, whereas it may theoretically be possible using genetic engineering?","A":"Selective breeding requires living specimens of the target species to breed from — extinct species have no living individuals to select; genetic engineering could reconstruct the genome from ancient DNA","B":"Selective breeding always produces the target species faster than genetic engineering","C":"Genetic engineering requires a living specimen, while selective breeding can use ancient DNA","D":"It would be impossible by any method — extinct species can never be recreated","correct":"A","explain":"Selective breeding requires existing variation in a living population — you can only select from what exists. With no living mammoths, there are no individuals to breed. Genetic engineering potentially allows scientists to use ancient mammoth DNA sequences and edit the genome of a living relative (the Asian elephant) to introduce mammoth-specific genes — a \"de-extinction\" approach. Whether this is scientifically achievable (and ethically desirable) remains debated."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
