@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T8: Exchange and Transport &mdash; Flame</h1><span class="tier-badge flame">Flame</span></header><main><div class="quiz-meta"><span>20 questions &middot; Exchange and Transport</span><span>Flame: Application</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"A cube has side length 1 cm. A second cube has side length 4 cm. Calculate both SA:V ratios and explain which cube would be more efficient at exchanging substances with its environment.","A":"1 cm cube: SA:V = 2; 4 cm cube: SA:V = 8 — the larger cube is more efficient","B":"1 cm cube: SA:V = 6:1 = 6; 4 cm cube: SA:V = 96:64 = 1.5; the 1 cm cube has a higher SA:V ratio and is more efficient for exchange by diffusion alone","C":"Both cubes have the same SA:V ratio because they are both cubes","D":"1 cm cube: SA:V = 1; 4 cm cube: SA:V = 4 — SA:V increases with size","correct":"B","explain":"1 cm cube: SA = 6×1² = 6 cm²; V = 1³ = 1 cm³; SA:V = 6:1. 4 cm cube: SA = 6×4² = 96 cm²; V = 4³ = 64 cm³; SA:V = 96:64 = 1.5:1. The 1 cm cube has a 4× higher SA:V ratio. Diffusion is proportional to surface area but must supply the whole volume — a smaller SA:V means longer average diffusion distances and slower delivery to central cells. The 4 cm cube would need a specialised transport system; the 1 cm cube can rely on diffusion."},{"stem":"During exercise, a person's breathing rate increases from 15 to 40 breaths per minute and tidal volume increases. Explain how this maintains efficient gas exchange.","A":"More breathing warms the air entering the lungs, helping haemoglobin bind more O₂","B":"Increased breathing rate and tidal volume increase the flow of fresh air to the alveoli, maintaining a steep concentration gradient for O₂ (high in alveolar air, lower in blood) and CO₂ (high in blood, lower in alveolar air) — maximising diffusion rates in both directions to meet increased metabolic demand","C":"Faster breathing increases blood pressure, which forces more O₂ through the alveolar membrane","D":"Increased breathing rate cools the blood, allowing haemoglobin to bind O₂ more strongly","correct":"B","explain":"Gas exchange by diffusion depends on the concentration gradient (Fick's law). During exercise, muscles produce more CO₂ and consume more O₂ — the gradient increases. Simultaneously, increased ventilation (breathing rate × tidal volume = minute ventilation) replaces alveolar air with fresh, high-O₂, low-CO₂ air more frequently, maintaining steep gradients. Increased cardiac output also speeds blood flow past alveoli, ensuring fresh blood is continuously presented for exchange."},{"stem":"A patient has emphysema — their alveolar walls break down, creating larger but fewer air spaces. Explain why they have difficulty with gas exchange.","A":"Larger alveoli have a greater total surface area, so gas exchange is improved in emphysema","B":"Breaking down alveolar walls reduces the total surface area of the lungs dramatically (fewer, larger spaces replace many small ones); less surface area means fewer molecules can diffuse per unit time; reduced capillary density also impairs exchange — resulting in insufficient O₂ delivery and CO₂ removal","C":"Larger alveoli trap more air, preventing CO₂ from escaping — but O₂ exchange is unaffected","D":"Emphysema increases the thickness of the alveolar membrane, reducing diffusion rate","correct":"B","explain":"Many small spheres have a much greater total surface area than one large sphere of the same total volume (SA ∝ r² while V ∝ r³). Emphysema destroys the walls between adjacent alveoli, merging them into fewer, larger sacs. This drastically reduces total surface area (the key variable in Fick's law: diffusion rate ∝ SA). Additionally, the capillary network in the destroyed walls is lost. Both effects reduce the rate of gas exchange — patients experience shortness of breath, reduced O₂ saturation and exercise intolerance."},{"stem":"During a sprint, muscle cells switch to anaerobic respiration. After the race, the runner continues to breathe heavily for several minutes. Explain why this occurs.","A":"The runner continues breathing heavily to cool the body down after exercise","B":"During the sprint, lactic acid (lactate) accumulated in muscles — this \"oxygen debt\" must be repaid; extra O₂ is needed for the liver to convert lactate back to glucose (gluconeogenesis) and for mitochondria to oxidise any remaining lactate to CO₂ and water; elevated CO₂ in the blood also continues to stimulate chemoreceptors, maintaining elevated breathing rate","C":"The runner breathes heavily to absorb more CO₂ from the environment to replace what was lost during exercise","D":"Continued heavy breathing pumps extra O₂ directly into muscle cells to replenish glycogen stores","correct":"B","explain":"Anaerobic respiration produces lactate, which must be cleared once O₂ is available again. The \"excess post-exercise oxygen consumption\" (EPOC or oxygen debt): ~80% of lactate is transported to the liver and converted to pyruvate → glucose/glycogen (requires ATP → O₂); ~20% is oxidised aerobically in the heart and slow-twitch muscle fibres. Additionally, post-exercise temperature elevation, elevated adrenaline and hormone levels, and mitochondrial resynthesis of ATP/creatine phosphate all require continued O₂ consumption, keeping breathing elevated."},{"stem":"A forensic scientist examines blood vessels from a deceased person with severe atherosclerosis. Describe the changes to artery structure and explain why these changes increase heart attack risk.","A":"Atherosclerosis widens the artery lumen, causing blood pressure to fall — heart attack risk increases because of low blood pressure","B":"Fatty plaques (atheromas) deposit in the artery wall → lumen narrows → blood flow restricted; plaque may rupture, triggering clot (thrombus) formation; clot may completely block the coronary artery → no blood/O₂ reaches myocardium → heart muscle cells die (myocardial infarction)","C":"Atherosclerosis causes the artery walls to thin and weaken, making them prone to rupture — blood leaks into the pericardium causing cardiac arrest","D":"The plaques form in the venous system, not arteries — veins narrow and blood backs up behind the heart","correct":"B","explain":"Atherosclerosis involves: (1) damage to endothelium (from hypertension, smoking, diabetes); (2) LDL cholesterol accumulates in the sub-endothelial space; (3) macrophages engulf LDL → foam cells → fatty streak; (4) fibrous cap forms over the growing atheroma; (5) plaque rupture triggers platelet aggregation and thrombus formation. In coronary arteries: narrowing reduces O₂ supply to myocardium (→ angina); complete occlusion → myocardial infarction. The plaque rupture/thrombosis mechanism explains why sudden heart attacks can occur even in people with moderate disease."},{"stem":"Explain why the walls of capillaries need to be only one cell thick.","A":"Capillaries are under such high pressure that thick walls would burst — thin walls allow the pressure to be released","B":"Capillaries are the site of exchange between blood and tissues — substances (O₂, glucose, CO₂, waste) must diffuse across the wall; minimising wall thickness (1 cell = ~0.2 μm) minimises the diffusion distance, maximising the rate of exchange according to Fick's law","C":"Thick capillary walls would prevent platelets from reaching wounds and forming clots","D":"One-cell-thick walls allow the capillaries to contract and pump blood through small spaces","correct":"B","explain":"Exchange rate by diffusion (Fick's law) is inversely proportional to diffusion distance. Capillary walls consisting of a single endothelial cell layer (~0.2 μm thick) minimise the distance molecules must travel between blood and interstitial fluid/cells. The distance is short enough for rapid diffusion of O₂, glucose, amino acids (into tissues) and CO₂, urea (out of tissues). Thicker walls would slow exchange — arteries and veins have thick walls that prevent exchange, correctly directing exchange to capillary beds."},{"stem":"A student compares the heart rate of an athlete (resting HR = 48 bpm) and a sedentary person (resting HR = 75 bpm). Both have the same cardiac output (5 L/min). Explain this difference.","A":"The athlete's heart pumps less blood per beat — their muscles are more efficient at extracting O₂","B":"Long-term aerobic training causes cardiac hypertrophy (enlarged left ventricle with greater stroke volume) — the athlete's heart pumps more blood per beat (higher stroke volume), so fewer beats per minute are needed to achieve the same cardiac output; cardiac output = heart rate × stroke volume","C":"The athlete has fewer red blood cells, so their heart beats slower to reduce overwork","D":"The sedentary person has a lower stroke volume and compensates with a faster heart rate — but their cardiac output is actually lower than the athlete's","correct":"B","explain":"Cardiac output (CO) = heart rate (HR) × stroke volume (SV). If both have CO = 5 L/min: athlete: 48 × SV = 5000 mL → SV = ~104 mL; sedentary: 75 × SV = 5000 mL → SV = ~67 mL. The athlete's larger, more efficient heart pumps more blood per beat — bradycardia (low resting HR) is an adaptation of endurance training. The larger stroke volume reflects left ventricular hypertrophy and increased end-diastolic volume. A lower resting HR also reduces cardiac work and oxygen demand of the heart muscle itself."},{"stem":"A person with iron deficiency anaemia has reduced haemoglobin levels. Predict the effect on oxygen transport and explain the symptoms they would experience.","A":"Reduced haemoglobin increases blood viscosity — symptoms include high blood pressure and headaches","B":"Less haemoglobin means fewer O₂-binding sites → reduced O₂-carrying capacity of the blood → tissues receive less O₂; symptoms: fatigue (insufficient O₂ for aerobic respiration in muscles), breathlessness (respiratory rate increases to compensate), pale skin (fewer red blood cells), rapid heart rate (heart beats faster to compensate for reduced O₂ per beat)","C":"Iron deficiency causes excessive O₂ binding — symptoms are the opposite of anaemia","D":"Reduced haemoglobin only affects CO₂ transport — O₂ is carried dissolved in plasma regardless","correct":"B","explain":"Each haemoglobin molecule carries up to four O₂. In iron deficiency, insufficient haem (iron-containing groups) means fewer functional Hb molecules per RBC, and often fewer RBCs. Blood O₂-carrying capacity falls. To compensate: (1) breathing rate/depth increases (more O₂ loaded per unit time); (2) heart rate increases (blood circulates faster); (3) tissues extract more O₂ per unit blood (increased arterio-venous O₂ difference). Symptoms reflect these compensations and the underlying hypoxia: fatigue, exertional breathlessness, pallor (fewer RBCs → less pink colour in skin/mucous membranes), tachycardia."},{"stem":"Predict what would happen to the rate of anaerobic respiration in muscle cells if a person began taking a drug that blocked glucose transport into cells.","A":"Anaerobic respiration would increase because cells switch to using fats without glucose","B":"Both aerobic and anaerobic respiration would decrease — both pathways begin with glycolysis (glucose → pyruvate); without glucose entering the cell, no ATP can be produced by either pathway; in muscles, ATP depletion would cause muscle fatigue and weakness even at low exercise intensity","C":"Aerobic respiration would stop but anaerobic respiration would continue using stored glycogen","D":"The drug would cause all glucose to be diverted to the liver, increasing liver respiration instead","correct":"B","explain":"Both aerobic and anaerobic respiration start with glycolysis: glucose → pyruvate → (aerobic) acetyl-CoA → Krebs cycle; or (anaerobic) → lactate. Glucose must enter cells through GLUT transporters. If GLUT is blocked, no glucose enters → glycolysis cannot proceed → no pyruvate for either pathway. Cells would deplete any small intracellular glucose/glycogen reserves rapidly, then fail to produce ATP. Muscle contraction (which requires ATP for myosin ATPase) would fail → weakness and fatigue even without exercise."},{"stem":"Statins work by inhibiting HMG-CoA reductase, an enzyme in the liver's cholesterol synthesis pathway. Explain how this reduces the risk of atherosclerosis.","A":"Statins directly dissolve existing fatty plaques in artery walls","B":"Inhibiting HMG-CoA reductase reduces cholesterol synthesis in liver cells → liver cells upregulate LDL receptors to compensate (pulling more LDL from the blood) → blood LDL-cholesterol falls → less LDL available to deposit in artery walls → reduced atheroma formation → reduced atherosclerosis risk","C":"Statins reduce blood pressure by relaxing the smooth muscle in artery walls","D":"Statins prevent blood clotting by blocking platelet aggregation, reducing heart attack risk","correct":"B","explain":"HMG-CoA reductase catalyses the rate-limiting step in the mevalonate pathway for cholesterol biosynthesis. Inhibition: (1) liver cells produce less cholesterol internally; (2) to maintain intracellular cholesterol levels, liver cells upregulate LDL receptor expression on their surface; (3) more LDL receptors → more LDL particles cleared from bloodstream → blood LDL-cholesterol falls (typically by 30–50%); (4) less circulating LDL → less sub-endothelial cholesterol deposition → reduced atheromatous plaque development. Statins also have pleiotropic anti-inflammatory effects on vessel walls. They are among the most evidence-based drugs for CVD prevention."},{"stem":"A patient's ECG (electrocardiogram) shows an abnormally long P–R interval. What does this indicate about heart function?","A":"The heart is pumping too fast — the P–R interval shows the speed of ventricular contraction","B":"The P wave represents atrial depolarisation; the R wave (part of QRS) represents ventricular depolarisation; a long P–R interval indicates delayed conduction through the atrioventricular (AV) node — first-degree heart block — meaning the electrical signal from the atria is taking longer than normal to reach the ventricles","C":"An abnormally long P–R interval indicates the sinus node (pacemaker) is firing too slowly","D":"The P–R interval measures the time for blood to travel from the atria to the ventricles — a longer interval shows narrowed valves","correct":"B","explain":"The ECG waveform: P wave = atrial depolarisation (atria contract); P-R interval = conduction delay through AV node (normal: 0.12–0.20 s); QRS complex = ventricular depolarisation (ventricles contract); T wave = ventricular repolarisation. A prolonged P-R interval (>0.20 s) = first-degree AV block — the AV node conducts slowly. This can be caused by increased vagal tone, electrolyte disturbances, or structural damage to the conduction system. More severe blocks (second/third degree) result in missed beats or complete atrio-ventricular dissociation."},{"stem":"Explain why the pulmonary artery carries deoxygenated blood and the pulmonary vein carries oxygenated blood, even though arteries normally carry oxygenated blood.","A":"This is an error in anatomy — arteries always carry oxygenated blood","B":"Arteries are defined by the direction of blood flow (away from the heart), not the oxygen content — the pulmonary artery carries blood from the right ventricle to the lungs (away from heart, therefore artery); at the lungs the blood becomes oxygenated; the pulmonary vein returns this oxygenated blood to the left atrium (toward the heart, therefore vein); in the systemic circuit, arteries happen to carry oxygenated blood — but this is not the defining feature of arteries","C":"The pulmonary artery and vein are the only exceptions to the rule — all other arteries carry oxygenated blood","D":"Oxygenated blood is heavier and flows downward (in the vein); deoxygenated blood is lighter and flows upward (in the artery)","correct":"B","explain":"Arteries = carry blood away from heart; veins = carry blood toward heart. This is the structural/functional definition. In the pulmonary circuit: right ventricle → pulmonary artery → lungs (gas exchange) → pulmonary veins → left atrium. The pulmonary artery leaves the heart (→ artery) but carries deoxygenated blood; the pulmonary veins return to the heart (→ veins) but carry oxygenated blood. In the systemic circuit, left ventricle → aorta (oxygenated) → body → vena cava (deoxygenated) → right atrium — here oxygenation happens to align with the artery/vein distinction, but this is incidental."},{"stem":"An athlete training at high altitude develops more red blood cells. Explain how this adaptation improves performance when the athlete returns to sea level.","A":"More red blood cells reduce blood viscosity, allowing faster flow through capillaries","B":"At altitude, lower O₂ partial pressure stimulates EPO release → more RBC production → higher haematocrit; each unit of blood can carry more O₂; returning to sea level (normal O₂) with elevated haematocrit → blood has greater O₂-carrying capacity → more O₂ delivered per beat → aerobic capacity of muscles increases → improved endurance performance","C":"More red blood cells increase blood pressure, forcing O₂ into muscle cells faster","D":"More red blood cells dilute the lactic acid produced during exercise, delaying fatigue","correct":"B","explain":"Erythropoietin (EPO) is produced by the kidneys in response to hypoxia. At altitude: reduced pO₂ → more EPO → bone marrow produces more erythrocytes (RBCs) → haematocrit rises from normal ~45% to ~50%+. Each 100 mL of blood carries more O₂ (more haemoglobin molecules). At sea level with elevated RBC count: VO₂max (maximum oxygen uptake) increases → endurance capacity improves. This is the rationale for legal altitude training and why blood doping (transfusing extra RBCs) and EPO doping are banned — they exploit the same physiological mechanism."},{"stem":"A child is born with a hole in the wall (septum) between the left and right ventricles. Explain the circulatory consequence and why this is dangerous.","A":"The hole allows oxygenated blood to flow into the right ventricle — the right ventricle sends more oxygenated blood to the lungs, improving gas exchange","B":"Oxygenated blood from the left ventricle (high pressure) leaks through the hole into the right ventricle and is pumped to the lungs again unnecessarily — the body tissues receive less oxygenated blood (left-to-right shunt); over time, the lungs receive excess blood flow → pulmonary hypertension; the heart works harder to compensate → cardiac hypertrophy and eventual failure if untreated","C":"The hole allows deoxygenated blood to enter the left ventricle and be pumped to the body — tissues receive deoxygenated blood","D":"A ventricular septal defect (VSD) has no effect because the cardiac output adjusts to compensate perfectly","correct":"B","explain":"Left ventricle pressure (~120 mmHg) >> right ventricle pressure (~25 mmHg). A VSD creates a left-to-right shunt: oxygenated blood leaks from left to right ventricle → gets recirculated through the pulmonary circuit → lungs are volume-overloaded → pulmonary hypertension. Simultaneously, the body's systemic circulation receives reduced blood flow. The heart compensates by increasing cardiac output → hypertrophy → eventually cardiac failure. Small VSDs may close spontaneously; large ones require surgical or catheter-based closure."},{"stem":"Explain how the countercurrent arrangement of blood flow in fish gills maximises oxygen uptake efficiency compared to a parallel flow arrangement.","A":"Countercurrent flow means water and blood flow in the same direction — concentration gradients are maintained throughout the gill","B":"In countercurrent flow, water flows in the opposite direction to blood; the blood that has already absorbed some O₂ still encounters water that has even more O₂ (not yet equilibrated) — a concentration gradient is maintained along the entire gill lamella length; in parallel flow, blood and water would equilibrate halfway along and net diffusion would stop; countercurrent achieves ~80–90% O₂ extraction vs ~50% for parallel","C":"Countercurrent flow causes O₂ to diffuse against its concentration gradient, which is more efficient","D":"Countercurrent simply doubles the surface area available for gas exchange","correct":"B","explain":"In parallel flow: blood and water equilibrate early — by the midpoint, pO₂ in blood = pO₂ in water → no further net diffusion → max extraction ~50%. In countercurrent flow: blood entering one end encounters water leaving the other end (already partially depleted but still richer than incoming blood); as blood becomes enriched, it encounters increasingly O₂-rich water; a gradient is maintained throughout the entire length → extraction approaches 80–90%. This is a key biological efficiency principle — the same countercurrent principle is used in mammalian kidneys (loop of Henle) and heat exchange systems in the limbs of birds and mammals."},{"stem":"Why do large, active animals such as mammals and birds require a closed circulatory system rather than an open one?","A":"An open circulatory system has no blood — it uses air to transport nutrients instead","B":"Closed circulatory systems maintain high blood pressure that can rapidly deliver O₂ and nutrients to active tissues; in an open system (blood bathes organs directly in haemocoel), pressure is low and flow is slow — insufficient for the high metabolic demands of active endotherms; closed systems also allow precise routing of blood to specific tissues (e.g. active muscles) via vasoconstriction and vasodilation","C":"Mammals are too large to fit an open circulatory system — it is purely a size constraint","D":"Closed systems prevent blood from touching cells — this avoids immune reactions between blood and tissues","correct":"B","explain":"Open circulatory systems (insects, molluscs) pump haemolymph into a body cavity (haemocoel) where it directly bathes tissues — low pressure, slow delivery, adequate for ectotherms with lower metabolic rates. Closed systems keep blood in vessels at high pressure, allowing rapid, directed, high-volume delivery to active tissues. Mammals/birds have high metabolic rates (endothermy) requiring constant rapid O₂ and glucose delivery — only a high-pressure closed system can achieve this. Closed systems also allow vasodilation/vasoconstriction to redirect blood flow (e.g. to exercising muscles, away from the gut) — impossible in an open system."},{"stem":"During inspiration, air moves into the lungs because intrapulmonary pressure falls below atmospheric pressure. Explain what creates this pressure difference.","A":"The alveoli actively expand by muscle contraction to create a vacuum","B":"Contraction of the diaphragm (moves down) and external intercostal muscles (ribs up and out) increases the thoracic volume; by Boyle's Law (pressure × volume = constant at constant temperature), increased volume → decreased pressure; when intrapulmonary pressure falls below atmospheric (~1013 hPa), air flows in along the pressure gradient","C":"The epiglottis opens, creating a direct pressure difference between atmosphere and lungs","D":"Mucus production in the airways creates suction that draws air into the lungs","correct":"B","explain":"Breathing mechanics follow Boyle's Law: P₁V₁ = P₂V₂. Inspiration: diaphragm (contracts, flattens, moves caudally) + external intercostals (contract, elevate ribs) → thoracic cavity volume increases → pressure in lungs decreases below atmospheric → pressure gradient from atmosphere to lungs → air flows in. Expiration is mostly passive: muscles relax → elastic recoil of lungs → volume decreases → pressure rises above atmospheric → air flows out. Forced expiration uses internal intercostals and abdominal muscles to actively decrease thoracic volume further."},{"stem":"A researcher measures oxygen consumption in small and large mammals and finds small mammals (e.g. shrew) have a much higher metabolic rate per gram of body mass than large mammals (e.g. elephant). Relate this to SA:V ratio.","A":"Small mammals have lower SA:V ratios — they lose less heat and require less energy","B":"Small mammals have higher SA:V ratios — they lose heat relatively faster to the environment; to maintain constant body temperature (endothermy), they must generate more heat per gram of tissue through respiration → higher mass-specific metabolic rate; large mammals lose proportionally less heat per gram (low SA:V) and have lower mass-specific metabolic rates; this is Kleiber's law (metabolic rate ∝ body mass^0.75)","C":"Large mammals have higher metabolic rates because they have more cells to maintain","D":"SA:V ratio has no relationship to metabolic rate — the difference is due to diet","correct":"B","explain":"Endotherms must balance heat production with heat loss. Heat loss is proportional to surface area; heat production is proportional to volume (mass). Small mammals: high SA:V → proportionally more heat lost per gram → must respire faster per gram to compensate → high mass-specific metabolic rate. Consequences: small mammals eat proportionally more, have faster heart/breathing rates, and shorter lifespans. A shrew must eat ~125% of its body weight daily; an elephant requires only ~4%. This SA:V-driven relationship is fundamental to understanding comparative physiology."},{"stem":"Explain why smoking is a major risk factor for both coronary heart disease and chronic obstructive pulmonary disease (COPD).","A":"Smoking damages only the trachea and has no effect on the heart or alveoli","B":"CVD: nicotine raises heart rate and blood pressure; carbon monoxide binds haemoglobin (reducing O₂ delivery, causing compensatory vasoconstriction); toxins damage artery endothelium → atherosclerosis; promotes platelet aggregation → clot risk. COPD: toxins paralyse/destroy cilia → mucus accumulates → bacterial infection (chronic bronchitis); carcinogens and irritants → inflammation → protease release → alveolar wall destruction (emphysema) → reduced SA for gas exchange","C":"Smoking only causes lung cancer — not CHD or COPD","D":"Smoking increases HDL cholesterol, which reduces CVD risk, but damages the airways","correct":"B","explain":"Smoking is the leading preventable cause of both: CVD mechanism — CO forms carboxyhaemoglobin (reducing O₂-carrying capacity → heart works harder), nicotine activates sympathetic nervous system (raises HR and BP), tobacco chemicals damage endothelium → LDL infiltration → atherosclerosis, pro-thrombotic state. COPD mechanism — smoke paralyses cilia (mucus escalator fails → infective chronic bronchitis), and neutrophil-derived proteases (elastase, MMP) destroy alveolar elastin/collagen → emphysema. Both diseases have dose-response relationships with pack-years smoked — stopping at any age reduces risk."},{"stem":"A student argues that aerobic respiration is always better than anaerobic respiration. Evaluate this claim.","A":"The student is correct — aerobic respiration is always preferable in all circumstances","B":"The claim is partly correct but oversimplified: aerobic respiration yields far more ATP per glucose (~36–38 vs ~2) and produces no lactic acid buildup; however, anaerobic respiration is essential when O₂ supply is insufficient (intense exercise, hypoxic tissues) — it allows continued (though limited) ATP production; in fermentation contexts (yeast, food production) anaerobic respiration is not \"worse\" — it is the intended pathway; the trade-off is ATP yield vs speed and O₂-independence","C":"Anaerobic respiration is always better — it produces more ATP per glucose molecule","D":"Both types of respiration produce identical amounts of ATP — there is no difference in efficiency","correct":"B","explain":"Aerobic advantages: ~36–38 ATP per glucose; complete oxidation to CO₂ + H₂O (no toxic by-products); sustainable for long periods if O₂ supplied. Anaerobic advantages: no O₂ needed (functions in hypoxic conditions); faster rate of ATP production per unit time (though less total ATP per glucose); allows muscles to continue contracting when O₂ supply is exceeded (e.g. during a 100 m sprint); in yeast, produces ethanol and CO₂ which are commercially useful. The \"better\" pathway depends on context — aerobic is more efficient; anaerobic is necessary when O₂ is limiting. Calling aerobic always better ignores the adaptive value of anaerobic respiration."}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
