<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T1 Cell Biology Inferno | Biology Bossed</title><style>:root{--pr:#16a34a;--pr-dk:#166534;--sp:#10b981;--fl:#16a34a;--inf:#166534;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(22,163,74,.10);--sh2:0 6px 24px rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em}
.tier-badge.spark{background:var(--sp)}.tier-badge.flame{background:var(--fl)}.tier-badge.inferno{background:var(--inf)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0fff4;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0fff4;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#052e16,#166534 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="site-header"><a href="practice.html" class="back-link">&larr; All topics</a><h1>T1: Cell Biology &mdash; Inferno</h1><span class="tier-badge inferno">Inferno</span></header><main><div class="quiz-meta"><span>20 questions &middot; Cell Biology</span><span>Inferno: Higher</span></div><div id="score-banner" class="score-banner"></div><div id="questions"></div><div class="submit-area"><button id="submit-btn" class="submit-btn">Submit All Answers</button></div></main><script>const QUESTIONS=[{"stem":"A student places potato cylinders in sucrose solutions ranging from 0 to 1.0 mol/dm³ and plots percentage change in mass against concentration. The graph crosses the x-axis at 0.35 mol/dm³. What does this crossing point represent?","A":"The concentration at which sucrose is fully absorbed by the potato","B":"The concentration at which the cell wall exerts maximum pressure","C":"The point at which the water potential of the external solution equals the water potential inside the potato cells — there is no net movement of water","D":"The concentration at which the cells become fully turgid","correct":"C","explain":"When percentage change in mass = 0, no net movement of water occurs. The external solution is isotonic with the cell contents, meaning their water potentials are equal. The x-intercept therefore provides an estimate of the solute concentration (and hence water potential) of the potato cell cytoplasm. This is a standard Higher practical technique."},{"stem":"Why is the use of embryonic stem cells for therapeutic purposes ethically controversial?","A":"Embryonic stem cells do not differentiate reliably enough for medical use","B":"Harvesting embryonic stem cells destroys the embryo, and many people regard the embryo as having the same moral status as a person","C":"Embryonic stem cells always cause immune rejection because they are genetically foreign","D":"Embryonic stem cells only exist in theory — they cannot be grown in a laboratory","correct":"B","explain":"The central ethical objection is that harvesting stem cells from a blastocyst-stage embryo (4–5 days old) requires destroying it. Those who believe life begins at fertilisation argue this is equivalent to ending a human life. This must be weighed against the potential to treat serious diseases including Parkinson's, type 1 diabetes and spinal cord injuries. The debate involves religious, philosophical and scientific perspectives."},{"stem":"Cystic fibrosis results from a mutation in the CFTR gene. The mutation changes the base sequence, producing a faulty chloride channel protein. Which chain of causation correctly explains this?","A":"Mutation → more CFTR proteins produced → chloride channel is permanently open","B":"Mutation → altered base sequence → altered amino acid sequence → altered tertiary structure → non-functional channel protein","C":"Mutation → nucleus is destroyed → no proteins are made in the affected cells","D":"Mutation → excess chloride enters the cell by diffusion → mucus becomes thin and watery","correct":"B","explain":"This question tests the DNA → protein → function pathway. A mutation changes the base sequence of the gene. This alters the codons translated at the ribosome, substituting one or more amino acids. The resulting protein has a different tertiary (3D) structure — the channel pore no longer functions correctly, preventing chloride transport. Thick mucus accumulates in the lungs and digestive tract."},{"stem":"An enzyme is tested at temperatures of 10°C, 20°C, 30°C, 37°C and 50°C. Reaction rate approximately doubles between each 10°C increment up to 37°C, then drops to zero at 50°C. What explains the drop at 50°C?","A":"All the substrate molecules are used up at high temperature","B":"The enzyme molecules slow down and cannot reach the substrate at 50°C","C":"The increased kinetic energy breaks the hydrogen and ionic bonds maintaining the enzyme's tertiary structure — the active site changes shape irreversibly (denaturation)","D":"The enzyme dissolves in the water at high temperature and can no longer catalyse the reaction","correct":"C","explain":"Below the optimum, higher temperature increases kinetic energy, leading to more successful enzyme-substrate collisions and a faster rate. Above the optimum, the increased energy breaks the bonds (hydrogen bonds, some ionic bonds) that hold the enzyme's tertiary structure together. The active site changes shape permanently — this irreversible loss of function is denaturation. The enzyme cannot recover, unlike at extreme pH (which can sometimes be reversed)."},{"stem":"A liver cell and a muscle cell contain identical DNA, yet they produce very different sets of proteins. What is the molecular explanation?","A":"Different mutations occur in each cell type during development","B":"Different genes are selectively expressed (switched on) in each cell type — transcription factors determine which genes are transcribed","C":"Liver cells have extra chromosomes not found in muscle cells","D":"Muscle cells have extra ribosomes that translate genes faster","correct":"B","explain":"Every somatic cell contains the same genome. Cell differentiation is controlled by transcription factors — proteins that bind to specific DNA sequences and switch genes on or off. A liver cell activates genes for enzymes involved in detoxification and metabolism; a muscle cell activates genes for contractile proteins (actin, myosin). This selective gene expression, not mutation, produces diverse cell types."},{"stem":"Two students debate whether stem cells arise from mitosis or meiosis. Which statement is correct?","A":"Meiosis — because it produces genetic variation, which generates diverse stem cell types","B":"Mitosis — stem cells divide by mitosis both to self-renew (producing more stem cells) and to produce differentiated daughter cells","C":"Both — mitosis for adult stem cells; meiosis for embryonic stem cells","D":"Neither — stem cells arise from the fusion of two differentiated cells","correct":"B","explain":"Stem cells undergo mitosis. Self-renewal produces genetically identical stem cells to maintain the stem cell pool. Asymmetric mitosis produces one stem cell and one cell that proceeds to differentiate. Meiosis only occurs in the gonads and produces gametes — it has no role in stem cell biology."},{"stem":"A plant cell undergoes plasmolysis. A visible gap appears between the cell membrane and the cell wall. What has caused this gap?","A":"The cell wall has expanded outward due to turgor pressure","B":"Water has entered the cell by osmosis, pushing the membrane away from the wall","C":"Water has left the cell by osmosis, causing the cytoplasm and cell membrane (the protoplast) to shrink away from the rigid cell wall","D":"Salt has entered the cell and dissolved the cell wall from the inside","correct":"C","explain":"When a plant cell is placed in a hypertonic solution (lower water potential than the cell), water leaves the vacuole and cytoplasm by osmosis. The protoplast (everything inside the cell wall) shrinks, pulling the membrane away from the cell wall and creating a visible gap. Extreme plasmolysis can permanently damage the cell."},{"stem":"In an enzyme experiment, a competitive inhibitor reduces the reaction rate. If the substrate concentration is greatly increased, what happens to the rate and why?","A":"The rate falls further, as the inhibitor permanently blocks all active sites","B":"The rate returns towards its uninhibited level, as excess substrate outcompetes the inhibitor for active sites","C":"The rate falls to zero, as competitive inhibitors denature the enzyme over time","D":"The rate doubles, as more substrate molecules react with the inhibitor","correct":"B","explain":"A competitive inhibitor binds reversibly to the active site, blocking the substrate temporarily. Because the inhibitor does not permanently alter the enzyme, the binding is concentration-dependent. Increasing substrate concentration raises the probability that substrate molecules (rather than inhibitor molecules) will occupy the active site — the effective inhibition decreases and the reaction rate recovers towards normal."},{"stem":"A medical team grows cardiac muscle cells from induced pluripotent stem cells (iPSCs) derived from the patient's own skin cells. Why is this approach advantageous over using embryonic stem cells?","A":"iPSCs divide faster, reducing treatment time","B":"iPSCs can only become heart cells, making them more targeted","C":"Using the patient's own cells avoids immune rejection, and no embryo is destroyed — addressing both practical and ethical concerns","D":"iPSCs are far cheaper to produce than embryonic stem cells","correct":"C","explain":"iPSCs are adult cells reprogrammed to a stem-cell-like state. Because they are derived from the patient's own tissue, the immune system recognises them as \"self,\" greatly reducing the risk of rejection. They also avoid the ethical objection to destroying embryos. iPSC technology represents a major advance in regenerative medicine, though challenges remain in directing precise differentiation and ensuring safety."},{"stem":"Why does the surface area to volume (SA:V) ratio of a cell limit its maximum size?","A":"Larger cells have more mitochondria and generate excessive heat, killing the cell","B":"As a cell grows, its volume increases faster than its surface area — the membrane area available for diffusion becomes insufficient to supply the growing cell interior","C":"Smaller SA:V ratios mean more membrane surface is available per unit of cytoplasm","D":"SA:V ratio only limits the size of plant cells because animal cells have no cell wall","correct":"B","explain":"As radius increases, volume grows as r³ but surface area grows as r², so SA:V decreases. A cell with a low SA:V ratio has proportionally little membrane surface to exchange gases and nutrients with the large volume of cytoplasm. Diffusion distance to the cell centre becomes too great, meaning oxygen and nutrients cannot be delivered quickly enough. This is why cells remain small and why large organisms evolve specialised exchange surfaces (villi, alveoli) and transport systems."},{"stem":"A point mutation changes one base triplet in the middle of a gene coding for an enzyme. Which outcome is most likely?","A":"All protein synthesis in the cell stops immediately","B":"The entire enzyme is non-functional because any gene change destroys the protein","C":"One amino acid in the enzyme is changed — this may or may not affect function depending on where the change occurs","D":"The ribosome automatically corrects the error and produces the normal protein","correct":"C","explain":"A point mutation affects one codon, potentially substituting a single amino acid. If the substitution occurs in or near the active site, the enzyme's tertiary structure may change enough to reduce or eliminate function. If the change is in a non-critical region, or if a similar amino acid is substituted (conservative substitution), function may be largely unaffected. Not all mutations are harmful."},{"stem":"The enzyme amylase is tested at pH 7 (maximum activity). The pH is dropped to 2 — activity stops. The pH is then raised back to 7 — activity returns to normal. What does this tell us?","A":"The enzyme is denatured at pH 2 but slowly renatures when pH returns to 7","B":"The enzyme is not denatured at pH 2 — the structural changes are reversible, and activity is restored when the correct pH is resumed","C":"The substrate (starch) is destroyed at pH 2, but regenerates when pH rises","D":"Amylase has a second active site that functions only at pH 2","correct":"B","explain":"The key observation is that activity is restored — this proves the enzyme was not permanently denatured at pH 2. Denaturation is irreversible by definition. Instead, the low pH caused a temporary, reversible conformational change in the active site. Once the optimum pH is restored, the enzyme returns to its functional shape. True denaturation (e.g. by boiling) would permanently prevent recovery."},{"stem":"A drug blocks phospholipid bilayer formation. Which cellular processes would be most directly disrupted?","A":"DNA replication inside the nucleus","B":"Protein synthesis at ribosomes","C":"Formation of new cell membranes — essential for cell division and maintenance of all membrane-bound organelles","D":"Transcription of mRNA from DNA","correct":"C","explain":"Cell membranes are phospholipid bilayers. Without new phospholipids forming bilayers, cells could not produce the membranes needed for cell division (new plasma membranes for daughter cells) or maintain membrane-bound organelles (mitochondria, nucleus, ER, Golgi). DNA replication, transcription and translation do not directly require phospholipids."},{"stem":"Why do prokaryotic cells carry out aerobic respiration without possessing mitochondria?","A":"Prokaryotes cannot carry out aerobic respiration — they are obligate anaerobes","B":"The reactions of aerobic respiration occur at the prokaryotic cell membrane and in the cytoplasm, rather than in a separate organelle","C":"Prokaryotes use their plasmids as a substitute for mitochondria","D":"Prokaryotic cells use chloroplasts to generate ATP instead of mitochondria","correct":"B","explain":"Prokaryotes evolved before eukaryotes and lack membrane-bound organelles. Their electron transport chain is located in the plasma membrane itself (and associated membranes in some bacteria). This is consistent with the endosymbiotic theory, which proposes that mitochondria originated when a proto-eukaryotic cell engulfed an aerobic bacterium — the bacterium's membrane-based respiration became the mitochondrion's inner membrane."},{"stem":"Telomerase is an enzyme that extends chromosomal telomeres. It is active in stem cells but inactive in most adult somatic cells. Cancer cells often reactivate telomerase. Why does this contribute to cancer?","A":"Telomerase activates oncogenes by lengthening chromosomes","B":"Telomerase reactivation prevents telomere shortening, removing the normal limit on cell division and allowing cancer cells to divide indefinitely","C":"Telomerase converts DNA to RNA in cancer cells, disrupting gene expression","D":"Telomerase speeds up the cell cycle, causing chromosomal errors","correct":"B","explain":"In normal cells, telomeres shorten with each division — eventually triggering senescence (the cell stops dividing). Cancer cells bypass this by reactivating telomerase, which rebuilds telomeres after each division. This allows unlimited proliferation, a hallmark of cancer. Inhibiting telomerase is actively researched as a cancer therapy target."},{"stem":"An animal cell is placed in a highly hypotonic solution (solute concentration far lower than cell contents). What will occur and why?","A":"The cell will lose water by osmosis and shrink (crenation)","B":"The cell will gain water by osmosis and may lyse (burst), as animal cells lack a cell wall to resist expansion","C":"The cell will gain water and become turgid like a plant cell","D":"Nothing — animal cells are not affected by changes in external concentration","correct":"B","explain":"A hypotonic solution has a higher water potential than the cell. Water enters by osmosis, down the water potential gradient. Animal cells lack a cell wall, so there is nothing to resist the increasing volume. The cell swells and, if the osmotic gradient is large enough, the cell membrane ruptures — lysis. This is why blood must be stored in isotonic saline solutions."},{"stem":"Preimplantation genetic diagnosis (PGD) involves testing cells from IVF embryos for genetic disorders before selecting embryos for implantation. Which argument best supports this procedure?","A":"It allows parents to choose cosmetic traits such as eye colour and intelligence","B":"It allows parents and clinicians to avoid implanting embryos carrying serious genetic conditions, reducing the risk of severe childhood disease","C":"It guarantees that implanted embryos will survive to full term","D":"It eliminates the need for any other form of genetic testing during pregnancy","correct":"B","explain":"PGD identifies embryos carrying genetic conditions (e.g. cystic fibrosis, Huntington's disease, chromosomal abnormalities) before implantation. Supporters argue it prevents the birth of children with serious illness and reduces suffering. Critics raise concerns about the destruction of affected embryos and the potential for the technique to be extended to non-medical traits (eugenics). Current UK regulation restricts PGD to serious genetic conditions."},{"stem":"A student graphs SA:V ratio against cell radius and finds the ratio is 6 µm⁻¹ when r = 1 µm but only 0.75 µm⁻¹ when r = 8 µm. What implication does this have for maximum cell size?","A":"Larger cells are always more efficient because they contain a greater volume for metabolic reactions","B":"As radius increases, SA:V falls — beyond a certain size, diffusion cannot supply the cell interior fast enough, setting a practical upper limit on cell size","C":"All cells maintain a constant SA:V ratio by increasing the number of mitochondria as they grow","D":"SA:V ratio is irrelevant for animal cells, which do not rely on diffusion","correct":"B","explain":"The falling SA:V ratio as cell size increases means that proportionally less membrane is available to supply the growing interior. Diffusion rate depends on surface area, not volume. Once the cell is large enough that the centre is too far from the membrane for diffusion to deliver oxygen and remove CO₂ quickly enough, normal metabolism becomes impossible. This is the fundamental reason cells are microscopic."},{"stem":"During mitosis, spindle fibres pull replicated chromosomes to opposite poles of the cell. A drug called colchicine prevents spindle fibre formation. What is the likely result?","A":"Mitosis proceeds normally, as spindle fibres are not required for chromosome separation","B":"DNA replication is blocked before mitosis can begin","C":"Chromosomes replicate but cannot separate — one or both daughter cells receive double the normal chromosome number (polyploidy)","D":"The cell switches from mitosis to meiosis to complete division","correct":"C","explain":"Spindle fibres (microtubules) are essential for pulling chromatids to opposite poles during anaphase. Without them, chromosomes cannot segregate. The cell may still undergo cytokinesis (cytoplasm division), producing cells with abnormal chromosome numbers. Polyploidy can be lethal in animal cells but is exploited in plant breeding to produce larger, more robust polyploid crop varieties."},{"stem":"Research shows that in most adult somatic cells, only about 1.5% of DNA codes for proteins (exons). The remaining ~98.5% includes regulatory sequences, introns and non-coding regions. How does this relate to cell differentiation?","A":"It shows that only 1.5% of DNA is actually functional — the rest is irrelevant","B":"Regulatory sequences within non-coding DNA control which genes are switched on or off in different cell types, enabling the same genome to produce functionally distinct specialised cells","C":"Non-coding DNA carries the instructions for osmosis and diffusion, which are the same in all cells","D":"All somatic cells transcribe and translate 100% of their DNA, but most proteins are degraded immediately","correct":"B","explain":"The non-coding regions include promoter sequences, enhancers and other regulatory elements that control gene expression. Transcription factors bind these sequences to switch specific genes on or off in a cell-type-specific manner. This is the molecular mechanism of differentiation — the same genome generates hundreds of different cell types by selectively expressing different subsets of genes. The Human Genome Project revealed this complexity, shifting understanding away from \"one gene = one function.\""}];function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){var n=idx+1;if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);});
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='âœ“ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'âœ— Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent work!':pct>=60?'Good. Review the questions you missed.':'Keep practising â€” read the explanations carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);</script></body></html>
